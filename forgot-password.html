<!DOCTYPE html>
<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Recuperar Senha — GeoGestor</title>
<script>
  (function() {
    try {
      var savedTheme = localStorage.getItem('constructive_theme') || 'Claro';
      document.documentElement.classList.remove('light', 'dark', 'neon');
      if (savedTheme === 'Azul neon') {
        document.documentElement.classList.add('neon', 'dark');
      } else if (savedTheme === 'Escuro' || (savedTheme === 'Automático' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.add('light');
      }
    } catch(e) {}
  })();
</script>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link rel="icon" type="image/png" href="assets/logo.png">
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: { primary: "#0ea5e9", "on-primary": "#ffffff" },
        fontFamily: { sans: ["Inter", "sans-serif"] }
      }
    }
  }
</script>
<style>
  body { background-color: #f8fafc; color: #334155; }
  html.dark body { background-color: #0f172a; color: #e2e8f0; }
  .card {
    background-color: #ffffff;
    box-shadow: 4px 4px 12px rgba(209, 217, 230, 0.4), -4px -4px 12px rgba(255, 255, 255, 0.8);
    border: 1px solid rgba(226, 232, 240, 0.6);
  }
  html.dark .card { background-color: #1e293b; border-color: rgba(51, 65, 85, 0.6); box-shadow: none; }
</style>
</head>
<body class="font-sans min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm">
    <div class="flex flex-col items-center mb-8">
      <img src="assets/logo.png" alt="GeoGestor" class="w-24 h-24 rounded-2xl shadow-lg mb-3 object-cover">
      <h1 class="text-lg font-black tracking-widest uppercase text-slate-800 dark:text-slate-100 mt-2">Recuperar Senha</h1>
      <p class="text-xs text-slate-400 mt-1 text-center">Informe seu login. Se existir uma conta com esse e-mail, você vai receber um link pra criar uma senha nova.</p>
    </div>

    <div class="card rounded-2xl p-6">
      <form id="forgot-form" class="flex flex-col gap-4">
        <div>
          <label class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Login</label>
          <input id="forgot-email" type="email" required autocomplete="username"
            class="mt-1 w-full rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary"
            placeholder="seu.email@orgao.gov.br">
        </div>

        <div id="forgot-error" class="hidden text-xs text-red-600 bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 rounded-lg px-3 py-2"></div>

        <button id="forgot-submit" type="submit"
          class="mt-2 w-full bg-primary text-on-primary font-semibold text-sm rounded-lg py-2.5 hover:opacity-90 transition-opacity flex items-center justify-center gap-2">
          <span id="forgot-submit-text">Enviar link de recuperação</span>
        </button>
      </form>
      <div id="forgot-success" class="hidden text-xs text-emerald-700 bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-200 dark:border-emerald-800 rounded-lg px-3 py-2"></div>
    </div>

    <p class="text-center text-[11px] text-slate-400 mt-6">
      Lembrou a senha? <a href="login.html" class="text-primary hover:underline">Voltar ao login</a>
    </p>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function() {
  const form = document.getElementById('forgot-form');
  const emailEl = document.getElementById('forgot-email');
  const errorEl = document.getElementById('forgot-error');
  const successEl = document.getElementById('forgot-success');
  const submitBtn = document.getElementById('forgot-submit');
  const submitText = document.getElementById('forgot-submit-text');

  function showError(msg) {
    successEl.classList.add('hidden');
    errorEl.textContent = msg;
    errorEl.classList.remove('hidden');
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    errorEl.classList.add('hidden');

    if (!supabaseClient) {
      showError('Não foi possível conectar ao sistema. Tente novamente em instantes.');
      return;
    }

    submitBtn.disabled = true;
    submitText.textContent = 'Enviando...';

    const { error } = await supabaseClient.auth.resetPasswordForEmail(emailEl.value.trim(), {
      redirectTo: window.location.origin + window.location.pathname.replace('forgot-password.html', 'reset-password.html')
    });

    submitBtn.disabled = false;
    submitText.textContent = 'Enviar link de recuperação';

    // Mesma mensagem dê certo ou errado o e-mail existir — não revela pra
    // quem está tentando se uma conta existe ou não.
    if (error) console.error('Erro ao pedir recuperação de senha:', error);

    form.classList.add('hidden');
    successEl.textContent = 'Se existir uma conta com esse e-mail, um link de recuperação foi enviado. Verifique também a caixa de spam.';
    successEl.classList.remove('hidden');
  });
})();
</script>
</body>
</html>
