<!DOCTYPE html>
<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Nova Senha — GeoGestor</title>
<script>
  (function() {
    try {
      var savedTheme = localStorage.getItem('constructive_theme') || 'Claro';
      document.documentElement.classList.remove('light', 'dark', 'neon');
      if (savedTheme === 'Azul neon') {
        document.documentElement.classList.add('neon', 'dark');
      } else if (savedTheme === 'Escuro' || (savedTheme === 'Automático' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.add('light');
      }
    } catch(e) {}
  })();
</script>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link rel="icon" type="image/png" href="assets/logo.png">
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: { primary: "#0ea5e9", "on-primary": "#ffffff" },
        fontFamily: { sans: ["Inter", "sans-serif"] }
      }
    }
  }
</script>
<style>
  body { background-color: #f8fafc; color: #334155; }
  html.dark body { background-color: #0f172a; color: #e2e8f0; }
  .card {
    background-color: #ffffff;
    box-shadow: 4px 4px 12px rgba(209, 217, 230, 0.4), -4px -4px 12px rgba(255, 255, 255, 0.8);
    border: 1px solid rgba(226, 232, 240, 0.6);
  }
  html.dark .card { background-color: #1e293b; border-color: rgba(51, 65, 85, 0.6); box-shadow: none; }
</style>
</head>
<body class="font-sans min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm">
    <div class="flex flex-col items-center mb-8">
      <img src="assets/logo.png" alt="GeoGestor" class="w-24 h-24 rounded-2xl shadow-lg mb-3 object-cover">
      <h1 class="text-lg font-black tracking-widest uppercase text-slate-800 dark:text-slate-100 mt-2">Nova Senha</h1>
      <p class="text-xs text-slate-400 mt-1 text-center">Escolha uma nova senha pra sua conta.</p>
    </div>

    <div class="card rounded-2xl p-6">
      <div id="reset-loading" class="text-xs text-slate-400 italic text-center py-4">Verificando o link...</div>

      <div id="reset-invalid" class="hidden text-xs text-red-600 bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 rounded-lg px-3 py-2">
        Este link de recuperação é inválido ou já expirou. <a href="forgot-password.html" class="underline font-semibold">Peça um novo</a>.
      </div>

      <form id="reset-form" class="hidden flex flex-col gap-4">
        <div>
          <label class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Nova senha</label>
          <div class="relative mt-1">
            <input id="reset-password" type="password" required minlength="6" autocomplete="new-password"
              class="w-full rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 pl-3 pr-10 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary"
              placeholder="mínimo 6 caracteres">
            <button type="button" id="reset-password-toggle" tabindex="-1" class="absolute right-2 top-1/2 -translate-y-1/2 p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors" title="Mostrar/ocultar senha">
              <span id="reset-password-toggle-icon" class="material-symbols-outlined text-[20px]">visibility</span>
            </button>
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Confirmar nova senha</label>
          <div class="relative mt-1">
            <input id="reset-password-confirm" type="password" required minlength="6" autocomplete="new-password"
              class="w-full rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 pl-3 pr-10 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary"
              placeholder="repita a senha">
            <button type="button" id="reset-password-confirm-toggle" tabindex="-1" class="absolute right-2 top-1/2 -translate-y-1/2 p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors" title="Mostrar/ocultar senha">
              <span id="reset-password-confirm-toggle-icon" class="material-symbols-outlined text-[20px]">visibility</span>
            </button>
          </div>
        </div>

        <div id="reset-error" class="hidden text-xs text-red-600 bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 rounded-lg px-3 py-2"></div>

        <button id="reset-submit" type="submit"
          class="mt-2 w-full bg-primary text-on-primary font-semibold text-sm rounded-lg py-2.5 hover:opacity-90 transition-opacity flex items-center justify-center gap-2">
          <span id="reset-submit-text">Salvar nova senha</span>
        </button>
      </form>
      <div id="reset-success" class="hidden text-xs text-emerald-700 bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-200 dark:border-emerald-800 rounded-lg px-3 py-2"></div>
    </div>

    <p class="text-center text-[11px] text-slate-400 mt-6">
      <a href="login.html" class="text-primary hover:underline">Voltar ao login</a>
    </p>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function() {
  const loadingEl = document.getElementById('reset-loading');
  const invalidEl = document.getElementById('reset-invalid');
  const form = document.getElementById('reset-form');
  const passwordEl = document.getElementById('reset-password');
  const passwordConfirmEl = document.getElementById('reset-password-confirm');
  const errorEl = document.getElementById('reset-error');
  const successEl = document.getElementById('reset-success');
  const submitBtn = document.getElementById('reset-submit');
  const submitText = document.getElementById('reset-submit-text');

  function setupToggle(inputId, btnId, iconId) {
    const input = document.getElementById(inputId);
    const btn = document.getElementById(btnId);
    const icon = document.getElementById(iconId);
    if (!input || !btn || !icon) return;
    btn.addEventListener('click', function() {
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      icon.textContent = showing ? 'visibility' : 'visibility_off';
    });
  }
  setupToggle('reset-password', 'reset-password-toggle', 'reset-password-toggle-icon');
  setupToggle('reset-password-confirm', 'reset-password-confirm-toggle', 'reset-password-confirm-toggle-icon');

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.remove('hidden');
  }

  function showForm() {
    loadingEl.classList.add('hidden');
    invalidEl.classList.add('hidden');
    form.classList.remove('hidden');
  }

  function showInvalid() {
    loadingEl.classList.add('hidden');
    form.classList.add('hidden');
    invalidEl.classList.remove('hidden');
  }

  if (!supabaseClient) {
    showInvalid();
    return;
  }

  // O link do e-mail estabelece uma sessão temporária de recuperação
  // (o próprio supabase-js já processa o token que vem na URL). Ouve os
  // dois sinais possíveis — o evento PASSWORD_RECOVERY (mais confiável) e,
  // como reforço, uma sessão já ativa quando a página carrega.
  let liberado = false;
  supabaseClient.auth.onAuthStateChange(function(event) {
    if (event === 'PASSWORD_RECOVERY') {
      liberado = true;
      showForm();
    }
  });

  setTimeout(async function() {
    if (liberado) return;
    const { data } = await supabaseClient.auth.getSession();
    if (data && data.session) {
      liberado = true;
      showForm();
    } else {
      showInvalid();
    }
  }, 1500);

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    errorEl.classList.add('hidden');

    if (passwordEl.value !== passwordConfirmEl.value) {
      showError('As senhas não coincidem.');
      return;
    }

    submitBtn.disabled = true;
    submitText.textContent = 'Salvando...';

    const { error } = await supabaseClient.auth.updateUser({ password: passwordEl.value });

    submitBtn.disabled = false;
    submitText.textContent = 'Salvar nova senha';

    if (error) {
      showError('Não foi possível salvar a nova senha: ' + error.message);
      return;
    }

    form.classList.add('hidden');
    successEl.textContent = 'Senha atualizada! Redirecionando pro login...';
    successEl.classList.remove('hidden');
    await supabaseClient.auth.signOut();
    setTimeout(function() { window.location.href = 'login.html'; }, 2000);
  });
})();
</script>
</body>
</html>
