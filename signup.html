<!DOCTYPE html>
<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Solicitar Acesso — GeoGestor</title>
<script>
  (function() {
    try {
      var savedTheme = localStorage.getItem('constructive_theme') || 'Claro';
      document.documentElement.classList.remove('light', 'dark', 'neon');
      if (savedTheme === 'Azul neon') {
        document.documentElement.classList.add('neon', 'dark');
      } else if (savedTheme === 'Escuro' || (savedTheme === 'Automático' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.add('light');
      }
    } catch(e) {}
  })();
</script>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link rel="icon" type="image/png" href="assets/logo.png">
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: { primary: "#0ea5e9", "on-primary": "#ffffff" },
        fontFamily: { sans: ["Inter", "sans-serif"] }
      }
    }
  }
</script>
<style>
  body { background-color: #f8fafc; color: #334155; }
  html.dark body { background-color: #0f172a; color: #e2e8f0; }
  .card {
    background-color: #ffffff;
    box-shadow: 4px 4px 12px rgba(209, 217, 230, 0.4), -4px -4px 12px rgba(255, 255, 255, 0.8);
    border: 1px solid rgba(226, 232, 240, 0.6);
  }
  html.dark .card { background-color: #1e293b; border-color: rgba(51, 65, 85, 0.6); box-shadow: none; }
</style>
</head>
<body class="font-sans min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <div class="flex flex-col items-center mb-6">
      <div class="w-14 h-14 rounded-xl bg-primary flex items-center justify-center text-on-primary shadow-lg mb-3">
        <span class="material-symbols-outlined text-[28px]">how_to_reg</span>
      </div>
      <h1 class="text-xl font-black tracking-widest uppercase text-slate-800 dark:text-slate-100">Solicitar Acesso</h1>
      <p class="text-xs text-slate-400 mt-1 text-center">Sua conta é criada agora, mas o acesso aos dados de um<br>município só libera depois de aprovado.</p>
    </div>

    <div class="card rounded-2xl p-6">
      <form id="signup-form" class="flex flex-col gap-3">
        <div>
          <label class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Nome completo</label>
          <input id="signup-nome" type="text" required
            class="mt-1 w-full rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">E-mail</label>
          <input id="signup-email" type="email" required autocomplete="username"
            class="mt-1 w-full rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Senha</label>
          <input id="signup-password" type="password" required minlength="6" autocomplete="new-password"
            class="mt-1 w-full rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary"
            placeholder="mínimo 6 caracteres">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Entidade</label>
            <select id="signup-entidade" required
              class="mt-1 w-full rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary">
              <option value="">Carregando...</option>
            </select>
            <input id="signup-entidade-outros" type="text"
              class="hidden mt-2 w-full rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary"
              placeholder="Qual entidade?">
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Cargo/Função</label>
            <input id="signup-cargo" type="text" required
              class="mt-1 w-full rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary"
              placeholder="Ex: Fiscal, Procurador...">
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Município(s) que deseja acessar</label>
          <div id="signup-municipios-list" class="mt-1 max-h-40 overflow-y-auto border border-slate-300 dark:border-slate-600 dark:bg-slate-800 rounded-lg p-2.5 flex flex-col gap-1.5">
            <div class="text-xs text-slate-400 italic">Carregando...</div>
          </div>
          <p id="signup-municipios-info" class="text-[10px] text-slate-400 mt-1">Pode marcar mais de um, se precisar acessar dados de vários municípios (ex: órgãos de fiscalização).</p>
        </div>

        <div id="signup-error" class="hidden text-xs text-red-600 bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 rounded-lg px-3 py-2"></div>

        <button id="signup-submit" type="submit"
          class="mt-2 w-full bg-primary text-on-primary font-semibold text-sm rounded-lg py-2.5 hover:opacity-90 transition-opacity">
          <span id="signup-submit-text">Solicitar Acesso</span>
        </button>
      </form>
      <div id="signup-success" class="hidden text-xs text-emerald-700 bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-200 dark:border-emerald-800 rounded-lg px-3 py-2"></div>
    </div>

    <p class="text-center text-[11px] text-slate-400 mt-6">
      Já tem conta? <a href="login.html" class="text-primary hover:underline">Entrar</a>
    </p>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function() {
  const form = document.getElementById('signup-form');
  const nomeEl = document.getElementById('signup-nome');
  const emailEl = document.getElementById('signup-email');
  const passwordEl = document.getElementById('signup-password');
  const entidadeEl = document.getElementById('signup-entidade');
  const entidadeOutrosEl = document.getElementById('signup-entidade-outros');
  const cargoEl = document.getElementById('signup-cargo');
  const municipiosListEl = document.getElementById('signup-municipios-list');
  const errorEl = document.getElementById('signup-error');
  const successEl = document.getElementById('signup-success');
  const submitBtn = document.getElementById('signup-submit');
  const submitText = document.getElementById('signup-submit-text');

  function showError(msg) {
    successEl.classList.add('hidden');
    errorEl.textContent = msg;
    errorEl.classList.remove('hidden');
  }

  async function loadMunicipios() {
    if (!supabaseClient) return;
    const { data, error } = await supabaseClient.from('municipios').select('id, nome, uf').eq('ativo', true).order('nome');
    if (error || !data || data.length === 0) {
      municipiosListEl.innerHTML = '<div class="text-xs text-slate-400 italic">Nenhum município disponível</div>';
      return;
    }
    municipiosListEl.innerHTML = data.map(m => `
      <label class="flex items-center gap-2 text-sm text-slate-700 dark:text-slate-200 cursor-pointer">
        <input type="checkbox" class="signup-municipio-input rounded border-slate-300 dark:border-slate-600 text-primary focus:ring-primary" value="${m.id}">
        ${m.nome}${m.uf ? ' - ' + m.uf : ''}
      </label>`).join('');
    updateMunicipioSelectionMode();
  }

  async function loadEntidades() {
    if (!supabaseClient) return;
    const { data, error } = await supabaseClient.from('entidades_padrao').select('id, nome, sigla, tipo').eq('ativo', true).order('created_at');
    if (error || !data || data.length === 0) {
      entidadeEl.innerHTML = '<option value="">Nenhuma entidade cadastrada</option>';
      return;
    }
    entidadeEl.innerHTML = data.map(e =>
      `<option value="${e.nome}" data-tipo="${e.tipo}">${e.sigla ? e.nome + ' (' + e.sigla + ')' : e.nome}</option>`
    ).join('');
    handleEntidadeChange();
  }

  loadMunicipios().then(() => loadEntidades());

  function handleEntidadeChange() {
    toggleEntidadeOutros();
    updateMunicipioSelectionMode();
  }

  function updateMunicipioSelectionMode() {
    const selected = entidadeEl.options[entidadeEl.selectedIndex];
    const tipo = selected ? selected.getAttribute('data-tipo') : 'municipal';
    const isMunicipal = (tipo === 'municipal');
    
    const infoTextEl = document.getElementById('signup-municipios-info');
    if (infoTextEl) {
      infoTextEl.textContent = isMunicipal
        ? 'Entidades municipais têm acesso restrito a um único município.'
        : 'Pode marcar mais de um município (ex: órgãos de fiscalização estadual/federal).';
      infoTextEl.className = isMunicipal 
        ? 'text-[10px] text-amber-600 dark:text-amber-400 font-medium mt-1 flex items-center gap-1'
        : 'text-[10px] text-slate-400 mt-1';
    }

    const inputs = document.querySelectorAll('.signup-municipio-input');
    let firstChecked = false;
    inputs.forEach(inp => {
      inp.type = isMunicipal ? 'radio' : 'checkbox';
      inp.name = isMunicipal ? 'signup_municipio_radio' : 'signup_municipio_check';
      
      if (isMunicipal) {
        if (inp.checked) {
          if (firstChecked) inp.checked = false;
          else firstChecked = true;
        }
      }
    });
  }

  function toggleEntidadeOutros() {
    const selected = entidadeEl.options[entidadeEl.selectedIndex];
    const isOutros = selected && selected.getAttribute('data-tipo') === 'outro';
    entidadeOutrosEl.classList.toggle('hidden', !isOutros);
    entidadeOutrosEl.required = isOutros;
  }
  entidadeEl.addEventListener('change', handleEntidadeChange);

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    errorEl.classList.add('hidden');
    successEl.classList.add('hidden');

    if (!supabaseClient) {
      showError('Não foi possível conectar ao sistema. Tente novamente em instantes.');
      return;
    }

    const municipioIds = Array.from(document.querySelectorAll('.signup-municipio-input:checked')).map(cb => cb.value);
    if (municipioIds.length === 0) {
      showError('Selecione ao menos um município.');
      return;
    }

    submitBtn.disabled = true;
    submitText.textContent = 'Enviando...';

    const selectedEntidade = entidadeEl.options[entidadeEl.selectedIndex];
    const entidadeFinal = (selectedEntidade && selectedEntidade.getAttribute('data-tipo') === 'outro')
      ? entidadeOutrosEl.value.trim()
      : entidadeEl.value;

    // Entidade/cargo/município vão junto na criação da conta (metadados do
    // usuário) — é o gatilho no banco (handle_new_user, roda no servidor)
    // quem registra o pedido de acesso. Isso funciona mesmo quando o projeto
    // exige confirmação de e-mail, caso em que signUp() não devolve uma
    // sessão utilizável ainda pra fazer uma chamada autenticada daqui.
    const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({
      email: emailEl.value.trim(),
      password: passwordEl.value,
      options: {
        data: {
          nome: nomeEl.value.trim(),
          municipio_id: municipioIds[0] || null,
          municipio_ids: municipioIds,
          entidade: entidadeFinal,
          cargo: cargoEl.value.trim()
        }
      }
    });

    submitBtn.disabled = false;
    submitText.textContent = 'Solicitar Acesso';

    if (signUpError) {
      showError(signUpError.message.includes('already registered') || signUpError.message.includes('already exists')
        ? 'Já existe uma conta com esse e-mail.'
        : 'Não foi possível criar a conta: ' + signUpError.message);
      return;
    }

    if (!signUpData || !signUpData.user) {
      showError('Não foi possível confirmar a criação da conta. Tente entrar em login.html.');
      return;
    }

    form.classList.add('hidden');
    successEl.textContent = signUpData.session
      ? 'Solicitação enviada! Sua conta foi criada e o pedido de acesso está aguardando aprovação. Você já pode entrar, mas só verá os dados do município depois de aprovado.'
      : 'Solicitação enviada! Confirme seu e-mail (verifique também a caixa de spam) antes de entrar — o pedido de acesso já está registrado e aguardando aprovação.';
    successEl.classList.remove('hidden');
  });
})();
</script>
</body>
</html>
