    <script>
        // Proteção de Acesso: Oculta o documento e redireciona ao login se não autenticado
        document.documentElement.style.visibility = 'hidden';
        (async function checkRelatorioAuth() {
            try {
                if (typeof window.supabaseClient !== 'undefined' && window.supabaseClient) {
                    const { data, error } = await window.supabaseClient.auth.getSession();
                    if (error || !data || !data.session) {
                        window.location.replace('login.html');
                        return;
                    }
                }
            } catch(e) {
                window.location.replace('login.html');
                return;
            }
            document.documentElement.style.visibility = 'visible';
        })();
    </script>

<body class="min-h-screen flex flex-col">

    <!-- PAINEL "CONFIGURAÇÕES DA PESQUISA" (só no Relatório Geral): criado dinamicamente por renderPainelPesquisaGeral(),
         no mesmo estilo do painel "Configurações do Mapa" do Relatório Individual (ver #pesquisa-tools-panel). -->

    <!-- CONTAINER DA FOLHA A4 E BARRA LATERAL (SEM SOBREPOSIÇÃO) -->
    <div class="layout-wrapper">
        <main class="page-column" id="main-page-column">
            <div id="a4-document-container" class="w-full flex flex-col items-center gap-6">
                <!-- Conteúdo montado dinamicamente via JS com suporte a multi-páginas e folha única sem vazamento -->
                <div id="report-blocks-render" class="a4-page w-full text-slate-900"></div>

        </main>

            <!-- Painel #map-tools-panel ancorado aqui -->

    <script>
        let reportPayload = null;
        let mapController = null;     // controlador do mini-mapa (src/reportMap.js)
        let mapBaseConfig = null;     // configuração definida no modelo
        let mapBloco = null;          // bloco 'mapa_estatico' do modelo
        let renderArgs = null;        // últimos argumentos de renderBlocks (para repaginar sem perder o mapa)
        let keptMapWrap = null;       // elemento do mapa (com o Leaflet vivo) que sobrevive à repaginação
        let temporalController = null; // análise temporal (src/reportTemporal.js)
        let chartInstances = {};      // gráficos do Dashboard (Chart.js) desenhados na folha: canvasId -> instância
        let tplAtual = null;          // modelo em uso nesta folha (Relatório Geral: editável aqui mesmo, painel "Configurações da Pesquisa")
        let tplSalvoSnapshot = null;  // última versão salva de tplAtual (para o botão "Restaurar" do painel de pesquisa)
        let ultimoTplIdSnapshot = null; // id do modelo já retratado em tplSalvoSnapshot (evita reatratar em toda prévia)
        let statusPesquisaGeral = ''; // mensagem do painel de pesquisa (some no próximo desenho)
        let pesquisaPanelOpen = null; // painel "Configurações da Pesquisa" aberto? (null = decide pela largura da tela)
        let pesquisaSecaoAberta = 'filtro'; // qual acordeão do painel de pesquisa está aberto
        let colunasReveladasPesquisa = new Set(); // "Incluir campos na tabela" expandido (chave: 'geral' ou id do gráfico)
        let emissao = { hash: '', protocolo: '', erro: '' }; // protocolo e SHA-256 da emissão (recalculados quando o conteúdo muda)
        const emissaoData = new Date();                       // dia da emissão (entra no protocolo)
        let emissaoTimer = null;
        let mapPanelOpen = null;       // painel "Mapa" aberto? (null = ainda não decidido; decide pela largura da tela)
        let lastPontosKey = '';
        let mapAlturaMm = null;
        let consultaAberta = false;   // formulário "Consultar Coordenadas" aberto no painel
        let consultaAba = 'dec';
        let consultaCampos = {};
        let consultaErro = '';       // altura do mapa na folha (mm): a do modelo até o usuário ajustar
        let repaginateTimer = null;

        // MODO EDIÇÃO: a Folha A4 Interativa do construtor é esta mesma página (em um iframe), com a moldura de edição por cima
        const EDICAO = !!(window.location && /[?&]modo=edicao(&|$)/.test(window.location.search || ''));
        if (EDICAO) document.documentElement.classList.add('modo-edicao');
        let chaveMapaEdicao = null;
        // quadros recolhidos na página de edição (só para a rolagem ficar menor; o relatório emitido sempre sai completo): 'sint:<bloco>' e 'laudo:<bloco>:<aba>'
        const CHAVE_RECOLHIDOS = 'constructive_quadros_recolhidos';
        const quadrosRecolhidos = new Set();
        try { JSON.parse(sessionStorage.getItem(CHAVE_RECOLHIDOS) || '[]').forEach(k => quadrosRecolhidos.add(k)); } catch (e) { /* sem armazenamento: começa tudo expandido */ }
        /** Seta do quadro (ou da aba do laudo): recolhe/expande e redesenha a página, mantendo o mapa vivo. */
        function alternarQuadro(chave) {
            if (quadrosRecolhidos.has(chave)) quadrosRecolhidos.delete(chave); else quadrosRecolhidos.add(chave);
            try { sessionStorage.setItem(CHAVE_RECOLHIDOS, JSON.stringify(Array.from(quadrosRecolhidos))); } catch (e) { /* ok */ }
            if (mapController) keptMapWrap = document.getElementById('map-wrap');
            desenharRelatorio();
        }
        const NOMES_BLOCO = { cabecalho: 'Cabeçalho oficial', grade_campos: 'Grade de atributos', mapa_estatico: 'Mini-mapa cartográfico', grafico_existente: 'Gráficos do dashboard', kpis: 'Painel de indicadores', galeria_fotos: 'Laudo analítico', laudo_vistoria_fotos: 'Laudo analítico', tabela_sintetica: 'Tabela sintética', tabela_sintetica_1n: 'Quadro sintético 1:N', tabela_analitica: 'Tabela analítica', tabela_feicoes: 'Tabela de feições', mapa_feicoes: 'Mapa das feições', caixa_texto_livre: 'Texto livre', texto_livre: 'Texto livre', rodape: 'Rodapé oficial' };

        window.addEventListener('DOMContentLoaded', () => {
            initReportViewer();
        });

        /** Mensagens entre a folha (esta página) e o construtor (página de fora). */
        function avisarConstrutor(msg) {
            try { if (window.parent && window.parent !== window) window.parent.postMessage(msg, window.location.origin); } catch (e) { /* sem pai: ignora */ }
        }

        /** Botões da moldura de edição: o construtor é quem altera o modelo (esta página só desenha). */
        function acaoEdicao(nome, args, ev) {
            if (ev) { ev.stopPropagation(); ev.preventDefault(); }
            avisarConstrutor({ tipo: 'construtor:acao', nome: nome, args: args || [] });
        }

        function selecionarBlocoEdicao(el, ev) {
            if (ev && ev.target && ev.target.closest && ev.target.closest('.edit-bloco-barra')) return;
            document.querySelectorAll('.edit-bloco.selecionado').forEach(x => x.classList.remove('selecionado'));
            el.classList.add('selecionado');
            avisarConstrutor({ tipo: 'construtor:selecionar', indice: Number(el.getAttribute('data-bloco-index')) });
        }

        /** Moldura de edição de um bloco: barra (nome, subir, descer, remover) e contorno ao passar o mouse / selecionar. */
        // mesma cor do card do painel lateral do construtor (uma cor por tipo de informação)
        const COR_BLOCO = { cabecalho: '#6366f1', rodape: '#06b6d4', caixa_texto_livre: '#8b5cf6', texto_livre: '#8b5cf6', grade_campos: '#0ea5e9', tabela_sintetica_1n: '#f59e0b', tabela_sintetica: '#f59e0b', tabela_analitica: '#f59e0b', laudo_vistoria_fotos: '#f59e0b', galeria_fotos: '#f59e0b', mapa_estatico: '#10b981', grafico_existente: '#f43f5e', kpis: '#f43f5e', tabela_feicoes: '#14b8a6', mapa_feicoes: '#0d9488' };
        function envolverEdicao(html, idx, bloco, opts) {
            if (!EDICAO || idx < 0 || !bloco) return html;
            const nome = NOMES_BLOCO[bloco.tipo] || bloco.tipo;
            const fixo = !!(opts && opts.fixo);
            const mover = fixo ? '' : `<button type="button" onclick="acaoEdicao('moveBlock', [${idx}, -1], event)" title="Mover para cima"><span class="material-symbols-outlined">arrow_upward</span></button><button type="button" onclick="acaoEdicao('moveBlock', [${idx}, 1], event)" title="Mover para baixo"><span class="material-symbols-outlined">arrow_downward</span></button>`;
            return `<div class="edit-bloco${opts && opts.classe ? ' ' + opts.classe : ''}" style="--cor-bloco:${COR_BLOCO[bloco.tipo] || '#0ea5e9'}" data-bloco-index="${idx}" onclick="selecionarBlocoEdicao(this, event)"><div class="edit-bloco-barra"><span>${escapeHtml(nome)}</span>${mover}<button type="button" onclick="acaoEdicao('removeBlock', [${idx}], event)" title="Remover da folha"><span class="material-symbols-outlined">close</span></button></div>${html}</div>`;
        }

        /** Chave do que exige recriar o mapa (o Leaflet não é refeito a cada edição): bloco do mapa, camadas e ortofotos. */
        function chaveMapaDe(payload) {
            const blocos = (payload && payload.template && payload.template.blocos) || [];
            return JSON.stringify([blocos.filter(b => b.tipo === 'mapa_estatico'), (payload && payload.camadasMapa) || null, (payload && payload.ortofotos) || null]);
        }

        /** Construtor enviou o modelo (ou uma alteração dele): redesenha a folha; o mapa só é refeito se ele mesmo mudou. */
        function receberDadosEdicao(payload) {
            const chave = chaveMapaDe(payload);
            if (mapController && chaveMapaEdicao !== null && chave !== chaveMapaEdicao) { window.location.reload(); return; } // recarrega e pede os dados de novo
            chaveMapaEdicao = chave;
            reportPayload = payload;
            if (mapController) keptMapWrap = document.getElementById('map-wrap');
            desenharRelatorio();
        }

        /**
         * "ReportBuilder" dentro da página: os botões da moldura (gerados por src/reportEditor.js) chamam ReportBuilder.<ação>(...);
         * aqui cada chamada vira uma mensagem para o construtor (que altera o modelo e reenvia). O que precisa de tela fica local.
         */
        function criarPonteConstrutor() {
            const local = {
                alternarQuadro: alternarQuadro, enableInlineEdit: editarTextoInline, toggleFieldWidthPopover: alternarPopoverLargura, closeFieldWidthPopover: fecharPopoverLargura,
                // editor do texto livre: roda aqui (é DOM da página); só o resultado vai para o construtor
                execFormat: FreeText.execFormat, changeLineHeight: FreeText.changeLineHeight, saveFreeTextContent: FreeText.saveFreeTextContent,
                handleFreeTextInput: FreeText.handleFreeTextInput, handleFreeTextKeyDown: FreeText.handleFreeTextKeyDown,
                showMentionDropdown: FreeText.showMentionDropdown, insertMentionField: FreeText.insertMentionField
            };
            return new Proxy({}, { get: (_, nome) => {
                if (local[nome]) return local[nome];
                return (...args) => {
                    const limpos = args.map(a => {
                        if (a && typeof a === 'object' && typeof a.stopPropagation === 'function') { a.stopPropagation(); if (a.preventDefault) a.preventDefault(); return null; }
                        return (a && a.nodeType) ? null : a;
                    });
                    avisarConstrutor({ tipo: 'construtor:acao', nome: String(nome), args: limpos });
                };
            } });
        }

        /** Duplo clique em um título/texto: edita ali mesmo; ao sair (ou Enter) grava a propriedade do bloco no modelo. */
        function editarTextoInline(el, idx, prop) {
            if (!el) return;
            el.contentEditable = 'true';
            el.focus();
            el.style.outline = '2px solid #0ea5e9';
            const teclas = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); el.blur(); } };
            el.addEventListener('keydown', teclas);
            const sair = () => {
                el.removeEventListener('keydown', teclas);
                el.removeEventListener('blur', sair);
                el.contentEditable = 'false';
                el.style.outline = '';
                let valor = el.innerText || '';
                if (valor.endsWith('\n')) valor = valor.slice(0, -1);
                avisarConstrutor({ tipo: 'construtor:acao', nome: 'atualizarPropriedade', args: [idx, prop, valor.trim()] });
            };
            el.addEventListener('blur', sair);
        }

        /** Largura exata do campo: pequeno menu ao lado do botão de % (proporções rápidas). */
        function fecharPopoverLargura() {
            const p = document.getElementById('popover-largura');
            if (p && p.remove) p.remove();
        }
        function alternarPopoverLargura(idx, fid, ev) {
            if (ev && ev.stopPropagation) { ev.stopPropagation(); if (ev.preventDefault) ev.preventDefault(); }
            const anterior = document.getElementById('popover-largura');
            const mesmo = anterior && anterior.getAttribute && anterior.getAttribute('data-campo') === String(fid);
            fecharPopoverLargura();
            if (mesmo) return;
            const alvo = ev && (ev.currentTarget || ev.target);
            const r = alvo && alvo.getBoundingClientRect ? alvo.getBoundingClientRect() : { bottom: 200, left: 100 };
            const p = document.createElement('div');
            p.id = 'popover-largura';
            p.setAttribute('data-campo', String(fid));
            p.style.cssText = 'position:absolute;z-index:9999;width:220px;background:#fff;border:1px solid #cbd5e1;border-radius:12px;box-shadow:0 10px 30px rgba(15,23,42,.25);padding:10px;font:12px system-ui,sans-serif;color:#0f172a;';
            p.style.top = (window.scrollY + r.bottom + 6) + 'px';
            p.style.left = Math.max(6, Math.min((window.innerWidth || 800) - 226, r.left - 70)) + 'px';
            const itens = [[25, '1/4'], [33, '1/3'], [50, '1/2'], [66, '2/3'], [75, '3/4'], [100, 'Total']];
            p.innerHTML = '<div style="font-weight:800;text-transform:uppercase;font-size:10px;color:#475569;margin-bottom:6px">Largura do campo</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px">'
                + itens.map(i => '<button type="button" style="padding:4px 2px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;cursor:pointer;font-weight:700;font-size:10px" onclick="definirLarguraExata(' + Number(idx) + ', \'' + escapeHtml(String(fid)) + '\', ' + i[0] + ', event)">' + i[1] + ' (' + i[0] + '%)</button>').join('') + '</div>';
            document.body.appendChild(p);
        }
        function definirLarguraExata(idx, fid, pct, ev) {
            if (ev) { ev.stopPropagation(); ev.preventDefault(); }
            fecharPopoverLargura();
            avisarConstrutor({ tipo: 'construtor:acao', nome: 'setFieldWidthExact', args: [idx, fid, pct] });
        }

        /**
         * REORDENAR BLOCOS DO RELATÓRIO GERAL: arrastar direto na folha (não no construtor — esses blocos só
         * existem/se configuram aqui). Cabeçalho e rodapé não entram (são slots fixos, fora do corpo).
         */
        const MOVABLE_BLOCK_TYPES = new Set(['caixa_texto_livre', 'texto_livre', 'tabela_feicoes', 'mapa_feicoes', 'grafico_existente', 'kpis']);

        function envolverArrastoBloco(html, blocoId) {
            return `<div class="geral-bloco-arrastavel" data-bloco-id="${escapeHtml(blocoId)}">
                <div class="bloco-drag-handle no-print" title="Arraste para mudar a posição deste bloco na folha"><span class="material-symbols-outlined">drag_indicator</span> arrastar para reordenar</div>
                ${html}
            </div>`;
        }

        let arrastosBlocosGerais = [];
        function ligarArrastoBlocosGerais() {
            arrastosBlocosGerais.forEach(s => { try { s.destroy(); } catch (e) { /* já removido */ } });
            arrastosBlocosGerais = [];
            const montar = () => {
                if (typeof Sortable === 'undefined') return;
                document.querySelectorAll('.a4-page-body-slot').forEach(cont => {
                    arrastosBlocosGerais.push(new Sortable(cont, {
                        draggable: '.geral-bloco-arrastavel', handle: '.bloco-drag-handle', group: 'geral-blocos-pesquisa',
                        animation: 200, ghostClass: 'opacity-40', chosenClass: 'ring-2',
                        onEnd: reordenarBlocosGeraisPelaTela
                    }));
                });
            };
            if (typeof Sortable === 'undefined') {
                const s = document.createElement('script');
                s.src = 'https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js';
                s.onload = montar;
                document.head.appendChild(s);
            } else {
                montar();
            }
        }

        /** Depois de soltar um bloco: lê a nova ordem visual (em toda a folha, entre páginas) e grava no modelo (rascunho, some ao salvar). */
        function reordenarBlocosGeraisPelaTela() {
            if (!tplAtual || !Array.isArray(tplAtual.blocos)) return;
            const idsNaTela = [];
            document.querySelectorAll('.geral-bloco-arrastavel').forEach(el => {
                const id = el.getAttribute('data-bloco-id');
                if (id && idsNaTela.indexOf(id) < 0) idsNaTela.push(id);
            });
            if (idsNaTela.length < 2) return; // nada para reordenar
            const porId = {};
            tplAtual.blocos.forEach(b => { porId[b.id] = b; });
            const fila = idsNaTela.map(id => porId[id]).filter(Boolean);
            if (fila.length !== idsNaTela.length) return; // segurança: algum id não bate (ex.: bloco recém-criado sem redesenhar) — não mexe em nada
            let cursor = 0;
            tplAtual.blocos = tplAtual.blocos.map(b => (idsNaTela.indexOf(b.id) >= 0) ? fila[cursor++] : b);
            statusPesquisaGeral = 'Ordem alterada (clique em "Salvar ajustes" para guardar).';
            renderPainelPesquisaGeral();
        }

        /** Arrastar campos (alça ⠿) dentro da grade e do laudo: a nova ordem vai para o construtor. */
        let arrastosCampos = [];
        function ligarArrastoCampos() {
            arrastosCampos.forEach(s => { try { s.destroy(); } catch (e) { /* já removido */ } });
            arrastosCampos = [];
            if (typeof Sortable === 'undefined') return;
            document.querySelectorAll('.a4-grid-fields-container').forEach(cont => {
                const idx = parseInt(cont.getAttribute('data-block-index'), 10);
                if (isNaN(idx)) return;
                arrastosCampos.push(new Sortable(cont, {
                    handle: '.field-drag-handle', animation: 200, direction: 'horizontal', swapThreshold: 0.65, invertSwap: true, emptyInsertThreshold: 5, ghostClass: 'opacity-40', chosenClass: 'ring-2',
                    onEnd: () => {
                        const ids = Array.from(cont.children).map(el => el.getAttribute('data-field-id')).filter(Boolean);
                        if (ids.length) avisarConstrutor({ tipo: 'construtor:acao', nome: 'reordenarCampos', args: [idx, ids] });
                    }
                }));
            });
        }

        /** Largura (em %) de um cartão depois de arrastar a alça: a largura de partida mais o deslocamento, em % do contêiner (mín. 15, máx. 100). */
        function larguraPorArrasto(larguraInicialPx, deslocamentoPx, larguraContainerPx) {
            if (!(larguraContainerPx > 0)) return 100;
            return Math.max(15, Math.min(100, Math.round((larguraInicialPx + deslocamentoPx) / larguraContainerPx * 100)));
        }

        /** Alça na borda direita de cada cartão de campo (grade e laudo): arrastar muda a largura; ao soltar, o construtor grava o percentual. */
        function ligarRedimensionarCampos() {
            document.querySelectorAll('.a4-grid-fields-container').forEach(cont => {
                const idx = parseInt(cont.getAttribute('data-block-index'), 10);
                if (isNaN(idx) || !(cont.className || '').includes('flex-wrap')) return; // "lista corrida" não tem largura por campo
                Array.from(cont.children).forEach(card => {
                    const fid = card.getAttribute && card.getAttribute('data-field-id');
                    if (!fid) return;
                    const alca = document.createElement('div');
                    alca.className = 'campo-resize';
                    alca.title = 'Arraste para regular a largura do campo';
                    alca.innerHTML = '<span class="campo-resize-rotulo"></span>';
                    alca.addEventListener('mousedown', (ev) => {
                        ev.preventDefault(); ev.stopPropagation();
                        const larguraCont = cont.getBoundingClientRect().width;
                        const inicial = card.getBoundingClientRect().width;
                        const x0 = ev.clientX;
                        const rotulo = alca.firstChild;
                        let pct = null;
                        alca.classList.add('arrastando');
                        const mover = (e) => {
                            pct = larguraPorArrasto(inicial, e.clientX - x0, larguraCont);
                            const folga = Math.round(10 * (1 - pct / 100) * 10) / 10;
                            const w = pct >= 98 ? '100%' : 'calc(' + pct + '% - ' + folga + 'px)';
                            card.style.flex = '0 0 ' + w; card.style.width = w; card.style.maxWidth = w;
                            if (rotulo) rotulo.textContent = pct + '%';
                        };
                        const soltar = () => {
                            document.removeEventListener('mousemove', mover);
                            document.removeEventListener('mouseup', soltar);
                            alca.classList.remove('arrastando');
                            if (pct !== null) avisarConstrutor({ tipo: 'construtor:acao', nome: 'setFieldWidthExact', args: [idx, fid, pct] });
                        };
                        document.addEventListener('mousemove', mover);
                        document.addEventListener('mouseup', soltar);
                    });
                    card.appendChild(alca);
                });
            });
        }

        function iniciarModoEdicao() {
            window.ReportBuilder = criarPonteConstrutor();
            document.addEventListener('mousedown', (e) => { if (!e.target.closest || !e.target.closest('#popover-largura')) fecharPopoverLargura(); });
            // Sortable (arrastar campos): carregado só aqui
            if (typeof Sortable === 'undefined') {
                const s = document.createElement('script');
                s.src = 'https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js';
                s.onload = () => ligarArrastoCampos();
                document.head.appendChild(s);
            }
            window.addEventListener('message', (e) => {
                if (e.origin !== window.location.origin || e.source !== window.parent) return;
                const m = e.data;
                if (m && m.tipo === 'construtor:dados' && m.payload) receberDadosEdicao(m.payload);
            });
            // o iframe é do tamanho do conteúdo: o construtor rola a página, não a folha
            let agendada = false;
            const enviarAltura = () => {
                if (agendada) return;
                agendada = true;
                requestAnimationFrame(() => { agendada = false; avisarConstrutor({ tipo: 'construtor:altura', altura: Math.ceil(document.body.getBoundingClientRect().height) }); });
            };
            if (typeof ResizeObserver !== 'undefined') new ResizeObserver(enviarAltura).observe(document.body);
            avisarConstrutor({ tipo: 'construtor:pronto' });
        }

        // desenhistas dos blocos (src/reportBlocks.js): os mesmos que o construtor passa a usar
        const Blocks = ReportBlocks.create({
            esc: escapeHtml,
            FieldFormatter: FieldFormatter,
            geometryCenter: () => {
                try {
                    const g = reportPayload && reportPayload.featureGeometry;
                    if (!g || typeof turf === 'undefined') return null;
                    const c = turf.centroid({ type: 'Feature', properties: {}, geometry: g }).geometry.coordinates;
                    return { lat: c[1], lng: c[0] };
                } catch (e) { return null; }
            },
            emissaoTexto: (k) => emissaoTexto(k),
            emissaoTitulo: () => emissaoTitulo(),
            emissaoProtocolo: () => emissao.protocolo,
            qrDataUrl: () => qrDataUrl(),
            ReportData: ReportData,
            formTabs: () => window.reportViewerFormTabs || [],
            formFields: () => window.reportViewerFormFields
        });
        const Editor = ReportEditor.create({ blocks: Blocks, esc: escapeHtml }); // moldura de edição (modo edição)
        // editor do texto livre (barra de formatação, lista do "@"): o texto e o espaçamento são gravados pelo construtor, por mensagem
        const FreeText = ReportFreeText.create({
            esc: escapeHtml,
            getFields: () => window.reportViewerFormFields || [],
            getFeatureData: () => (reportPayload && reportPayload.featureData) || window.reportViewerFeatureData || {},
            resolveFieldValue: (f, d) => (Blocks && Blocks.resolveFieldValue ? Blocks.resolveFieldValue(f, d) : undefined),
            save: (i, html) => {
                if (EDICAO) {
                    avisarConstrutor({ tipo: 'construtor:acao', nome: 'saveFreeTextContent', args: [i, html] });
                } else {
                    if (tplAtual && tplAtual.blocos && tplAtual.blocos[i]) {
                        tplAtual.blocos[i].conteudo = html;
                    }
                    if (reportPayload && reportPayload.template && reportPayload.template.blocos && reportPayload.template.blocos[i]) {
                        reportPayload.template.blocos[i].conteudo = html;
                    }
                    scheduleEmissao();
                }
            },
            setLineHeight: (i, v) => {
                if (EDICAO) {
                    avisarConstrutor({ tipo: 'construtor:acao', nome: 'changeLineHeight', args: [i, v] });
                } else {
                    if (tplAtual && tplAtual.blocos && tplAtual.blocos[i]) {
                        tplAtual.blocos[i].espacamento = v;
                    }
                }
            }
        });
        window.ReportBuilder = criarPonteConstrutor();
        const { getOrgBadgeHtml, getStatusBadgeHtml, getRecuoBadgeHtml, getGeometryCenter, formatFieldValueForDisplay, readFieldRaw, isRichField,
                resolveFieldHtml, resolveFieldValue, getFieldWidthStyle, renderAttributeGrid, replaceMentionsWithData,
                getFooterPageNumberText, renderHeaderSlotHtml, renderFooterSlotHtml } = Blocks;



        // aviso fixo (só na tela) quando o relatório é aberto pelo construtor com a feição de teste
        function mostrarAvisoPrevia() {
            if (document.getElementById('aviso-previa')) return;
            const d = document.createElement('div');
            d.id = 'aviso-previa';
            d.className = 'no-print';
            d.style.cssText = 'position:fixed;left:16px;bottom:16px;z-index:1300;max-width:340px;background:#fef3c7;border:1px solid #f59e0b;color:#92400e;padding:9px 12px;border-radius:10px;font:12px/1.35 sans-serif;box-shadow:0 6px 18px rgba(15,23,42,.18)';
            d.innerHTML = '<b>PRÉVIA</b> — feição e dados de exemplo, com o modelo como está no construtor. Nada é salvo nem registrado, e o que for gerado aqui não tem validade como documento.';
            document.body.appendChild(d);
        }

        function initReportViewer() {
            const docBox = document.getElementById('a4-document-container');
            if (docBox) docBox.addEventListener('input', () => scheduleEmissao());
            if (EDICAO) { iniciarModoEdicao(); return; }
            // Recupera o payload de dados salvo pela aplicação principal
            try {
                const raw = sessionStorage.getItem('constructive_active_report_payload') || 
                            localStorage.getItem('constructive_active_report_payload');
                if (raw) {
                    reportPayload = JSON.parse(raw);
                }
            } catch(e) {
                console.error('[Viewer] Falha ao ler payload:', e);
            }

            // Fallback para recuperar dados da feição da janela principal (window.opener) se o payload for vazio
            if ((!reportPayload || !reportPayload.featureData || Object.keys(reportPayload.featureData).length === 0) && typeof window !== 'undefined' && window.opener) {
                try {
                    const opLayer = window.opener.activeFeatureLayer;
                    if (opLayer && opLayer.feature) {
                        if (!reportPayload) reportPayload = {};
                        reportPayload.featureData = window.opener.activeFeatureData || window.opener.currentFormFeatureData || opLayer.feature.properties || {};
                        reportPayload.featureGeometry = opLayer.feature.geometry || (opLayer.toGeoJSON ? opLayer.toGeoJSON().geometry : null);
                        if (!reportPayload.templateId) {
                            const urlParams = new URLSearchParams(window.location.search);
                            reportPayload.templateId = urlParams.get('templateId');

                    console.warn('[Viewer] Falha ao recuperar dados da janela principal:', e);

                    </div>
                `;
                return;
            }

            desenharRelatorio();
        }

        /** Monta o relatório a partir do payload (feição, modelo, camadas): folhas, blocos, mapa. */
        function desenharRelatorio() {
            const { templateId, formId, featureData, featureGeometry, template } = reportPayload;
            if (reportPayload.preview && !EDICAO) mostrarAvisoPrevia();
            
            // Busca o modelo
            let templates = [];
            try {
                templates = JSON.parse(localStorage.getItem('constructive_report_templates') || '[]');
            } catch(e) {}
            
            let tpl = template || templates.find(t => t.id === templateId) || templates.find(t => t.form_id === formId) || templates[0];
            if (!tpl) {
                tpl = {
                    id: 'default_preview',
                    nome: 'Ficha Individual do Imóvel',
                    tipo: 'individual',
                    config_pagina: { orientacao: 'portrait', margens_mm: { top: 15, bottom: 15, left: 15, right: 15 } },
                    blocos: [
                        { id: 'b1', tipo: 'cabecalho', titulo: 'FICHA CADASTRAL DO IMÓVEL', subtitulo: 'Prefeitura Municipal', logo: true, exibirDataHora: true, exibirProtocolo: true },
                        { id: 'b2', tipo: 'mapa_estatico', titulo: 'Delimitação Cartográfica do Imóvel', exibirCotas: true, exibirArea: true, exibirNorte: true, exibirEscala: true, escala: '1:2.500' },
                        { id: 'b3', tipo: 'grade_campos', titulo: 'Dados Cadastrais', colunasLayout: 2 },
                        { id: 'b4', tipo: 'caixa_texto_livre', titulo: 'Parecer Técnico / Observações', conteudo: 'O imóvel inspecionado encontra-se devidamente delimitado conforme as coordenadas georreferenciadas levantadas.' },
                        { id: 'b5', tipo: 'rodape', numeracao: true, exibirHash: true, exibirDataHora: true }
                    ]
                };
            }

            // Atualiza o título da barra superior
            document.getElementById('report-header-title').textContent = tpl.nome || 'Relatório da Feição';
            document.title = `${tpl.nome || 'Relatório'} - Feição`;

            // Configura as dimensões da folha (A4 ou A3, retrato ou paisagem)
            const pd = PageSize.dims(tpl.config_pagina);
            const orient = pd.orient;
            const mm = (tpl.config_pagina && tpl.config_pagina.margens_mm) || { top: 15, bottom: 15, left: 15, right: 15 };
            
            // Injeta regra @page dinâmica
            let pageStyle = document.getElementById('dynamic-page-print-style');
            if (!pageStyle) {
                pageStyle = document.createElement('style');
                pageStyle.id = 'dynamic-page-print-style';
                document.head.appendChild(pageStyle);
            }
            pageStyle.textContent = `
                @page {
                    size: ${pd.cssPageSize};
                    margin: 0;
                }
            `;

            const docContainer = document.getElementById('a4-document-container');
            if (docContainer) {
                docContainer.style.maxWidth = pd.widthPx + 'px';
                docContainer.style.padding = '0';
                docContainer.style.display = 'flex';
                docContainer.style.flexDirection = 'column';
                docContainer.style.alignItems = 'center';
            }
            document.documentElement.style.setProperty('--print-padding', `${mm.top}mm ${mm.right}mm ${mm.bottom}mm ${mm.left}mm`);
            document.documentElement.style.setProperty('--page-width', pd.widthPx + 'px');
            document.documentElement.style.setProperty('--page-height', pd.heightPx + 'px');
            document.documentElement.style.setProperty('--print-page-width', pd.widthMm + 'mm');
            document.documentElement.style.setProperty('--print-page-height', pd.heightMm + 'mm');

            // Injeta os blocos do relatório
            renderBlocks(tpl, featureData, featureGeometry);
        }

        function renderBlocks(tpl, featureData = {}, featureGeometry = null) {
            const docContainer = document.getElementById('a4-document-container');
            if (!docContainer) return;

            // Busca campos para preenchimento
            let fields = [];
            let formTabs = [];
            if (reportPayload && Array.isArray(reportPayload.formFields) && reportPayload.formFields.length > 0) {
                fields = [...reportPayload.formFields];
            }
            if (reportPayload && Array.isArray(reportPayload.formTabs) && reportPayload.formTabs.length > 0) {
                formTabs = [...reportPayload.formTabs];
            }

            // Fallback para window.opener se abas ou campos estiverem vazios
            if ((formTabs.length === 0 || fields.length === 0) && typeof window !== 'undefined' && window.opener) {
                try {
                    const op = window.opener;
                    const opTabs = op.activeFormSchema || op.currentFormFeatures || op.activeFormTabs;
                    if (Array.isArray(opTabs) && opTabs.length > 0) {
                        if (formTabs.length === 0) formTabs = opTabs;
                        if (fields.length === 0) {
                            opTabs.forEach(t => {
                                if (Array.isArray(t.fields)) fields.push(...t.fields);
                            });
                        }
                    }
                } catch(e) {}
            }

            if (fields.length === 0) {
                try {
                    const forms = JSON.parse(localStorage.getItem('constructive_forms') || '[]');
                    const curForm = forms.find(f => f.id === tpl.form_id) || forms[0];
                    const tabsList = curForm?.tabs || (curForm?.schema && curForm.schema.tabs);
                    if (tabsList && Array.isArray(tabsList)) {
                        tabsList.forEach(t => {
                            if (t.fields) fields.push(...t.fields);
                        });
                        if (formTabs.length === 0) formTabs = tabsList;
                    }
                } catch(e) {}
            }
            window.reportViewerFormTabs = formTabs;
            window.reportViewerFormFields = fields;
            window.reportViewerFeatureData = featureData;
            // migra modelos antigos: um bloco de gráfico só com vários chart_ids vira um bloco por gráfico (cada um
            // arrastável e configurável à parte); "chart_id" (singular, do modelo padrão bem antigo) também migra
            tpl.blocos = normalizarBlocosGraficosGeral(tpl.blocos || []);
            tplAtual = tpl;
            // o retrato "salvo" só é atualizado na 1ª vez que ESTE modelo é aberto (ou depois de salvar de verdade,
            // ver salvarPesquisaGeral) — desenharRelatorio() também roda em prévias ao vivo (Aplicar filtro, ligar
            // gráfico/mapa) que ainda não foram salvas, e essas não podem apagar o que "Restaurar" precisa voltar.
            if (tpl.id !== ultimoTplIdSnapshot) {
                tplSalvoSnapshot = JSON.parse(JSON.stringify(tpl));
                ultimoTplIdSnapshot = tpl.id;
            }
            renderPainelPesquisaGeral(fields);
            const isGeral = tpl.tipo === 'geral';

            const blocos = tpl.blocos || [];
            const tplId = tpl.id || (reportPayload && reportPayload.templateId) || 'default';
            blocos.forEach((b, idx) => {
                if (b.tipo === 'tabela_sintetica_1n' || b.tipo === 'laudo_vistoria_fotos' || b.tipo === 'galeria_fotos') {
                    const bId = b.id || ('quadro_' + idx);
                    try {
                        const savedDens = localStorage.getItem('constructive_block_density_' + tplId + '_' + bId);
                        if (savedDens) b.densidade = savedDens;
                    } catch (e) {}
                }
            });
            const hdrBloco = blocos.find(b => b.tipo === 'cabecalho');
            const ftrBloco = blocos.find(b => b.tipo === 'rodape');
            renderArgs = { tpl: tpl, featureData: featureData, featureGeometry: featureGeometry };
            // a tabela de pontos (e o memorial) entra logo depois do mapa, com quebra entre folhas
            const bodyBlocos = blocos.filter(b => b.tipo !== 'cabecalho' && b.tipo !== 'rodape').reduce((acc, b) => {
                acc.push(b);
                if (b.tipo === 'mapa_estatico') {
                    acc.push({ tipo: 'tabela_pontos_mapa', id: 'pts_' + (b.id || ''), _sintetico: true });
                    acc.push({ tipo: 'tabela_confrontantes_mapa', id: 'conf_' + (b.id || ''), _sintetico: true });
                    acc.push({ tipo: 'analise_mapa', id: 'ana_' + (b.id || ''), _sintetico: true });
                    acc.push({ tipo: 'mapa_temporal_series', id: 'tmp_' + (b.id || ''), _sintetico: true });
                }
                return acc;
            }, []);

            const pageDims = PageSize.dims(tpl.config_pagina);
            const mm = (tpl.config_pagina && tpl.config_pagina.margens_mm) || { top: 15, bottom: 15, left: 15, right: 15 };
            const pageHeightPx = pageDims.heightPx;
            const pageWidthPx = pageDims.widthPx;

            // Renderiza os blocos de corpo. Blocos "divisíveis" (tabelas longas) devolvem { split }.
            const renderedBodyBlocks = bodyBlocos.map((b, bIdx) => {
                const globalIdx = blocos.indexOf(b);
                const out = renderSingleBlock(b, globalIdx >= 0 ? globalIdx : bIdx, featureData, featureGeometry, fields, tpl);
                return (out && typeof out === 'object' && out.split) ? { bloco: b, split: out.split } : { bloco: b, html: out };
            }).filter(rb => !(rb.bloco._sintetico && !rb.split && !rb.html)); // sem pontos, a tabela não ocupa espaço

            // Medição de altura para distribuição em folhas
            let measureBox = document.getElementById('a4-measure-stage');
            if (!measureBox) {
                measureBox = document.createElement('div');
                measureBox.id = 'a4-measure-stage';
                measureBox.style.cssText = 'position:absolute; left:-9999px; top:-9999px; visibility:hidden; width:' + (pageWidthPx - Math.round((mm.left + mm.right) * 3.78)) + 'px; box-sizing:border-box; font-family:"IBM Plex Sans",sans-serif;';
                document.body.appendChild(measureBox);
            }
            measureBox.style.width = (pageWidthPx - Math.round((mm.left + mm.right) * 3.78)) + 'px';

            const headerHeightPx = hdrBloco ? 135 : 0;
            const footerHeightPx = ftrBloco ? 42 : 0;
            
            // Margens superior e inferior reais configuradas no documento
            const padTopP1Px = Math.round((hdrBloco ? Math.max(2, mm.top - 8) : mm.top) * 3.78);
            const padBotP1Px = Math.round((ftrBloco ? Math.max(2, mm.bottom - 8) : mm.bottom) * 3.78);
            const padTopP2Px = Math.round(((hdrBloco && hdrBloco.repetir_todas_folhas) ? Math.max(2, mm.top - 8) : mm.top) * 3.78);
            const padBotP2Px = padBotP1Px;

            const maxBodyHeightP1 = pageHeightPx - (hdrBloco ? headerHeightPx : 0) - (ftrBloco ? footerHeightPx : 0) - padTopP1Px - padBotP1Px;
            const maxBodyHeightP2 = pageHeightPx - ((hdrBloco && hdrBloco.repetir_todas_folhas) ? headerHeightPx : 0) - (ftrBloco ? footerHeightPx : 0) - padTopP2Px - padBotP2Px;

            // Bloco comum: altura total. Bloco divisível: altura fixa (título + cabeçalho da tabela) e de cada linha.
            const BLOCK_GAP = 14;
            renderedBodyBlocks.forEach(rb => {
                if (rb.split) {
                    if (Array.isArray(rb.split.rowHeightsFixas)) {
                        // altura JÁ CONHECIDA (ex.: Mapa das Feições, cuja altura de cada mini-mapa é a que o próprio
                        // bloco define) — evita medir no DOM escondido, que não capta corretamente o tamanho real de
                        // um Leaflet (ainda não existe ali) e fazia o mapa "esticar" sem quebrar a folha certo.
                        rb.rowHeights = rb.split.rowHeightsFixas;
                        rb.overheadH = rb.split.overheadFixo || 0;
                    } else {
                        // overhead (título + cabeçalho da tabela) medido À PARTE, sem nenhuma linha — mais confiável
                        // que subtrair de uma tabela com centenas de linhas de uma vez só.
                        measureBox.innerHTML = rb.split.chunkHtml([], true);
                        rb.overheadH = measureBox.firstElementChild ? measureBox.firstElementChild.offsetHeight : measureBox.offsetHeight;
                        // linhas medidas em LOTES (não todas de uma vez): tabelas com centenas/milhares de linhas
                        // não viram uma única árvore DOM enorme escondida na página, o que também ajuda a medição
                        // a ficar fiel ao que realmente aparece depois, linha por linha
                        const LOTE_MEDICAO = 80;
                        rb.rowHeights = [];
                        for (let i = 0; i < rb.split.rowsHtml.length; i += LOTE_MEDICAO) {
                            measureBox.innerHTML = rb.split.chunkHtml(rb.split.rowsHtml.slice(i, i + LOTE_MEDICAO), true);
                            Array.from(measureBox.querySelectorAll('[data-split-row]')).forEach(el => {
                                rb.rowHeights.push(Math.max(1, Math.ceil(el.getBoundingClientRect().height)));
                            });
                        }
                    }
                } else {
                    measureBox.innerHTML = rb.html;
                    rb.h = Math.max(40, measureBox.firstElementChild ? measureBox.firstElementChild.offsetHeight : measureBox.offsetHeight) + BLOCK_GAP;
                }
            });
            measureBox.innerHTML = '';

            // Distribuição em folhas: blocos inteiros; tabelas longas quebram por linhas (sem cortar conteúdo)
            const pagesBlocks = [[]];
            let pageAcc = 0;
            let pageLimit = maxBodyHeightP1;
            const startNewPage = () => { pagesBlocks.push([]); pageAcc = 0; pageLimit = maxBodyHeightP2; };
            const currentPage = () => pagesBlocks[pagesBlocks.length - 1];

            renderedBodyBlocks.forEach(rb => {
                if (!rb.split) {
                    if (currentPage().length > 0 && pageAcc + rb.h > pageLimit) startNewPage();
                    currentPage().push(rb);
                    pageAcc += rb.h;
                    return;
                }
                let rows = rb.split.rowsHtml.slice();
                let heights = rb.rowHeights.slice();
                let isFirstChunk = true;
                while (rows.length > 0) {
                    const gapBefore = (pageAcc > 0 ? BLOCK_GAP : 0);
                    let room = pageLimit - pageAcc - gapBefore - rb.overheadH;
                    if (room < heights[0] && currentPage().length > 0) {
                        startNewPage();
                        room = pageLimit - rb.overheadH;
                    }
                    let take = 0;
                    let used = 0;
                    while (take < rows.length && (used + heights[take]) <= room) {
                        used += heights[take];
                        take++;
                    }
                    if (take === 0) take = 1; // linha maior que a folha: entra sozinha
                    currentPage().push({ bloco: rb.bloco, html: rb.split.chunkHtml(rows.slice(0, take), isFirstChunk), primeiroChunk: isFirstChunk });
                    pageAcc += gapBefore + rb.overheadH + used;
                    isFirstChunk = false;
                    rows = rows.slice(take);
                    heights = heights.slice(take);
                    if (rows.length > 0) startNewPage();
                }
            });
            if (pagesBlocks.length > 1 && pagesBlocks[pagesBlocks.length - 1].length === 0) pagesBlocks.pop();

            const totalPages = pagesBlocks.length;

            // aviso bem visível (também na impressão/Word) quando o filtro do modelo está cortando a lista de
            // feições — sem ele, uma contagem "estranha" (ex.: 44 de 282) parece bug de carregamento, quando na
            // verdade é um filtro salvo de uma pesquisa anterior; aparece só na 1ª folha, antes do resto do corpo.
            let avisoFiltroHtml = '';
            if (isGeral) {
                const totalComFiltro = resolveFeatureListFull().length;
                const totalSemFiltro = ultimoTotalSemFiltroGeral;
                if (typeof totalSemFiltro === 'number' && totalSemFiltro !== totalComFiltro) {
                    avisoFiltroHtml = `
                        <div class="page-break-avoid" style="background:#fff7ed;border:1px solid #fdba74;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:11px;color:#9a3412">
                            <b>Filtro ativo:</b> mostrando ${totalComFiltro} de ${totalSemFiltro} feições da camada. Para ver todas, abra "Configurações da Pesquisa" → "Filtro de feições" e clique em "Limpar filtro".
                        </div>`;
                }
            }

            let pagesHtml = '';
            pagesBlocks.forEach((pageBlocks, pIdx) => {
                const pageNum = pIdx + 1;
                const isFirst = (pageNum === 1);
                const showHeader = isFirst || (hdrBloco && hdrBloco.repetir_todas_folhas);
                const showFooter = !!ftrBloco;

                const padTopMm = showHeader ? Math.max(2, mm.top - 8) : mm.top;
                const padBotMm = showFooter ? Math.max(2, mm.bottom - 8) : mm.bottom;

                const bodyHtml = (isFirst ? avisoFiltroHtml : '') + pageBlocks.map(b => {
                    const ehPrimeiro = b.primeiroChunk !== false; // ausente (bloco inteiro, não dividido) ou true = primeira aparição
                    const html = (isGeral && !EDICAO && ehPrimeiro && MOVABLE_BLOCK_TYPES.has(b.bloco.tipo)) ? envolverArrastoBloco(b.html, b.bloco.id) : b.html;
                    return envolverEdicao(html, blocos.indexOf(b.bloco), b.bloco);
                }).join('');
                const pageIdAttr = isFirst ? 'id="report-blocks-render"' : '';

                pagesHtml += `
                    <div class="a4-page w-full text-slate-900 ${totalPages === 1 ? 'single-page' : ''}" 
                         data-page="${pageNum}"
                         style="max-width: ${pageWidthPx}px; min-height: ${pageHeightPx}px; ">
                        
                        <!-- Cabeçalho Institucional: Fora do corpo, acima da margem superior -->
                        ${showHeader ? envolverEdicao(EDICAO ? Editor.cabecalho(hdrBloco, blocos.indexOf(hdrBloco), tpl, { padLeftMm: mm.left, padRightMm: mm.right }) : renderHeaderSlotHtml(hdrBloco, tpl, mm.left, mm.right), blocos.indexOf(hdrBloco), hdrBloco, { fixo: true }) : ''}

                        <!-- Corpo da Folha: Delimitado entre as margens superior e inferior -->
                        <div ${pageIdAttr} class="a4-page-body-slot flex flex-col gap-3.5 w-full flex-1" style="padding: ${padTopMm}mm ${mm.right}mm ${padBotMm}mm ${mm.left}mm; box-sizing: border-box;">
                            ${bodyHtml}
                        </div>

                        <!-- Rodapé Oficial: Fora do corpo, abaixo da margem inferior, fixo na base -->
                        ${showFooter ? envolverEdicao(renderFooterSlotHtml(ftrBloco, pageNum, totalPages, mm.left, mm.right), blocos.indexOf(ftrBloco), ftrBloco, { fixo: true, classe: 'mt-auto' }) : ''}
                    </div>
                `;
            });

            docContainer.innerHTML = pagesHtml;
            renderPendingCharts();
            renderPendingMapasFeicoes();
            ligarRedimensionarQuadros1N();
            if (isGeral && !EDICAO) { ligarArrastoBlocosGerais(); ligarRedimensionarTabelaFeicoes(); }

            if (mapController && keptMapWrap) {
                // repaginação: o mapa (Leaflet vivo) volta para o novo lugar, sem recarregar nada
                const fresh = document.getElementById('map-wrap');
                if (fresh) fresh.replaceWith(keptMapWrap);
                keptMapWrap = null;
                mapController.invalidate();
                mapController.refresh();
            } else {
                // Inicializa o Mini-Mapa Leaflet Interativo (com os ajustes que o usuário já salvou)
                setTimeout(() => {
                    initReportMiniMap(featureGeometry);
                }, 100);
            }
            if (temporalController) temporalController.attach();
            if (EDICAO) { ligarArrastoCampos(); ligarRedimensionarCampos(); } // as alças voltam a cada repaginação
            scheduleEmissao();
        }

        // =====================================================================================
        // GRÁFICOS DO DASHBOARD NO RELATÓRIO GERAL: mesmo Chart.js do painel de estatísticas, com os dados
        // da lista de exemplo (prévia) ou da camada de verdade (emissão, lida da janela de origem por themeId).
        // =====================================================================================
        const CHART_COLORS = ['#0ea5e9', '#f59e0b', '#10b981', '#f43f5e', '#8b5cf6', '#06b6d4', '#eab308', '#64748b'];

        /** Feições do Relatório Geral: da prévia (featureList no payload) ou, na emissão real, da camada (window.opener, por themeId). */
        const LIMITE_FEICOES_GRAFICO = 5000; // acima disso, os gráficos usam só as primeiras (evita travar a folha)
        let featureListTruncada = false;

        /**
         * Feições do Relatório Geral, com propriedades e geometria: da prévia (featureList no payload, sem geometria —
         * a lista de exemplo não tem coordenadas) ou da camada de verdade (emissão, lida do opener por themeId).
         */
        // conta as feições da camada, sem passar pelo filtro do modelo — só para o aviso "N de TOTAL feições"
        // saber quantas existiam ANTES do filtro cortar (não reaproveita a mesma lista filtrada por engano)
        let ultimoTotalSemFiltroGeral = null;

        function resolveFeatureListFull(ignorarFiltro) {
            // filtro do modelo (Relatório Geral): lido de tplAtual, que é a MESMA referência editada ao vivo pelo
            // painel "Ajustar pesquisa" — assim o filtro reage tanto na prévia quanto na emissão real.
            const filtro = LayerFilter ? LayerFilter.normalizeFiltro((tplAtual && tplAtual.filtro) || (reportPayload && reportPayload.template && reportPayload.template.filtro)) : null;
            const temFiltro = !ignorarFiltro && !!(filtro && LayerFilter && !LayerFilter.filtroVazio(filtro));
            if (reportPayload && Array.isArray(reportPayload.featureListAll)) {
                // prévia: lista de exemplo BRUTA, refiltrada aqui a cada mudança do painel (sem gerar prévia nova)
                const fieldIndex = {};
                (reportPayload.formFields || []).forEach(f => { if (f && f.id) fieldIndex[f.id] = f; });
                const base = reportPayload.featureListAll;
                if (!ignorarFiltro) ultimoTotalSemFiltroGeral = base.length;
                const filtradas = temFiltro ? LayerFilter.filtrarFeatures(base.map(p => ({ properties: p })), filtro, fieldIndex).map(f => f.properties) : base;
                return filtradas.map(p => ({ properties: p || {}, geometry: null }));
            }
            if (reportPayload && Array.isArray(reportPayload.featureList)) {
                if (!ignorarFiltro) ultimoTotalSemFiltroGeral = reportPayload.featureList.length;
                return reportPayload.featureList.map(p => ({ properties: p || {}, geometry: null }));
            }
            try {
                const opener = window.opener;
                const themeId = reportPayload && reportPayload.themeId;
                if (opener && !opener.closed && themeId && Array.isArray(opener.themes)) {
                    const theme = opener.themes.find(t => String(t.id) === String(themeId));
                    if (theme && Array.isArray(theme.features)) {
                        if (!ignorarFiltro) ultimoTotalSemFiltroGeral = theme.features.length;
                        // resolve cada campo pelo MESMO caminho do Painel de Estatísticas do mapa (getFeaturePropertyValue),
                        // que entende fórmulas/1:N (ex.: "valor mais recente da vistoria") — sem isso, um campo assim
                        // fica sempre vazio aqui (não existe como properties[id] bruto), quebrando tabela e filtro.
                        // rawFeature guarda a feição ORIGINAL (não resolvida): os gráficos usam ela + computeChartAggregation
                        // (também do opener) para contar exatamente como o Painel de Estatísticas conta, sem recalcular aqui.
                        const resolvidas = theme.features.map(f => ({ properties: propriedadesResolvidasDaCamada(theme, f), geometry: f && f.geometry, rawFeature: f }));
                        // filtro do modelo: aplicado ANTES do teto de segurança, para não descartar por engano
                        // uma feição que casaria com o filtro só porque veio depois das primeiras LIMITE_FEICOES_GRAFICO
                        const fieldIndex = {};
                        (reportPayload.formFields || []).forEach(f => { if (f && f.id) fieldIndex[f.id] = f; });
                        const filtradas = temFiltro ? LayerFilter.filtrarFeatures(resolvidas, filtro, fieldIndex) : resolvidas;
                        featureListTruncada = filtradas.length > LIMITE_FEICOES_GRAFICO;
                        return filtradas.slice(0, LIMITE_FEICOES_GRAFICO);
                    }
                }
            } catch (e) { /* sem janela de origem: fica sem dados */ }
            return [];
        }

        /**
         * Propriedades de uma feição, resolvidas campo a campo pela janela de origem (window.opener.getFeaturePropertyValue),
         * a mesma função que o Painel de Estatísticas do mapa usa — entende campo com fórmula (ex.: "valor mais recente
         * entre as vistorias de uma aba 1:N"), não só a leitura direta de feature.properties[id]. Sem essa função na
         * janela de origem (prévia, ou uma janela mais antiga), cai para as propriedades brutas da feição.
         */
        function propriedadesResolvidasDaCamada(theme, feature) {
            const brutas = (feature && feature.properties) || {};
            const opener = window.opener;
            if (!opener || opener.closed || typeof opener.getFeaturePropertyValue !== 'function') return brutas;
            const campos = (reportPayload && reportPayload.formFields) || [];
            const out = {};
            campos.forEach(f => {
                if (!f || !f.id) return;
                try { out[f.id] = opener.getFeaturePropertyValue(theme, feature, f.id); } catch (e) { out[f.id] = brutas[f.id]; }
            });
            Object.keys(brutas).forEach(k => { if (!(k in out)) out[k] = brutas[k]; });
            return out;
        }

        /** Só as propriedades (para os gráficos e a tabela, que não precisam de geometria). */
        function resolveFeatureList() {
            return resolveFeatureListFull().map(r => r.properties);
        }

        /** Rótulo de exibição do valor de um campo (pelo tipo, como no resto do relatório); "Não informado" quando vazio. */
        function chartValueLabel(fieldId, valor) {
            const campo = (reportPayload && Array.isArray(reportPayload.formFields)) ? reportPayload.formFields.find(f => f.id === fieldId) : null;
            const texto = campo ? FieldFormatter.toText(valor, campo) : ((valor === undefined || valor === null || valor === '') ? FieldFormatter.EMPTY : String(valor));
            return texto === FieldFormatter.EMPTY ? 'Não informado' : texto;
        }

        /**
         * Conta quantas feições têm cada valor do campo de um gráfico. Na emissão real (por themeId), delega para
         * window.opener.computeChartAggregation — a MESMA função que o Painel de Estatísticas do mapa usa — passando
         * a feição original (rawFeature) e a lista já filtrada, para dar exatamente os mesmos valores e as mesmas
         * cores de lá (nada recalculado por conta própria). Sem essa função (prévia com dados de exemplo, sem janela
         * de origem), cai no formatador comum do relatório (chartValueLabel), sobre a lista de exemplo.
         */
        function aggregateChart(chartEntry) {
            const fieldId = chartEntry && chartEntry.fieldId;
            const registrosFull = resolveFeatureListFull();
            const opener = window.opener;
            if (opener && !opener.closed && typeof opener.computeChartAggregation === 'function') {
                const themeId = reportPayload && reportPayload.themeId;
                const theme = (themeId && Array.isArray(opener.themes)) ? opener.themes.find(t => String(t.id) === String(themeId)) : null;
                if (theme) {
                    const featuresRaw = registrosFull.map(r => r.rawFeature).filter(Boolean);
                    try {
                        const agg = opener.computeChartAggregation(theme, chartEntry, featuresRaw);
                        return { labels: agg.rawLabels, data: agg.data, total: agg.total, cores: agg.colorsMap };
                    } catch (e) { /* cai para o cálculo local abaixo */ }
                }
            }
            const contagem = new Map();
            registrosFull.forEach(r => {
                const rotulo = chartValueLabel(fieldId, r.properties ? r.properties[fieldId] : undefined);
                contagem.set(rotulo, (contagem.get(rotulo) || 0) + 1);
            });
            const labels = Array.from(contagem.keys());
            return { labels: labels, data: labels.map(l => contagem.get(l)), total: registrosFull.length, cores: null };
        }

        /** Bloco "Gráficos do Dashboard" (Relatório Geral): um cartão com um canvas por gráfico escolhido. */
        /** Soma e média de um campo numérico (só faz sentido para campos desse tipo; complementa o resumo do gráfico). */
        function agregacaoNumericaCampo(fieldId) {
            const registros = resolveFeatureList();
            let soma = 0, n = 0;
            registros.forEach(props => {
                const raw = props ? props[fieldId] : undefined;
                const num = typeof raw === 'number' ? raw : parseFloat(String(raw == null ? '' : raw).replace(/\./g, '').replace(',', '.').replace(/[^\d.-]/g, ''));
                if (!isNaN(num)) { soma += num; n++; }
            });
            return { soma: soma, media: n ? soma / n : 0, n: n };
        }

        /** Bloco "Gráficos do Dashboard": um card por gráfico (arrastável sozinho), com tabela de valores absolutos e percentuais. */
        function renderChartsBlock(bloco, idx) {
            const catalogo = (reportPayload && Array.isArray(reportPayload.charts)) ? reportPayload.charts : [];
            const chartId = bloco.chartId || (Array.isArray(bloco.chart_ids) ? bloco.chart_ids[0] : bloco.chart_id);
            const g = catalogo.find(c => c.id === chartId);
            const tituloHtml = `<span class="whitespace-pre-line">${(escapeHtml(bloco.titulo || (g && (g.title || g.fieldLabel)) || 'Gráfico do Dashboard')).replace(/\r?\n/g, '<br>')}</span>`;
            if (!g) {
                return `
                    <div class="mb-4 page-break-avoid">
                        <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2.5">${tituloHtml}</div>
                        <div class="p-4 text-center text-slate-400 italic text-xs border border-dashed border-slate-300 rounded-lg bg-slate-50/60">Gráfico não encontrado nas Estatísticas desta camada.</div>
                    </div>`;
            }
            const agg = aggregateChart(g); // também marca featureListTruncada, usada logo abaixo
            const total = agg.total;
            const metaHtml = `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold tracking-wide bg-slate-100 text-slate-700 border border-slate-200 uppercase">${total} feiç${total === 1 ? 'ão' : 'ões'}${featureListTruncada ? ` • mostrando as ${LIMITE_FEICOES_GRAFICO} primeiras` : ''}</span>`;
            const canvasId = 'rpt-chart-' + idx;
            const campoDef = (reportPayload.formFields || []).find(f => f.id === g.fieldId);
            const ehNumerico = ['area_m2', 'number', 'currency', 'moeda'].includes(String((campoDef && campoDef.type) || '').toLowerCase());
            const corDe = (l, i) => (agg.cores && agg.cores[l]) || CHART_COLORS[i % CHART_COLORS.length];
            const linhasResumo = agg.labels.map((l, i) => {
                const pct = total ? (agg.data[i] / total * 100) : 0;
                return `<tr>
                    <td style="padding:4px 8px;border-bottom:1px solid #f1f5f9;color:#334155"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${corDe(l, i)};margin-right:6px;vertical-align:middle"></span>${escapeHtml(l)}</td>
                    <td style="padding:4px 8px;border-bottom:1px solid #f1f5f9;text-align:right;font-family:monospace;font-weight:600;color:#0f172a">${agg.data[i]}</td>
                    <td style="padding:4px 8px;border-bottom:1px solid #f1f5f9;text-align:right;font-family:monospace;color:#64748b">${pct.toFixed(1)}%</td>
                </tr>`;
            }).join('');
            const numAgg = ehNumerico ? agregacaoNumericaCampo(g.fieldId) : null;
            const numHtml = (numAgg && numAgg.n) ? `<div style="font-size:10px;color:#475569;margin-top:6px;padding:4px 8px;background:#f8fafc;border-radius:6px;border:1px solid #e2e8f0;display:inline-block">Soma: <b>${MapTools.fmtNumber(numAgg.soma, 2)}</b> • Média: <b>${MapTools.fmtNumber(numAgg.media, 2)}</b></div>` : '';
            return `
                <div class="mb-4 page-break-avoid">
                    <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2.5 flex items-center justify-between">${tituloHtml}${metaHtml}</div>
                    <div class="h-52 border border-slate-200 rounded-lg p-2.5 bg-white shadow-2xs"><canvas id="${canvasId}" data-chart-canvas data-chart-id="${escapeHtml(g.id || '')}" data-chart-field="${escapeHtml(g.fieldId || '')}" data-chart-type="${escapeHtml(g.type || 'pie')}"></canvas></div>
                    <table style="width:100%;border-collapse:collapse;font-size:10px;margin-top:8px;border:1px solid #e2e8f0;border-radius:6px;overflow:hidden">
                        <thead><tr style="background:#f8fafc;border-bottom:2px solid #e2e8f0;color:#475569"><th style="padding:4px 8px;text-align:left;font-weight:700;text-transform:uppercase;font-size:9.5px;letter-spacing:0.04em">Categoria</th><th style="padding:4px 8px;text-align:right;font-weight:700;text-transform:uppercase;font-size:9.5px;letter-spacing:0.04em">Qtde</th><th style="padding:4px 8px;text-align:right;font-weight:700;text-transform:uppercase;font-size:9.5px;letter-spacing:0.04em">%</th></tr></thead>
                        <tbody>${linhasResumo}
                            <tr style="font-weight:700;background:#f8fafc;border-top:1px solid #cbd5e1"><td style="padding:4px 8px;color:#0f172a">Total</td><td style="padding:4px 8px;text-align:right;font-family:monospace;color:#0f172a">${total}</td><td style="padding:4px 8px;text-align:right;font-family:monospace;color:#0f172a">100%</td></tr>
                        </tbody>
                    </table>
                    ${numHtml}
                </div>`;
        }

        /** Depois que o HTML entra na página: cria (ou recria) os gráficos reais nos canvases da folha. */
        function renderPendingCharts() {
            Object.keys(chartInstances).forEach(id => { try { chartInstances[id].destroy(); } catch (e) { /* já sumiu com a repaginação */ } });
            chartInstances = {};
            if (typeof Chart === 'undefined') return;
            const catalogo = (reportPayload && Array.isArray(reportPayload.charts)) ? reportPayload.charts : [];
            document.querySelectorAll('[data-chart-canvas]').forEach(canvas => {
                const chartId = canvas.getAttribute('data-chart-id');
                const fieldId = canvas.getAttribute('data-chart-field');
                const tipo = canvas.getAttribute('data-chart-type');
                const chartEntry = catalogo.find(c => c.id === chartId) || { fieldId: fieldId, type: tipo };
                const agg = aggregateChart(chartEntry);
                const ehPizza = tipo === 'pie' || tipo === 'donut';
                const cores = agg.labels.map((l, i) => (agg.cores && agg.cores[l]) || CHART_COLORS[i % CHART_COLORS.length]);
                chartInstances[canvas.id] = new Chart(canvas.getContext('2d'), {
                    type: ehPizza ? 'doughnut' : 'bar',
                    data: { labels: agg.labels, datasets: [{ data: agg.data, backgroundColor: cores, borderWidth: 0, cutout: tipo === 'donut' ? '65%' : (tipo === 'pie' ? '0%' : undefined) }] },
                    options: {
                        responsive: true, maintainAspectRatio: false, animation: false,
                        plugins: { legend: { display: ehPizza, position: 'right', labels: { boxWidth: 8, font: { size: 9 } } } },
                        scales: ehPizza ? {} : { y: { beginAtZero: true, ticks: { precision: 0 } } }
                    }
                });
            });
        }

        // =====================================================================================
        // PAINEL "CONFIGURAÇÕES DA PESQUISA" (Relatório Geral): filtro, gráficos, tabela e mapa editáveis direto
        // nesta página — na prévia ("Ver como sairá") e na emissão real —, no mesmo estilo (acordeão flutuante à
        // direita) e comportamento do painel "Configurações do Mapa" do Relatório Individual: edita aqui, clica em
        // "Salvar ajustes", grava por cima do mesmo modelo. Uma pesquisa nova = outro modelo no construtor.
        // =====================================================================================

        function garantirFiltroGeral() {
            if (!tplAtual.filtro || !Array.isArray(tplAtual.filtro.grupos)) tplAtual.filtro = { grupos: [] };
            return tplAtual.filtro;
        }

        function condicaoFiltroVaziaGeral() { return { field: '', op: '', value: '', value2: '' }; }

        function addFiltroGrupoGeral() {
            const f = garantirFiltroGeral();
            if (f.grupos.length >= (LayerFilter.MAX_GRUPOS || 6)) return;
            f.grupos.push({ condicoes: [condicaoFiltroVaziaGeral()] });
            renderPainelPesquisaGeral();
        }

        function removeFiltroGrupoGeral(gIdx, evt) {
            if (evt) evt.stopPropagation();
            const f = garantirFiltroGeral();
            f.grupos.splice(gIdx, 1);
            renderPainelPesquisaGeral();
        }

        function addFiltroCondicaoGeral(gIdx) {
            const f = garantirFiltroGeral();
            const g = f.grupos[gIdx];
            if (!g || g.condicoes.length >= (LayerFilter.MAX_CONDICOES || 6)) return;
            g.condicoes.push(condicaoFiltroVaziaGeral());
            renderPainelPesquisaGeral();
        }

        function removeFiltroCondicaoGeral(gIdx, cIdx, evt) {
            if (evt) evt.stopPropagation();
            const f = garantirFiltroGeral();
            const g = f.grupos[gIdx];
            if (!g) return;
            g.condicoes.splice(cIdx, 1);
            if (g.condicoes.length === 0) f.grupos.splice(gIdx, 1);
            renderPainelPesquisaGeral();
        }

        function updateFiltroCondicaoGeral(gIdx, cIdx, prop, value) {
            const f = garantirFiltroGeral();
            const cond = f.grupos[gIdx] && f.grupos[gIdx].condicoes[cIdx];
            if (!cond) return;
            if (prop === 'field') { cond.field = value; cond.op = ''; cond.value = ''; cond.value2 = ''; }
            else cond[prop] = value;
            renderPainelPesquisaGeral();
        }

        function limparFiltroGeral() {
            tplAtual.filtro = { grupos: [] };
            // "Limpar" é uma ação definitiva (ao contrário de editar uma condição, que espera o "Aplicar filtro"):
            // atualiza a folha inteira na hora — gráficos, tabela, mapa e o aviso "Filtro ativo" somem juntos,
            // sem exigir um segundo clique em "Aplicar filtro" que não é óbvio depois de já ter limpado
            aplicarPesquisaGeral();
        }

        /**
         * Migração: um bloco "grafico_existente" antigo com vários chart_ids (ou o "chart_id" singular do modelo
         * padrão bem antigo) vira um bloco por gráfico. Sem isso, gráfico nenhum fica órfão nem duplicado — cada
         * id de gráfico do bloco antigo vira um bloco novo, na mesma ordem; blocos de outros tipos não mudam.
         */
        function normalizarBlocosGraficosGeral(blocos) {
            const out = [];
            (blocos || []).forEach(b => {
                if (!b || b.tipo !== 'grafico_existente') { out.push(b); return; }
                if (b.chartId) { out.push(b); return; } // já no formato novo
                const ids = Array.isArray(b.chart_ids) ? b.chart_ids : (b.chart_id ? [b.chart_id] : []);
                if (!ids.length) return; // bloco de gráfico sem nenhum gráfico escolhido: descarta
                ids.forEach((id, i) => out.push({ id: ids.length > 1 ? (b.id + '_' + i) : b.id, tipo: 'grafico_existente', chartId: id, titulo: ids.length > 1 ? tituloDoGrafico(id) : b.titulo }));
            });
            return out;
        }

        /**
         * Gráficos do Dashboard (Relatório Geral): CADA gráfico escolhido é o SEU PRÓPRIO bloco (arrastável e
         * independente dos demais), não mais um bloco só com vários gráficos dentro.
         */
        function graficosBlocosGeral() {
            return (tplAtual.blocos || []).filter(b => b.tipo === 'grafico_existente');
        }
        function graficoBlocoPara(chartId) {
            return (tplAtual.blocos || []).find(b => b.tipo === 'grafico_existente' && b.chartId === chartId);
        }
        function tituloDoGrafico(chartId) {
            const g = ((reportPayload && reportPayload.charts) || []).find(c => c.id === chartId);
            return g ? (g.title || g.fieldLabel || 'Gráfico') : 'Gráfico';
        }

        function toggleGraficoEscolhidoGeral(chartId, checked) {
            if (checked) {
                if (graficoBlocoPara(chartId)) { aplicarPesquisaGeral(); return; }
                if (!Array.isArray(tplAtual.blocos)) tplAtual.blocos = [];
                tplAtual.blocos.push({ id: 'b_chart_' + chartId + '_' + Date.now(), tipo: 'grafico_existente', chartId: chartId, titulo: tituloDoGrafico(chartId) });
            } else {
                // remover o gráfico também remove a tabela/mapa dedicados a ele (senão ficam órfãos, sem sentido)
                tplAtual.blocos = (tplAtual.blocos || []).filter(b => !(
                    (b.tipo === 'grafico_existente' && b.chartId === chartId) ||
                    (b.tipo === 'tabela_feicoes' && b.origemGraficoId === chartId) ||
                    (b.tipo === 'mapa_feicoes' && b.origemGraficoId === chartId)
                ));
            }
            aplicarPesquisaGeral();
        }

        /**
         * Bloco "Tabela de Feições" do modelo em uso. Sem origemGraficoId = a tabela geral (card "Filtro de
         * Feições"); com origemGraficoId = a tabela própria de UM gráfico (mesmo conjunto filtrado, colunas à parte).
         */
        function tabelaBlocoGeral(origemGraficoId) {
            return (tplAtual.blocos || []).find(b => b.tipo === 'tabela_feicoes' && (b.origemGraficoId || null) === (origemGraficoId || null));
        }

        /** Cria (se faltar) a tabela geral ou a de um gráfico específico, e mostra o resultado na folha. */
        function gerarTabelaGeral(origemGraficoId) {
            if (!tplAtual) return;
            if (!tabelaBlocoGeral(origemGraficoId)) {
                if (!Array.isArray(tplAtual.blocos)) tplAtual.blocos = [];
                tplAtual.blocos.push({
                    id: 'b_tabela_' + (origemGraficoId || 'geral') + '_' + Date.now(), tipo: 'tabela_feicoes',
                    titulo: origemGraficoId ? ('Feições — ' + tituloDoGrafico(origemGraficoId)) : 'Feições da Camada',
                    origemGraficoId: origemGraficoId || undefined, colunas: []
                });
            }
            aplicarPesquisaGeral();
        }

        function toggleColunaTabelaGeral(fieldId, checked, origemGraficoId) {
            let bloco = tabelaBlocoGeral(origemGraficoId);
            if (!bloco) {
                if (!checked) return;
                gerarTabelaGeral(origemGraficoId);
                bloco = tabelaBlocoGeral(origemGraficoId);
            }
            const cols = Array.isArray(bloco.colunas) ? bloco.colunas : (bloco.colunas = []);
            const i = cols.indexOf(fieldId);
            if (checked && i < 0) cols.push(fieldId);
            if (!checked && i >= 0) cols.splice(i, 1);
            aplicarPesquisaGeral();
        }

        /**
         * Bloco "Mapa das Feições" do modelo em uso (desligado por padrão). Sem origemGraficoId = o mapa geral;
         * com origemGraficoId = o mapa próprio de UM gráfico (mesmo conjunto filtrado).
         */
        function mapaBlocoGeral(origemGraficoId) {
            return (tplAtual.blocos || []).find(b => b.tipo === 'mapa_feicoes' && (b.origemGraficoId || null) === (origemGraficoId || null));
        }

        function toggleMapaFeicoesGeral(checked, origemGraficoId) {
            if (checked) {
                if (mapaBlocoGeral(origemGraficoId)) { aplicarPesquisaGeral(); return; }
                if (!Array.isArray(tplAtual.blocos)) tplAtual.blocos = [];
                tplAtual.blocos.push({
                    id: 'b_mapa_' + (origemGraficoId || 'geral') + '_' + Date.now(), tipo: 'mapa_feicoes',
                    titulo: origemGraficoId ? ('Mapa — ' + tituloDoGrafico(origemGraficoId)) : 'Mapa das Feições',
                    origemGraficoId: origemGraficoId || undefined, cor: '#0ea5e9', exibirContagem: true,
                    baseMap: 'osm', quadriculado: false, alturaPx: 260
                });
            } else {
                tplAtual.blocos = (tplAtual.blocos || []).filter(b => !(b.tipo === 'mapa_feicoes' && (b.origemGraficoId || null) === (origemGraficoId || null)));
            }
            aplicarPesquisaGeral();
        }

        function kpisBlocoGeral() {
            return (tplAtual && Array.isArray(tplAtual.blocos)) ? tplAtual.blocos.find(b => b && b.tipo === 'kpis') : null;
        }

        function toggleKpisGeral(checked) {
            if (!tplAtual) return;
            if (checked) {
                if (kpisBlocoGeral()) { aplicarPesquisaGeral(); return; }
                if (!Array.isArray(tplAtual.blocos)) tplAtual.blocos = [];
                // Insere logo no início do corpo (após o cabeçalho se houver)
                const insertIdx = tplAtual.blocos.findIndex(b => b.tipo !== 'cabecalho');
                const novoBloco = {
                    id: 'b_kpis_' + Date.now(),
                    tipo: 'kpis',
                    titulo: 'Indicadores Territoriais & Cadastrais'
                };
                if (insertIdx >= 0) tplAtual.blocos.splice(insertIdx, 0, novoBloco);
                else tplAtual.blocos.push(novoBloco);
            } else {
                tplAtual.blocos = (tplAtual.blocos || []).filter(b => b && b.tipo !== 'kpis');
            }
            aplicarPesquisaGeral();
        }

        function updateTabelaFeicoesConfigGeral(prop, value, origemGraficoId) {
            const bloco = tabelaBlocoGeral(origemGraficoId);
            if (!bloco) return;
            bloco[prop] = value;
            aplicarPesquisaGeral();
        }

        function updateMargensGeral(tipo) {
            if (!tplAtual) return;
            if (!tplAtual.config_pagina) tplAtual.config_pagina = { tamanho: 'A4', orientacao: 'portrait' };
            let mm = { top: 15, bottom: 15, left: 15, right: 15 };
            if (tipo === 'moderada') mm = { top: 10, bottom: 10, left: 10, right: 10 };
            else if (tipo === 'estreita') mm = { top: 8, bottom: 8, left: 8, right: 8 };
            tplAtual.config_pagina.margens_mm = mm;
            tplAtual.config_pagina.margens_tipo = tipo;
            aplicarPesquisaGeral();
        }

        function updateMapaFeicoesConfigGeral(prop, value, origemGraficoId) {
            const bloco = mapaBlocoGeral(origemGraficoId);
            if (!bloco) return;
            bloco[prop] = value;
            aplicarPesquisaGeral();
        }

        /** Campo escolhido pra rotular a feição no mapa (posição 0 ou 1, até 2 campos no total). */
        function updateRotuloCampoMapaFeicoes(posicao, fieldId, origemGraficoId) {
            const bloco = mapaBlocoGeral(origemGraficoId);
            if (!bloco) return;
            const lista = Array.isArray(bloco.rotuloCampos) ? bloco.rotuloCampos.slice() : [];
            lista[posicao] = fieldId || undefined;
            bloco.rotuloCampos = lista.filter((v, i, arr) => v && arr.indexOf(v) === i); // sem vazios nem repetido
            aplicarPesquisaGeral();
        }

        /** Abreviação de um campo no rótulo da feição (ex.: "Quadra" -> "QD"); vazio volta a usar o nome do campo. */
        function updateRotuloAbrevMapaFeicoes(fieldId, abrev, origemGraficoId) {
            const bloco = mapaBlocoGeral(origemGraficoId);
            if (!bloco) return;
            if (!bloco.rotuloAbrev) bloco.rotuloAbrev = {};
            if (abrev) bloco.rotuloAbrev[fieldId] = abrev; else delete bloco.rotuloAbrev[fieldId];
            aplicarPesquisaGeral();
        }
