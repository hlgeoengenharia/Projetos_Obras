    <style>
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
            margin: 0;
            padding: 0;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        .a4-page {
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
            margin: 20px auto;
            position: relative;
            box-sizing: border-box;
            transition: all 0.2s ease;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        @media screen {
            .a4-page {
                min-height: var(--page-height, 1123px);
                max-width: var(--page-width, 794px);
            }
            .a4-page.single-page {
                height: var(--page-height, 1123px);
                max-height: var(--page-height, 1123px);
                overflow: hidden;
            }
        }

        @page {
            size: A4 portrait;
            margin: 0 !important;
        }

        @media print {
            .no-print {
                display: none !important;
            }
            html, body {
                background: #ffffff !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
            }
            main {
                padding: 0 !important;
                margin: 0 !important;
                display: block !important;
            }
            #a4-document-container {
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                max-width: none !important;
                display: block !important;
            }
            .a4-page {
                box-shadow: none !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                max-width: none !important;
                height: var(--print-page-height, 297mm) !important;
                min-height: var(--print-page-height, 297mm) !important;
                max-height: var(--print-page-height, 297mm) !important;
                overflow: hidden !important;
                box-sizing: border-box !important;
                page-break-after: always !important;
                break-after: page !important;
            }
            .a4-page:last-child {
                page-break-after: auto !important;
                break-after: auto !important;
            }
            .page-break-avoid {
                break-inside: avoid;
                page-break-inside: avoid;
            }

        /* Mini-mapa: sobreposições impressas junto com o mapa */
        .report-map-overlay { position: absolute; z-index: 500; pointer-events: none; }
        #map-north { top: 8px; right: 8px; background: rgba(0,0,0,.72); color: #fff; padding: 4px 6px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; font: 700 10px monospace; line-height: 1; }
        #map-info-wrap { bottom: 34px; left: 8px; display: flex; gap: 4px; align-items: center; max-width: 70%; flex-wrap: wrap; }
        .map-chip { background: rgba(0,0,0,.72); color: #fff; padding: 3px 7px; border-radius: 5px; font: 9px monospace; pointer-events: auto; cursor: move; touch-action: none; }
        /* ferramenta de medição ativa: nada no mapa reage ao mouse (só o próprio mapa), e o cursor é a mira */
        .report-drawing, .report-drawing * { cursor: crosshair !important; }
        .report-drawing .leaflet-interactive, .report-drawing .leaflet-marker-icon, .report-drawing .leaflet-control-scale { pointer-events: none !important; }
        /* alça na borda inferior do mapa: arrastar muda a altura dele na folha */
        #map-resize { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; cursor: ns-resize; z-index: 700; touch-action: none; display: flex; justify-content: center; align-items: flex-end; background: linear-gradient(to top, rgba(15,23,42,.30), transparent); opacity: 0; transition: opacity .15s; }
        #map-wrap:hover #map-resize, #map-resize.ativo { opacity: 1; }
        #map-resize::after { content: ''; width: 46px; height: 4px; margin-bottom: 3px; border-radius: 2px; background: #fff; box-shadow: 0 0 0 1px rgba(15,23,42,.55); }
        /* divisória ajustável das colunas Distância e Confrontantes (só na tela) */
        .col-resize { position: absolute; top: 0; right: -4px; width: 9px; height: 100%; cursor: col-resize; z-index: 5; touch-action: none; }
        .col-resize:hover, .col-resize.ativo { background: rgba(5,150,105,.35); }
        #map-north, #map-legend, #map-locator, .leaflet-control-scale { pointer-events: auto; cursor: move; touch-action: none; }
        #map-legend [data-leg] span { cursor: text; }
        #map-legend { bottom: 22px; right: 8px; background: rgba(255,255,255,.92); border: 1px solid #cbd5e1; border-radius: 6px; padding: 4px 7px; font: 9px sans-serif; color: #0f172a; max-width: 45%; }
        #map-legend div { display: flex; align-items: center; gap: 5px; line-height: 1.5; }
        #map-legend i { display: inline-block; width: 12px; height: 8px; border-radius: 2px; border: 1px solid rgba(0,0,0,.35); }
        .leaflet-container { font-family: inherit; }
        .report-measure { background: transparent; border: 0; }
        .report-measure-label { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; color: #065f46; font: 10px/14px monospace; text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 3px #fff; cursor: move; }
        .report-measure-label.edited { color: #92400e; }
        /* ícone de girar: a área de clique é maior que o desenho e encosta no texto, para o mouse chegar até ele sem perdê-lo */
        .report-rot { position: absolute; left: 100%; top: 50%; transform: translateY(-50%); box-sizing: content-box; width: 18px; height: 18px; padding: 6px 6px 6px 10px; background: radial-gradient(circle closest-side, #0f172a 96%, transparent 100%); background-origin: content-box; background-clip: content-box; background-repeat: no-repeat; color: #fff; font: 13px/18px sans-serif; text-align: center; text-shadow: none; cursor: grab; display: none; }
        .report-rot:active { cursor: grabbing; }        .report-measure-label:hover .report-rot, .report-point-label:hover .report-rot, .report-nlabel-l:hover .report-rot, .report-note-label:hover .report-rot, .rotating .report-rot { display: block; }
        .report-tframe-title { display: flex; justify-content: space-between; gap: 6px; background: #0f172a; color: #fff; padding: 2px 7px; border-radius: 6px 6px 0 0; font: 700 9.5px/16px monospace; }
        .report-tframe-title span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .report-tframe-wrap { border: 1px solid #cbd5e1; border-top: 0; background: #e2e8f0; position: relative; overflow: hidden; border-radius: 0 0 6px 6px; }
        #map-locator { top: 8px; left: 46px; width: 128px; height: 128px; border: 2px solid #0f172a; border-radius: 6px; background: #e2e8f0; overflow: hidden; display: none; }
        .report-locator-north { position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; display: none; align-items: center; justify-content: center; background: rgba(15,23,42,.75); color: #fbbf24; border-radius: 4px; z-index: 600; pointer-events: none; }
        .report-locator-north .material-symbols-outlined { font-size: 13px; }
        .report-nlabel, .report-glabel { background: transparent; border: 0; }
        .report-glabel { pointer-events: none; }
        .report-nlabel-l { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font: 8px/10px monospace; color: #0f172a; text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 3px #fff; cursor: move; }
        .report-glabel span { position: absolute; white-space: nowrap; font: 8px/10px monospace; color: #1e293b; background: rgba(255,255,255,.85); padding: 0 2px; }
        .report-glabel span.e { transform: translate(-50%, -110%); }
        .report-glabel span.n { transform: translate(2px, -50%); }
        .report-note { background: transparent; border: 0; }
        .report-note-label { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; background: #ffffff; color: #0f172a; border: 1px solid #000000; border-radius: 4px; padding: 0 5px; font: 10px/14px sans-serif; cursor: move; }
        .report-vertex-handle { cursor: pointer; }
        @media print { .report-vertex-handle { display: none !important; } }
        .report-point { background: transparent; border: 0; }
        .report-point-dot { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #dc2626; border: 2px solid #fff; box-shadow: 0 0 0 1px #7f1d1d; }
        .report-point-label { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; color: #7f1d1d; font: 10px/14px monospace; text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 3px #fff; cursor: move; }
        .report-measure-input { width: 120px; font: 700 9px monospace; border: 1px solid #059669; border-radius: 3px; padding: 0 3px; outline: none; }
        @media print {
            .leaflet-control-zoom, #map-tools-panel, #map-tools-toggle { display: none !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
        #map-tools-panel { position: fixed; top: 84px; right: 12px; width: 268px; max-height: calc(100vh - 100px); overflow-y: auto; z-index: 1200; background: #fff; border: 1px solid #cbd5e1; border-radius: 14px; box-shadow: 0 10px 30px rgba(15,23,42,.18); font-size: 12px; color: #0f172a; }
                #map-tools-panel h4 { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #334155; font-weight: 800; margin: 8px 0 0; padding: 8px 10px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; background: #e2e8f0; border: 1px solid #cbd5e1; border-radius: 8px; user-select: none; }
        #map-tools-panel h4:hover { color: #0f172a; background: #dbe3ee; }
        #map-tools-panel h4.open { border-radius: 8px 8px 0 0; background: #cbd5e1; color: #0f172a; }
        #map-tools-panel h4 .chev { font-size: 12px; transition: transform .15s; }
        #map-tools-panel h4.open .chev { transform: rotate(180deg); }
        #map-tools-panel .sec-body { padding: 8px 10px 10px; border: 1px solid #cbd5e1; border-top: 0; border-radius: 0 0 8px 8px; background: #f8fafc; }
        #map-tools-panel label.row { display: flex; align-items: center; gap: 7px; padding: 2px 0; cursor: pointer; }
        #map-tools-panel label.row.off { opacity: .45; cursor: not-allowed; }
        #map-tools-panel .rowx { display: flex; align-items: center; gap: 4px; }
        #map-tools-panel .nis { display: inline-flex; gap: 2px; flex: none; }
        #map-tools-panel .nis button { width: 20px; height: 20px; padding: 0; border: 1px solid #cbd5e1; background: #fff; border-radius: 5px; font-size: 11px; line-height: 1; cursor: pointer; color: #0f172a; }
        #map-tools-panel .nis button.on { background: #0f172a; border-color: #0f172a; color: #fff; }
        #map-tools-panel button.act { width: 100%; padding: 7px 8px; border-radius: 9px; font-weight: 700; font-size: 12px; cursor: pointer; border: 1px solid #cbd5e1; background: #f8fafc; }
        #map-tools-panel button.act.primary { background: #059669; border-color: #059669; color: #fff; }
        #map-tools-toggle { position: fixed; top: 84px; right: 12px; z-index: 1200; background: #0f172a; color: #fff; border-radius: 999px; padding: 7px 12px; font-size: 12px; font-weight: 700; cursor: pointer; display: none; box-shadow: 0 6px 18px rgba(15,23,42,.3); }
        .mention-rendered {
            font-weight: 600;
            color: #0f172a;
        }
        .mention-tag {
            user-select: all;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
        }
        .mention-tag[data-format-bold="true"], .mention-tag.font-bold, .mention-tag.font-black, .mention-tag.is-bold {
            font-weight: 700 !important;
        }
        .mention-tag[data-format-italic="true"], .mention-tag.italic {
            font-style: italic !important;
        }
        .mention-tag[data-format-underline="true"], .mention-tag.underline {
            text-decoration: underline !important;
            text-underline-offset: 2px !important;
        }

        /* MODO EDIÇÃO (?modo=edicao): a própria página do relatório dentro da Folha A4 Interativa do construtor */
        html.modo-edicao body { min-height: 0; background: transparent; }
        html.modo-edicao header.no-print, html.modo-edicao #dica-viewer, html.modo-edicao #aviso-previa,
        html.modo-edicao #map-tools-panel, html.modo-edicao #map-tools-toggle { display: none !important; }
        html.modo-edicao main { padding: 0; }
        .edit-bloco { --cor-bloco: #0ea5e9; position: relative; outline: 1px dashed transparent; outline-offset: 3px; border-radius: 6px; transition: outline-color .12s; }
        .edit-bloco:hover { outline-color: var(--cor-bloco); }
        .edit-bloco.selecionado { outline: 2px solid var(--cor-bloco); }
        .edit-bloco-barra { display: none; position: absolute; top: -15px; right: 6px; z-index: 60; align-items: center; gap: 2px; background: var(--cor-bloco); color: #fff; border-radius: 8px; padding: 3px 7px; font: 600 9px/1 ui-monospace, monospace; text-transform: uppercase; box-shadow: 0 2px 8px rgba(0,0,0,.25); user-select: none; }
        .edit-bloco:hover > .edit-bloco-barra, .edit-bloco.selecionado > .edit-bloco-barra { display: flex; }
        /* alça para regular a largura do cartão de campo arrastando com o mouse (como a altura do mapa) */
        .quadro-seta { display: inline-flex; align-items: center; border: 0; background: none; cursor: pointer; padding: 0; color: #475569; border-radius: 4px; }
        .quadro-seta:hover { background: rgba(15,23,42,.08); color: #0f172a; }
        .quadro-seta .material-symbols-outlined { font-size: 18px; }
        .campo-resize { display: none; position: absolute; top: 4px; bottom: 4px; right: -5px; width: 9px; cursor: ew-resize; z-index: 20; border-radius: 5px; background: rgba(14,165,233,.35); touch-action: none; }
        .campo-resize::after { content: ''; position: absolute; top: 50%; left: 3px; width: 3px; height: 16px; margin-top: -8px; border-radius: 2px; background: #0284c7; }
        [data-field-id]:hover > .campo-resize, .campo-resize.arrastando { display: block; }
        .campo-resize .campo-resize-rotulo { display: none; position: absolute; bottom: 100%; right: 0; margin-bottom: 2px; background: #0f172a; color: #fff; font: 700 10px/1 ui-monospace, monospace; padding: 3px 5px; border-radius: 5px; white-space: nowrap; }
        .campo-resize.arrastando .campo-resize-rotulo { display: block; }
        .edit-bloco-barra button { background: none; border: 0; color: inherit; cursor: pointer; padding: 2px; border-radius: 4px; display: inline-flex; }
        .edit-bloco-barra button:hover { background: rgba(255,255,255,.18); }
        .edit-bloco-barra .material-symbols-outlined { font-size: 14px; }
        @media print { .edit-bloco-barra { display: none !important; } .edit-bloco { outline: none !important; } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- BARRA SUPERIOR (RODATETO) - AÇÕES RÁPIDAS (OCULTA NA IMPRESSÃO) -->
    <header class="no-print sticky top-0 z-50 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-xs px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-3 select-none">
        <div class="flex items-center gap-3 w-full sm:w-auto">
            <button type="button" onclick="window.close()" class="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full text-slate-500 transition-colors cursor-pointer" title="Fechar Janela">
                <span class="material-symbols-outlined text-[22px]">arrow_back</span>
            </button>
            <div class="flex flex-col">
                <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-sky-600 text-[20px]">description</span>
                    <h1 id="report-header-title" class="font-bold text-sm sm:text-base text-slate-900 dark:text-white leading-tight truncate max-w-xs sm:max-w-md">Relatório da Feição</h1>
                </div>
                <span id="report-header-subtitle" class="text-[11px] font-mono text-slate-500 dark:text-slate-400">Configuração Interativa do Documento • Edição de Mapa &amp; Texto</span>
            </div>
        </div>

        <div class="flex items-center gap-2 w-full sm:w-auto justify-end flex-wrap">
            <!-- Botão Gerar Word -->
            <button type="button" onclick="gerarWord()" class="flex items-center gap-1.5 px-3.5 py-2 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white rounded-xl text-xs font-bold transition-all shadow-xs cursor-pointer" title="Exportar como documento Word (.doc)">
                <span class="material-symbols-outlined text-[17px]">article</span>
                <span>Gerar Word</span>
            </button>

            <!-- Botão Imprimir -->
            <button type="button" onclick="imprimirRelatorio()" class="flex items-center gap-1.5 px-3.5 py-2 bg-slate-800 hover:bg-slate-900 dark:bg-slate-700 dark:hover:bg-slate-600 active:scale-95 text-white rounded-xl text-xs font-bold transition-all shadow-xs cursor-pointer" title="Imprimir em impressora ou salvar como PDF">
                <span class="material-symbols-outlined text-[17px]">print</span>
                <span>Imprimir</span>
            </button>
        </div>
    </header>

    <!-- ÁREA DE NOTIFICAÇÃO / DICA VISUAL -->
    <div id="dica-viewer" class="no-print bg-sky-50 dark:bg-sky-950/40 border-b border-sky-200 dark:border-sky-800/60 px-4 py-2 text-center text-xs text-sky-800 dark:text-sky-300 flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-[16px]">info</span>
        <span>Você pode navegar pelo Mini-Mapa Cartográfico (pan/zoom/camadas) e editar a Caixa de Texto Livre diretamente na folha antes de imprimir (ou salvar em PDF) ou gerar o Word.</span>
    </div>

    <!-- CONTAINER DA FOLHA A4 -->
    <main class="flex-1 flex justify-center p-3 sm:p-6 overflow-y-auto">
        <div id="a4-document-container" class="w-full flex flex-col items-center gap-6">
            <!-- Conteúdo montado dinamicamente via JS com suporte a multi-páginas e folha única sem vazamento -->
            <div id="report-blocks-render" class="a4-page w-full text-slate-900"></div>
        </div>
    </main>

    <script>
        let reportPayload = null;
        let mapController = null;     // controlador do mini-mapa (src/reportMap.js)
        let mapBaseConfig = null;     // configuração definida no modelo
        let mapBloco = null;          // bloco 'mapa_estatico' do modelo
        let renderArgs = null;        // últimos argumentos de renderBlocks (para repaginar sem perder o mapa)
        let keptMapWrap = null;       // elemento do mapa (com o Leaflet vivo) que sobrevive à repaginação
        let temporalController = null; // análise temporal (src/reportTemporal.js)
        let chartInstances = {};      // gráficos do Dashboard (Chart.js) desenhados na folha: canvasId -> instância
        let emissao = { hash: '', protocolo: '', erro: '' }; // protocolo e SHA-256 da emissão (recalculados quando o conteúdo muda)
        const emissaoData = new Date();                       // dia da emissão (entra no protocolo)
        let emissaoTimer = null;
        let mapPanelOpen = null;       // painel "Mapa" aberto? (null = ainda não decidido; decide pela largura da tela)
        let lastPontosKey = '';
        let mapAlturaMm = null;
        let consultaAberta = false;   // formulário "Consultar Coordenadas" aberto no painel
        let consultaAba = 'dec';
        let consultaCampos = {};
        let consultaErro = '';       // altura do mapa na folha (mm): a do modelo até o usuário ajustar
        let repaginateTimer = null;

        // MODO EDIÇÃO: a Folha A4 Interativa do construtor é esta mesma página (em um iframe), com a moldura de edição por cima
        const EDICAO = !!(window.location && /[?&]modo=edicao(&|$)/.test(window.location.search || ''));
        if (EDICAO) document.documentElement.classList.add('modo-edicao');
        let chaveMapaEdicao = null;
        // quadros recolhidos na página de edição (só para a rolagem ficar menor; o relatório emitido sempre sai completo): 'sint:<bloco>' e 'laudo:<bloco>:<aba>'
        const CHAVE_RECOLHIDOS = 'constructive_quadros_recolhidos';
        const quadrosRecolhidos = new Set();
        try { JSON.parse(sessionStorage.getItem(CHAVE_RECOLHIDOS) || '[]').forEach(k => quadrosRecolhidos.add(k)); } catch (e) { /* sem armazenamento: começa tudo expandido */ }
        /** Seta do quadro (ou da aba do laudo): recolhe/expande e redesenha a página, mantendo o mapa vivo. */
        function alternarQuadro(chave) {
            if (quadrosRecolhidos.has(chave)) quadrosRecolhidos.delete(chave); else quadrosRecolhidos.add(chave);
            try { sessionStorage.setItem(CHAVE_RECOLHIDOS, JSON.stringify(Array.from(quadrosRecolhidos))); } catch (e) { /* ok */ }

            const sair = () => {
                el.removeEventListener('keydown', teclas);
                el.removeEventListener('blur', sair);
                el.contentEditable = 'false';
                el.style.outline = '';

            if (typeof Sortable === 'undefined') return;

        /** Largura (em %) de um cartão depois de arrastar a alça: a largura de partida mais o deslocamento, em % do contêiner (mín. 15, máx. 100). */
        function larguraPorArrasto(larguraInicialPx, deslocamentoPx, larguraContainerPx) {
            if (!(larguraContainerPx > 0)) return 100;
            return Math.max(15, Math.min(100, Math.round((larguraInicialPx + deslocamentoPx) / larguraContainerPx * 100)));
        }

        /** Alça na borda direita de cada cartão de campo (grade e laudo): arrastar muda a largura; ao soltar, o construtor grava o percentual. */
        function ligarRedimensionarCampos() {
            document.querySelectorAll('.a4-grid-fields-container').forEach(cont => {
                const idx = parseInt(cont.getAttribute('data-block-index'), 10);
                if (isNaN(idx) || !(cont.className || '').includes('flex-wrap')) return; // "lista corrida" não tem largura por campo
                Array.from(cont.children).forEach(card => {
                    const fid = card.getAttribute && card.getAttribute('data-field-id');
                    if (!fid) return;
                    const alca = document.createElement('div');
                    alca.className = 'campo-resize';
                    alca.title = 'Arraste para regular a largura do campo';
                    alca.innerHTML = '<span class="campo-resize-rotulo"></span>';
                    alca.addEventListener('mousedown', (ev) => {
                        ev.preventDefault(); ev.stopPropagation();
                        const larguraCont = cont.getBoundingClientRect().width;
                        const inicial = card.getBoundingClientRect().width;
                        const x0 = ev.clientX;
                        const rotulo = alca.firstChild;
                        let pct = null;
                        alca.classList.add('arrastando');
                        const mover = (e) => {
                            pct = larguraPorArrasto(inicial, e.clientX - x0, larguraCont);
                            const folga = Math.round(10 * (1 - pct / 100) * 10) / 10;
                            const w = pct >= 98 ? '100%' : 'calc(' + pct + '% - ' + folga + 'px)';
                            card.style.flex = '0 0 ' + w; card.style.width = w; card.style.maxWidth = w;
                            if (rotulo) rotulo.textContent = pct + '%';
                        };
                        const soltar = () => {
                            document.removeEventListener('mousemove', mover);
                            document.removeEventListener('mouseup', soltar);
                            alca.classList.remove('arrastando');
                            if (pct !== null) avisarConstrutor({ tipo: 'construtor:acao', nome: 'setFieldWidthExact', args: [idx, fid, pct] });
                        };
                        document.addEventListener('mousemove', mover);
                        document.addEventListener('mouseup', soltar);
                    });
                    card.appendChild(alca);
                });
            });

        function initReportViewer() {

                    ]

            document.title = `${tpl.nome || 'Relatório'} - Feição`;

            // Configura as dimensões da folha (A4 ou A3, retrato ou paisagem)

        function renderBlocks(tpl, featureData = {}, featureGeometry = null) {
            const docContainer = document.getElementById('a4-document-container');
            if (!docContainer) return;

            // Busca campos para preenchimento
            let fields = [];
            let formTabs = [];
            if (reportPayload && Array.isArray(reportPayload.formFields) && reportPayload.formFields.length > 0) {
                fields = [...reportPayload.formFields];
            }
            if (reportPayload && Array.isArray(reportPayload.formTabs) && reportPayload.formTabs.length > 0) {
                formTabs = [...reportPayload.formTabs];
            }

            // Fallback para window.opener se abas ou campos estiverem vazios
            if ((formTabs.length === 0 || fields.length === 0) && typeof window !== 'undefined' && window.opener) {
                try {
                    const op = window.opener;
                    const opTabs = op.activeFormSchema || op.currentFormFeatures || op.activeFormTabs;
                    if (Array.isArray(opTabs) && opTabs.length > 0) {
                        if (formTabs.length === 0) formTabs = opTabs;
                        if (fields.length === 0) {
                            opTabs.forEach(t => {
                                if (Array.isArray(t.fields)) fields.push(...t.fields);
                            });
                        }
                    }
                } catch(e) {}
            }

            if (fields.length === 0) {
                try {
                    const forms = JSON.parse(localStorage.getItem('constructive_forms') || '[]');
                    const curForm = forms.find(f => f.id === tpl.form_id) || forms[0];
                    const tabsList = curForm?.tabs || (curForm?.schema && curForm.schema.tabs);
                    if (tabsList && Array.isArray(tabsList)) {
                        tabsList.forEach(t => {
                            if (t.fields) fields.push(...t.fields);
                        });
                        if (formTabs.length === 0) formTabs = tabsList;
                    }
                } catch(e) {}
            }
            window.reportViewerFormTabs = formTabs;
            window.reportViewerFormFields = fields;

            const blocos = tpl.blocos || [];
            const hdrBloco = blocos.find(b => b.tipo === 'cabecalho');
            const ftrBloco = blocos.find(b => b.tipo === 'rodape');
            renderArgs = { tpl: tpl, featureData: featureData, featureGeometry: featureGeometry };
            // a tabela de pontos (e o memorial) entra logo depois do mapa, com quebra entre folhas
            const bodyBlocos = blocos.filter(b => b.tipo !== 'cabecalho' && b.tipo !== 'rodape').reduce((acc, b) => {
                acc.push(b);
                if (b.tipo === 'mapa_estatico') {
                    acc.push({ tipo: 'tabela_pontos_mapa', id: 'pts_' + (b.id || ''), _sintetico: true });
                    acc.push({ tipo: 'tabela_confrontantes_mapa', id: 'conf_' + (b.id || ''), _sintetico: true });
                    acc.push({ tipo: 'analise_mapa', id: 'ana_' + (b.id || ''), _sintetico: true });
                    acc.push({ tipo: 'mapa_temporal_series', id: 'tmp_' + (b.id || ''), _sintetico: true });
                }
                return acc;
            }, []);

            const pageDims = PageSize.dims(tpl.config_pagina);
            const mm = (tpl.config_pagina && tpl.config_pagina.margens_mm) || { top: 15, bottom: 15, left: 15, right: 15 };
            const pageHeightPx = pageDims.heightPx;
            const pageWidthPx = pageDims.widthPx;

            // Renderiza os blocos de corpo. Blocos "divisíveis" (tabelas longas) devolvem { split }.
            const renderedBodyBlocks = bodyBlocos.map((b, bIdx) => {
                const globalIdx = blocos.indexOf(b);
                const out = renderSingleBlock(b, globalIdx >= 0 ? globalIdx : bIdx, featureData, featureGeometry, fields, tpl);
                return (out && typeof out === 'object' && out.split) ? { bloco: b, split: out.split } : { bloco: b, html: out };
            }).filter(rb => !(rb.bloco._sintetico && !rb.split && !rb.html)); // sem pontos, a tabela não ocupa espaço

            // Medição de altura para distribuição em folhas
            let measureBox = document.getElementById('a4-measure-stage');
            if (!measureBox) {
                measureBox = document.createElement('div');
                measureBox.id = 'a4-measure-stage';
                measureBox.style.cssText = 'position:absolute; left:-9999px; top:-9999px; visibility:hidden; width:' + (pageWidthPx - Math.round((mm.left + mm.right) * 3.78)) + 'px;';
                document.body.appendChild(measureBox);
            }
            measureBox.style.width = (pageWidthPx - Math.round((mm.left + mm.right) * 3.78)) + 'px';

            const headerHeightPx = hdrBloco ? 135 : 0;
            const footerHeightPx = ftrBloco ? 42 : 0;
            const marginHeightPx = Math.round((mm.top + mm.bottom) * 3.78);

            const maxBodyHeightP1 = pageHeightPx - headerHeightPx - footerHeightPx - marginHeightPx;
            const maxBodyHeightP2 = pageHeightPx - (hdrBloco && hdrBloco.repetir_todas_folhas ? headerHeightPx : 15) - footerHeightPx - marginHeightPx;

            // Bloco comum: altura total. Bloco divisível: altura fixa (título + cabeçalho da tabela) e de cada linha.
            const BLOCK_GAP = 20;
            renderedBodyBlocks.forEach(rb => {
                if (rb.split) {
                    measureBox.innerHTML = rb.split.chunkHtml(rb.split.rowsHtml, true);
                    const rowEls = Array.from(measureBox.querySelectorAll('[data-split-row]'));
                    rb.rowHeights = rowEls.map(el => Math.max(1, Math.ceil(el.getBoundingClientRect().height)));
                    const total = measureBox.firstElementChild ? measureBox.firstElementChild.offsetHeight : measureBox.offsetHeight;
                    rb.overheadH = Math.max(0, total - rb.rowHeights.reduce((a, c) => a + c, 0));
                } else {
                    measureBox.innerHTML = rb.html;
                    rb.h = Math.max(40, measureBox.firstElementChild ? measureBox.firstElementChild.offsetHeight : measureBox.offsetHeight) + BLOCK_GAP;
                }
            });
            measureBox.innerHTML = '';

            // Distribuição em folhas: blocos inteiros; tabelas longas quebram por linhas (sem cortar conteúdo)
            const pagesBlocks = [[]];
            let pageAcc = 0;
            let pageLimit = maxBodyHeightP1;
            const startNewPage = () => { pagesBlocks.push([]); pageAcc = 0; pageLimit = maxBodyHeightP2; };
            const currentPage = () => pagesBlocks[pagesBlocks.length - 1];

            renderedBodyBlocks.forEach(rb => {
                if (!rb.split) {
                    if (currentPage().length > 0 && pageAcc + rb.h > pageLimit) startNewPage();
                    currentPage().push(rb);
                    pageAcc += rb.h;
                    return;
                }
                let rows = rb.split.rowsHtml.slice();
                let heights = rb.rowHeights.slice();
                let isFirstChunk = true;
                while (rows.length > 0) {
                    let room = pageLimit - pageAcc - rb.overheadH - BLOCK_GAP;
                    if (room < heights[0] && currentPage().length > 0) {
                        startNewPage();
                        room = pageLimit - rb.overheadH - BLOCK_GAP;
                    }
                    let take = 0;
                    let used = 0;
                    while (take < rows.length && used + heights[take] <= room) { used += heights[take]; take++; }
                    if (take === 0) take = 1; // linha maior que a folha: entra sozinha
                    currentPage().push({ bloco: rb.bloco, html: rb.split.chunkHtml(rows.slice(0, take), isFirstChunk) });
                    pageAcc += rb.overheadH + used + BLOCK_GAP;
                    isFirstChunk = false;
                    rows = rows.slice(take);
                    heights = heights.slice(take);
                    if (rows.length > 0) startNewPage();
                }
            });
            if (pagesBlocks.length > 1 && pagesBlocks[pagesBlocks.length - 1].length === 0) pagesBlocks.pop();

            const totalPages = pagesBlocks.length;

            let pagesHtml = '';
            pagesBlocks.forEach((pageBlocks, pIdx) => {
                const pageNum = pIdx + 1;
                const isFirst = (pageNum === 1);
                const showHeader = isFirst || (hdrBloco && hdrBloco.repetir_todas_folhas);
                const showFooter = !!ftrBloco;

                const padTopMm = showHeader ? Math.max(2, mm.top - 8) : mm.top;
                const padBotMm = showFooter ? Math.max(2, mm.bottom - 8) : mm.bottom;

                const bodyHtml = pageBlocks.map(b => envolverEdicao(b.html, blocos.indexOf(b.bloco), b.bloco)).join('');
                const pageIdAttr = isFirst ? 'id="report-blocks-render"' : '';

                pagesHtml += `
                    <div class="a4-page w-full text-slate-900 ${totalPages === 1 ? 'single-page' : ''}" 
                         data-page="${pageNum}"
                         style="max-width: ${pageWidthPx}px; min-height: ${pageHeightPx}px; ">
                        
                        <!-- Cabeçalho Institucional: Fora do corpo, acima da margem superior -->
                        ${showHeader ? envolverEdicao(EDICAO ? Editor.cabecalho(hdrBloco, blocos.indexOf(hdrBloco), tpl, { padLeftMm: mm.left, padRightMm: mm.right }) : renderHeaderSlotHtml(hdrBloco, tpl, mm.left, mm.right), blocos.indexOf(hdrBloco), hdrBloco, { fixo: true }) : ''}

                        <!-- Corpo da Folha: Delimitado entre as margens superior e inferior -->
                        <div ${pageIdAttr} class="a4-page-body-slot flex flex-col gap-5 w-full flex-1" style="padding: ${padTopMm}mm ${mm.right}mm ${padBotMm}mm ${mm.left}mm; box-sizing: border-box;">
                            ${bodyHtml}
                        </div>

                        <!-- Rodapé Oficial: Fora do corpo, abaixo da margem inferior, fixo na base -->
                        ${showFooter ? envolverEdicao(renderFooterSlotHtml(ftrBloco, pageNum, totalPages, mm.left, mm.right), blocos.indexOf(ftrBloco), ftrBloco, { fixo: true, classe: 'mt-auto' }) : ''}
                    </div>
                `;
            });

            docContainer.innerHTML = pagesHtml;
            renderPendingCharts();

            if (mapController && keptMapWrap) {
                // repaginação: o mapa (Leaflet vivo) volta para o novo lugar, sem recarregar nada
                const fresh = document.getElementById('map-wrap');
                if (fresh) fresh.replaceWith(keptMapWrap);
                keptMapWrap = null;
                mapController.invalidate();
                mapController.refresh();
            } else {
                // Inicializa o Mini-Mapa Leaflet Interativo (com os ajustes que o usuário já salvou)
                setTimeout(() => {
                    initReportMiniMap(featureGeometry);
                }, 100);
            }
            if (temporalController) temporalController.attach();
            if (EDICAO) { ligarArrastoCampos(); ligarRedimensionarCampos(); } // as alças voltam a cada repaginação
            scheduleEmissao();
        }

        // =====================================================================================
        // GRÁFICOS DO DASHBOARD NO RELATÓRIO GERAL: mesmo Chart.js do painel de estatísticas, com os dados
        // da lista de exemplo (prévia) ou da camada de verdade (emissão, lida da janela de origem por themeId).
        // =====================================================================================
        const CHART_COLORS = ['#0ea5e9', '#f59e0b', '#10b981', '#f43f5e', '#8b5cf6', '#06b6d4', '#eab308', '#64748b'];

        /** Feições do Relatório Geral: da prévia (featureList no payload) ou, na emissão real, da camada (window.opener, por themeId). */
        const LIMITE_FEICOES_GRAFICO = 5000; // acima disso, os gráficos usam só as primeiras (evita travar a folha)
        let featureListTruncada = false;

        function resolveFeatureList() {
            if (reportPayload && Array.isArray(reportPayload.featureList)) return reportPayload.featureList;
            try {
                const opener = window.opener;
                const themeId = reportPayload && reportPayload.themeId;
                if (opener && !opener.closed && themeId && Array.isArray(opener.themes)) {
                    const theme = opener.themes.find(t => String(t.id) === String(themeId));
                    if (theme && Array.isArray(theme.features)) {
                        featureListTruncada = theme.features.length > LIMITE_FEICOES_GRAFICO;
                        return theme.features.slice(0, LIMITE_FEICOES_GRAFICO).map(f => (f && f.properties) || {});
                    }
                }
            } catch (e) { /* sem janela de origem: fica sem dados */ }
            return [];
        }

        /** Rótulo de exibição do valor de um campo (pelo tipo, como no resto do relatório); "Não informado" quando vazio. */
        function chartValueLabel(fieldId, valor) {
            const campo = (reportPayload && Array.isArray(reportPayload.formFields)) ? reportPayload.formFields.find(f => f.id === fieldId) : null;
            const texto = campo ? FieldFormatter.toText(valor, campo) : ((valor === undefined || valor === null || valor === '') ? FieldFormatter.EMPTY : String(valor));
            return texto === FieldFormatter.EMPTY ? 'Não informado' : texto;
        }

        /** Conta quantas feições têm cada valor (formatado) de um campo. */
        function aggregateChart(fieldId) {
            const registros = resolveFeatureList();
            const contagem = new Map();
            registros.forEach(props => {
                const rotulo = chartValueLabel(fieldId, props ? props[fieldId] : undefined);
                contagem.set(rotulo, (contagem.get(rotulo) || 0) + 1);
            });
            const labels = Array.from(contagem.keys());
            return { labels: labels, data: labels.map(l => contagem.get(l)), total: registros.length };
        }

        /** Bloco "Gráficos do Dashboard" (Relatório Geral): um cartão com um canvas por gráfico escolhido. */
        function renderChartsBlock(bloco, idx) {
            const idsEscolhidos = Array.isArray(bloco.chart_ids) ? bloco.chart_ids : (bloco.chart_id ? [bloco.chart_id] : []);
            const catalogo = (reportPayload && Array.isArray(reportPayload.charts)) ? reportPayload.charts : [];
            const graficos = idsEscolhidos.map(id => catalogo.find(c => c.id === id)).filter(Boolean);
            const isSide = bloco.layout === 'lado_a_lado';
            const tituloHtml = `<span class="whitespace-pre-line">${(escapeHtml(bloco.titulo || 'Estatísticas do Dashboard')).replace(/\r?\n/g, '<br>')}</span>`;
            if (!graficos.length) {
                return `
                    <div class="mb-4 page-break-avoid">
                        <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2.5">${tituloHtml}</div>
                        <div class="p-4 text-center text-slate-400 italic text-xs border border-dashed border-slate-300 rounded-lg bg-slate-50/60">Nenhum gráfico selecionado. Escolha os gráficos no construtor (card "Gráficos do Dashboard").</div>
                    </div>`;
            }
            const total = resolveFeatureList().length; // também marca featureListTruncada, usada logo abaixo
            const metaHtml = `<span class="text-[10px] font-mono text-slate-500 normal-case">${total} feiç${total === 1 ? 'ão' : 'ões'}${featureListTruncada ? ` • mostrando as ${LIMITE_FEICOES_GRAFICO} primeiras` : ''}</span>`;
            return `
                <div class="mb-4 page-break-avoid">
                    <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2.5 flex items-center justify-between">${tituloHtml}${metaHtml}</div>
                    <div class="grid ${isSide ? 'grid-cols-2' : 'grid-cols-1'} gap-3">
                        ${graficos.map((g, gi) => {
                            const canvasId = 'rpt-chart-' + idx + '-' + gi;
                            return `
                            <div class="h-52 border border-slate-200 rounded-lg p-2 bg-white flex flex-col">
                                <div class="text-[10px] font-bold text-slate-600 uppercase text-center mb-1 truncate">${escapeHtml(g.title || g.fieldLabel || 'Gráfico')}</div>
                                <div class="flex-1 min-h-0"><canvas id="${canvasId}" data-chart-canvas data-chart-field="${escapeHtml(g.fieldId || '')}" data-chart-type="${escapeHtml(g.type || 'pie')}"></canvas></div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>`;
        }

        /** Depois que o HTML entra na página: cria (ou recria) os gráficos reais nos canvases da folha. */
        function renderPendingCharts() {
            Object.keys(chartInstances).forEach(id => { try { chartInstances[id].destroy(); } catch (e) { /* já sumiu com a repaginação */ } });
            chartInstances = {};
            if (typeof Chart === 'undefined') return;
            document.querySelectorAll('[data-chart-canvas]').forEach(canvas => {
                const fieldId = canvas.getAttribute('data-chart-field');
                const tipo = canvas.getAttribute('data-chart-type');
                const agg = aggregateChart(fieldId);
                const ehPizza = tipo === 'pie' || tipo === 'donut';
                const cores = agg.labels.map((_, i) => CHART_COLORS[i % CHART_COLORS.length]);
                chartInstances[canvas.id] = new Chart(canvas.getContext('2d'), {
                    type: ehPizza ? 'doughnut' : 'bar',
                    data: { labels: agg.labels, datasets: [{ data: agg.data, backgroundColor: cores, borderWidth: 0, cutout: tipo === 'donut' ? '65%' : (tipo === 'pie' ? '0%' : undefined) }] },
                    options: {
                        responsive: true, maintainAspectRatio: false, animation: false,
                        plugins: { legend: { display: ehPizza, position: 'right', labels: { boxWidth: 8, font: { size: 9 } } } },
                        scales: ehPizza ? {} : { y: { beginAtZero: true, ticks: { precision: 0 } } }
                    }
                });
            });
        }

        function renderSingleBlock(bloco, idx, featureData, featureGeometry, fields, tpl) {
            switch(bloco.tipo) {
                case 'cabecalho':
                    return Blocks.renderHeaderBlock(bloco, tpl);

                case 'grade_campos': {
                    if (EDICAO) return Editor.grade(bloco, idx, fields, featureData, bloco.colunasLayout || 2);
                    return renderAttributeGrid(bloco, featureData, fields);
                }

                case 'mapa_estatico': {
                    mapBloco = bloco;
                    const mcfg = MapTools.normalizeMapConfig(bloco);
                    if (mapAlturaMm === null) mapAlturaMm = mcfg.alturaMm;
                    const mapPx = Math.round(mapAlturaMm * 3.78);
                    return `
                        <div class="mb-4 page-break-avoid">
                            <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2 flex items-center justify-between">
                                <span class="whitespace-pre-line">${(escapeHtml(bloco.titulo || 'Delimitação Cartográfica do Imóvel')).replace(/\r?\n/g, '<br>')}</span>
                            </div>
                            <!-- Mini-mapa Leaflet (configurado no painel "Mapa" à direita) -->
                            <div id="map-wrap" class="relative rounded-lg overflow-hidden border border-slate-300 shadow-xs" style="height: ${mapPx}px;">
                                <div id="interactive-report-map" class="w-full bg-slate-200 z-0" style="height: ${mapPx}px;"></div>
                                <div id="map-resize" class="no-print" title="Arraste para ajustar a altura do mapa (a largura acompanha a folha)"></div>
                                <div id="map-north" class="report-map-overlay"><span class="material-symbols-outlined" style="font-size:18px;color:#fbbf24">navigation</span><span>N</span></div>
                                <div id="map-info-wrap" class="report-map-overlay"><div id="map-escala-txt" class="map-chip" title="Arraste para mover"></div><div id="map-proj-txt" class="map-chip" title="Arraste para mover"></div></div>
                                <div id="map-legend" class="report-map-overlay"></div>
                                <div id="map-locator" class="report-map-overlay"></div>
                            </div>
                            <!-- Dimensões da feição -->
                            <div id="map-dimensions-summary" class="mt-1.5 p-2 bg-slate-50 border border-slate-200 rounded-lg flex flex-wrap items-center justify-between gap-2 text-[10px] font-mono">
                                <div class="flex items-center gap-1.5">
                                    <span class="font-bold text-emerald-700">Georreferenciamento:</span>
                                    <span id="map-sides-text">Processando lados do polígono...</span>
                                </div>
                                <div id="map-area-text" class="font-bold text-slate-900">Área: —</div>
                            </div>
                            ${bloco.notaTecnica ? `<div class="mt-1 text-[9.5px] text-slate-500 font-mono px-1">${escapeHtml(bloco.notaTecnica)}</div>` : ''}
                        </div>
                    `;
                }

                case 'tabela_pontos_mapa':
                    return renderPointsTable();

                case 'tabela_confrontantes_mapa':
                    return renderConfrontantesTable();

                case 'analise_mapa':
                    return renderAnaliseMapa();

                case 'mapa_temporal_series':
                    return temporalController ? temporalController.block() : '';

                case 'caixa_texto_livre':
                case 'texto_livre':
                    if (EDICAO) return FreeText.renderEditor(bloco, idx);
                    return Blocks.renderFreeTextBlock(bloco, idx, featureData);

                case 'tabela_sintetica_1n': {
                    if (EDICAO) return Editor.sintetica(bloco, idx, featureData, { recolhivel: true, recolhido: quadrosRecolhidos.has('sint:' + idx) });
                    return renderSyntheticTable(bloco, featureData);
                }

                case 'laudo_vistoria_fotos':
                case 'galeria_fotos': {
                    if (EDICAO) return Editor.laudo(bloco, idx, featureData, { recolhivel: true, recolhidos: Array.from(quadrosRecolhidos).filter(k => k.startsWith('laudo:' + idx + ':')).map(k => k.split(':').slice(2).join(':')) });
                    return renderAnalyticalLaudo(bloco, featureData);
                }

                case 'grafico_existente':
                    return renderChartsBlock(bloco, idx);

                case 'rodape': {
                    const startMode = bloco.inicio_numeracao || 'primeira';
                    const isSecond = (startMode === 'segunda');
                    const pageText = isSecond ? '' : 'Página 1 de 1';
                    return `
                        <div class="border-t border-slate-300 pt-2 mt-auto text-[10px] text-slate-500 flex items-center justify-between font-mono page-break-avoid w-full">
                            <div>
                                ${bloco.exibirDataHora !== false ? `Emitido em ${new Date().toLocaleDateString('pt-BR')} às ${new Date().toLocaleTimeString('pt-BR')}` : ''}
                                ${bloco.exibirHash !== false ? `<span class="ml-2 font-bold text-slate-600">SHA-256: <span data-emissao="hash" title="${emissaoTitulo()}">${emissaoTexto('hash')}</span></span>` : ''}
                            </div>
                            <div class="font-bold text-slate-700">
                                ${bloco.numeracao !== false ? pageText : ''}
                            </div>
                        </div>
                    `;
                }

                default:
                    return '';
            }
        }

        /**
         * Substitui menções @ por dados reais da feição sem o título do campo.
         */
        /**
         * Extrai e normaliza registros 1:N da feição (vistorias, fotos, relatos, links).
         */
        // =====================================================================================
        // QUADRO SINTÉTICO E LAUDO ANALÍTICO — guiados pelo schema do formulário (src/reportData.js)
        //  • Abas: as que o usuário escolheu no bloco (por id ou título); sem escolha = todas as 1:N.
        //  • Colunas: os campos escolhidos (por id). A origem da linha é o TÍTULO da aba.
        //  • Valores: sempre formatados pelo TIPO do campo (src/fieldFormatter.js).
        //  • Tabelas longas quebram por linhas entre as folhas (retornam { split }).
        // =====================================================================================

        // Quadro sintético e laudo analítico: desenhados por src/reportBlocks.js (o construtor usa os mesmos, com controles de edição)
        const { renderSyntheticTable, renderAnalyticalLaudo } = Blocks;

        // =====================================================================================
        // MINI-MAPA DO RELATÓRIO: configuração do modelo + ajustes do usuário (salvos por relatório + feição)
        // =====================================================================================
        const AJUSTES_STORAGE_KEY = 'constructive_report_ajustes';

        function getOpenerAdapter() {
            try {
                return (window.opener && !window.opener.closed && window.opener.ReportAdapter) ? window.opener.ReportAdapter : null;
            } catch (e) { return null; }
        }

        function mapAjusteIds() {
            const tplId = (reportPayload && (reportPayload.templateId || (reportPayload.template && reportPayload.template.id))) || '';
            const key = (reportPayload && reportPayload.featureKey) || MapTools.featureKey(reportPayload && reportPayload.featureData) || '';
            return { tplId: String(tplId), key: String(key), formId: (reportPayload && reportPayload.formId) || '' };
        }

        const emPrevia = () => !!(reportPayload && reportPayload.preview);

        async function loadMapAjustes() {
            if (emPrevia()) return null; // prévia: sempre o padrão do modelo
            const { tplId, key } = mapAjusteIds();
            if (!tplId || !key) return null;
            const adapter = getOpenerAdapter();
            if (adapter && typeof adapter.getAjustes === 'function') {
                try { return await adapter.getAjustes(tplId, key); } catch (e) { /* cai para o navegador */ }
            }
            try { return (JSON.parse(localStorage.getItem(AJUSTES_STORAGE_KEY) || '{}') || {})[tplId + '|' + key] || null; } catch (e) { return null; }
        }

        async function persistMapAjustes(ajustes) {
            if (emPrevia()) return { ok: false, motivo: 'previa' };
            const { tplId, key, formId } = mapAjusteIds();
            if (!tplId || !key) return { ok: false, motivo: 'sem-feicao' };
            const adapter = getOpenerAdapter();
            if (adapter && typeof adapter.saveAjustes === 'function') {
                try { return await adapter.saveAjustes(tplId, key, formId, ajustes); } catch (e) { /* cai para o navegador */ }
            }
            try {
                const all = JSON.parse(localStorage.getItem(AJUSTES_STORAGE_KEY) || '{}') || {};
                all[tplId + '|' + key] = ajustes;
                localStorage.setItem(AJUSTES_STORAGE_KEY, JSON.stringify(all));
                return { ok: true, remoto: false };
            } catch (e) { return { ok: false, motivo: 'erro' }; }
        }

        async function initReportMiniMap(geometry) {
            const mapContainer = document.getElementById('interactive-report-map');
            if (!mapContainer || typeof L === 'undefined' || !mapBloco) return;

            mapBaseConfig = MapTools.normalizeMapConfig(mapBloco);
            mapBaseConfig.referencia.ativo = false; // "Distância e sobreposição (camada de referência)" foi retirada do relatório
            let ajustes = null;
            try { ajustes = await loadMapAjustes(); } catch (e) {}
            const config = MapTools.mergeAjustes(mapBaseConfig, ajustes);
            config.referencia.ativo = false;
            const camadas = (reportPayload && Array.isArray(reportPayload.camadasMapa)) ? reportPayload.camadasMapa : [];

            try {
                lastPontosKey = blocosKey(config);
                mapController = ReportMap.create({ L, MapTools, container: 'interactive-report-map', geometry, camadas, onMeasureState: () => renderMapToolsPanel(), onMedicaoCriada: (id) => abrirModalTipoArea(id), ortofotos: (reportPayload && Array.isArray(reportPayload.ortofotos)) ? reportPayload.ortofotos : [], config, onChange: onMapChange });
            } catch (e) {
                console.error('[Mapa] Erro ao criar o mini-mapa:', e);
                return;
            }
            aplicarAlturaMapa(config.alturaMm); // altura escolhida pelo usuário na última vez
            renderMapToolsPanel();
            // análise temporal: ortofotos que a página do mapa entregou (só as que o usuário pode ver)
            const ortofotos = (reportPayload && Array.isArray(reportPayload.ortofotos)) ? reportPayload.ortofotos : [];
            if (ortofotos.length) {
                temporalController = ReportTemporal.create({
                    L, MapTools, geometry, ortofotos, config: config.temporal, corContorno: config.destaque.cor,
                    probe: makeOrtofotoProbe(geometry),
                    onStructureChange: () => { renderMapToolsPanel(); scheduleRepaginate(); scheduleEmissao(); },
                    onChange: () => { renderMapToolsPanel(); scheduleEmissao(); }
                });
                if (config.temporal.ativo) temporalController.start();
            }
            renderMapToolsPanel();
            // pontos e série temporal já salvos: os blocos precisam entrar na paginação
            const temPontos = mapController.pointRows().rows.length && config.pontos.ativo && config.pontos.tabela;
            const temAnalises = (config.confrontantes.ativo && config.confrontantes.camada) || (config.referencia.ativo && config.referencia.camada) || (config.comparacaoArea.ativo && config.comparacaoArea.campo);
            if (temPontos || temAnalises || (temporalController && config.temporal.ativo)) scheduleRepaginate();
        }

        // Ortofotos em tiles não informam a área que cobrem: pede o tile do centro da feição; se não existe, o quadro sai.
        function makeOrtofotoProbe(geometry) {
            const bb = MapTools.geometryBBox(geometry);
            const c = bb ? MapTools.bboxCenter(bb) : null;
            return (o) => new Promise(resolve => {
                if (!c) { resolve(null); return; }
                const z = MapTools.probeZoom(o);
                const t = MapTools.tileXY(c[1], c[0], z);
                const img = new Image();
                let done = false;
                const fin = (v) => { if (!done) { done = true; clearTimeout(timer); resolve(v); } };
                const timer = setTimeout(() => fin(null), 8000);
                img.onload = () => fin(true);
                img.onerror = () => fin(false);
                img.src = MapTools.tileUrl(o.url, t.x, t.y, z);
            });
        }

        // ajustes completos para salvar: mapa + série temporal
        function snapshotCompleto() {
            const s = mapController.snapshot();
            if (temporalController) s.temporal = temporalController.snapshot();
            return s;
        }

        // ---------------- pontos nos vértices: tabela (com memorial) e repaginação
        function onMapChange(cfg) {
            scheduleEmissao();
            if (mapController && cfg.alturaMm !== mapAlturaMm) { aplicarAlturaMapa(cfg.alturaMm); renderMapToolsPanel(); }
            const key = blocosKey(cfg);
            if (key === lastPontosKey) return;
            lastPontosKey = key;
            if (!mapController) return; // ainda montando
            renderMapToolsPanel();
            scheduleRepaginate();
        }

        // ---- altura do mapa na folha: arrastar a borda inferior, digitar em mm ou preencher o espaço livre da folha
        function mapaAlturaMaxMm() {
            const tpl = renderArgs && renderArgs.tpl;
            const d = PageSize.dims(tpl && tpl.config_pagina);
            const m = (tpl && tpl.config_pagina && tpl.config_pagina.margens_mm) || { top: 15, bottom: 15 };
            // sobra da folha depois do cabeçalho, do rodapé, das margens e da caixa de dimensões que vem embaixo do mapa
            const px = d.heightPx - Math.round(((m.top || 0) + (m.bottom || 0)) * 3.78) - 135 - 42 - 110;
            return Math.max(60, Math.floor(px / 3.78));
        }
        function mapaAlturaLimitada(mm) { return Math.round(Math.min(mapaAlturaMaxMm(), Math.max(40, Number(mm) || 0))); }
        /** Nova altura (mm) que aproveita o espaço livre (px) no fim da folha; nunca fora de [40, max]. */
        function mapaAlturaPreenchida(atualMm, livrePx, maxMm) {
            return Math.round(Math.min(maxMm, Math.max(40, atualMm + livrePx / 3.78 - 3)));
        }
        function aplicarAlturaMapa(mm) {
            const nova = mapaAlturaLimitada(mm);
            if (nova === mapAlturaMm) return;
            mapAlturaMm = nova;
            const px = Math.round(nova * 3.78) + 'px';
            const wrap = document.getElementById('map-wrap');
            const inner = document.getElementById('interactive-report-map');
            if (wrap) wrap.style.height = px;
            if (inner) inner.style.height = px;
            if (mapController) mapController.invalidate();
            scheduleRepaginate();
        }
        document.addEventListener('pointerdown', (ev) => {
            const h = ev.target && ev.target.closest ? ev.target.closest('#map-resize') : null;
            if (!h || !mapController) return;
            ev.preventDefault();
            const wrap = document.getElementById('map-wrap');
            const inner = document.getElementById('interactive-report-map');
            if (!wrap || !inner) return;
            const y0 = ev.clientY, h0 = wrap.getBoundingClientRect().height;
            const minPx = 40 * 3.78, maxPx = mapaAlturaMaxMm() * 3.78;
            let px = h0;
            h.classList.add('ativo');
            const move = (e) => {
                px = Math.min(maxPx, Math.max(minPx, h0 + (e.clientY - y0)));
                wrap.style.height = inner.style.height = Math.round(px) + 'px';
                mapController.invalidate();
            };
            const up = () => {
                document.removeEventListener('pointermove', move);
                document.removeEventListener('pointerup', up);
                h.classList.remove('ativo');
                mapController.setAltura(Math.round(px / 3.78));
            };
            document.addEventListener('pointermove', move);
            document.addEventListener('pointerup', up);
        });

        function scheduleRepaginate() {
            clearTimeout(repaginateTimer);
            repaginateTimer = setTimeout(repaginateKeepingMap, 120);
        }

        function repaginateKeepingMap() {
            if (!renderArgs || !mapController) return;
            keptMapWrap = document.getElementById('map-wrap');
            const y = window.scrollY;
            renderBlocks(renderArgs.tpl, renderArgs.featureData, renderArgs.featureGeometry);
            window.scrollTo(0, y);
        }

        /** O que muda a paginação: pontos, confrontantes, referência e comparação de área. */
        function blocosKey(cfg) {
            return JSON.stringify([cfg.pontos, cfg.confrontantes, cfg.referencia, cfg.comparacaoArea, cfg.medicoes.itens, cfg.analises]);
        }

        function camadasDoPayload() {
            return (reportPayload && Array.isArray(reportPayload.camadasMapa)) ? reportPayload.camadasMapa : [];
        }

        function areaEmLinha(txt) { return escapeHtml(txt); }

        /** Quem faz divisa com cada lado do polígono (camada escolhida no painel; nomes só se o usuário quiser). */
        function renderConfrontantesTable() {
            if (!mapController || !renderArgs) return '';
            const c = mapController.getConfig().confrontantes;
            if (!c.ativo || !c.camada) return '';
            const cam = camadasDoPayload().find(x => String(x.id) === c.camada);
            if (!cam) return '';
            const rows = mapController.confrontanteRows();
            if (!rows.length) return '';
            const esc = escapeHtml;
            const nomeDe = (x) => {
                const r = x.r || '';
                const t = c.nomes ? (x.t || '') : '';
                return esc(r && t ? r + ' — ' + t : (r || t || 'sem identificação'));
            };
            const rowsHtml = rows.map((r, i) => `<tr data-split-row class="${i % 2 ? 'bg-slate-50/70' : 'bg-white'}" style="page-break-inside: avoid;">
                <td class="px-2 py-1 border-r border-slate-200 font-bold text-[10px] text-slate-800 pt-editavel" data-conf-edit="${esc(r.id)}:lado" title="Duplo clique para editar (vazio restaura o calculado)">${esc(r.lado)}</td>
                <td class="px-2 py-1 border-r border-slate-200 font-mono text-[10px] text-right">${MapTools.fmtNumber(r.comprimento, 2)}</td>
                <td class="px-2 py-1 border-r border-slate-200 font-mono text-[10px] text-right">${esc(MapTools.fmtAzimuth(r.azimute))}</td>
                <td class="px-2 py-1 text-[10px] pt-editavel" data-conf-edit="${esc(r.id)}:conf" title="Duplo clique para editar (vazio restaura o calculado)">${r.confTexto ? esc(r.confTexto) : (r.confrontantes.length ? r.confrontantes.map(nomeDe).join('; ') : '<span class="text-slate-400 italic">Sem confrontante identificado (via pública ou área livre)</span>')}</td></tr>`);
            const thead = `<thead><tr class="bg-slate-100 border-b border-slate-200 text-slate-700">${['Lado', 'Comprimento (m)', 'Azimute', 'Confrontante(s)'].map(h => `<th class="px-2 py-1 border-r last:border-r-0 border-slate-200 text-[9.5px] font-bold uppercase tracking-wide leading-tight">${h}</th>`).join('')}</tr></thead>`;
            const meta = `camada: ${cam.name} • divisa = feição a até ${MapTools.fmtNumber(c.tolM, 1)} m de, no mínimo, 20% do lado${cam.truncated ? ' • camada recortada pelo limite de envio' : ''}`;
            const chunkHtml = (rs, isFirst) => `
                <div class="mb-4">
                    <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2 flex items-center justify-between gap-3">
                        <span>Confrontantes${isFirst ? '' : ' (continuação)'}</span>
                        <span class="text-[9.5px] font-mono text-slate-500 normal-case text-right">${esc(meta)}</span>
                    </div>
                    <div class="border border-slate-200 rounded-lg overflow-hidden shadow-2xs">
                        <table class="w-full text-left border-collapse">${thead}<tbody>${rs.join('')}</tbody></table>
                    </div>
                </div>`;
            return { split: { rowsHtml, chunkHtml } };
        }

        /** Área cadastral x calculada e distância/sobreposição com a camada de referência. */
        function renderAnaliseMapa() {
            if (!mapController || !renderArgs) return '';
            const cfg = mapController.getConfig();
            const linhas = [];
            const geom = renderArgs.featureGeometry;
            const fmt = MapTools.fmtNumber;

            if (cfg.comparacaoArea.ativo && cfg.comparacaoArea.campo) {
                const campo = ((reportPayload && reportPayload.formFields) || []).find(f => (f.id || f.name) === cfg.comparacaoArea.campo);
                const areaItem = MapTools.computeMeasures(geom).itens.find(i => i.id === 'area');
                const cmp = campo && areaItem ? MapTools.compararAreas(readFieldRaw(campo, renderArgs.featureData), areaItem.valor) : null;
                if (cmp) {
                    const sinal = cmp.diferenca >= 0 ? '+' : '−';
                    linhas.push({ id: 'comp', aviso: cmp.alerta, html: `<b>Área:</b> cadastral (${areaEmLinha(campo.label || campo.name || 'campo')}${campo.tabTitle ? ' — Aba: ' + areaEmLinha(campo.tabTitle) : ''}) ${fmt(cmp.cadastro, 2)} m² • calculada pela geometria ${fmt(cmp.calculada, 2)} m² • diferença ${sinal}${fmt(Math.abs(cmp.diferenca), 2)} m²${cmp.pct === null ? '' : ` (${sinal}${fmt(Math.abs(cmp.pct), 2)}%)`}${cmp.alerta ? ' — <b>divergência acima de 1%</b>' : ''}` });
                }
            }

            if (cfg.referencia.ativo && cfg.referencia.camada) {
                const cam = camadasDoPayload().find(x => String(x.id) === cfg.referencia.camada);
                if (cam) {
                    const d = MapTools.distanciaCamada(geom, cam);
                    if (d) {
                        const alvo = d.r ? ` (${escapeHtml(d.r)})` : '';
                        let txt;
                        if (d.intersecta) {
                            const s = MapTools.sobreposicaoCamada(geom, cam, window.turf);
                            txt = `A feição <b>intersecta</b> a camada <b>${escapeHtml(cam.name)}</b>${alvo}${s && s.areaM2 > 0 ? `: área sobreposta ${fmt(s.areaM2, 2)} m² (${fmt(s.pct, 2)}% da feição)` : ''}.`;
                        } else {
                            txt = `Distância até a camada <b>${escapeHtml(cam.name)}</b>${alvo}: <b>${fmt(d.metros, 2)} m</b>.`;
                        }
                        linhas.push({ aviso: d.intersecta, html: txt + (cam.truncated ? ' <i>(camada recortada pelo limite de envio)</i>' : '') });
                    } else {
                        linhas.push({ aviso: false, html: `Camada <b>${escapeHtml(cam.name)}</b>: nenhuma feição num raio de 400 m da feição.` });
                    }
                }
            }
            if (cfg.referencia.ativo && cfg.referencia.camada && mapController.distanceRows) {
                const cam = camadasDoPayload().find(x => String(x.id) === cfg.referencia.camada);
                mapController.distanceRows().forEach(r => linhas.push({ aviso: false, html: `<b>Distância medida no mapa${r.id ? ' (' + escapeHtml(r.id.slice(5)) + ')' : ''}</b> — da feição até a camada <b>${escapeHtml(cam ? cam.name : 'de referência')}</b>: <b>${escapeHtml(r.texto)}</b>.` }));
            }
            if (mapController.medicaoRows) {
                mapController.medicaoRows().forEach(r => {
                    const c = r.coords;
                    // DEC, GMS e UTM, um abaixo do outro
                    const coord = (rotulo) => '<div class="font-mono text-[10px] mt-1">' + (rotulo ? '<div class="font-sans text-slate-500">' + rotulo + '</div>' : '') + '<div>DEC ' + escapeHtml(c.dec) + '</div><div>GMS ' + escapeHtml(c.gms) + '</div><div>UTM ' + escapeHtml(c.utm) + '</div></div>';
                    if (r.tipo === 'ponto') linhas.push({ id: r.id, aviso: false, html: '<b>Coordenadas do ponto (' + escapeHtml(r.texto || '') + ')</b>' + coord('') });
                    else if (r.tipo === 'linha') {
                        const trechos = r.info.trechos.length > 1 ? '<div class="font-mono text-[10px] mt-1">' + r.info.trechos.map((d, k) => '<div>Vértice ' + (k + 1) + ' → ' + (k + 2) + ': <b>' + fmt(d, 2) + ' m</b></div>').join('') + '</div>' : '';
                        linhas.push({ id: r.id, aviso: false, html: '<b>Distância medida (' + r.numero + ')</b>: comprimento total <b>' + fmt(r.info.comprimento, 2) + ' m</b>' + trechos + coord('Centro da linha') });
                    } else linhas.push({ id: r.id, aviso: false, html: '<b>Área medida (' + r.numero + ')' + (r.nome ? ' — ' + escapeHtml(r.nome) : '') + '</b>: <b>' + fmt(r.info.area, 2) + ' m²</b> (' + fmt(r.info.area / 10000, 4) + ' ha) • perímetro <b>' + fmt(r.info.perimetro, 2) + ' m</b>' + coord('Centroide') });
                });
            }
            if (!linhas.length) return '';
            // cada card tem largura própria (% da folha): arrastar a borda direita ajusta; vários cards cabem lado a lado
            const largura = cfg.analises.largura || {};
            const GAP = 6;
            const larguraCss = (id) => { const p = id && largura[id] ? largura[id] : 100; return p >= 100 ? '100%' : 'calc(' + p + '% - ' + (GAP * (1 - p / 100)).toFixed(1) + 'px)'; };
            const cardHtml = (l) => `<div class="relative text-[10.5px] p-2 rounded-lg border ${l.aviso ? 'bg-amber-50 border-amber-300 text-amber-900' : 'bg-white border-slate-200 text-slate-800'}" ${l.id ? 'data-analise-id="' + l.id + '"' : ''} style="width: ${larguraCss(l.id)}; box-sizing: border-box;">${l.html}${l.id ? '<span class="col-resize no-print" data-card-resize="' + l.id + '" title="Arraste para ajustar a largura do card (dois cliques: largura total)"></span>' : ''}</div>`;
            return `<div class="mb-4 page-break-avoid">
                <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2">Análises da Feição</div>
                <div class="flex flex-wrap items-stretch" style="gap: 4px ${GAP}px;">${linhas.map(cardHtml).join('')}</div>
            </div>`;
        }

        function renderPointsTable() {
            if (!mapController) return '';
            const cfg = mapController.getConfig();
            if (!cfg.pontos.ativo || !cfg.pontos.tabela) return '';
            const pr = mapController.pointRows();
            if (!pr.rows.length) return '';
            const esc = escapeHtml;
            // colunas: Distância e Confrontantes têm largura ajustável (arrastar a divisória do cabeçalho); Azimute nunca quebra
            const larg = cfg.pontos.colunas || {};
            const cols = [{ h: 'Ponto' }];
            if (pr.colOrientacao) cols.push({ h: 'Orientação' });
            pr.headers.forEach(h => cols.push({ h: h }));
            if (pr.memorial) { cols.push({ h: 'Azimute', nowrap: true }); cols.push({ h: 'Distância (m)', key: 'dist' }); }
            if (pr.colConfrontantes) cols.push({ h: 'Confrontantes', key: 'cf' });
            // tudo centralizado; dois cliques em qualquer texto da tabela (título, nome, coordenadas, azimute, distância) para editar
            const ed = (key, txt, cls) => `<td class="px-2 py-1 border-r border-slate-200 text-center ${cls} pt-editavel" data-pt-edit="${esc(key)}" title="${/whitespace-pre-line/.test(cls) ? 'Duplo clique para editar; Shift+Enter quebra a linha (vazio restaura o calculado)' : 'Duplo clique para editar (vazio restaura o calculado)'}">${esc(txt)}</td>`;
            const rowsHtml = pr.rows.map((r, i) => {
                const tds = [ed(r.vid + ':t', r.titulo, 'font-bold text-[10px] text-slate-800')];
                if (pr.colOrientacao) tds.push(ed(r.vid + ':or', r.orientacao, 'font-mono text-[10px] whitespace-pre-line'));
                r.cells.forEach((c, k) => tds.push(ed(r.vid + ':c' + k, c, 'font-mono text-[10px]')));
                if (pr.memorial) { tds.push(ed(r.vid + ':az', r.azimute, 'font-mono text-[10px] whitespace-nowrap')); tds.push(ed(r.vid + ':dist', r.distancia, 'font-mono text-[10px] whitespace-pre-line')); }
                if (pr.colConfrontantes) tds.push(ed(r.vid + ':cf', r.confrontantes || '', 'text-[10px] whitespace-pre-line'));
                tds[tds.length - 1] = tds[tds.length - 1].replace('border-r ', ''); // a última coluna não leva divisória
                return `<tr data-split-row class="${i % 2 ? 'bg-slate-50/70' : 'bg-white'}" style="page-break-inside: avoid;">${tds.join('')}</tr>`;
            });
            const thead = `<thead><tr class="bg-slate-100 border-b border-slate-200 text-slate-700">${cols.map(c => `<th class="px-2 py-1 border-r last:border-r-0 border-slate-200 text-center text-[9.5px] font-bold uppercase tracking-wide leading-tight ${c.nowrap ? 'whitespace-nowrap' : ''}" style="position:relative;${c.key && larg[c.key] ? 'width:' + larg[c.key] + '%;' : ''}" ${c.key ? `data-col-key="${c.key}"` : ''}>${esc(c.h).replace(/\n/g, '<br>')}${c.key ? `<span class="col-resize no-print" data-col-resize="${c.key}" title="Arraste para ajustar a largura da coluna (dois cliques: automática)"></span>` : ''}</th>`).join('')}</tr></thead>`;
            const tituloPadrao = pr.memorial ? 'Memorial Descritivo — Tabela de Pontos' : 'Tabela de Pontos';
            const titulo = pr.tituloTabela || tituloPadrao;
            const nota = pr.memorial ? ` • azimutes a partir do Norte; distância somada pelos vértices não escolhidos quando houver${pr.fecha ? '; fecha no primeiro ponto' : ''}` : '';
            const meta = `${pr.rows.length} ponto(s) • ${pr.sistemaLabel}${nota}`;
            const chunkHtml = (rows, isFirst) => `
                <div class="mb-4">
                    <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2 flex items-center justify-between gap-3">
                        <span class="whitespace-pre-line pt-editavel" data-pt-edit="titulo" title="Duplo clique para editar (vazio restaura o título padrão)">${esc(titulo)}</span>${isFirst ? '' : '<span> (continuação)</span>'}
                        <span class="text-[9.5px] font-mono text-slate-500 normal-case text-right">${esc(meta)}</span>
                    </div>
                    <div class="border border-slate-200 rounded-lg overflow-hidden shadow-2xs">
                        <table class="w-full text-left border-collapse">${thead}<tbody>${rows.join('')}</tbody></table>
                    </div>
                </div>`;
            return { split: { rowsHtml, chunkHtml } };
        }

        // ---------------- painel "Mapa" (só na tela; não sai na impressão)
        function renderMapToolsPanel() {
            if (!mapController) return;
            let panel = document.getElementById('map-tools-panel');
            let toggle = document.getElementById('map-tools-toggle');
            if (!panel) {
                panel = document.createElement('div');
                panel.id = 'map-tools-panel';
                panel.className = 'no-print';
                document.body.appendChild(panel);

                toggle.id = 'map-tools-toggle';
                toggle.type = 'button';
                toggle.className = 'no-print';
                toggle.textContent = 'Mapa';
                toggle.onclick = () => { mapPanelOpen = true; applyMapPanelVisibility(); };
                document.body.appendChild(toggle);
            }
            const cfg = mapController.getConfig();
            const kind = mapController.kind;
            const camadas = (reportPayload && Array.isArray(reportPayload.camadasMapa)) ? reportPayload.camadasMapa : [];
            const on = new Set(cfg.camadasLigadas.map(String));
            const esc = escapeHtml;

            const secH = (id) => (mapPanelSecaoAberta === id ? 'open' : '');

            const chk = (id, label, checked, handler, disabled) => `<label class="row ${disabled ? 'off' : ''}"><input type="checkbox" id="${id}" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''} onchange="${handler}"> ${label}</label>`;
            const nisNota = (n) => '<span class="nis">' + [['n', '<b>N</b>', 'Negrito'], ['i', '<i>I</i>', 'Itálico'], ['s', '<u>S</u>', 'Sublinhado']].map(([k, l, tt]) => `<button type="button" title="${tt}" class="${n.estilo && n.estilo[k] ? 'on' : ''}" onclick="mapPanelNotaEstilo('${esc(n.id)}', '${k}')">${l}</button>`).join('') + '</span>';
            const nis = (alvo, grupo, e) => '<span class="nis">' + [['n', '<b>N</b>', 'Negrito'], ['i', '<i>I</i>', 'Itálico'], ['s', '<u>S</u>', 'Sublinhado']].map(([k, l, t]) => `<button type="button" title="${t}" class="${e[k] ? 'on' : ''}" onclick="mapPanelEstilo('${alvo}', '${grupo}', '${k}')">${l}</button>`).join('') + '</span>';
            const chkN = (id, label, checked, handler, disabled, nisHtml) => `<div class="rowx"><label class="row ${disabled ? 'off' : ''}" style="flex:1;min-width:0"><input type="checkbox" id="${id}" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''} onchange="${handler}"> ${label}</label>${nisHtml}</div>`;
            const estM = cfg.medidas.estilo;

<h4 data-sec-h="elementos" class="${secH('elementos')}" onclick="mapPanelSecao('elementos')">Elementos do mapa<span class="chev">&#9662;</span></h4><div data-sec="elementos" class="sec-body" style="display:${secD('elementos')}">

<h4 data-sec-h="base" class="${secH('base')}" onclick="mapPanelSecao('base')">Mapa base<span class="chev">&#9662;</span></h4><div data-sec="base" class="sec-body" style="display:${secD('base')}">

<h4 data-sec-h="medidas" class="${secH('medidas')}" onclick="mapPanelSecao('medidas')">Medição da feição<span class="chev">&#9662;</span></h4><div data-sec="medidas" class="sec-body" style="display:${secD('medidas')}">

                    ${chkN('mp-med-lados', kind === 'line' ? 'Trechos' : 'Lados', cfg.medidas.lados, "mapPanelMedidas('lados', this.checked)", kind === 'point' || mapController.ladosOmitidos, nis('medidas', 'lados', estM.lados))}
                    ${chkN('mp-med-total', kind === 'polygon' ? 'Área' : (kind === 'line' ? 'Comprimento total' : 'Coordenada'), cfg.medidas.total, "mapPanelMedidas('total', this.checked)", false, nis('medidas', 'total', estM.total))}
