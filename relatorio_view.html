        /**
         * Substitui menções @ por dados reais da feição sem o título do campo.
         */
        /**
         * Substitui menções @ por dados reais da feição sem o título do campo,
         * aplicando formatação de máscaras (CPF/CNPJ, Endereço, etc.) e formatação rica (Negrito, Itálico, Sublinhado).
         */
        function replaceMentionsWithData(contentHtml, featureData) {
            if (!contentHtml) return '';
            
            const availableFields = (window.reportViewerFormFields && Array.isArray(window.reportViewerFormFields)) ? window.reportViewerFormFields : [];

            // 1. Substitui spans com menção estruturada (@campo) priorizando data-field-id (único por campo e aba)
            let result = contentHtml.replace(/<span[^>]*class="[^"]*mention-[^"]*"[^>]*>[\s\S]*?<\/span>/gi, (match) => {
                const idMatch = match.match(/data-field-id="([^"]+)"/i);
                const nameMatch = match.match(/data-field-name="([^"]+)"/i);
                const fId = idMatch ? idMatch[1] : null;
                const fName = nameMatch ? nameMatch[1] : null;

                // Extrai rótulo limpo do texto da menção (ex: "@Loteamento (Dados do Imóvel)" -> "Loteamento")
                const rawInnerText = match.replace(/<[^>]+>/g, '').replace(/^@/, '').trim();
                const cleanLabel = rawInnerText.replace(/\s*\([^)]*\)$/, '').trim();

                let fieldDef = availableFields.find(f => (fId && f.id === fId) || (fName && f.name === fName));
                if (!fieldDef && cleanLabel) {
                    fieldDef = availableFields.find(f => f.label && f.label.toLowerCase().trim() === cleanLabel.toLowerCase().trim());
                }
                if (!fieldDef) {
                    fieldDef = { id: fId, name: fName, label: cleanLabel };
                }
                if (!fieldDef.label && cleanLabel) fieldDef.label = cleanLabel;

                // Resolve o valor formatado através de resolveFieldValue (que já faz busca inteligente, aliases e formatação)
                let val = undefined;
                if (typeof resolveFieldValue === 'function') {
                    const resolved = resolveFieldValue(fieldDef, featureData, availableFields);
                    if (resolved !== '—') val = resolved;
                }

                // Fallback direto em featureData caso resolveFieldValue não encontre
                if (val === undefined || val === null || val === '') {
                    if (fId && featureData[fId] !== undefined && featureData[fId] !== null && featureData[fId] !== '') {
                        val = formatFieldValueForDisplay(featureData[fId], fieldDef);
                    } else if (fName && featureData[fName] !== undefined && featureData[fName] !== null && featureData[fName] !== '') {
                        val = formatFieldValueForDisplay(featureData[fName], fieldDef);
                    } else if (fName && featureData[fName.toLowerCase()] !== undefined && featureData[fName.toLowerCase()] !== null && featureData[fName.toLowerCase()] !== '') {
                        val = formatFieldValueForDisplay(featureData[fName.toLowerCase()], fieldDef);
                    }
                }

                if (val === undefined || val === null || val === '') {
                    val = '—';
                }

                let displayVal = String(val);

                // Detecta opções de formatação ricas (Negrito, Itálico, Sublinhado) aplicadas na tag ou pelo editor
                const isBold = match.includes('data-format-bold="true"') || 
                               /font-weight\s*:\s*(bold|700|800|900)/i.test(match) || 
                               /\bfont-black\b/i.test(match) || 
                               /\bis-bold\b/i.test(match);

                const isItalic = match.includes('data-format-italic="true"') || 
                                 /font-style\s*:\s*italic/i.test(match) || 
                                 /\bitalic\b/i.test(match);

                const isUnderline = match.includes('data-format-underline="true"') || 
                                   /text-decoration\s*:\s*underline/i.test(match) || 
                                   /\bunderline\b/i.test(match);

                let formattedOutput = escapeHtml(displayVal);
                if (isUnderline) formattedOutput = `<u>${formattedOutput}</u>`;
                if (isItalic) formattedOutput = `<em>${formattedOutput}</em>`;
                if (isBold) formattedOutput = `<strong>${formattedOutput}</strong>`;

                return formattedOutput;
            });

            // 2. Substitui spans legados caso existam
            result = result.replace(/<span[^>]*data-field-id="([^"]+)"[^>]*>.*?<\/span>/gi, (match, fId) => {
                const isBold = match.includes('data-format-bold="true"') || /font-weight\s*:\s*(bold|700|800|900)/i.test(match) || /\bfont-black\b/i.test(match) || /\bis-bold\b/i.test(match);
                const isItalic = match.includes('data-format-italic="true"') || /font-style\s*:\s*italic/i.test(match) || /\bitalic\b/i.test(match);
                const isUnderline = match.includes('data-format-underline="true"') || /text-decoration\s*:\s*underline/i.test(match) || /\bunderline\b/i.test(match);

                let fieldDef = availableFields.find(f => f.id === fId) || { id: fId };
                let val = (typeof resolveFieldValue === 'function') ? resolveFieldValue(fieldDef, featureData, availableFields) : undefined;
                if (val === undefined || val === null || val === '—') {
                    val = featureData[fId] ? formatFieldValueForDisplay(featureData[fId], fieldDef) : '—';
                }
                let out = escapeHtml(String(val));
                if (isUnderline) out = `<u>${out}</u>`;
                if (isItalic) out = `<em>${out}</em>`;
                if (isBold) out = `<strong>${out}</strong>`;
                return out;
            });

            result = result.replace(/<span[^>]*data-field-name="([^"]+)"[^>]*>.*?<\/span>/gi, (match, fName) => {
                const isBold = match.includes('data-format-bold="true"') || /font-weight\s*:\s*(bold|700|800|900)/i.test(match) || /\bfont-black\b/i.test(match) || /\bis-bold\b/i.test(match);
                const isItalic = match.includes('data-format-italic="true"') || /font-style\s*:\s*italic/i.test(match) || /\bitalic\b/i.test(match);
                const isUnderline = match.includes('data-format-underline="true"') || /text-decoration\s*:\s*underline/i.test(match) || /\bunderline\b/i.test(match);

                let fieldDef = availableFields.find(f => f.name === fName) || { name: fName };
                let val = (typeof resolveFieldValue === 'function') ? resolveFieldValue(fieldDef, featureData, availableFields) : undefined;
                if (val === undefined || val === null || val === '—') {
                    val = featureData[fName] ? formatFieldValueForDisplay(featureData[fName], fieldDef) : '—';
                }
                let out = escapeHtml(String(val));
                if (isUnderline) out = `<u>${out}</u>`;
                if (isItalic) out = `<em>${out}</em>`;
                if (isBold) out = `<strong>${out}</strong>`;
                return out;
            });

            // 3. Substitui padrões como @[Nome] ou @nome_campo
            for (const [key, rawVal] of Object.entries(featureData)) {
                if (rawVal !== null && rawVal !== undefined) {
                    const regex = new RegExp(`@\\[?${key}\\]?`, 'gi');
                    if (regex.test(result)) {
                        const fieldDef = availableFields.find(f => f.name === key || f.id === key) || { id: key, name: key };
                        const formatted = formatFieldValueForDisplay(rawVal, fieldDef);
                        result = result.replace(regex, escapeHtml(String(formatted)));
                    }
                }
            }

            return result;
        }

        /**
         * Extrai e normaliza registros 1:N da feição (vistorias, fotos, relatos, links).
         */
        // =====================================================================================
        // QUADRO SINTÉTICO E LAUDO ANALÍTICO — guiados pelo schema do formulário (src/reportData.js)
        //  • Abas: as que o usuário escolheu no bloco (por id ou título); sem escolha = todas as 1:N.
        //  • Colunas: os campos escolhidos (por id). A origem da linha é o TÍTULO da aba.
        //  • Valores: sempre formatados pelo TIPO do campo (src/fieldFormatter.js).
        //  • Tabelas longas quebram por linhas entre as folhas (retornam { split }).
        // =====================================================================================

        /** Converte a seleção do bloco (ids ou títulos de aba) nos ids das abas realmente disponíveis. */
        function resolveTabIds(list, tabs) {
            const out = [];
            (Array.isArray(list) ? list : []).forEach(entry => {
                const e = (entry && typeof entry === 'object') ? (entry.id || entry.tabId || entry.title) : entry;
                const tab = tabs.find(t => String(t.id) === String(e)) ||
                            tabs.find(t => ReportData.norm(t.title) === ReportData.norm(e));
                if (tab && !out.includes(tab.id)) out.push(tab.id);
            });
            return out;
        }

        /** Abas visíveis (permissão e condição já aplicadas no snapshot; a condição é reaplicada por segurança). */
        function getReportSchema(featureData) {
            const tabs = ReportData.visibleTabs(window.reportViewerFormTabs || [], featureData);
            return { tabs, fieldIndex: ReportData.buildFieldIndex(tabs) };
        }

        function getTableDensityClasses(density) {
            if (density === 'comfortable') {
                return { th: 'p-2 text-[10.5px] font-bold text-slate-700 uppercase border-b-2 border-slate-300', td: 'p-2 text-[11px] border-b border-slate-200' };
            }
            if (density === 'ultracompact') {
                return { th: 'py-0.5 px-1 text-[8.5px] font-bold text-slate-700 uppercase border-b-2 border-slate-300', td: 'py-0.5 px-1 text-[9px] font-medium border-b border-slate-200' };
            }
            return { th: 'py-1.5 px-2 text-[9.5px] font-bold text-slate-700 uppercase border-b-2 border-slate-300', td: 'py-1.5 px-2 text-[10px] border-b border-slate-200' };
        }

        function reportBlockNotice(bloco, defaultTitle, message) {
            return `
                <div class="mb-4 page-break-avoid">
                    <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2">
                        ${FieldFormatter.escapeHtml(bloco.titulo || defaultTitle)}
                    </div>
                    <div class="p-4 text-center text-slate-400 italic text-xs border border-dashed border-slate-300 rounded-lg bg-slate-50/60">${FieldFormatter.escapeHtml(message)}</div>
                </div>`;
        }

        const MSG_TABS_UNAVAILABLE = 'As abas escolhidas para este quadro não estão disponíveis (ocultas por permissão ou condição, ou removidas do formulário). Revise a seleção de abas no construtor.';

        function renderSyntheticTable(bloco, featureData) {
            const TITLE = 'Quadro Sintético de Vistorias (Histórico 1:N)';
            const esc = FieldFormatter.escapeHtml;
            const { tabs, fieldIndex } = getReportSchema(featureData);

            const sortOrder = bloco.ordem_cronologica || 'desc';
            const groupByTab = !!bloco.ordenar_por_aba;
            const hasSelection = Array.isArray(bloco.abas_selecionadas) && bloco.abas_selecionadas.length > 0;
            const tabIds = hasSelection ? resolveTabIds(bloco.abas_selecionadas, tabs) : [];
            if (hasSelection && tabIds.length === 0) return reportBlockNotice(bloco, TITLE, MSG_TABS_UNAVAILABLE);

            let records = ReportData.buildRecords(tabs, featureData, { tabIds });
            records = ReportData.sortRecords(records, sortOrder, groupByTab, bloco.ordem_abas);
            if (records.length === 0) {
                return reportBlockNotice(bloco, TITLE, 'Nenhum registro cadastrado nas abas selecionadas para este imóvel.');
            }

            const rawCols = (Array.isArray(bloco.colunas) && bloco.colunas.length) ? bloco.colunas : ['aba', 'data', 'qtd_fotos'];
            const cols = rawCols.map(c => ({
                col: c,
                id: (c && typeof c === 'object') ? c.id : c,
                label: ReportData.columnLabel(c, fieldIndex)
            }));
            const ctx = { fieldIndex, geometryCenter: getGeometryCenter() };
            const dens = getTableDensityClasses(bloco.densidade || 'compact');
            const striping = bloco.zebrado || 'slate';
            const NUMERIC = ['area_m2', 'length_m', 'volume_m3', 'currency'];

            const cellHtml = (c, r) => {
                const cell = ReportData.cellFor(c.col, r, ctx);
                if (c.id === 'aba' || c.id === 'org') return getOrgBadgeHtml(r.tabTitle);
                if (c.id === 'situacao_ocupacao') return getStatusBadgeHtml(cell.text);
                if (c.id === 'situacao_recuo') return getRecuoBadgeHtml(cell.text);
                return cell.html;
            };

            const rowsHtml = records.map((r, i) => {
                const odd = i % 2 === 1;
                let rowBg = odd ? 'bg-slate-50/70' : 'bg-white';
                if (striping === 'sky') rowBg = odd ? 'bg-sky-50/50' : 'bg-white';
                else if (striping === 'white') rowBg = 'bg-white';
                const tds = cols.map(c => {
                    const field = ReportData.fieldForColumn(c.col, r, fieldIndex);
                    const numeric = field && NUMERIC.includes(String(field.type || '').toLowerCase());
                    return `<td class="${dens.td} border-r last:border-r-0 border-slate-200 whitespace-normal break-words ${numeric ? 'text-right font-mono' : 'text-slate-700'}">${cellHtml(c, r)}</td>`;
                }).join('');
                return `<tr data-split-row class="${rowBg}" style="page-break-inside: avoid;">
                    <td class="${dens.td} border-r border-slate-200 text-center font-mono text-[10px] text-slate-400">${i + 1}</td>${tds}</tr>`;
            });

            const theadHtml = `<thead><tr class="bg-slate-100 border-b border-slate-200 text-slate-700">
                <th class="${dens.th} border-r border-slate-200 w-8 text-center">#</th>
                ${cols.map(c => `<th class="${dens.th} border-r last:border-r-0 border-slate-200 whitespace-normal break-words leading-tight">${esc(c.label)}</th>`).join('')}
            </tr></thead>`;

            const meta = `${records.length} registro(s) • ${sortOrder === 'asc' ? 'Antigo → Recente' : 'Recente → Antigo'}${groupByTab ? ' • Por Aba' : ''}`;
            const chunkHtml = (rows, isFirst) => `
                <div class="mb-4">
                    <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2 flex items-center justify-between">
                        <span class="whitespace-pre-line">${esc(bloco.titulo || TITLE)}${isFirst ? '' : ' (continuação)'}</span>
                        <span class="text-[10px] font-mono text-slate-500 normal-case">${esc(meta)}</span>
                    </div>
                    <div class="border border-slate-200 rounded-lg overflow-hidden shadow-2xs">
                        <table class="w-full text-left border-collapse">${theadHtml}<tbody>${rows.join('')}</tbody></table>
                    </div>
                </div>`;

            return { split: { rowsHtml, chunkHtml } };
        }

        function renderAnalyticalLaudo(bloco, featureData) {
            const TITLE = 'Laudo Analítico e Caderno Fotográfico';
            const esc = FieldFormatter.escapeHtml;
            const { tabs, fieldIndex } = getReportSchema(featureData);

            const sortOrder = bloco.ordem_cronologica || 'desc';
            const groupByTab = !!bloco.ordenar_por_aba;

            // Campos escolhidos (por id) e abas: escolhidas no bloco, ou deduzidas dos campos, ou todas as 1:N
            const rawSel = Array.isArray(bloco.campos_selecionados) ? bloco.campos_selecionados : [];
            const selFieldIds = rawSel.map(cf => (typeof cf === 'string') ? cf : (cf && (cf.rawId || cf.id))).filter(id => id && fieldIndex[id]);
            const hasTabSelection = Array.isArray(bloco.abas_selecionadas) && bloco.abas_selecionadas.length > 0;
            let tabIds = hasTabSelection ? resolveTabIds(bloco.abas_selecionadas, tabs) : [];
            if (!hasTabSelection && selFieldIds.length) {
                selFieldIds.forEach(fid => {
                    const ref = fieldIndex[fid];
                    if (ref && !tabIds.includes(ref.tab.id)) tabIds.push(ref.tab.id);
                });
            }
            if (hasTabSelection && tabIds.length === 0) return reportBlockNotice(bloco, TITLE, MSG_TABS_UNAVAILABLE);

            let records = ReportData.buildRecords(tabs, featureData, { tabIds });
            if (bloco.escopo === 'ultima') {
                const seenTab = new Set();
                records = ReportData.sortRecords(records, 'desc', true, bloco.ordem_abas).filter(r => !seenTab.has(r.tabId) && seenTab.add(r.tabId));
            }
            records = ReportData.sortRecords(records, sortOrder, true, bloco.ordem_abas);
            if (records.length === 0) {
                return reportBlockNotice(bloco, TITLE, 'Nenhum registro cadastrado nas abas selecionadas para este imóvel.');
            }

            const layout = bloco.layoutFotos || '2_cols';
            const gridClass = layout === '1_col' ? 'grid-cols-1' : (layout === 'grid_4' ? 'grid-cols-4' : 'grid-cols-2');
            const striping = bloco.zebrado || 'slate';
            const larguras = bloco.campos_larguras || {};
            const modes = bloco.campos_exibicao || {};   // { idDoCampo: 'lista' | 'imagem' }
            const fileMeta = { titulo: bloco.exibirLegenda !== false, autor: bloco.exibirResp !== false, data: bloco.exibirData !== false };
            const geometryCenter = getGeometryCenter();
            const WIDE = ['textarea', 'hiperlink', 'hiperlink_1n', 'attachment', 'cep'];

            const widthOf = (pct) => {
                const p = Math.round(pct);
                return p >= 98 ? '100%' : (p >= 65 ? '66.666%' : (p <= 28 ? '25%' : (p <= 38 ? '33.333%' : '50%')));
            };

            const photosHtml = (r) => {
                // Campos de foto que o usuário mandou exibir como LISTA saem como texto (título + arquivo)
                const listFields = (r.tab.fields || []).filter(f => String(f.type || '').toLowerCase() === 'photo' && modes[f.id] === 'lista');
                const listHtml = listFields.map(f => {
                    const v = FieldFormatter.toHtml(r.values[f.id], f, { fileMode: 'lista', fileMeta });
                    if (v === FieldFormatter.EMPTY) return '';
                    return `<div class="p-2 bg-white rounded-lg border border-slate-200 text-xs">
                        <span class="font-bold text-slate-500 uppercase text-[9px] block mb-0.5">${esc(f.label || f.name || f.id)}:</span>
                        <div class="text-[10.5px] text-slate-800 font-semibold break-words">${v}</div></div>`;
                }).join('');
                const photos = ReportData.recordPhotos(r, listFields.map(f => f.id));
                if (photos.length === 0) return listHtml;
                return `<div class="grid ${gridClass} gap-3 pt-1">${photos.map(p => {
                    const href = FieldFormatter.normalizeUrl(p.url);
                    if (!href) return '';
                    return `<div class="border border-slate-200 rounded-lg overflow-hidden bg-white flex flex-col shadow-2xs">
                        <a href="${esc(href)}" target="_blank" rel="noopener noreferrer" class="block h-44 bg-slate-100 overflow-hidden">
                            <img src="${esc(href)}" class="w-full h-full object-cover" alt="${esc(p.title)}" />
                        </a>
                        <div class="p-2 text-[10.5px] space-y-0.5 text-slate-600">
                            ${bloco.exibirLegenda !== false && p.title ? `<div class="font-bold text-slate-800 break-words">${esc(p.title)}</div>` : ''}
                            ${bloco.exibirData !== false && p.date ? `<div class="text-slate-500">Data: ${esc(p.date)}</div>` : ''}
                            ${bloco.exibirResp !== false && p.author ? `<div class="text-slate-500">Resp: ${esc(p.author)}</div>` : ''}
                        </div></div>`;
                }).join('')}</div>` + listHtml;
            };

            const cardHtml = (r, idx) => {
                let cardBg = idx % 2 === 1 ? 'bg-slate-100/70 border-slate-300' : 'bg-white border-slate-200';
                if (striping === 'sky') cardBg = idx % 2 === 1 ? 'bg-sky-50/50 border-sky-200' : 'bg-white border-slate-200';
                else if (striping === 'white') cardBg = 'bg-white border-slate-200';

                const fields = ReportData.recordFields(r, selFieldIds.length ? selFieldIds : null)
                    .filter(f => String(f.type || '').toLowerCase() !== 'photo');
                const cells = fields.map(f => {
                    const type = String(f.type || '').toLowerCase();
                    const pct = larguras[f.id] || (WIDE.includes(type) ? 100 : 50);
                    const w = widthOf(pct);
                    return `<div class="p-2 bg-white rounded-lg border border-slate-200 text-xs" style="flex: 0 0 ${w}; max-width: ${w}; width: ${w}; box-sizing: border-box;">
                        <span class="font-bold text-slate-500 uppercase text-[9px] block truncate mb-0.5">${esc(f.label || f.name || f.id)}:</span>
                        <div class="text-[10.5px] text-slate-800 font-semibold break-words whitespace-normal ${type === 'textarea' ? 'font-normal text-justify' : ''}">${FieldFormatter.toHtml(r.values[f.id], f, { geometryCenter, fileMode: modes[f.id], fileMeta })}</div>
                    </div>`;
                }).join('');

                return `<div class="border rounded-xl p-3 ${cardBg} space-y-2.5 shadow-2xs">
                    ${cells ? `<div class="flex flex-wrap gap-2">${cells}</div>` : '<div class="text-[10px] italic text-slate-400">Nenhum campo desta aba foi selecionado para o laudo.</div>'}
                    ${photosHtml(r)}
                </div>`;
            };

            // Uma "unidade" por registro (a primeira de cada aba leva o título do grupo). Cada unidade é indivisível.
            const perTabCount = {};
            records.forEach(r => { perTabCount[r.tabId] = (perTabCount[r.tabId] || 0) + 1; });
            const seenTab = {};
            const rowsHtml = records.map((r, i) => {
                let groupHeader = '';
                if (!seenTab[r.tabId]) {
                    seenTab[r.tabId] = true;
                    groupHeader = `<div class="flex items-center justify-between px-2.5 py-1.5 bg-slate-100 rounded-lg border border-slate-200 text-xs font-bold text-slate-800 uppercase tracking-wide mb-2">
                        <div class="flex items-center gap-1.5"><span>${esc(bloco['custom_tab_title_' + r.tabId] || ('Aba / Ente: ' + r.tabTitle))}</span></div>
                        <span class="text-[9.5px] font-mono font-bold text-slate-500 bg-white px-2 py-0.5 rounded-full border border-slate-200">${perTabCount[r.tabId]} registro(s)</span>
                    </div>`;
                }
                return `<div data-split-row>${groupHeader}${cardHtml(r, i)}</div>`;
            });

            const meta = `${records.length} registro(s) • ${sortOrder === 'asc' ? 'Antigo → Recente' : 'Recente → Antigo'}`;
            const chunkHtml = (rows, isFirst) => `
                <div class="mb-4">
                    <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2.5 flex items-center justify-between">
                        <span class="whitespace-pre-line">${esc(bloco.titulo || TITLE)}${isFirst ? '' : ' (continuação)'}</span>
                        <span class="text-[10px] font-mono text-slate-500 normal-case">${esc(meta)}</span>
                    </div>
                    <div class="space-y-3">${rows.join('')}</div>
                </div>`;

            return { split: { rowsHtml, chunkHtml } };
        }

        // =====================================================================================
        // MINI-MAPA DO RELATÓRIO: configuração do modelo + ajustes do usuário (salvos por relatório + feição)
        // =====================================================================================
        const AJUSTES_STORAGE_KEY = 'constructive_report_ajustes';

        function getOpenerAdapter() {
            try {
                return (window.opener && !window.opener.closed && window.opener.ReportAdapter) ? window.opener.ReportAdapter : null;
            } catch (e) { return null; }
        }

        function mapAjusteIds() {
            const tplId = (reportPayload && (reportPayload.templateId || (reportPayload.template && reportPayload.template.id))) || '';
            const key = (reportPayload && reportPayload.featureKey) || MapTools.featureKey(reportPayload && reportPayload.featureData) || '';
            return { tplId: String(tplId), key: String(key), formId: (reportPayload && reportPayload.formId) || '' };
        }

        async function loadMapAjustes() {
            const { tplId, key } = mapAjusteIds();
            if (!tplId || !key) return null;
            const adapter = getOpenerAdapter();
            if (adapter && typeof adapter.getAjustes === 'function') {
                try { return await adapter.getAjustes(tplId, key); } catch (e) { /* cai para o navegador */ }
            }
            try { return (JSON.parse(localStorage.getItem(AJUSTES_STORAGE_KEY) || '{}') || {})[tplId + '|' + key] || null; } catch (e) { return null; }
        }

        async function persistMapAjustes(ajustes) {
            const { tplId, key, formId } = mapAjusteIds();
            if (!tplId || !key) return { ok: false, motivo: 'sem-feicao' };
            const adapter = getOpenerAdapter();
            if (adapter && typeof adapter.saveAjustes === 'function') {
                try { return await adapter.saveAjustes(tplId, key, formId, ajustes); } catch (e) { /* cai para o navegador */ }
            }
            try {
                const all = JSON.parse(localStorage.getItem(AJUSTES_STORAGE_KEY) || '{}') || {};
                all[tplId + '|' + key] = ajustes;
                localStorage.setItem(AJUSTES_STORAGE_KEY, JSON.stringify(all));
                return { ok: true, remoto: false };
            } catch (e) { return { ok: false, motivo: 'erro' }; }
        }

        async function initReportMiniMap(geometry) {
            const mapContainer = document.getElementById('interactive-report-map');
            if (!mapContainer || typeof L === 'undefined' || !mapBloco) return;

            mapBaseConfig = MapTools.normalizeMapConfig(mapBloco);
            let ajustes = null;
            try { ajustes = await loadMapAjustes(); } catch (e) {}
            const config = MapTools.mergeAjustes(mapBaseConfig, ajustes);
            const camadas = (reportPayload && Array.isArray(reportPayload.camadasMapa)) ? reportPayload.camadasMapa : [];

            try {
                lastPontosKey = blocosKey(config);
                mapController = ReportMap.create({ L, MapTools, container: 'interactive-report-map', geometry, camadas, onMeasureState: () => renderMapToolsPanel(), ortofotos: (reportPayload && Array.isArray(reportPayload.ortofotos)) ? reportPayload.ortofotos : [], config, onChange: onMapChange });
            } catch (e) {
                console.error('[Mapa] Erro ao criar o mini-mapa:', e);
                return;
            }
            aplicarAlturaMapa(config.alturaMm); // altura escolhida pelo usuário na última vez
            renderMapToolsPanel();
            // análise temporal: ortofotos que a página do mapa entregou (só as que o usuário pode ver)
            const ortofotos = (reportPayload && Array.isArray(reportPayload.ortofotos)) ? reportPayload.ortofotos : [];
            if (ortofotos.length) {
                temporalController = ReportTemporal.create({
                    L, MapTools, geometry, ortofotos, config: config.temporal, corContorno: config.destaque.cor,
                    probe: makeOrtofotoProbe(geometry),
                    onStructureChange: () => { renderMapToolsPanel(); scheduleRepaginate(); scheduleEmissao(); },
                    onChange: () => { renderMapToolsPanel(); scheduleEmissao(); }
                });
                if (config.temporal.ativo) temporalController.start();
            }
            renderMapToolsPanel();
            // pontos e série temporal já salvos: os blocos precisam entrar na paginação
            const temPontos = mapController.pointRows().rows.length && config.pontos.ativo && config.pontos.tabela;
            const temAnalises = (config.confrontantes.ativo && config.confrontantes.camada) || (config.referencia.ativo && config.referencia.camada) || (config.comparacaoArea.ativo && config.comparacaoArea.campo);
            if (temPontos || temAnalises || (temporalController && config.temporal.ativo)) scheduleRepaginate();
        }

        // Ortofotos em tiles não informam a área que cobrem: pede o tile do centro da feição; se não existe, o quadro sai.
        function makeOrtofotoProbe(geometry) {
            const bb = MapTools.geometryBBox(geometry);
            const c = bb ? MapTools.bboxCenter(bb) : null;
            return (o) => new Promise(resolve => {
                if (!c) { resolve(null); return; }
                const z = MapTools.probeZoom(o);
                const t = MapTools.tileXY(c[1], c[0], z);
                const img = new Image();
                let done = false;
                const fin = (v) => { if (!done) { done = true; clearTimeout(timer); resolve(v); } };
                const timer = setTimeout(() => fin(null), 8000);
                img.onload = () => fin(true);
                img.onerror = () => fin(false);
                img.src = MapTools.tileUrl(o.url, t.x, t.y, z);
            });
        }

        // ajustes completos para salvar: mapa + série temporal
        function snapshotCompleto() {
            const s = mapController.snapshot();
            if (temporalController) s.temporal = temporalController.snapshot();
            return s;
        }

        // ---------------- pontos nos vértices: tabela (com memorial) e repaginação
        function onMapChange(cfg) {
            scheduleEmissao();
            if (mapController && cfg.alturaMm !== mapAlturaMm) { aplicarAlturaMapa(cfg.alturaMm); renderMapToolsPanel(); }
            const key = blocosKey(cfg);
            if (key === lastPontosKey) return;
            lastPontosKey = key;
            if (!mapController) return; // ainda montando
            renderMapToolsPanel();
            scheduleRepaginate();
        }

        // ---- altura do mapa na folha: arrastar a borda inferior, digitar em mm ou preencher o espaço livre da folha
        function mapaAlturaMaxMm() {
            const tpl = renderArgs && renderArgs.tpl;
            const d = PageSize.dims(tpl && tpl.config_pagina);
            const m = (tpl && tpl.config_pagina && tpl.config_pagina.margens_mm) || { top: 15, bottom: 15 };
            // sobra da folha depois do cabeçalho, do rodapé, das margens e da caixa de dimensões que vem embaixo do mapa
            const px = d.heightPx - Math.round(((m.top || 0) + (m.bottom || 0)) * 3.78) - 135 - 42 - 110;
            return Math.max(60, Math.floor(px / 3.78));
        }
        function mapaAlturaLimitada(mm) { return Math.round(Math.min(mapaAlturaMaxMm(), Math.max(40, Number(mm) || 0))); }
        /** Nova altura (mm) que aproveita o espaço livre (px) no fim da folha; nunca fora de [40, max]. */
        function mapaAlturaPreenchida(atualMm, livrePx, maxMm) {
            return Math.round(Math.min(maxMm, Math.max(40, atualMm + livrePx / 3.78 - 3)));
        }
        function aplicarAlturaMapa(mm) {
            const nova = mapaAlturaLimitada(mm);
            if (nova === mapAlturaMm) return;
            mapAlturaMm = nova;
            const px = Math.round(nova * 3.78) + 'px';
            const wrap = document.getElementById('map-wrap');
            const inner = document.getElementById('interactive-report-map');
            if (wrap) wrap.style.height = px;
            if (inner) inner.style.height = px;
            if (mapController) mapController.invalidate();
            scheduleRepaginate();
        }
        document.addEventListener('pointerdown', (ev) => {
            const h = ev.target && ev.target.closest ? ev.target.closest('#map-resize') : null;
            if (!h || !mapController) return;
            ev.preventDefault();
            const wrap = document.getElementById('map-wrap');
            const inner = document.getElementById('interactive-report-map');
            if (!wrap || !inner) return;
            const y0 = ev.clientY, h0 = wrap.getBoundingClientRect().height;
            const minPx = 40 * 3.78, maxPx = mapaAlturaMaxMm() * 3.78;
            let px = h0;
            h.classList.add('ativo');
            const move = (e) => {
                px = Math.min(maxPx, Math.max(minPx, h0 + (e.clientY - y0)));
                wrap.style.height = inner.style.height = Math.round(px) + 'px';
                mapController.invalidate();
            };
            const up = () => {
                document.removeEventListener('pointermove', move);
                document.removeEventListener('pointerup', up);
                h.classList.remove('ativo');
                mapController.setAltura(Math.round(px / 3.78));
            };
            document.addEventListener('pointermove', move);
            document.addEventListener('pointerup', up);
        });

        function scheduleRepaginate() {
            clearTimeout(repaginateTimer);
            repaginateTimer = setTimeout(repaginateKeepingMap, 120);
        }

        function repaginateKeepingMap() {
            if (!renderArgs || !mapController) return;
            keptMapWrap = document.getElementById('map-wrap');
            const y = window.scrollY;
            renderBlocks(renderArgs.tpl, renderArgs.featureData, renderArgs.featureGeometry);
            window.scrollTo(0, y);
        }

        /** O que muda a paginação: pontos, confrontantes, referência e comparação de área. */
        function blocosKey(cfg) {
            return JSON.stringify([cfg.pontos, cfg.confrontantes, cfg.referencia, cfg.comparacaoArea]);
        }

        function camadasDoPayload() {
            return (reportPayload && Array.isArray(reportPayload.camadasMapa)) ? reportPayload.camadasMapa : [];
        }

        function areaEmLinha(txt) { return escapeHtml(txt); }

        /** Quem faz divisa com cada lado do polígono (camada escolhida no painel; nomes só se o usuário quiser). */
        function renderConfrontantesTable() {
            if (!mapController || !renderArgs) return '';
            const c = mapController.getConfig().confrontantes;
            if (!c.ativo || !c.camada) return '';
            const cam = camadasDoPayload().find(x => String(x.id) === c.camada);
            if (!cam) return '';
            const rows = mapController.confrontanteRows();
            if (!rows.length) return '';
            const esc = escapeHtml;
            const nomeDe = (x) => {
                const r = x.r || '';
                const t = c.nomes ? (x.t || '') : '';
                return esc(r && t ? r + ' — ' + t : (r || t || 'sem identificação'));
            };
            const rowsHtml = rows.map((r, i) => `<tr data-split-row class="${i % 2 ? 'bg-slate-50/70' : 'bg-white'}" style="page-break-inside: avoid;">
                <td class="px-2 py-1 border-r border-slate-200 font-bold text-[10px] text-slate-800 pt-editavel" data-conf-edit="${esc(r.id)}:lado" title="Duplo clique para editar (vazio restaura o calculado)">${esc(r.lado)}</td>
                <td class="px-2 py-1 border-r border-slate-200 font-mono text-[10px] text-right">${MapTools.fmtNumber(r.comprimento, 2)}</td>
                <td class="px-2 py-1 border-r border-slate-200 font-mono text-[10px] text-right">${esc(MapTools.fmtAzimuth(r.azimute))}</td>
                <td class="px-2 py-1 text-[10px] pt-editavel" data-conf-edit="${esc(r.id)}:conf" title="Duplo clique para editar (vazio restaura o calculado)">${r.confTexto ? esc(r.confTexto) : (r.confrontantes.length ? r.confrontantes.map(nomeDe).join('; ') : '<span class="text-slate-400 italic">Sem confrontante identificado (via pública ou área livre)</span>')}</td></tr>`);
            const thead = `<thead><tr class="bg-slate-100 border-b border-slate-200 text-slate-700">${['Lado', 'Comprimento (m)', 'Azimute', 'Confrontante(s)'].map(h => `<th class="px-2 py-1 border-r last:border-r-0 border-slate-200 text-[9.5px] font-bold uppercase tracking-wide leading-tight">${h}</th>`).join('')}</tr></thead>`;
            const meta = `camada: ${cam.name} • divisa = feição a até ${MapTools.fmtNumber(c.tolM, 1)} m de, no mínimo, 20% do lado${cam.truncated ? ' • camada recortada pelo limite de envio' : ''}`;
            const chunkHtml = (rs, isFirst) => `
                <div class="mb-4">
                    <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2 flex items-center justify-between gap-3">
                        <span>Confrontantes${isFirst ? '' : ' (continuação)'}</span>
                        <span class="text-[9.5px] font-mono text-slate-500 normal-case text-right">${esc(meta)}</span>
                    </div>
                    <div class="border border-slate-200 rounded-lg overflow-hidden shadow-2xs">
                        <table class="w-full text-left border-collapse">${thead}<tbody>${rs.join('')}</tbody></table>
                    </div>
                </div>`;
            return { split: { rowsHtml, chunkHtml } };
        }

        /** Área cadastral x calculada e distância/sobreposição com a camada de referência. */
        function renderAnaliseMapa() {
            if (!mapController || !renderArgs) return '';
            const cfg = mapController.getConfig();
            const linhas = [];
            const geom = renderArgs.featureGeometry;
            const fmt = MapTools.fmtNumber;

            if (cfg.comparacaoArea.ativo && cfg.comparacaoArea.campo) {
                const campo = ((reportPayload && reportPayload.formFields) || []).find(f => (f.id || f.name) === cfg.comparacaoArea.campo);
                const areaItem = MapTools.computeMeasures(geom).itens.find(i => i.id === 'area');
                const cmp = campo && areaItem ? MapTools.compararAreas(readFieldRaw(campo, renderArgs.featureData), areaItem.valor) : null;
                if (cmp) {
                    const sinal = cmp.diferenca >= 0 ? '+' : '−';
                    linhas.push({ aviso: cmp.alerta, html: `<b>Área:</b> cadastral (${areaEmLinha(campo.label || campo.name || 'campo')}${campo.tabTitle ? ' — Aba: ' + areaEmLinha(campo.tabTitle) : ''}) ${fmt(cmp.cadastro, 2)} m² • calculada pela geometria ${fmt(cmp.calculada, 2)} m² • diferença ${sinal}${fmt(Math.abs(cmp.diferenca), 2)} m²${cmp.pct === null ? '' : ` (${sinal}${fmt(Math.abs(cmp.pct), 2)}%)`}${cmp.alerta ? ' — <b>divergência acima de 1%</b>' : ''}` });
                }
            }

            if (cfg.referencia.ativo && cfg.referencia.camada) {
                const cam = camadasDoPayload().find(x => String(x.id) === cfg.referencia.camada);
                if (cam) {
                    const d = MapTools.distanciaCamada(geom, cam);
                    if (d) {
                        const alvo = d.r ? ` (${escapeHtml(d.r)})` : '';
                        let txt;
                        if (d.intersecta) {
                            const s = MapTools.sobreposicaoCamada(geom, cam, window.turf);
                            txt = `A feição <b>intersecta</b> a camada <b>${escapeHtml(cam.name)}</b>${alvo}${s && s.areaM2 > 0 ? `: área sobreposta ${fmt(s.areaM2, 2)} m² (${fmt(s.pct, 2)}% da feição)` : ''}.`;
                        } else {
                            txt = `Distância até a camada <b>${escapeHtml(cam.name)}</b>${alvo}: <b>${fmt(d.metros, 2)} m</b>.`;
                        }
                        linhas.push({ aviso: d.intersecta, html: txt + (cam.truncated ? ' <i>(camada recortada pelo limite de envio)</i>' : '') });
                    } else {

        function renderPointsTable() {
            if (!mapController) return '';
            const cfg = mapController.getConfig();
            if (!cfg.pontos.ativo || !cfg.pontos.tabela) return '';
            const pr = mapController.pointRows();
            if (!pr.rows.length) return '';
            const esc = escapeHtml;
            const heads = ['Ponto'].concat(pr.colOrientacao ? ['Orientação'] : [], pr.headers, pr.memorial ? ['Azimute', 'Distância (m)'] : [], pr.colConfrontantes ? ['Confrontantes'] : []);
            // tudo centralizado; dois cliques em qualquer texto da tabela (título, nome, coordenadas, azimute, distância) para editar
            const ed = (key, txt, cls) => `<td class="px-2 py-1 border-r border-slate-200 text-center ${cls} pt-editavel" data-pt-edit="${esc(key)}" title="Duplo clique para editar (vazio restaura o calculado)">${esc(txt)}</td>`;
            const rowsHtml = pr.rows.map((r, i) => {
                const tds = [ed(r.vid + ':t', r.titulo, 'font-bold text-[10px] text-slate-800')];
                if (pr.colOrientacao) tds.push(ed(r.vid + ':or', r.orientacao, 'font-mono text-[10px]'));
                r.cells.forEach((c, k) => tds.push(ed(r.vid + ':c' + k, c, 'font-mono text-[10px]')));
                if (pr.memorial) { tds.push(ed(r.vid + ':az', r.azimute, 'font-mono text-[10px]')); tds.push(ed(r.vid + ':dist', r.distancia, 'font-mono text-[10px]')); }
                if (pr.colConfrontantes) tds.push(ed(r.vid + ':cf', r.confrontantes || '', 'text-[10px]'));
                tds[tds.length - 1] = tds[tds.length - 1].replace('border-r ', ''); // a última coluna não leva divisória
                return `<tr data-split-row class="${i % 2 ? 'bg-slate-50/70' : 'bg-white'}" style="page-break-inside: avoid;">${tds.join('')}</tr>`;
            });
            const thead = `<thead><tr class="bg-slate-100 border-b border-slate-200 text-slate-700">${heads.map(h => `<th class="px-2 py-1 border-r last:border-r-0 border-slate-200 text-center text-[9.5px] font-bold uppercase tracking-wide leading-tight">${esc(h).replace(/\n/g, '<br>')}</th>`).join('')}</tr></thead>`;
            const tituloPadrao = pr.memorial ? 'Memorial Descritivo — Tabela de Pontos' : 'Tabela de Pontos';
            const titulo = pr.tituloTabela || tituloPadrao;
            const nota = pr.memorial ? ` • azimutes a partir do Norte; distância somada pelos vértices não escolhidos quando houver${pr.fecha ? '; fecha no primeiro ponto' : ''}` : '';
            const meta = `${pr.rows.length} ponto(s) • ${pr.sistemaLabel}${nota}`;
            const chunkHtml = (rows, isFirst) => `
                <div class="mb-4">
                    <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2 flex items-center justify-between gap-3">

                        <span class="text-[9.5px] font-mono text-slate-500 normal-case text-right">${esc(meta)}</span>

                        <table class="w-full text-left border-collapse">${thead}<tbody>${rows.join('')}</tbody></table>
                    </div>
                </div>`;
            return { split: { rowsHtml, chunkHtml } };
        }

            panel.scrollTop = scrollTop;

        // O painel ocupa 268 px à direita da folha (794 px): em telas estreitas começa recolhido, atrás do botão "Mapa".
        const MAP_PANEL_MIN_WIDTH = 1360;
        function applyMapPanelVisibility() {
            const panel = document.getElementById('map-tools-panel');
            const toggle = document.getElementById('map-tools-toggle');
            // valores explícitos: '' devolveria o controle ao CSS, que esconde o botão por padrão
            if (panel) panel.style.display = mapPanelOpen ? 'block' : 'none';
            if (toggle) toggle.style.display = mapPanelOpen ? 'none' : 'block';
        }

        // sanfona: só uma seção aberta; clicar na aberta recolhe. Vale entre redesenhos do painel.
        let mapPanelSecaoAberta = 'destaque';
        function mapPanelSecao(id) {
            mapPanelSecaoAberta = mapPanelSecaoAberta === id ? null : id;
            const panel = document.getElementById('map-tools-panel');
            if (!panel) return;
            panel.querySelectorAll('[data-sec]').forEach(d => { d.style.display = d.getAttribute('data-sec') === mapPanelSecaoAberta ? 'block' : 'none'; });
            panel.querySelectorAll('[data-sec-h]').forEach(h => { h.classList.toggle('open', h.getAttribute('data-sec-h') === mapPanelSecaoAberta); });
        }

        // edição por duplo clique dos textos da tabela de pontos (título, nome, coordenadas, azimute, distância)
        function editarTextoTabelaPontos(td) {
            if (!mapController || !td || td.querySelector('input')) return;
            const chave = td.getAttribute('data-pt-edit') || td.getAttribute('data-conf-edit');
            const daConf = !td.getAttribute('data-pt-edit');
            const atual = td.textContent.trim();
            const input = document.createElement('input');
            input.type = 'text';
            input.value = atual;
            input.maxLength = 80;
            input.className = 'pt-edit-input';
            input.style.cssText = 'width:100%;min-width:60px;font:inherit;text-align:center;border:1px solid #059669;border-radius:3px;padding:0 2px;outline:none';
            td.textContent = '';
            td.appendChild(input);
            input.focus();
            input.select();
            let feito = false;
            const fim = (grava) => {
                if (feito) return;
                feito = true;
                if (!grava || input.value === atual) { td.textContent = atual; return; }
                if (daConf) mapController.setConfrontanteTexto(chave, input.value);
                else if (/:t$/.test(chave)) mapController.renamePoint(chave.slice(0, -2), input.value);
                else mapController.setTabelaTexto(chave, input.value);
            };
            input.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') fim(true); else if (ev.key === 'Escape') fim(false); });
            input.addEventListener('blur', () => fim(true));
        }
        document.addEventListener('dblclick', (ev) => {
            const td = ev.target && ev.target.closest ? ev.target.closest('[data-pt-edit], [data-conf-edit]') : null;
            if (td) editarTextoTabelaPontos(td);
        });

        // coluna "Confrontantes" da tabela de pontos: camadas, campos e distâncias
        function colConfEditar(fn) {
            if (!mapController) return;
            const c = JSON.parse(JSON.stringify(mapController.getConfig().pontos.colConf));
            fn(c);
            mapController.setColConf(c);
            renderMapToolsPanel();
        }
        function mapPanelColConf(k, v) { colConfEditar(c => { c[k] = v; }); }
        function mapPanelColConfCamada(id, on) { colConfEditar(c => { c.camadas = c.camadas.filter(x => x.id !== String(id)); if (on) c.camadas.push({ id: String(id), campos: [], logradouro: false }); }); }
        function mapPanelColConfLog(id, on) { colConfEditar(c => { const s = c.camadas.find(x => x.id === String(id)); if (s) s.logradouro = !!on; }); }
        function mapPanelColConfCampo(id, j, on) {
            const cam = camadasDoPayload().find(x => String(x.id) === String(id));
            const k = cam && cam.campos && cam.campos[j] ? cam.campos[j].k : null;
            if (k === null) return;
            colConfEditar(c => { const s = c.camadas.find(x => x.id === String(id)); if (s) s.campos = s.campos.filter(x => x !== k).concat(on ? [k] : []); });
        }

        function mapPanelConfMover(id, dir) { if (mapController) { mapController.moveConfrontante(id, dir); renderMapToolsPanel(); } }
        function mapPanelConfReset() { if (mapController) { mapController.resetConfrontantes(); renderMapToolsPanel(); } }
        function mapPanelRotulosReset() { if (mapController) { mapController.resetRotulos(); renderMapToolsPanel(); } }

        function mapPanelElementosReset() { if (mapController) { mapController.resetElementos(); renderMapToolsPanel(); } }

        function mapPanelLegendaNome(key, txt) { if (mapController) { mapController.renameLegend(key, txt); renderMapToolsPanel(); } }

        function mapPanelMedirDist() {
            if (!mapController) return;

            renderMapToolsPanel();

        function mapPanelAltura(v) {

            renderMapToolsPanel();
        }
        // soma à altura do mapa o espaço que sobra no fim da folha em que ele está
        function mapPanelPreencher() {
            const wrap = document.getElementById('map-wrap');
            const page = wrap && wrap.closest ? wrap.closest('.a4-page') : null;
            const slot = page ? page.querySelector('.a4-page-body-slot') : null;
            const ultimo = slot ? slot.lastElementChild : null;
            if (!mapController || !slot || !ultimo) return;
            const limite = slot.getBoundingClientRect().bottom - (parseFloat(window.getComputedStyle(slot).paddingBottom) || 0);
            const livre = limite - ultimo.getBoundingClientRect().bottom;
            mapController.setAltura(mapaAlturaPreenchida(mapAlturaMm, livre, mapaAlturaMaxMm()));
            renderMapToolsPanel();
        }

        function mapPanelHide() {
            mapPanelOpen = false;

        function mapPanelSet(key, value) { if (mapController) mapController.setConfig({ [key]: value }); }
        // negrito / itálico / sublinhado: alvo 'medidas' (por grupo ou 'todos') ou 'pontos' / 'rotulos' (estilo único)
        function mapPanelEstilo(alvo, grupo, k) {
            if (!mapController) return;
            const cfg = mapController.getConfig();
            if (alvo === 'medidas') {
                const est = cfg.medidas.estilo;
                const gs = grupo === 'todos' ? ['lados', 'total', 'perimetro'] : [grupo];
                const novo = !gs.every(g => est[g][k]);
                gs.forEach(g => { est[g][k] = novo; });
                mapController.setConfig({ medidas: { estilo: est } });
            } else {
                const est = Object.assign({}, cfg[alvo].estilo);
                est[k] = !est[k];
                mapController.setConfig({ [alvo]: { estilo: est } });
            }
            renderMapToolsPanel();
        }

        function mapPanelMover(vid, dir) { if (mapController) mapController.movePoint(vid, dir); }
        function mapPanelRemover(vid) { if (mapController) mapController.removePoint(vid); }
        function mapPanelExtra(grupo, prop, value) { if (mapController) mapController.setConfig({ [grupo]: { [prop]: value } }); }

        function mapPanelNotaRemover(id) { if (mapController) { mapController.removeNote(id); renderMapToolsPanel(); } }

        function mapPanelOrtofoto(id, on) { if (temporalController) temporalController.toggle(id, on); }
        function mapPanelMedidas(key, value) { if (mapController) mapController.setConfig({ medidas: { [key]: value } }); }
        function mapPanelResetMedidas() { if (mapController) mapController.resetMeasures(); }
        function mapPanelLayer(id, on) { if (mapController) mapController.toggleLayer(id, on); }

        async function mapPanelSave() {
            const status = document.getElementById('map-panel-status');
            if (!mapController) return;
            if (status) status.textContent = 'Salvando…';
            const r = await persistMapAjustes(snapshotCompleto());
            if (!status) return;
            if (!r.ok) status.textContent = r.motivo === 'sem-feicao' ? 'Salve a feição no mapa antes de guardar ajustes.' : 'Não foi possível salvar.';
            else status.textContent = r.remoto ? 'Ajustes salvos.' : 'Ajustes salvos neste navegador (servidor indisponível).';
        }

        function mapPanelReset() {
            if (!mapController || !mapBaseConfig) return;
            mapController.reset(mapBaseConfig);
            if (temporalController) temporalController.setConfig(Object.assign({}, mapBaseConfig.temporal, { excluidas: [] }));
            renderMapToolsPanel();
            const status = document.getElementById('map-panel-status');
            if (status) status.textContent = 'Padrão do modelo restaurado (falta salvar para guardar).';
        }

        // Garante que o navegador não imprima cabeçalhos/rodapés nativos indesejados (como 'about:blank', títulos ou data/hora do sistema)
        window.addEventListener('beforeprint', () => {
            window._savedDocTitle = document.title;
            document.title = '';
            if (mapController) mapController.setExportMode(true); // vértices livres não saem no papel
        });
        window.addEventListener('afterprint', () => {
            if (mapController) mapController.setExportMode(false);
            if (window._savedDocTitle) {
                document.title = window._savedDocTitle;
            }
        });

        function gerarPDF() {
            window.print();
        }

        // =====================================================================================
        // EMISSÃO: protocolo + SHA-256 do conteúdo, calculados a partir do que está na folha
        // =====================================================================================
        function emissaoTexto(kind) {
            if (emissao.erro) return kind === 'protocolo' ? 'indisponível' : 'indisponível';
            if (!emissao.hash) return 'a gerar…';
            return kind === 'protocolo' ? '#' + emissao.protocolo : emissao.hash.slice(0, 16) + '…';
        }
        function emissaoTitulo() {
            return emissao.erro ? escapeHtml(emissao.erro) : escapeHtml(emissao.hash || '');
        }

        /** QR code (imagem GIF embutida) que leva à página de verificação com o protocolo. Vazio se ainda não há protocolo. */
        function qrDataUrl() {
            if (!emissao.protocolo || typeof qrcode !== 'function' || typeof VerificarEmissao === 'undefined') return '';
            try {
                const qr = qrcode(0, 'M');
                qr.addData(VerificarEmissao.verificationUrl(window.location.href, emissao.protocolo));
                qr.make();
                return qr.createDataURL(4, 0);
            } catch (e) { return ''; }
        }

        function aplicarEmissaoNoDom() {
            const qr = qrDataUrl();
            document.querySelectorAll('[data-emissao="qr"]').forEach(e => { if (qr) { e.src = qr; e.style.display = ''; } else { e.style.display = 'none'; } });
            document.querySelectorAll('[data-emissao="protocolo"]').forEach(e => { e.textContent = emissaoTexto('protocolo'); });
            document.querySelectorAll('[data-emissao="hash"]').forEach(e => { e.textContent = emissaoTexto('hash'); e.title = emissao.hash || emissao.erro || ''; });
        }

        /** Tudo que o hash garante: modelo, feição, ajustes do mapa (com o zoom atual) e textos editados na folha. */
        function coletarConteudoParaHash() {
            const args = renderArgs || {};
            const snap = mapController ? snapshotCompleto() : null;
            const temporal = snap ? snap.temporal : null;
            if (snap) delete snap.temporal;
            return {
                template: args.tpl, featureKey: mapAjusteIds().key, featureData: args.featureData, geometry: args.featureGeometry,
                mapa: snap, temporal: temporal,
                textos: Array.from(document.querySelectorAll('.free-text-editable')).map(e => e.textContent || '')
            };
        }

        async function calcularEmissao() {
            try {
                const hash = await ReportExport.sha256Hex(ReportExport.buildHashContent(coletarConteudoParaHash()));
                emissao = { hash: hash, protocolo: ReportExport.makeProtocol(hash, emissaoData), erro: '' };
            } catch (e) {
                emissao = { hash: '', protocolo: '', erro: (e && e.message) || 'SHA-256 indisponível' };
            }
            aplicarEmissaoNoDom();
            return emissao;
        }

        function scheduleEmissao() {
            clearTimeout(emissaoTimer);
            emissaoTimer = setTimeout(() => { calcularEmissao(); }, 400);
        }

        /** Recalcula na hora (o conteúdo pode ter mudado há instantes) e registra a emissão. */
        async function emitirEregistrar(formato) {
            clearTimeout(emissaoTimer);
            const em = await calcularEmissao();
            if (em.hash) {
                const adapter = getOpenerAdapter();
                const ids = mapAjusteIds();
                if (adapter && typeof adapter.registrarEmissao === 'function') {
                    try { await adapter.registrarEmissao({ protocolo: em.protocolo, hash: em.hash, templateId: ids.tplId, featureKey: ids.key, formId: ids.formId, formato: formato }); } catch (e) { /* o registro não impede a emissão */ }
                }
            }
            return em;
        }

        async function imprimirRelatorio() {
            await emitirEregistrar('impressao');
            window.print();
        }

        // =====================================================================================
        // IMAGEM DO MAPA (PNG e Word)
        // =====================================================================================
        /** Captura um elemento (mapa com camadas, rótulos, norte, escala e legenda) como imagem PNG. */
        async function capturarElemento(el, escala) {
            if (typeof html2canvas !== 'function') throw new Error('html2canvas não carregou (sem internet?)');
            // 1) html2canvas desenha tiles e vetores; 2) rótulos, norte, escala, legenda e crédito são desenhados por cima
            //    nas posições que o navegador calculou (o html2canvas os posiciona alguns pixels fora do lugar)
            return MapSnapshot.capture(el, {
                html2canvas: html2canvas,
                cs: (e) => window.getComputedStyle(e),
                rect: (e) => e.getBoundingClientRect(),
                textRect: nodeTextRect,
                size: (e) => ({ w: e.offsetWidth, h: e.offsetHeight }),
                scale: escala || 2
            });
        }

        /** Retângulo (união das linhas) que o navegador reservou para um trecho de texto. */
        function nodeTextRect(node) {
            const rg = document.createRange();
            rg.selectNodeContents(node);
            const rects = rg.getClientRects();
            if (!rects.length) return null;
            let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity;
            Array.prototype.forEach.call(rects, x => { l = Math.min(l, x.left); t = Math.min(t, x.top); r = Math.max(r, x.right); b = Math.max(b, x.bottom); });
            return { left: l, top: t, right: r, bottom: b, width: r - l, height: b - t };
        }

        /** Captura o mapa principal e os quadros da análise temporal. Devolve { id: captura | null }. */
        async function capturarMapasDoRelatorio() {
            const ids = ['map-wrap'];
            document.querySelectorAll('.report-tframe-wrap').forEach(e => { if (e.id) ids.push(e.id); });
            const caps = {};
            if (mapController) mapController.setExportMode(true);
            try {
                for (const id of ids) {
                    const el = document.getElementById(id);
                    if (!el) continue;
                    try { caps[id] = await capturarElemento(el, 2); }
                    catch (e) { console.warn('[Exportação] Falha ao capturar ' + id + ':', e); caps[id] = null; }
                }
            } finally {
                if (mapController) mapController.setExportMode(false);
            }
            return caps;
        }

        function baixarArquivo(conteudo, tipo, nome) {
            const blob = new Blob(conteudo, { type: tipo });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = nome;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(link.href), 2000);
        }

        async function exportarMapaPng() {
            const status = document.getElementById('map-panel-status');
            try {
                const el = document.getElementById('map-wrap');
                if (!el) throw new Error('mapa não encontrado');
                if (status) status.textContent = 'Gerando imagem…';
                if (mapController) mapController.setExportMode(true);
                let cap;
                try { cap = await capturarElemento(el, 2); } finally { if (mapController) mapController.setExportMode(false); }
                const bin = atob(cap.dataUrl.split(',')[1]);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                baixarArquivo([bytes], 'image/png', 'mapa_' + (emissao.protocolo || Date.now()) + '.png');
                if (status) status.textContent = 'Imagem do mapa salva.';
            } catch (e) {
                console.warn('[Exportação] PNG do mapa:', e);
                if (status) status.textContent = 'Não foi possível gerar a imagem do mapa (' + ((e && e.message) || 'erro') + ').';
            }
        }

        /**
         * Word: os mapas entram como IMAGEM (capturada da tela), os quadros da análise temporal viram tabela e o
         * arquivo é um MHTML (.doc) com as imagens dentro, que o Word abre normalmente.
         */
        async function gerarWord() {
            const docElement = document.getElementById('a4-document-container');
            if (!docElement) return;
            await emitirEregistrar('word');
            const caps = await capturarMapasDoRelatorio();
            const falhas = Object.keys(caps).filter(id => !caps[id]);

            const tpl = renderArgs && renderArgs.tpl;
            const cfgPag = (tpl && tpl.config_pagina) || {};
            const docTitle = document.getElementById('report-header-title')?.textContent || 'Relatorio_Oficial';
            // A folha viva (com o layout calculado pelo navegador) vira HTML de Word: estilos em cada elemento,
            // flex/grid como tabelas, mapas como imagem, cabeçalho no topo e rodapé do Word com número de página.
            const partes = ReportWord.buildDocument(docElement, {
                cs: (el) => window.getComputedStyle(el),
                rect: (el) => el.getBoundingClientRect(),
                captures: caps
            });
            const dims = PageSize.dims(cfgPag);
            // o corpo vai como HTML (MHTML com as imagens) dentro do .docx; o rodapé é escrito em OOXML, com campos de página
            const wordHtml = ReportWord.wordFileHtml({ title: docTitle, page: dims, margins: cfgPag.margens_mm, sinRodape: true }, { header: partes.header, body: partes.body, footer: '' });
            const ftrBloco = ((tpl && tpl.blocos) || []).find(b => b.tipo === 'rodape') || {};
            const agora = new Date();
            const qrUrl = qrDataUrl();
            const bytes = ReportDocx.build({
                mhtml: ReportExport.toWordMhtml(wordHtml),
                page: dims,
                margins: cfgPag.margens_mm,
                footer: {
                    data: 'Emitido em ' + agora.toLocaleDateString('pt-BR') + ' às ' + agora.toLocaleTimeString('pt-BR'),
                    hash: emissao.hash ? emissao.hash.slice(0, 16) + '…' : '',
                    qr: qrUrl ? ReportDocx.b64ToBytes(qrUrl.split(',')[1]) : null, qrExt: 'gif',
                    mostrarData: ftrBloco.exibirDataHora !== false, mostrarHash: ftrBloco.exibirHash !== false,
                    mostrarQr: ftrBloco.exibirQr !== false, mostrarPaginas: ftrBloco.numeracao !== false
                }
            });
            baixarArquivo([bytes], 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', docTitle.replace(/[\s\/\\:*?"<>|]+/g, '_') + '_' + (emissao.protocolo || Date.now()) + '.docx');
            if (falhas.length) alert('O Word foi gerado, mas ' + falhas.length + ' mapa(s) não puderam virar imagem (veja o aviso no lugar do mapa). Confira a conexão com a internet e tente de novo.');
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }
    </script>
</body>
