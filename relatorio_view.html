                    <div class="space-y-3">${rows.join('')}</div>
                </div>`;

            return { split: { rowsHtml, chunkHtml } };
        }

        // =====================================================================================
        // MINI-MAPA DO RELATÓRIO: configuração do modelo + ajustes do usuário (salvos por relatório + feição)
        // =====================================================================================
        const AJUSTES_STORAGE_KEY = 'constructive_report_ajustes';

        function getOpenerAdapter() {
            try {
                return (window.opener && !window.opener.closed && window.opener.ReportAdapter) ? window.opener.ReportAdapter : null;
            } catch (e) { return null; }
        }

        function mapAjusteIds() {
            const tplId = (reportPayload && (reportPayload.templateId || (reportPayload.template && reportPayload.template.id))) || '';
            const key = (reportPayload && reportPayload.featureKey) || MapTools.featureKey(reportPayload && reportPayload.featureData) || '';
            return { tplId: String(tplId), key: String(key), formId: (reportPayload && reportPayload.formId) || '' };
        }

        async function loadMapAjustes() {
            const { tplId, key } = mapAjusteIds();
            if (!tplId || !key) return null;
            const adapter = getOpenerAdapter();
            if (adapter && typeof adapter.getAjustes === 'function') {
                try { return await adapter.getAjustes(tplId, key); } catch (e) { /* cai para o navegador */ }
            }
            try { return (JSON.parse(localStorage.getItem(AJUSTES_STORAGE_KEY) || '{}') || {})[tplId + '|' + key] || null; } catch (e) { return null; }
        }

        async function persistMapAjustes(ajustes) {
            const { tplId, key, formId } = mapAjusteIds();
            if (!tplId || !key) return { ok: false, motivo: 'sem-feicao' };
            const adapter = getOpenerAdapter();
            if (adapter && typeof adapter.saveAjustes === 'function') {
                try { return await adapter.saveAjustes(tplId, key, formId, ajustes); } catch (e) { /* cai para o navegador */ }
            }
            try {
                const all = JSON.parse(localStorage.getItem(AJUSTES_STORAGE_KEY) || '{}') || {};
                all[tplId + '|' + key] = ajustes;
                localStorage.setItem(AJUSTES_STORAGE_KEY, JSON.stringify(all));
                return { ok: true, remoto: false };
            } catch (e) { return { ok: false, motivo: 'erro' }; }
        }

        async function initReportMiniMap(geometry) {
            const mapContainer = document.getElementById('interactive-report-map');
            if (!mapContainer || typeof L === 'undefined' || !mapBloco) return;

            mapBaseConfig = MapTools.normalizeMapConfig(mapBloco);
            let ajustes = null;
            try { ajustes = await loadMapAjustes(); } catch (e) {}
            const config = MapTools.mergeAjustes(mapBaseConfig, ajustes);
            const camadas = (reportPayload && Array.isArray(reportPayload.camadasMapa)) ? reportPayload.camadasMapa : [];

            try {
                mapController = ReportMap.create({ L, MapTools, container: 'interactive-report-map', geometry, camadas, config });
            } catch (e) {
                console.error('[Mapa] Erro ao criar o mini-mapa:', e);
                return;
            }
            renderMapToolsPanel();
        }

        // ---------------- painel "Mapa" (só na tela; não sai na impressão)
        function renderMapToolsPanel() {
            if (!mapController) return;
            let panel = document.getElementById('map-tools-panel');
            let toggle = document.getElementById('map-tools-toggle');
            if (!panel) {
                panel = document.createElement('div');
                panel.id = 'map-tools-panel';
                panel.className = 'no-print';
                document.body.appendChild(panel);
                toggle = document.createElement('button');
                toggle.id = 'map-tools-toggle';
                toggle.type = 'button';
                toggle.className = 'no-print';
                toggle.textContent = 'Mapa';
                toggle.onclick = () => { panel.style.display = ''; toggle.style.display = 'none'; };
                document.body.appendChild(toggle);
            }
            const cfg = mapController.getConfig();
            const kind = mapController.kind;
            const camadas = (reportPayload && Array.isArray(reportPayload.camadasMapa)) ? reportPayload.camadasMapa : [];
            const on = new Set(cfg.camadasLigadas.map(String));
            const esc = escapeHtml;
            const chk = (id, label, checked, handler, disabled) => `<label class="row ${disabled ? 'off' : ''}"><input type="checkbox" id="${id}" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''} onchange="${handler}"> ${label}</label>`;
            const camadasHtml = !cfg.camadasVizinhas
                ? '<div style="color:#64748b">O modelo não permite camadas neste mapa.</div>'
                : (camadas.length
                    ? camadas.map(c => `<label class="row"><input type="checkbox" ${on.has(String(c.id)) ? 'checked' : ''} onchange="mapPanelLayer('${esc(c.id)}', this.checked)"><i style="display:inline-block;width:12px;height:8px;border-radius:2px;background:${esc(c.color)}"></i><span style="flex:1">${esc(c.name)}</span>${c.truncated ? '<span title="Parte das feições ficou de fora (limite de envio)" style="color:#b45309">*</span>' : ''}</label>`).join('')
                    : '<div style="color:#64748b">Nenhuma outra camada estava ativa no mapa ao abrir este relatório.</div>');

            panel.innerHTML = `
                <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #e2e8f0">
                    <strong style="font-size:13px">Mapa do relatório</strong>
                    <button type="button" onclick="mapPanelHide()" style="border:0;background:none;cursor:pointer;font-size:16px;line-height:1" title="Recolher">×</button>
                </div>
                <div style="padding:2px 12px 12px">
                    <h4>Feição em destaque</h4>
                    ${chk('mp-destaque', 'Destacar a feição', cfg.destaque.ativo, "mapPanelDestaque('ativo', this.checked)")}
                    ${chk('mp-esmaecer', 'Esmaecer o entorno', cfg.destaque.esmaecerEntorno, "mapPanelDestaque('esmaecerEntorno', this.checked)", kind !== 'polygon')}
                    <label class="row">Cor <input type="color" value="${esc(cfg.destaque.cor)}" oninput="mapPanelDestaque('cor', this.value)" style="width:34px;height:22px;padding:0;border:1px solid #cbd5e1"></label>
                    <label class="row">Preenchimento <input type="range" min="0" max="90" value="${Math.round(cfg.destaque.preenchimento * 100)}" oninput="mapPanelDestaque('preenchimento', this.value / 100)" style="flex:1"></label>
                    <h4>Medidas da feição</h4>
                    ${chk('mp-med', 'Mostrar medidas no mapa', cfg.medidas.ativo, "mapPanelMedidas('ativo', this.checked)")}
                    ${chk('mp-med-lados', kind === 'line' ? 'Trechos' : 'Lados', cfg.medidas.lados, "mapPanelMedidas('lados', this.checked)", kind === 'point' || mapController.ladosOmitidos)}
                    ${chk('mp-med-total', kind === 'polygon' ? 'Área' : (kind === 'line' ? 'Comprimento total' : 'Coordenada'), cfg.medidas.total, "mapPanelMedidas('total', this.checked)")}
                    ${chk('mp-med-perim', 'Perímetro', cfg.medidas.perimetro, "mapPanelMedidas('perimetro', this.checked)", kind !== 'polygon')}
                    <div style="color:#64748b;line-height:1.35;margin:3px 0 4px">Dê <b>dois cliques</b> numa medida para editar o texto (vazio restaura o calculado). Arraste para mudar de lugar.${mapController.ladosOmitidos ? ' <span style="color:#b45309">Mais de 80 lados: rótulos dos lados omitidos.</span>' : ''}</div>
                    <button type="button" class="act" onclick="mapPanelResetMedidas()">Restaurar medidas calculadas</button>
                    <h4>Mapa base</h4>
                    <select onchange="mapPanelSet('baseMap', this.value)" style="width:100%;padding:5px;border:1px solid #cbd5e1;border-radius:8px">
                        <option value="osm" ${cfg.baseMap === 'osm' ? 'selected' : ''}>Ruas (OpenStreetMap)</option>
                        <option value="satelite" ${cfg.baseMap === 'satelite' ? 'selected' : ''}>Satélite</option>
                        <option value="nenhum" ${cfg.baseMap === 'nenhum' ? 'selected' : ''}>Sem mapa base</option>
                    </select>
                    <h4>Camadas ativas no mapa</h4>
                    ${camadasHtml}
                    <h4>Elementos do mapa</h4>
                    ${chk('mp-norte', 'Norte', cfg.norte, "mapPanelSet('norte', this.checked)")}
                    ${chk('mp-escala', 'Escala', cfg.escala, "mapPanelSet('escala', this.checked)")}
                    ${chk('mp-proj', 'Sistema de projeção', cfg.projecao, "mapPanelSet('projecao', this.checked)")}
                    <div style="display:flex;gap:6px;margin-top:12px">
                        <button type="button" class="act primary" onclick="mapPanelSave()">Salvar ajustes</button>
                        <button type="button" class="act" onclick="mapPanelReset()">Restaurar</button>
                    </div>
                    <div id="map-panel-status" style="margin-top:6px;color:#475569;min-height:16px"></div>
                </div>`;
            panel.style.display = window.innerWidth < 1500 ? 'none' : '';
            if (toggle) toggle.style.display = window.innerWidth < 1500 ? '' : 'none';
        }

        function mapPanelHide() {
            document.getElementById('map-tools-panel').style.display = 'none';
            document.getElementById('map-tools-toggle').style.display = '';
        }
        function mapPanelSet(key, value) { if (mapController) mapController.setConfig({ [key]: value }); }
        function mapPanelDestaque(key, value) { if (mapController) mapController.setConfig({ destaque: { [key]: value } }); }
        function mapPanelMedidas(key, value) { if (mapController) mapController.setConfig({ medidas: { [key]: value } }); }
        function mapPanelResetMedidas() { if (mapController) mapController.resetMeasures(); }
        function mapPanelLayer(id, on) { if (mapController) mapController.toggleLayer(id, on); }

        async function mapPanelSave() {
            const status = document.getElementById('map-panel-status');
            if (!mapController) return;
            if (status) status.textContent = 'Salvando…';
            const r = await persistMapAjustes(mapController.snapshot());
            if (!status) return;
            if (!r.ok) status.textContent = r.motivo === 'sem-feicao' ? 'Salve a feição no mapa antes de guardar ajustes.' : 'Não foi possível salvar.';
            else status.textContent = r.remoto ? 'Ajustes salvos.' : 'Ajustes salvos neste navegador (servidor indisponível).';
        }

        function mapPanelReset() {
            if (!mapController || !mapBaseConfig) return;
            mapController.reset(mapBaseConfig);
            renderMapToolsPanel();
            const status = document.getElementById('map-panel-status');
            if (status) status.textContent = 'Padrão do modelo restaurado (falta salvar para guardar).';
        }

        // Garante que o navegador não imprima cabeçalhos/rodapés nativos indesejados (como 'about:blank', títulos ou data/hora do sistema)
        window.addEventListener('beforeprint', () => {
            window._savedDocTitle = document.title;
            document.title = '';
        });
        window.addEventListener('afterprint', () => {
            if (window._savedDocTitle) {
                document.title = window._savedDocTitle;
            }
        });

        function gerarPDF() {
            window.print();
        }

        /**
         * Gera download de arquivo .doc formatado nativamente para Microsoft Word
         */
        function gerarWord() {
            const docElement = document.getElementById('a4-document-container');
            if (!docElement) return;

            // Clona o elemento para limpar botões e elementos no-print
            const clone = docElement.cloneNode(true);
            clone.querySelectorAll('.no-print').forEach(el => el.remove());

            const htmlBody = clone.innerHTML;
            const docTitle = document.getElementById('report-header-title')?.textContent || 'Relatorio_Oficial';

            const wordHtml = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head>
                    <meta charset='utf-8'>
                    <title>${escapeHtml(docTitle)}</title>
                    <!--[if gte mso 9]>
                    <xml>
                        <w:WordDocument>
                            <w:View>Print</w:View>
                            <w:Zoom>100</w:Zoom>
                            <w:DoNotOptimizeForBrowser/>
                        </w:WordDocument>
                    </xml>
                    <![endif]-->
                    <style>
                        @page Section1 {
                            size: 595.3pt 841.9pt;
                            margin: 2.0cm 2.0cm 2.0cm 2.0cm;
                            mso-header-margin: 35.4pt;
                            mso-footer-margin: 35.4pt;
                            mso-paper-source: 0;
                        }
                        div.Section1 { page: Section1; }
                        body {
                            font-family: 'Arial', sans-serif;
                            font-size: 11pt;
                            color: #111827;
                        }
                        table {
                            width: 100%;
                            border-collapse: collapse;
                            margin-bottom: 12pt;
                        }
                        th, td {
                            border: 1px solid #cbd5e1;
                            padding: 6pt;
                            font-size: 10pt;
                        }
                        th {
                            background-color: #f1f5f9;
                            font-weight: bold;
                        }
                        h1, h2, h3 {
                            color: #0f172a;
                        }
                    </style>
                </head>
                <body>
                    <div class="Section1">
                        ${htmlBody}
                    </div>
                </body>
                </html>
            `;

            const blob = new Blob(['\ufeff', wordHtml], {
                type: 'application/msword;charset=utf-8'
            });

            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${docTitle.replace(/[\s\/\\:*?"<>|]+/g, '_')}_${Date.now()}.doc`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
