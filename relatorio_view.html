        /** Valores já existentes na camada para um campo (prévia: lista de exemplo bruta; emissão real: camada de verdade, sem o filtro atual — mostra tudo que existe). */
        function valoresCampoFiltroGeral(fieldId) {
            const campo = ((reportPayload && reportPayload.formFields) || []).find(f => f.id === fieldId);
            let features = [];
            if (reportPayload && Array.isArray(reportPayload.featureListAll)) {
                features = reportPayload.featureListAll.map(p => ({ properties: p || {} }));
            } else if (reportPayload && Array.isArray(reportPayload.featureList)) {
                features = reportPayload.featureList.map(p => ({ properties: p || {} }));
            } else {
                try {
                    const opener = window.opener;
                    const themeId = reportPayload && reportPayload.themeId;
                    if (opener && !opener.closed && themeId && Array.isArray(opener.themes)) {
                        const theme = opener.themes.find(t => String(t.id) === String(themeId));
                        if (theme && Array.isArray(theme.features)) features = theme.features;
                    }
                } catch (e) { /* sem janela de origem: fica sem sugestões */ }
            }
            return LayerFilter.valoresDistintos(features, fieldId, campo);
        }

        function renderCondicaoGeralHtml(gIdx, cIdx, cond, fields) {
            const campo = (fields || []).find(f => f.id === cond.field);
            const tipo = campo ? LayerFilter.tipoDoCampo(campo) : 'texto';
            const ops = LayerFilter.operadoresValidos(tipo);
            const precisaValor = cond.op && cond.op !== 'vazio' && cond.op !== 'preenchido';
            const precisaValor2 = cond.op === 'entre';
            const listId = 'pp-vals-' + gIdx + '-' + cIdx;
            const valores = (precisaValor || precisaValor2) && cond.field ? valoresCampoFiltroGeral(cond.field) : [];
            const datalistHtml = valores.length ? `<datalist id="${listId}">${valores.map(v => `<option value="${escapeHtml(v)}">`).join('')}</datalist>` : '';
            return `
                <div style="display:flex;align-items:flex-start;gap:4px;margin-bottom:4px">
                    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
                        <select onchange="updateFiltroCondicaoGeral(${gIdx},${cIdx},'field',this.value)" style="width:100%">
                            <option value="">Campo...</option>
                            ${(fields || []).map(f => `<option value="${escapeHtml(f.id)}" ${f.id === cond.field ? 'selected' : ''}>${escapeHtml(f.label || f.name || f.id)}</option>`).join('')}
                        </select>
                        ${cond.field ? `
                        <select onchange="updateFiltroCondicaoGeral(${gIdx},${cIdx},'op',this.value)" style="width:100%">
                            <option value="">Operador...</option>
                            ${ops.map(op => `<option value="${op}" ${op === cond.op ? 'selected' : ''}>${escapeHtml(LayerFilter.rotuloOperador(op))}</option>`).join('')}
                        </select>` : ''}
                        ${precisaValor ? `<input type="text" list="${listId}" value="${escapeHtml(cond.value || '')}" oninput="updateFiltroCondicaoGeral(${gIdx},${cIdx},'value',this.value)" style="width:100%" placeholder="valor">${datalistHtml}` : ''}
                        ${precisaValor2 ? `<input type="text" list="${listId}" value="${escapeHtml(cond.value2 || '')}" oninput="updateFiltroCondicaoGeral(${gIdx},${cIdx},'value2',this.value)" style="width:100%" placeholder="e...">` : ''}
                    </div>
                    <button type="button" onclick="removeFiltroCondicaoGeral(${gIdx},${cIdx},event)" title="Remover condição" style="border:0;background:none;cursor:pointer;color:#94a3b8;flex:none">×</button>
                </div>`;
        }

        /** Linha com checkbox, no mesmo padrão visual do painel "Configurações do Mapa" (função chk() local dele). */
        function chkRowPesquisa(id, label, checked, handler) {
            return `<label class="row"><input type="checkbox" id="${id}" ${checked ? 'checked' : ''} onchange="${handler}"> ${label}</label>`;
        }

        /** Lista de colunas (checkboxes com a aba de cada campo), reaproveitada pela tabela geral e pela de cada gráfico. */
        function colunasChecklistHtml(camposList, colunasEscolhidas, origemGraficoId) {
            const esc = escapeHtml;
            if (!camposList.length) return '<div style="color:#64748b;font-style:italic">Nenhum campo disponível neste formulário.</div>';
            const origemAttr = origemGraficoId ? `, '${esc(origemGraficoId)}'` : '';
            return camposList.map(f => `
                <label class="row"><input type="checkbox" ${colunasEscolhidas.indexOf(f.id) >= 0 ? 'checked' : ''} onchange="toggleColunaTabelaGeral('${esc(f.id)}', this.checked${origemAttr})">
                    <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.label || f.name || f.id)}</span>
                    ${f.tabTitle ? `<span style="color:#94a3b8;font-size:9.5px;flex:none;margin-left:4px">${esc(f.tabTitle)}</span>` : ''}
                </label>`).join('');
        }

        /** Passos "Incluir campos na tabela" + "Gerar/Remover mapa" — reaproveitado pelo Filtro (geral) e por cada gráfico. */
        /** Ajustes de um bloco "Mapa das Feições" já ligado: título, cor, contagem, mapa base e quadriculado UTM — igual ao "Mapa Base" do Relatório Individual. A altura se ajusta arrastando a borda de baixo, direto na folha. */
        /** Ortofotos ativas no projeto (mesma fonte do mini-mapa individual), disponíveis como Mapa Base do Mapa das Feições. */
        function ortofotosDisponiveisGeral() {
            return (reportPayload && Array.isArray(reportPayload.ortofotos)) ? reportPayload.ortofotos : [];
        }

        function mapaConfigCamposHtml(blocoMapa, chave, origemArg, camposList) {
            const esc = escapeHtml;
            const campos = camposList || (reportPayload && reportPayload.formFields) || [];
            const optsCampos = (selecionado) => campos.map(f => `<option value="${esc(f.id)}" ${selecionado === f.id ? 'selected' : ''}>${esc(f.label || f.name || f.id)}</option>`).join('');
            const rotuloCampos = Array.isArray(blocoMapa.rotuloCampos) ? blocoMapa.rotuloCampos : [];
            const rotuloAbrev = blocoMapa.rotuloAbrev || {};
            const linhaRotulo = (posicao) => {
                const fid = rotuloCampos[posicao] || '';
                return `
                    <div class="row" style="gap:4px">
                        <select onchange="updateRotuloCampoMapaFeicoes(${posicao}, this.value${origemArg})" style="flex:1;min-width:0">
                            <option value="">Nenhum</option>
                            ${optsCampos(fid)}
                        </select>
                        ${fid ? `<input type="text" value="${esc(rotuloAbrev[fid] || '')}" placeholder="abreviação" title="Como esse campo aparece no rótulo (ex.: 'QD' em vez de 'Quadra'); vazio usa o nome do campo" oninput="updateRotuloAbrevMapaFeicoes('${esc(fid)}', this.value${origemArg})" style="width:76px">` : ''}
                    </div>`;
            };
            return `
                <div style="margin-top:5px">
                    <label class="row">Título<input type="text" value="${esc(blocoMapa.titulo || '')}" onchange="updateMapaFeicoesConfigGeral('titulo', this.value${origemArg})" style="flex:1;min-width:0"></label>
                    <label class="row">Cor das feições<input type="color" value="${esc(blocoMapa.cor || '#0ea5e9')}" oninput="updateMapaFeicoesConfigGeral('cor', this.value${origemArg})" style="width:34px;height:22px;padding:0;border:1px solid #cbd5e1;margin-left:auto"></label>
                    <div style="font-weight:700;margin:4px 0 2px">Mapa base</div>
                    <select onchange="updateMapaFeicoesConfigGeral('baseMap', this.value${origemArg})" style="width:100%;margin-bottom:3px">
                        <option value="osm" ${(blocoMapa.baseMap || 'osm') === 'osm' ? 'selected' : ''}>Ruas (OpenStreetMap)</option>
                        <option value="satelite" ${blocoMapa.baseMap === 'satelite' ? 'selected' : ''}>Satélite</option>
                        ${ortofotosDisponiveisGeral().length ? `<optgroup label="Ortofotos ativas no projeto">${ortofotosDisponiveisGeral().map(o => `<option value="ortofoto:${esc(o.id)}" ${blocoMapa.baseMap === 'ortofoto:' + o.id ? 'selected' : ''}>${esc(o.nome)}${o.dataTxt ? ' — ' + esc(o.dataTxt) : ''}</option>`).join('')}</optgroup>` : ''}
                    </select>
                    ${/^ortofoto:/.test(blocoMapa.baseMap || '') ? '<div style="color:#64748b;line-height:1.35;margin-bottom:3px">A ortofoto fica sobre o satélite, que preenche o que ela não cobre.</div>' : ''}
                    ${chkRowPesquisa('pp-mapa-grade-' + esc(chave), 'Quadriculado UTM', !!blocoMapa.quadriculado, `updateMapaFeicoesConfigGeral('quadriculado', this.checked${origemArg})`)}
                    ${chkRowPesquisa('pp-mapa-contagem-' + esc(chave), 'Mostrar contagem de feições em cada grupo', blocoMapa.exibirContagem !== false, `updateMapaFeicoesConfigGeral('exibirContagem', this.checked${origemArg})`)}
                    <div style="font-weight:700;margin:6px 0 2px">Aproveitamento na Folha A4</div>
                    <select onchange="updateMapaFeicoesConfigGeral('layoutPreenchimento', this.value${origemArg})" style="width:100%;margin-bottom:3px">
                        <option value="auto2" ${(blocoMapa.layoutPreenchimento || 'auto2') === 'auto2' ? 'selected' : ''}>2 mapas por folha (Preenchimento Completo)</option>
                        <option value="auto3" ${blocoMapa.layoutPreenchimento === 'auto3' ? 'selected' : ''}>3 mapas por folha (Compacto)</option>
                        <option value="auto1" ${blocoMapa.layoutPreenchimento === 'auto1' ? 'selected' : ''}>1 mapa por folha (Expandido)</option>
                        <option value="manual" ${blocoMapa.layoutPreenchimento === 'manual' ? 'selected' : ''}>Manual (${blocoMapa.alturaPx || 260}px)</option>
                    </select>
                    <div style="color:#64748b;line-height:1.35;margin-bottom:3px">Em 2 ou 3 mapas por folha, o sistema calcula a altura exata para preencher a página sem deixar vazios.</div>
                    <div style="font-weight:700;margin:6px 0 2px">Agrupar mapas por campo</div>
                    <select onchange="updateMapaFeicoesConfigGeral('agruparPorCampo', this.value || undefined${origemArg})" style="width:100%;margin-bottom:3px">
                        <option value="">Nenhum (agrupar por proximidade)</option>
                        ${optsCampos(blocoMapa.agruparPorCampo || '')}
                    </select>
                    <div style="color:#64748b;line-height:1.35;margin-bottom:3px">Ex.: escolhendo "Loteamento", cada mapa reúne só as feições de UM loteamento (um mapa por valor); acima de ${LIMITE_GRUPOS_CAMPO} valores distintos, escolha outro campo.</div>
                    <div style="font-weight:700;margin:6px 0 2px">Rótulo de cada feição no mapa (até 2 campos)</div>
                    ${linhaRotulo(0)}
                    ${linhaRotulo(1)}
                    <div style="color:#64748b;line-height:1.35;margin-bottom:3px">Ex.: "Quadra" e "Lote" abreviados para "QD"/"LT" mostram "QD A - LT 10" dentro de cada feição.</div>
                    <div style="font-weight:700;margin:6px 0 2px">Zoom dos mapas</div>
                    ${blocoMapa.zoomManual
                        ? `<div style="color:#334155">Zoom fixo: <b>${esc(String(blocoMapa.zoomManual))}</b> — os mapas adicionais cobrem o resto das feições nesse mesmo zoom. <button type="button" class="act" onclick="updateMapaFeicoesConfigGeral('zoomManual', undefined${origemArg})">Voltar ao automático</button></div>`
                        : `<div style="color:#64748b">Automático (cada mapa se ajusta ao seu grupo). Para escolher, dê zoom no 1º mapa da folha e clique em "Usar este zoom nos demais mapas".</div>`}
                    <div style="color:#64748b;line-height:1.35;margin-top:3px">A altura também pode ser ajustada arrastando a borda inferior de qualquer mapa na folha.</div>
                </div>`;
        }

        function passosTabelaMapaHtml(camposList, origemGraficoId) {
            const esc = escapeHtml;
            const blocoTabela = tabelaBlocoGeral(origemGraficoId);
            const blocoMapa = mapaBlocoGeral(origemGraficoId);
            if (!blocoTabela) return '';
            const chave = origemGraficoId || 'geral';
            const revelado = colunasReveladasPesquisa.has(chave);
            const colunas = Array.isArray(blocoTabela.colunas) ? blocoTabela.colunas : [];
            const origemArg = origemGraficoId ? `, '${esc(origemGraficoId)}'` : '';
            return `
                <div style="margin-top:8px;padding-top:8px;border-top:1px dashed #cbd5e1">
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;gap:6px">
                        <button type="button" class="act" style="flex:1" onclick="toggleColunasPesquisaGeral(${origemGraficoId ? `'${esc(origemGraficoId)}'` : ''})">${revelado ? 'Ocultar campos da tabela ▴' : 'Incluir campos na tabela ▾'}</button>
                        <select title="Densidade das linhas da tabela" onchange="updateTabelaFeicoesConfigGeral('densidade', this.value${origemArg})" style="font-size:11px;padding:3px 5px;width:auto;flex:none">
                            <option value="compacta" ${(blocoTabela.densidade || 'compacta') === 'compacta' ? 'selected' : ''}>Compacta (~36 lin/folha)</option>
                            <option value="padrao" ${blocoTabela.densidade === 'padrao' ? 'selected' : ''}>Padrão (~20 lin/folha)</option>
                        </select>
                    </div>
                    ${revelado ? `<div style="max-height:160px;overflow-y:auto;margin-top:5px">${colunasChecklistHtml(camposList, colunas, origemGraficoId)}</div>` : ''}
                </div>
                <div style="margin-top:8px;padding-top:8px;border-top:1px dashed #cbd5e1">
                    <button type="button" class="act" onclick="toggleMapaFeicoesGeral(${blocoMapa ? 'false' : 'true'}${origemArg})">${blocoMapa ? 'Remover mapa' : 'Gerar mapa'}</button>
                    ${blocoMapa ? mapaConfigCamposHtml(blocoMapa, chave, origemArg, camposList) : ''}
                </div>`;
        }

        /**
         * Tabela e mapa de UM gráfico específico: independentes entre si (gerar um não depende do outro existir) —
         * diferente do Filtro geral, onde o mapa só aparece depois da 1ª tabela (aqui o gráfico já É o "aplicar").
         */
        function passoTabelaGraficoHtml(camposList, chartId) {
            const esc = escapeHtml;
            const bloco = tabelaBlocoGeral(chartId);
            if (!bloco) return `<button type="button" class="act" onclick="gerarTabelaGeral('${esc(chartId)}')">Gerar tabela deste gráfico</button>`;
            const revelado = colunasReveladasPesquisa.has(chartId);
            const colunas = Array.isArray(bloco.colunas) ? bloco.colunas : [];
            return `
                <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:4px">
                    <button type="button" class="act" style="flex:1" onclick="toggleColunasPesquisaGeral('${esc(chartId)}')">${revelado ? 'Ocultar campos da tabela ▴' : 'Incluir campos na tabela ▾'}</button>
                    <select title="Densidade das linhas da tabela" onchange="updateTabelaFeicoesConfigGeral('densidade', this.value, '${esc(chartId)}')" style="font-size:11px;padding:3px 5px;width:auto;flex:none">
                        <option value="compacta" ${(bloco.densidade || 'compacta') === 'compacta' ? 'selected' : ''}>Compacta</option>
                        <option value="padrao" ${bloco.densidade === 'padrao' ? 'selected' : ''}>Padrão</option>
                    </select>
                </div>
                ${revelado ? `<div style="max-height:160px;overflow-y:auto;margin-top:5px">${colunasChecklistHtml(camposList, colunas, chartId)}</div>` : ''}`;
        }

        function passoMapaGraficoHtml(chartId, camposList) {
            const esc = escapeHtml;
            const blocoMapa = mapaBlocoGeral(chartId);
            return `
                <button type="button" class="act" onclick="toggleMapaFeicoesGeral(${blocoMapa ? 'false' : 'true'}, '${esc(chartId)}')">${blocoMapa ? 'Remover mapa' : 'Gerar mapa deste gráfico'}</button>
                ${blocoMapa ? mapaConfigCamposHtml(blocoMapa, chartId, `, '${esc(chartId)}'`, camposList) : ''}`;
        }

        /** Conteúdo (sanfona) do painel "Configurações da Pesquisa": filtro (com tabela/mapa geral) e gráficos (cada um com sua própria tabela/mapa). */
        function pesquisaPanelConteudoHtml(fields) {
            const esc = escapeHtml;
            const secH = (id) => (pesquisaSecaoAberta === id ? 'open' : '');
            const secD = (id) => (pesquisaSecaoAberta === id ? 'block' : 'none');
            const camposList = fields || (reportPayload && reportPayload.formFields) || [];
            const catalogo = (reportPayload && reportPayload.charts) || [];
            const filtro = garantirFiltroGeral();
            const blocoTabela = tabelaBlocoGeral();

            const gruposHtml = filtro.grupos.length ? filtro.grupos.map((g, gIdx) => `
                <div class="mp-inner-card filtro-grupo-card" style="border:1px solid #fed7aa;border-radius:8px;padding:6px;margin-bottom:6px;background:#fff7ed">
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
                        <span style="font-weight:700;color:#ea580c;font-size:10.5px;text-transform:uppercase">Grupo ${gIdx + 1}${gIdx > 0 ? ' <span style="font-weight:400;text-transform:none;color:#94a3b8">(ou)</span>' : ''}</span>
                        <button type="button" onclick="removeFiltroGrupoGeral(${gIdx}, event)" title="Remover grupo" style="border:0;background:none;cursor:pointer;color:#94a3b8;font-size:14px;line-height:1">×</button>
                    </div>
                    ${(g.condicoes || []).map((c, cIdx) => renderCondicaoGeralHtml(gIdx, cIdx, c, camposList)).join('')}
                    <button type="button" class="act" onclick="addFiltroCondicaoGeral(${gIdx})" style="padding:4px;font-size:10px;margin-top:2px">+ condição (e)</button>
                </div>`).join('') : '<div style="color:#64748b;font-style:italic;margin-bottom:5px">Sem filtro: considera todas as feições da camada.</div>';

            // contagem AO VIVO (sem precisar redesenhar a folha) do rascunho atual do filtro, para decidir se já aplica
            const filtroLimpo = LayerFilter.normalizeFiltro(filtro);
            const temFiltroAtivo = !LayerFilter.filtroVazio(filtroLimpo);
            const totalFiltrado = resolveFeatureListFull().length;
            const contagemHtml = `<div style="color:#64748b;margin:6px 0 4px">${totalFiltrado} feiç${totalFiltrado === 1 ? 'ão casa' : 'ões casam'} com o filtro atual${temFiltroAtivo ? '' : ' (sem filtro: todas)'}.</div>`;

            // cada gráfico marcado vira seu próprio card, com o passo a passo de tabela/mapa dedicados a ele
            const graficosHtml = catalogo.length ? catalogo.map(g => {
                const marcado = !!graficoBlocoPara(g.id);
                if (!marcado) {
                    return `<label class="row"><input type="checkbox" onchange="toggleGraficoEscolhidoGeral('${esc(g.id)}', this.checked)"> <span>${esc(g.title || g.fieldLabel || 'Gráfico')}</span></label>`;
                }
                return `
                    <div class="mp-inner-card grafico-card" style="border:1px solid #fecdd3;border-radius:8px;padding:6px;margin-bottom:6px;background:#fff1f2">
                        <label class="row" style="font-weight:700"><input type="checkbox" checked onchange="toggleGraficoEscolhidoGeral('${esc(g.id)}', this.checked)"> <span>${esc(g.title || g.fieldLabel || 'Gráfico')}</span></label>
                        <div style="margin:5px 0 0 16px;padding-left:8px;border-left:2px solid rgba(244,63,94,0.4)">
                            <div style="margin-bottom:6px">${passoTabelaGraficoHtml(camposList, g.id)}</div>
                            <div>${passoMapaGraficoHtml(g.id, camposList)}</div>
                        </div>
                    </div>`;
            }).join('') : '<div style="color:#64748b;font-style:italic">Nenhum gráfico configurado nas Estatísticas desta camada.</div>';

            const temKpis = !!kpisBlocoGeral();
            const margemTipoAtual = (tplAtual && tplAtual.config_pagina && tplAtual.config_pagina.margens_tipo) || 'padrao';

            return `
                <h4 data-sec-h="filtro" class="${secH('filtro')}" onclick="pesquisaPanelSecao('filtro')">Filtro de feições<span class="chev">&#9662;</span></h4>
                <div data-sec="filtro" class="sec-body" style="display:${secD('filtro')}">
                    ${gruposHtml}
                    <button type="button" class="act" onclick="addFiltroGrupoGeral()">+ grupo (ou)</button>
                    ${contagemHtml}
                    <button type="button" class="act primary" onclick="aplicarFiltroGeral()">${blocoTabela ? 'Aplicar filtro (atualizar tabela)' : 'Aplicar filtro'}</button>
                    ${passosTabelaMapaHtml(camposList, undefined)}
                    <div style="margin-top:8px;padding-top:8px;border-top:1px dashed rgba(255,255,255,0.12)">
                        <label class="row" style="cursor:pointer">
                            <input type="checkbox" ${temKpis ? 'checked' : ''} onchange="toggleKpisGeral(this.checked)">
                            <span>Indicadores consolidados (KPIs)</span>
                        </label>
                    </div>
                    ${filtro.grupos.length ? `<div style="margin-top:8px;padding-top:8px;border-top:1px dashed #cbd5e1"><button type="button" class="act" onclick="limparFiltroGeral()">Limpar filtro</button></div>` : ''}
                </div>
                <h4 data-sec-h="graficos" class="${secH('graficos')}" onclick="pesquisaPanelSecao('graficos')">Gráficos do dashboard<span class="chev">&#9662;</span></h4>
                <div data-sec="graficos" class="sec-body" style="display:${secD('graficos')}">
                    <div style="color:#64748b;line-height:1.35;margin-bottom:5px">Cada gráfico marcado vira um card à parte na folha (pode ser arrastado sozinho). Dentro dele: tabela e mapa próprios, com colunas à sua escolha.</div>
                    ${graficosHtml}
                </div>
                <h4 data-sec-h="layout" class="${secH('layout')}" onclick="pesquisaPanelSecao('layout')">Diagramação e Folha A4<span class="chev">&#9662;</span></h4>
                <div data-sec="layout" class="sec-body" style="display:${secD('layout')}">
                    <div style="font-weight:700;margin-bottom:3px">Margens da folha</div>
                    <select onchange="updateMargensGeral(this.value)" style="width:100%;margin-bottom:4px">
                        <option value="padrao" ${margemTipoAtual === 'padrao' ? 'selected' : ''}>Padrão (15 mm em todas as bordas)</option>
                        <option value="moderada" ${margemTipoAtual === 'moderada' ? 'selected' : ''}>Moderada (10 mm - mais espaço)</option>
                        <option value="estreita" ${margemTipoAtual === 'estreita' ? 'selected' : ''}>Estreita (8 mm - aproveitamento total)</option>
                    </select>
                    <div style="color:#64748b;font-size:11px;line-height:1.35;margin-bottom:4px">Margens menores liberam altura vertical e largura para mais feições e mapas por página.</div>
                </div>
                <div style="padding:10px 0 2px">
                    <div style="display:flex;gap:6px">
                        <button type="button" class="act primary" onclick="salvarPesquisaGeral()">Salvar ajustes</button>
                        <button type="button" class="act" onclick="restaurarPesquisaGeral()">Restaurar</button>
                    </div>
                    <div class="pesquisa-status" id="pesquisa-panel-status">${esc(statusPesquisaGeral)}</div>
                    <div style="color:#94a3b8;line-height:1.3;margin-top:2px">Salva por cima deste relatório. Para uma pesquisa nova, crie outro modelo no construtor.</div>
                </div>`;
        }

        /** Cria (ou atualiza) o painel "Configurações da Pesquisa" — ancorado na coluna lateral dark, some fora do Relatório Geral. */
        function renderPainelPesquisaGeral(fields) {
            if (!tplAtual || tplAtual.tipo !== 'geral') {
                const p = document.getElementById('pesquisa-tools-panel');
                const t = document.getElementById('pesquisa-tools-toggle');
                if (p) p.remove();
                if (t) t.remove();
                return;
            }
            let panel = document.getElementById('pesquisa-tools-panel');
            let toggle = document.getElementById('pesquisa-tools-toggle');
            if (!panel) {
                const sidebar = document.getElementById('map-sidebar-column');
                panel = document.createElement('div');
                panel.id = 'pesquisa-tools-panel';
                panel.className = 'no-print';
                if (sidebar) sidebar.appendChild(panel);
                else document.body.appendChild(panel);
                toggle = document.createElement('button');
                toggle.id = 'pesquisa-tools-toggle';
                toggle.type = 'button';
                toggle.className = 'no-print';
                toggle.textContent = 'Pesquisa';
                toggle.onclick = () => { pesquisaPanelOpen = true; applyPesquisaPanelVisibility(); };
                document.body.appendChild(toggle);
            }
            panel.innerHTML = `
                <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #e2e8f0" class="panel-header">
                    <strong style="font-size:13px" class="panel-header-title">Configurações da Pesquisa</strong>
                    <button type="button" onclick="pesquisaPanelHide()" style="border:0;background:none;cursor:pointer;font-size:16px;line-height:1;color:inherit" title="Recolher">×</button>
                </div>
                <div style="padding:0 12px 12px">${pesquisaPanelConteudoHtml(fields)}</div>`;
            // botão flutuante avisa "filtro ativo" mesmo com o painel fechado, pra não passar despercebido
            const totalComFiltro = resolveFeatureListFull().length;
            const filtroAtivoBotao = typeof ultimoTotalSemFiltroGeral === 'number' && ultimoTotalSemFiltroGeral !== totalComFiltro;
            toggle.textContent = filtroAtivoBotao ? `Pesquisa • filtro ativo (${totalComFiltro}/${ultimoTotalSemFiltroGeral})` : 'Pesquisa';
            if (pesquisaPanelOpen === null) pesquisaPanelOpen = window.innerWidth >= 1360;
            applyPesquisaPanelVisibility();
        }

        function applyPesquisaPanelVisibility() {
            const panel = document.getElementById('pesquisa-tools-panel');
            const toggle = document.getElementById('pesquisa-tools-toggle');
            const sidebar = document.getElementById('map-sidebar-column');
            if (panel) panel.style.display = pesquisaPanelOpen ? 'block' : 'none';
            if (toggle) toggle.style.display = pesquisaPanelOpen ? 'none' : 'block';
            if (sidebar) sidebar.style.display = pesquisaPanelOpen ? '' : 'none';
        }

        function pesquisaPanelHide() { pesquisaPanelOpen = false; applyPesquisaPanelVisibility(); }

        function pesquisaPanelSecao(id) {
            pesquisaSecaoAberta = pesquisaSecaoAberta === id ? null : id;
            renderPainelPesquisaGeral();
        }

        /** Descarta as edições ainda não salvas do painel, voltando ao que está gravado (tplSalvoSnapshot). */
        function restaurarPesquisaGeral() {
            if (!tplSalvoSnapshot) return;
            tplAtual.filtro = JSON.parse(JSON.stringify(tplSalvoSnapshot.filtro || { grupos: [] }));
            tplAtual.blocos = JSON.parse(JSON.stringify(tplSalvoSnapshot.blocos || []));
            if (tplSalvoSnapshot.config_pagina) tplAtual.config_pagina = JSON.parse(JSON.stringify(tplSalvoSnapshot.config_pagina));
            statusPesquisaGeral = 'Ajustes restaurados (não salvos ainda eram descartados).';
            desenharRelatorio();
        }

        /** Persiste o filtro/gráficos/tabela/mapa editados (opener + LocalStorage, como o modelo de relatórios) e redesenha a folha. */
        async function salvarPesquisaGeral() {
            if (!tplAtual) return;
            if (!tplAtual.id) tplAtual.id = (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : 'rpt_' + Math.random().toString(36).substr(2, 9);
            try {
                let all = [];
                try { all = JSON.parse(localStorage.getItem('constructive_report_templates') || '[]'); } catch (e) {}
                const idx = all.findIndex(t => t.id === tplAtual.id);
                if (idx >= 0) all[idx] = tplAtual; else all.push(tplAtual);
                localStorage.setItem('constructive_report_templates', JSON.stringify(all));
            } catch (e) { /* segue tentando pelo opener */ }
            const adapter = getOpenerAdapter();
            let remoto = false;
            if (adapter && typeof adapter.saveReportTemplate === 'function') {
                try { await adapter.saveReportTemplate(tplAtual); remoto = true; } catch (e) { /* já ficou salvo localmente */ }
            }
            statusPesquisaGeral = remoto ? 'Ajustes salvos.' : 'Ajustes salvos neste navegador (servidor indisponível).';
            tplSalvoSnapshot = JSON.parse(JSON.stringify(tplAtual)); // "Restaurar" passa a voltar para ESTE ponto
            desenharRelatorio();
        }

        /** Aplica o rascunho atual (filtro, gráficos, tabela, mapa) na folha, sem gravar ainda — só para o usuário ver o resultado. */
        function aplicarPesquisaGeral() {
            if (!tplAtual) return;
            desenharRelatorio();
        }

        /** "Aplicar filtro": garante que exista uma tabela (a "primeira tabela" do filtro) e mostra o resultado na folha. */
        function aplicarFiltroGeral() {
            if (!tplAtual) return;
            gerarTabelaGeral(); // "primeira tabela" do filtro (geral, sem origemGraficoId)
        }

        /** Mostra/esconde a lista de campos de "Incluir campos na tabela" (só estado de tela, não é salvo). chave: 'geral' ou o id do gráfico. */
        function toggleColunasPesquisaGeral(origemGraficoId) {
            const chave = origemGraficoId || 'geral';
            if (colunasReveladasPesquisa.has(chave)) colunasReveladasPesquisa.delete(chave); else colunasReveladasPesquisa.add(chave);
            renderPainelPesquisaGeral();
        }

        /**
         * Bloco "Painel de Indicadores" (KPIs do Relatório Geral):
         * Calcula métricas 100% reais sobre o conjunto de feições ativas (resolveFeatureListFull()):
         * - Total de feições (e proporção do filtro em relação ao total da camada)
         * - Área somada real e área média real (a partir da geometria poligonal via Turf ou atributo cadastral)
         * - Extensão linear real (para feições lineares)
         * - Totais numéricos reais (se a camada contiver campos como orçamento, valor, área)
         * - Categoria predominante real (do catálogo de gráficos da camada)
         */
        function renderKpisBlock(bloco, idx) {
            const esc = escapeHtml;
            const tituloBase = (esc(bloco.titulo || 'Indicadores Territoriais & Cadastrais')).replace(/\r?\n/g, '<br>');
            const features = resolveFeatureListFull();
            const totalFiltrado = features.length;
            const totalCamada = typeof ultimoTotalSemFiltroGeral === 'number' ? ultimoTotalSemFiltroGeral : totalFiltrado;
            const comFiltro = totalCamada > 0 && totalFiltrado !== totalCamada;
            const pctFiltrado = totalCamada > 0 ? (totalFiltrado / totalCamada * 100) : 100;

            if (totalFiltrado === 0) {
                return `
                    <div class="mb-4 page-break-avoid">
                        <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2.5">
                            <span class="whitespace-pre-line">${tituloBase}</span>
                        </div>
                        <div class="p-4 text-center text-slate-400 italic text-xs border border-dashed border-slate-300 rounded-lg bg-slate-50/60">Nenhuma feição encontrada para calcular indicadores.</div>
                    </div>`;
            }

            // 1. Cálculo real de Áreas (polígonos) e Extensões (linhas)
            let areaTotalM2 = 0;
            let feicoesComArea = 0;
            let compTotalKm = 0;
            let feicoesComLinha = 0;

            features.forEach(f => {
                let a = 0;
                if (f && f.geometry) {
                    const gType = f.geometry.type;
                    if (gType === 'Polygon' || gType === 'MultiPolygon') {
                        try {
                            if (typeof turf !== 'undefined' && turf.area) {
                                a = turf.area(f.geometry);
                            }
                        } catch (e) {}
                    } else if (gType === 'LineString' || gType === 'MultiLineString') {
                        try {
                            if (typeof turf !== 'undefined' && turf.length) {
                                const km = turf.length(f.geometry, { units: 'kilometers' });
                                if (km > 0) {
                                    compTotalKm += km;
                                    feicoesComLinha++;
                                }
                            }
                        } catch (e) {}
                    }
                }
                // Se a geometria não deu área, checa atributos cadastrais de área
                if (!a && f && f.properties) {
                    const p = f.properties;
                    const valArea = p['area_m2'] || p['area'] || p['area_lote'] || p['area_terreno'] || p['area_construida'];
                    if (valArea != null) {
                        const num = typeof valArea === 'number' ? valArea : parseFloat(String(valArea).replace(/\./g, '').replace(',', '.').replace(/[^\d.-]/g, ''));
                        if (!isNaN(num) && num > 0) a = num;
                    }
                }
                if (a > 0) {
                    areaTotalM2 += a;
                    feicoesComArea++;
                }
            });

            // 2. Busca campos numéricos financeiros/quantitativos adicionais no schema
            const campos = (reportPayload && reportPayload.formFields) || [];
            let campoExtraNumerico = null;
            let aggExtraNumerico = null;
            const camposNum = campos.filter(c => ['currency', 'moeda', 'number', 'volume_m3'].includes(String(c.type || '').toLowerCase()));
            for (const c of camposNum) {
                const a = agregacaoNumericaCampo(c.id);
                if (a && a.soma > 0) {
                    campoExtraNumerico = c;
                    aggExtraNumerico = a;
                    break;
                }
            }

            // 3. Monta a lista de cards reais
            const cards = [];

            // Card 1: Quantidade de Feições
            cards.push(`
                <div class="p-3 border border-slate-200 rounded-lg bg-white shadow-2xs flex flex-col justify-between">
                    <div>
                        <div class="text-[9px] uppercase font-bold text-slate-500 tracking-wider">Total de Feições</div>
                        <div class="text-xl font-black text-slate-900 mt-1">${MapTools.fmtNumber(totalFiltrado, 0)}</div>
                    </div>
                    <div class="text-[10px] mt-2 font-medium">
                        ${comFiltro
                            ? `<span class="text-amber-600 font-semibold">${pctFiltrado.toFixed(1)}% da camada</span> <span class="text-slate-400">(${totalCamada} total)</span>`
                            : `<span class="text-emerald-600 font-semibold">100% da camada ativa</span>`}
                    </div>
                </div>`);

            // Card 2 & 3: Área Total e Média (se houver polígonos/área real)
            if (feicoesComArea > 0 && areaTotalM2 > 0) {
                const areaMediaM2 = areaTotalM2 / feicoesComArea;
                const areaHa = areaTotalM2 / 10000;
                cards.push(`
                    <div class="p-3 border border-slate-200 rounded-lg bg-white shadow-2xs flex flex-col justify-between">
                        <div>
                            <div class="text-[9px] uppercase font-bold text-slate-500 tracking-wider">Área Total Delimitada</div>
                            <div class="text-xl font-black text-slate-900 mt-1">${areaTotalM2 >= 10000 ? `${MapTools.fmtNumber(areaHa, 2)} ha` : `${MapTools.fmtNumber(areaTotalM2, 2)} m²`}</div>
                        </div>
                        <div class="text-[10px] text-slate-500 mt-2 font-medium">
                            ${areaTotalM2 >= 10000 ? `${MapTools.fmtNumber(areaTotalM2, 2)} m² somados` : `Em ${feicoesComArea} polígono${feicoesComArea > 1 ? 's' : ''}`}
                        </div>
                    </div>`);

                cards.push(`
                    <div class="p-3 border border-slate-200 rounded-lg bg-white shadow-2xs flex flex-col justify-between">
                        <div>
                            <div class="text-[9px] uppercase font-bold text-slate-500 tracking-wider">Área Média</div>
                            <div class="text-xl font-black text-slate-900 mt-1">${MapTools.fmtNumber(areaMediaM2, 2)} m²</div>
                        </div>
                        <div class="text-[10px] text-slate-500 mt-2 font-medium">
                            Por feição analisada
                        </div>
                    </div>`);
            } else if (feicoesComLinha > 0 && compTotalKm > 0) {
                // Se for linear: Extensão Total
                cards.push(`
                    <div class="p-3 border border-slate-200 rounded-lg bg-white shadow-2xs flex flex-col justify-between">
                        <div>
                            <div class="text-[9px] uppercase font-bold text-slate-500 tracking-wider">Extensão Total</div>
                            <div class="text-xl font-black text-slate-900 mt-1">${MapTools.fmtNumber(compTotalKm, 2)} km</div>
                        </div>
                        <div class="text-[10px] text-slate-500 mt-2 font-medium">
                            ${MapTools.fmtNumber(compTotalKm * 1000, 0)} metros lineares
                        </div>
                    </div>`);
            }

            // Card 4: Agregação Financeira/Numérica real ou Primeiro Gráfico do Catálogo
            if (campoExtraNumerico && aggExtraNumerico) {
                const ehMoeda = ['currency', 'moeda'].includes(String(campoExtraNumerico.type || '').toLowerCase());
                const prefix = ehMoeda ? 'R$ ' : '';
                cards.push(`
                    <div class="p-3 border border-slate-200 rounded-lg bg-white shadow-2xs flex flex-col justify-between">
                        <div>
                            <div class="text-[9px] uppercase font-bold text-slate-500 tracking-wider truncate" title="${esc(campoExtraNumerico.label || campoExtraNumerico.name)}">${esc(campoExtraNumerico.label || campoExtraNumerico.name)}</div>
                            <div class="text-xl font-black text-slate-900 mt-1">${prefix}${MapTools.fmtNumber(aggExtraNumerico.soma, 2)}</div>
                        </div>
                        <div class="text-[10px] text-slate-500 mt-2 font-medium">
                            Média: ${prefix}${MapTools.fmtNumber(aggExtraNumerico.media, 2)}
                        </div>
                    </div>`);
            } else {
                // Se não houver campo financeiro, verifica o primeiro gráfico do catálogo para mostrar a categoria líder
                const catalogo = (reportPayload && Array.isArray(reportPayload.charts)) ? reportPayload.charts : [];
                if (catalogo.length > 0) {
                    const g = catalogo[0];
                    const agg = aggregateChart(g);
                    if (agg.labels.length > 0 && agg.total > 0) {
                        const topLabel = agg.labels[0];
                        const topCount = agg.data[0];
                        const topPct = (topCount / agg.total * 100).toFixed(1);
                        cards.push(`
                            <div class="p-3 border border-slate-200 rounded-lg bg-white shadow-2xs flex flex-col justify-between">
                                <div>
                                    <div class="text-[9px] uppercase font-bold text-slate-500 tracking-wider truncate" title="${esc(g.title || g.fieldLabel || 'Predominância')}">${esc(g.title || g.fieldLabel || 'Categoria Líder')}</div>
                                    <div class="text-base font-black text-slate-900 mt-1 truncate" title="${esc(topLabel)}">${esc(topLabel)}</div>
                                </div>
                                <div class="text-[10px] text-slate-500 mt-2 font-medium">
                                    <span class="font-bold text-slate-800">${topCount} feições</span> (${topPct}%)
                                </div>
                            </div>`);
                    }
                }
            }

            const colCount = Math.min(4, Math.max(1, cards.length));
            const gridColsClass = colCount === 4 ? 'grid-cols-2 sm:grid-cols-4' : (colCount === 3 ? 'grid-cols-3' : (colCount === 2 ? 'grid-cols-2' : 'grid-cols-1'));

            return `
                <div class="mb-4 page-break-avoid">
                    <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2.5 flex items-center justify-between">
                        <span class="whitespace-pre-line">${tituloBase}</span>
                        <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold tracking-wide bg-slate-100 text-slate-700 border border-slate-200 uppercase">
                            INDICADORES CONSOLIDADOS
                        </span>
                    </div>
                    <div class="grid ${gridColsClass} gap-3">
                        ${cards.join('')}
                    </div>
                </div>`;
        }

        /** Proporções inteligentes por tipo de campo caso o usuário não tenha arrastado larguras manuais */
        function calcularLargurasColunasPadrao(columns) {
            if (!columns || !columns.length) return {};
            const pesos = columns.map(c => {
                const id = (c.id || '').toLowerCase();
                const lbl = (c.label || '').toLowerCase();
                if (/(^|[_ ])(quadra|lote|faces?|setor|distrito|uf|num|n°|nº|seq|fid)($|[_ ])/i.test(id) ||
                    /(^|[_ ])(quadra|lote|faces?|setor|distrito|uf|n°|nº|número)($|[_ ])/i.test(lbl)) {
                    return 0.55;
                }
                if (/(cpf|cnpj|bairro|cep|data|valor|area|área|zoneamento|telefone|situacao|sit)/i.test(id) ||
                    /(cpf|cnpj|bairro|cep|data|valor|área|zoneamento|telefone|situação)/i.test(lbl)) {
                    return 1.1;
                }
                if (/(propriet|nome|titular|enderec|lograd|observ|parecer|descri)/i.test(id) ||
                    /(propriet|nome|titular|endereç|lograd|observ|parecer|descri)/i.test(lbl)) {
                    return 2.0;
                }
                return 1.0;
            });
            const pesoTotal = pesos.reduce((a, b) => a + b, 0);
            const lgs = {};
            columns.forEach((c, i) => {
                lgs[c.id] = Number(((pesos[i] / pesoTotal) * 94).toFixed(2));
            });
            return lgs;
        }

        /**
         * Bloco "Tabela de Feições" (Relatório Geral): uma linha por feição que passou pelo filtro, com as colunas
         * escolhidas no construtor. Divisível entre folhas, como o Quadro Sintético do relatório individual.
         */
        function renderTabelaFeicoesBlock(bloco) {
            const colunas = Array.isArray(bloco.colunas) ? bloco.colunas : [];
            const tituloBase = (escapeHtml(bloco.titulo || 'Feições da Camada')).replace(/\r?\n/g, '<br>');
            if (!colunas.length) {
                return `
                    <div class="mb-4 page-break-avoid">
                        <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2.5"><span class="whitespace-pre-line">${tituloBase}</span></div>
                        <div class="p-4 text-center text-slate-400 italic text-xs border border-dashed border-slate-300 rounded-lg bg-slate-50/60">Nenhuma coluna escolhida. Escolha os campos no construtor (card "Tabela de Feições").</div>
                    </div>`;
            }
            const registros = resolveFeatureList();
            if (!registros.length) {
                return `
                    <div class="mb-4 page-break-avoid">
                        <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2.5"><span class="whitespace-pre-line">${tituloBase}</span></div>
                        <div class="p-4 text-center text-slate-400 italic text-xs border border-dashed border-slate-300 rounded-lg bg-slate-50/60">Nenhuma feição casa com o filtro escolhido.</div>
                    </div>`;
            }
            const fieldIndex = {};
            (reportPayload.formFields || []).forEach(f => { if (f && f.id) fieldIndex[f.id] = f; });
            const cols = colunas.map(id => ({ id: id, campo: fieldIndex[id], label: (fieldIndex[id] && (fieldIndex[id].label || fieldIndex[id].name)) || id }));
            const densidade = bloco.densidade || 'compacta';
            const isCompacta = densidade === 'compacta';
            const pyTd = isCompacta ? 'py-1 px-1.5 tf-compact-td' : 'py-1.5 px-2 tf-padrao-td';
            const textTd = isCompacta ? 'text-[9px] leading-snug' : 'text-[10px] leading-normal';
            const pyTh = isCompacta ? 'py-1 px-1.5 tf-compact-th' : 'py-1.5 px-2 tf-padrao-th';
            const textTh = isCompacta ? 'text-[9px] leading-snug' : 'text-[9.5px] leading-normal';
            const larguras = bloco.larguras || {};
            const largurasPadrao = calcularLargurasColunasPadrao(cols);
            const larguraPadrao = cols.length ? (94 / cols.length) : 94; // fallback uniforme
            const colgroupHtml = `<colgroup><col style="width:34px">${cols.map(c => `<col data-field-id="${escapeHtml(c.id)}" style="width:${(larguras[c.id] || largurasPadrao[c.id] || larguraPadrao).toFixed(2)}%">`).join('')}</colgroup>`;
            const rowsHtml = registros.map((props, i) => `
                <tr data-split-row class="${i % 2 === 1 ? 'bg-slate-50/70' : 'bg-white'}" style="page-break-inside: avoid;">
                    <td class="${pyTd} ${textTd} border-r border-slate-200 text-center font-mono text-slate-400">${i + 1}</td>
                    ${cols.map(c => `<td class="${pyTd} ${textTd} border-r last:border-r-0 border-slate-200 whitespace-normal break-words text-slate-700">${escapeHtml(FieldFormatter.toText(props[c.id], c.campo))}</td>`).join('')}
                </tr>`);
            const theadHtml = `<thead><tr class="bg-slate-100 border-b-2 border-slate-300 text-slate-700">
                <th class="${pyTh} ${textTh} font-bold uppercase border-r border-slate-200 text-center">#</th>
                ${cols.map(c => `<th class="relative ${pyTh} ${textTh} font-bold uppercase border-r last:border-r-0 border-slate-200 whitespace-normal break-words">${escapeHtml(c.label)}<div class="tf-col-resize no-print" data-bloco-id="${escapeHtml(bloco.id)}" data-field-id="${escapeHtml(c.id)}" title="Arraste para ajustar a largura da coluna"></div></th>`).join('')}
            </tr></thead>`;
            const meta = `${registros.length} feiç${registros.length === 1 ? 'ão' : 'ões'}${featureListTruncada ? ' (mostrando as primeiras)' : ''}`;
            const chunkHtml = (rows, isFirst) => `
                <div class="mb-3">
                    <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2 flex items-center justify-between">
                        <span class="whitespace-pre-line">${tituloBase}${isFirst ? '' : ' (continuação)'}</span>
                        <span class="text-[10px] font-mono text-slate-500 normal-case">${escapeHtml(meta)}</span>
                    </div>
                    <div class="border border-slate-200 rounded-lg overflow-hidden shadow-2xs">
                        <table class="w-full text-left border-collapse" style="table-layout:fixed" data-tf-bloco-id="${escapeHtml(bloco.id)}">${colgroupHtml}${theadHtml}<tbody class="divide-y divide-slate-200">${rows.join('')}</tbody></table>
                    </div>
                </div>`;
            return { split: { rowsHtml, chunkHtml } };
        }

        /** Nova largura (%) de uma coluna da Tabela de Feições após arrastar — mesma ideia de larguraPorArrasto (campos da Grade). */
        function larguraColunaPorArrasto(larguraInicialPx, deslocamentoPx, larguraTabelaPx) {
            if (!(larguraTabelaPx > 0)) return 50;
            const px = Math.max(24, larguraInicialPx + deslocamentoPx);
            return Math.max(4, Math.min(75, Math.round((px / larguraTabelaPx) * 10000) / 100));
        }

        /** Arrastar a alça no canto de um cabeçalho de coluna muda a largura dela (table-layout:fixed reajusta as demais). */
        function ligarRedimensionarTabelaFeicoes() {
            document.querySelectorAll('.tf-col-resize').forEach(alca => {
                if (alca._ligada) return;
                alca._ligada = true;
                alca.addEventListener('mousedown', (ev) => {
                    ev.preventDefault(); ev.stopPropagation();
                    const blocoId = alca.getAttribute('data-bloco-id');
                    const fieldId = alca.getAttribute('data-field-id');
                    const th = alca.closest('th');
                    const tabela = th ? th.closest('table') : null;
                    if (!tabela) return;
                    const larguraTabela = tabela.getBoundingClientRect().width;
                    const wInicial = th.getBoundingClientRect().width;
                    const x0 = ev.clientX;
                    let pctFinal = null;
                    const mover = (e) => {
                        pctFinal = larguraColunaPorArrasto(wInicial, e.clientX - x0, larguraTabela);
                        document.querySelectorAll(`table[data-tf-bloco-id="${blocoId}"] col[data-field-id="${fieldId}"]`).forEach(col => {
                            col.style.width = pctFinal.toFixed(2) + '%';
                        });
                    };
                    const soltar = () => {
                        document.removeEventListener('mousemove', mover);
                        document.removeEventListener('mouseup', soltar);
                        if (pctFinal === null || !tplAtual) return;
                        const bloco = (tplAtual.blocos || []).find(b => b.id === blocoId);
                        if (!bloco) return;
                        if (!bloco.larguras) bloco.larguras = {};
                        bloco.larguras[fieldId] = Number(pctFinal.toFixed(2));
                    };
                    document.addEventListener('mousemove', mover);
                    document.addEventListener('mouseup', soltar);
                });
            });
        }

        // =====================================================================================
        // MAPA DAS FEIÇÕES (Relatório Geral): um mini-mapa Leaflet por grupo de feições próximas entre si.
        // Só existe se o usuário ligar o card no construtor (é o mais pesado de montar); com muitas feições
        // filtradas, pede para refinar o filtro em vez de tentar montar dezenas de mapas.
        // =====================================================================================
        const LIMITE_FEICOES_MAPA = 200; // acima disso, pede para refinar o filtro em vez de montar os mini-mapas
        const ALVO_POR_MAPA = 40;        // quantas feições cabem, em média, num mini-mapa antes de abrir outro (legibilidade)
        const LIMITE_MAPAS_ZOOM_FIXO = 60; // com zoom manual, o sistema "ladrilha" a área — acima disso, pede pra diminuir o zoom
        const LIMITE_GRUPOS_CAMPO = 60;  // agrupando por campo (ex.: Loteamento), acima disso pede pra escolher outro campo
        let mapaFeicoesInstances = {};

        /**
         * Agrupa registros (índices) pelo VALOR de um campo — um grupo por valor distinto (ex.: um mapa por
         * Loteamento), em vez de por proximidade geográfica. Vazio/"não informado" sempre por último.
         * @param {Array<string|undefined>} valores um valor por registro, na mesma ordem/índice dos registros
         * @returns {Array<{valor:string, idxs:number[]}>}
         */
        function agruparPorValorCampoMapaFeicoes(valores) {
            const grupos = new Map();
            (valores || []).forEach((v, i) => {
                const chave = (v === undefined || v === null || String(v).trim() === '') ? '' : String(v);
                if (!grupos.has(chave)) grupos.set(chave, []);
                grupos.get(chave).push(i);
            });
            const chaves = Array.from(grupos.keys()).sort((a, b) => {
                if (a === '' || b === '') return a === b ? 0 : (a === '' ? 1 : -1); // vazio por último
                return a.localeCompare(b, 'pt-BR', { sensitivity: 'base', numeric: true });
            });
            return chaves.map(chave => ({ valor: chave === '' ? 'Não informado' : chave, idxs: grupos.get(chave) }));
        }

        function renderMapaFeicoesBlock(bloco, idx) {
            const tituloBase = (escapeHtml(bloco.titulo || 'Mapa das Feições')).replace(/\r?\n/g, '<br>');
            const avisoHtml = (msg) => `
                <div class="mb-4 page-break-avoid">
                    <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2.5"><span class="whitespace-pre-line">${tituloBase}</span></div>
                    <div class="p-4 text-center text-xs border border-dashed rounded-lg ${msg.aviso ? 'text-amber-800 bg-amber-50 border-amber-300' : 'text-slate-400 italic bg-slate-50/60 border-slate-300'}">${msg.texto}</div>
                </div>`;
            const todos = resolveFeatureListFull();
            if (!todos.length) {
                return avisoHtml({ aviso: false, texto: 'Nenhuma feição passou pelo filtro escolhido.' });
            }
            const registros = todos.filter(r => r.geometry);
            if (!registros.length) {
                return avisoHtml({ aviso: false, texto: reportPayload.preview ? 'A prévia com dados de exemplo não tem coordenadas para desenhar o mapa; ele aparece na emissão real, com a camada de verdade.' : 'Nenhuma das feições filtradas tem geometria para desenhar no mapa.' });
            }
            const campoAgrupador = bloco.agruparPorCampo ? ((reportPayload.formFields || []).find(f => f.id === bloco.agruparPorCampo) || { id: bloco.agruparPorCampo, label: bloco.agruparPorCampo }) : null;
            // sem agrupar por campo, o TOTAL de feições é o que decide se vale a pena montar os mini-mapas; agrupando
            // por campo, o que importa é quantos MAPAS (valores distintos) vão sair, não o total (checado mais abaixo)
            if (!campoAgrupador && registros.length > LIMITE_FEICOES_MAPA) {
                return avisoHtml({ aviso: true, texto: `${registros.length} feições passaram pelo filtro — acima do limite de ${LIMITE_FEICOES_MAPA} para o mapa. Refine o filtro para gerar os mini-mapas (a tabela e os gráficos continuam mostrando todas).` });
            }
            const cor = bloco.cor || '#0ea5e9';
            const exibirContagem = bloco.exibirContagem !== false;
            const baseMap = /^ortofoto:/.test(bloco.baseMap || '') ? bloco.baseMap : (bloco.baseMap === 'satelite' ? 'satelite' : 'osm');
            const layoutPreenchimento = bloco.layoutPreenchimento || 'auto2';
            let alturaPx = Number(bloco.alturaPx) || 260;

            // Preenchimento dinâmico inteligente da folha A4 para eliminar vazios
            if (layoutPreenchimento === 'auto2' || layoutPreenchimento === 'auto3' || layoutPreenchimento === 'auto1') {
                const pd = PageSize.dims(tplAtual && tplAtual.config_pagina);
                const mm = (tplAtual && tplAtual.config_pagina && tplAtual.config_pagina.margens_mm) || { top: 15, bottom: 15, left: 15, right: 15 };
                const hdrBloco = (tplAtual.blocos || []).find(b => b.tipo === 'cabecalho');
                const ftrBloco = (tplAtual.blocos || []).find(b => b.tipo === 'rodape');
                const hdrH = (hdrBloco && hdrBloco.repetir_todas_folhas) ? 135 : 0;
                const ftrH = ftrBloco ? 42 : 0;
                const padTopPx = Math.round(((hdrBloco && hdrBloco.repetir_todas_folhas) ? Math.max(2, mm.top - 8) : mm.top) * 3.78);
                const padBotPx = Math.round((ftrBloco ? Math.max(2, mm.bottom - 8) : mm.bottom) * 3.78);
                const utilH = pd.heightPx - hdrH - ftrH - padTopPx - padBotPx; // ~950px - 1000px

                const overheadTitulo = 42; // título do bloco de mapa + divisor
                const extraPorMapa = (exibirContagem ? 20 : 0) + (campoAgrupador ? 20 : 0) + 16; // legenda + contagem + margin-bottom

                if (layoutPreenchimento === 'auto2') {
                    // 2 mapas por folha: preenche ~96% da folha A4
                    const espacoDisponivel = utilH - overheadTitulo - 16;
                    alturaPx = Math.max(180, Math.floor((espacoDisponivel - (2 * extraPorMapa)) / 2));
                } else if (layoutPreenchimento === 'auto3') {
                    // 3 mapas por folha
                    const espacoDisponivel = utilH - overheadTitulo - 24;
                    alturaPx = Math.max(140, Math.floor((espacoDisponivel - (3 * extraPorMapa)) / 3));
                } else if (layoutPreenchimento === 'auto1') {
                    // 1 mapa grande por folha
                    const espacoDisponivel = utilH - overheadTitulo - 12;
                    alturaPx = Math.max(300, Math.floor(espacoDisponivel - extraPorMapa));
                }
            }
            alturaPx = Math.max(120, Math.min(850, Math.round(alturaPx)));
            const centros = registros.map(r => MapTools.bboxCenter(MapTools.geometryBBox(r.geometry)) || [0, 0]);

            // agrupar por campo (ex.: um mapa por Loteamento) tem prioridade; dentro de cada valor, ainda pode
            // precisar de mais de um mapa (muitas feições no mesmo valor) — sub-divide por proximidade nesse caso.
            // sem agrupar por campo: zoom automático (cada mapa se ajusta ao seu grupo) ou zoom FIXO definido pelo
            // usuário (o sistema "ladrilha" a área inteira no mesmo zoom, criando quantos mapas forem precisos)
            let grupos, centrosFixos = null, legendas = null;
            if (campoAgrupador) {
                const valores = registros.map(r => r.properties ? r.properties[campoAgrupador.id] : undefined);
                const porValor = agruparPorValorCampoMapaFeicoes(valores);
                const gruposFinais = [];
                const legendasFinais = [];
                porValor.forEach(g => {
                    const subCentros = g.idxs.map(i => centros[i]);
                    const subGrupos = g.idxs.length > ALVO_POR_MAPA ? MapTools.agruparPorProximidade(subCentros, ALVO_POR_MAPA) : [subCentros.map((_, k) => k)];
                    subGrupos.forEach((idxsLocais, parte) => {
                        gruposFinais.push(idxsLocais.map(k => g.idxs[k]));
                        legendasFinais.push(`${campoAgrupador.label || campoAgrupador.id} = ${g.valor}` + (subGrupos.length > 1 ? ` (parte ${parte + 1} de ${subGrupos.length})` : ''));
                    });
                });
                if (gruposFinais.length > LIMITE_GRUPOS_CAMPO) {
                    return avisoHtml({ aviso: true, texto: `Agrupar por "${escapeHtml(campoAgrupador.label || campoAgrupador.id)}" geraria ${gruposFinais.length} mapas — acima do limite de ${LIMITE_GRUPOS_CAMPO}. Escolha um campo com menos valores distintos.` });
                }
                grupos = gruposFinais;
                legendas = legendasFinais;
            } else if (bloco.zoomManual) {
                const pd = PageSize.dims(tplAtual && tplAtual.config_pagina);
                const mm = (tplAtual && tplAtual.config_pagina && tplAtual.config_pagina.margens_mm) || { left: 15, right: 15 };
                const larguraMapaPx = Math.max(200, pd.widthPx - Math.round((mm.left + mm.right) * 3.78));
                const tiles = MapTools.agruparPorZoomFixo(centros, bloco.zoomManual, larguraMapaPx, alturaPx);
                if (tiles.length > LIMITE_MAPAS_ZOOM_FIXO) {
                    return avisoHtml({ aviso: true, texto: `No zoom ${bloco.zoomManual} definido, seriam necessários ${tiles.length} mapas para cobrir todas as feições — acima do limite de ${LIMITE_MAPAS_ZOOM_FIXO}. Diminua o zoom ou volte ao ajuste automático.` });
                }
                grupos = tiles.map(t => t.idxs);
                centrosFixos = tiles.map(t => t.center);
            } else {
                grupos = MapTools.agruparPorProximidade(centros, ALVO_POR_MAPA);
            }
            const rowsHtml = grupos.map((idxs, gi) => {
                const mapId = 'rpt-mapafeicoes-' + idx + '-' + gi;
                const zoomAttrs = bloco.zoomManual ? `data-mapa-zoom="${bloco.zoomManual}" data-mapa-centro="${centrosFixos[gi][0]},${centrosFixos[gi][1]}"` : '';
                // o botão "usar este zoom" só faz sentido no 1º mapa do bloco, sem zoom fixo já definido nem
                // agrupamento por campo (nesse caso os grupos vêm do CAMPO, não da proximidade/zoom)
                const botaoZoom = (gi === 0 && !bloco.zoomManual && !campoAgrupador) ? `<button type="button" class="no-print" data-usar-zoom-mapa data-bloco-id="${escapeHtml(bloco.id)}" data-map-id="${mapId}" style="position:absolute;z-index:401;top:6px;right:6px;background:#0f172a;color:#fff;border:none;border-radius:6px;padding:4px 8px;font-size:10px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.3)" title="Dê zoom neste mapa até o nível de detalhe que quiser; ao clicar, os demais mapas usam o mesmo zoom">Usar este zoom nos demais mapas</button>` : '';
                // legenda do agrupamento por campo: informa QUAL valor está representado neste mapa específico
                // (ex.: "Loteamento = Areia Dourada"), pra não parecer que todos os mapas mostram a mesma coisa
                const legendaCampoHtml = legendas ? `<div class="text-[10.5px] font-bold text-slate-700 mb-1">${escapeHtml(legendas[gi])}</div>` : '';
                return `
                    <div data-split-row class="mb-3 page-break-avoid">
                        ${legendaCampoHtml}
                        ${exibirContagem ? `<div class="text-[10px] font-mono text-slate-500 mb-1">Grupo ${gi + 1} de ${grupos.length} • ${idxs.length} feiç${idxs.length === 1 ? 'ão' : 'ões'}</div>` : ''}
                        <div class="relative" data-mapa-feicoes-wrap data-bloco-id="${escapeHtml(bloco.id)}">
                            <div id="${mapId}" data-mapa-feicoes data-mapa-indices="${idxs.join(',')}" data-mapa-cor="${escapeHtml(cor)}" data-mapa-basemap="${escapeHtml(baseMap)}" data-mapa-grade="${bloco.quadriculado ? '1' : '0'}" data-bloco-id="${escapeHtml(bloco.id)}" ${zoomAttrs} class="w-full rounded-lg border border-slate-300 overflow-hidden bg-slate-100" style="height: ${alturaPx}px;"></div>
                            ${botaoZoom}
                            <div class="mapa-feicoes-resize no-print" data-bloco-id="${escapeHtml(bloco.id)}" title="Arraste para ajustar a altura do mapa"></div>
                        </div>
                    </div>`;
            });
            const meta = `${registros.length} feiç${registros.length === 1 ? 'ão' : 'ões'} em ${grupos.length} grupo(s)`;
            const chunkHtml = (rows, isFirst) => `
                <div class="mb-4">
                    <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2 flex items-center justify-between">
                        <span class="whitespace-pre-line">${tituloBase}${isFirst ? '' : ' (continuação)'}</span>
                        <span class="text-[10px] font-mono text-slate-500 normal-case">${escapeHtml(meta)}</span>
                    </div>
                    ${rows.join('')}
                </div>`;
            // altura de cada mini-mapa já é CONHECIDA (é a altura definida no bloco, não algo pra medir no DOM) —
            // um Leaflet dentro de uma área escondida pra medição não tem tamanho real ainda, e medir dava um valor
            // errado (o mapa "esticava" na folha de verdade sem a paginação prever isso e quebrar a página).
            const alturaLinha = alturaPx + (exibirContagem ? 20 : 0) + (legendas ? 20 : 0) + 16;
            return { split: { rowsHtml, chunkHtml, rowHeightsFixas: grupos.map(() => alturaLinha), overheadFixo: 42 } };
        }

        const TILES_MAPA_FEICOES = {
            osm: { url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', attribution: '© OpenStreetMap contributors' },
            satelite: { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', attribution: 'Imagens © Esri, Maxar, Earthstar Geographics' }
        };

        /** Desenha o quadriculado UTM (mesma malha do Mini-Mapa individual) sobre um mini-mapa de feições. */
        function desenharGradeUtmMapaFeicoes(mapa) {
            if (!mapa.getBounds) return;
            (mapa._gradeLayers || []).forEach(l => { try { mapa.removeLayer(l); } catch (e) {} });
            mapa._gradeLayers = [];
            const b = mapa.getBounds();
            const g = MapTools.gradeUTM([b.getWest(), b.getSouth(), b.getEast(), b.getNorth()], 0);
            (g.linhas || []).forEach(l => {
                const pl = L.polyline(l.pts, { color: '#1e293b', weight: 0.8, opacity: 0.65, dashArray: '4 4', interactive: false });
                pl.addTo(mapa);
                mapa._gradeLayers.push(pl);
            });
        }

        /**
         * Cor de cada feição de um mini-mapa "do gráfico": a mesma categoria/cor que o próprio gráfico calculou
         * (window.opener.computeChartAggregation), para bater com a legenda — igual ao mapa do index.html, que
         * classifica as feições pela mesma config (applyThemeClassification). Sem gráfico de origem (mapa geral do
         * Filtro) ou sem a janela de origem, retorna null e quem chamou usa a cor única escolhida no painel.
         */
        function coresPorFeicaoMapaFeicoes(bloco, feats) {
            if (!bloco || !bloco.origemGraficoId) return null;
            const opener = window.opener;
            if (!opener || opener.closed || typeof opener.getFeaturePropertyValue !== 'function' || typeof opener.normalizeStatValue !== 'function' || typeof opener.computeChartAggregation !== 'function') return null;
            const g = ((reportPayload && reportPayload.charts) || []).find(c => c.id === bloco.origemGraficoId);
            const themeId = reportPayload && reportPayload.themeId;
            const theme = (g && themeId && Array.isArray(opener.themes)) ? opener.themes.find(t => String(t.id) === String(themeId)) : null;
            if (!g || !theme) return null;
            try {
                const featuresRaw = feats.map(f => f.rawFeature).filter(Boolean);
                const agg = opener.computeChartAggregation(theme, g, featuresRaw);
                const campo = (reportPayload.formFields || []).find(f => f.id === g.fieldId);
                return feats.map(f => {
                    if (!f.rawFeature) return null;
                    let rotulo;
                    try { rotulo = opener.normalizeStatValue(opener.getFeaturePropertyValue(theme, f.rawFeature, g.fieldId), campo); } catch (e) { return null; }
                    if (rotulo === 'N/I') rotulo = 'Não informado';
                    return agg.colorsMap[rotulo] || null;
                });
            } catch (e) { return null; }
        }

        /**
         * Texto do rótulo de uma feição no mapa (até 2 campos escolhidos em bloco.rotuloCampos, ex.: "QD A - LT 10")
         * — abrevia pelo bloco.rotuloAbrev quando definido, senão usa o nome do campo. Campo vazio na feição não entra.
         */
        function textoRotuloFeicaoMapaFeicoes(bloco, registro) {
            const camposIds = (bloco && Array.isArray(bloco.rotuloCampos)) ? bloco.rotuloCampos.filter(Boolean) : [];
            if (!camposIds.length || !registro || !registro.properties) return '';
            const abrevs = bloco.rotuloAbrev || {};
            const partes = camposIds.map(fid => {
                const valor = registro.properties[fid];
                if (valor === undefined || valor === null || String(valor).trim() === '') return null;
                const campo = (reportPayload.formFields || []).find(f => f.id === fid);
                const rotuloCampo = abrevs[fid] || (campo && (campo.label || campo.name)) || fid;
                return `${rotuloCampo} ${valor}`;
            }).filter(Boolean);
            return partes.join(' - ');
        }

        /** Seta do norte (fixa) e escala — mesmos elementos do Mini-Mapa do Relatório Individual, num mini-mapa de feições. */
        function adicionarNorteEscala(mapa, container) {
            const norte = document.createElement('div');
            norte.className = 'mapa-feicoes-norte';
            norte.innerHTML = '<span class="material-symbols-outlined">navigation</span>';
            container.appendChild(norte);
            L.control.scale({ metric: true, imperial: false, position: 'bottomleft', maxWidth: 100 }).addTo(mapa);
        }

        /** Depois que o HTML entra na página: cria (ou recria) o Leaflet de cada mini-mapa, enquadrado no seu grupo. */
        function renderPendingMapasFeicoes() {
            Object.keys(mapaFeicoesInstances).forEach(id => { try { mapaFeicoesInstances[id].remove(); } catch (e) { /* já sumiu com a repaginação */ } });
            mapaFeicoesInstances = {};
            if (typeof L === 'undefined') return;
            const registros = resolveFeatureListFull().filter(r => r.geometry);
            document.querySelectorAll('[data-mapa-feicoes]').forEach(div => {
                const idxs = (div.getAttribute('data-mapa-indices') || '').split(',').filter(Boolean).map(Number);
                const feats = idxs.map(i => registros[i]).filter(Boolean);
                if (!feats.length) return;
                const corUnica = div.getAttribute('data-mapa-cor') || '#0ea5e9';
                const blocoId = div.getAttribute('data-bloco-id');
                const bloco = (tplAtual && tplAtual.blocos || []).find(b => b.id === blocoId);
                const coresPorFeicao = coresPorFeicaoMapaFeicoes(bloco, feats);
                const baseMapValue = div.getAttribute('data-mapa-basemap') || 'osm';
                const ortoMatch = /^ortofoto:(.+)$/.exec(baseMapValue);
                const orto = ortoMatch ? ortofotosDisponiveisGeral().find(o => String(o.id) === ortoMatch[1]) : null;
                // ortofoto vai sobre o satélite, que preenche o que ela não cobre (mesma lógica do mini-mapa individual)
                const tile = TILES_MAPA_FEICOES[orto ? 'satelite' : baseMapValue] || TILES_MAPA_FEICOES.osm;
                // zoomControl/scrollWheelZoom ligados: é como o usuário ajusta o enquadramento manualmente (botão
                // "Usar este zoom nos demais mapas") antes de imprimir/gerar o Word — no impresso, o controle some (no-print)
                const mapa = L.map(div, { attributionControl: true, zoomControl: true, scrollWheelZoom: true });
                L.tileLayer(tile.url, { maxZoom: 19, crossOrigin: true, attribution: tile.attribution }).addTo(mapa);
                if (orto) {
                    if (orto.tipo === 'xyz_tiles' || String(orto.url).indexOf('{z}') >= 0) {
                        const zMin = Math.min(Number(orto.zoomMin || 12), Number(orto.zoomMax || 22));
                        const zMax = Math.max(Number(orto.zoomMin || 12), Number(orto.zoomMax || 22));
                        const ortoLyr = L.tileLayer(orto.url, {
                            minZoom: 1,
                            minNativeZoom: zMin,
                            maxNativeZoom: zMax,
                            maxZoom: 24,
                            keepBuffer: 16,
                            opacity: orto.opacidade !== undefined ? orto.opacidade : 1,
                            crossOrigin: true,
                            attribution: 'Ortofoto: ' + orto.nome
                        });
                        ortoLyr.addTo(mapa);
                    } else if (orto.bbox) {
                        L.imageOverlay(orto.url, orto.bbox, { opacity: orto.opacidade, crossOrigin: true, attribution: 'Ortofoto: ' + orto.nome }).addTo(mapa);
                    }
                }
                const camada = L.geoJSON(feats.map((f, i) => ({ type: 'Feature', properties: { _cor: (coresPorFeicao && coresPorFeicao[i]) || corUnica }, geometry: f.geometry })), {
                    style: (f) => ({ color: f.properties._cor, weight: 2, fillColor: f.properties._cor, fillOpacity: 0.25 }),
                    pointToLayer: (f, ll) => L.circleMarker(ll, { radius: 5, color: f.properties._cor, weight: 2, fillColor: f.properties._cor, fillOpacity: 0.85 })
                }).addTo(mapa);
                // rótulo de até 2 campos escolhidos, centralizado em cada feição (ex.: "QD A - LT 10")
                if (bloco && Array.isArray(bloco.rotuloCampos) && bloco.rotuloCampos.filter(Boolean).length) {
                    feats.forEach(f => {
                        const texto = textoRotuloFeicaoMapaFeicoes(bloco, f);
                        if (!texto || !f.geometry) return;
                        const centro = MapTools.bboxCenter(MapTools.geometryBBox(f.geometry));
                        if (!centro) return;
                        const icon = L.divIcon({ className: '', html: `<span class="mapa-feicoes-rotulo">${escapeHtml(texto)}</span>`, iconSize: [0, 0] });
                        L.marker([centro[1], centro[0]], { icon, interactive: false, keyboard: false }).addTo(mapa);
                    });
                }
                // zoom automático (ajusta ao grupo) ou o zoom FIXO que o usuário escolheu (mesmo enquadramento em todos)
                const zoomFixo = Number(div.getAttribute('data-mapa-zoom')) || null;
                const centroStr = div.getAttribute('data-mapa-centro');
                if (zoomFixo && centroStr) {
                    const partes = centroStr.split(',').map(Number);
                    mapa.setView([partes[1], partes[0]], zoomFixo);
                } else {
                    const limites = camada.getBounds ? camada.getBounds() : null;
                    if (limites && limites.isValid && limites.isValid()) mapa.fitBounds(limites, { padding: [20, 20] });
                    else mapa.setView([-15, -47], 4);
                }
                if (div.getAttribute('data-mapa-grade') === '1') {
                    desenharGradeUtmMapaFeicoes(mapa);
                    mapa.on('moveend zoomend', () => desenharGradeUtmMapaFeicoes(mapa));
                }
                adicionarNorteEscala(mapa, div);
                mapaFeicoesInstances[div.id] = mapa;
            });
            ligarRedimensionarMapasFeicoes();
            ligarBotaoUsarZoomMapaFeicoes();
        }

        /**
         * Botão "Usar este zoom nos demais mapas" (só no 1º mapa do bloco, enquanto não há zoom fixo definido):
         * lê o zoom atual daquele mapa (o usuário já pode ter dado zoom/arrastado à vontade) e o sistema passa a
         * "ladrilhar" a área inteira nesse mesmo zoom, criando quantos mapas forem precisos para cobrir tudo.
         */
        function ligarBotaoUsarZoomMapaFeicoes() {
            document.querySelectorAll('[data-usar-zoom-mapa]').forEach(btn => {
                if (btn._ligado) return;
                btn._ligado = true;
                btn.addEventListener('click', (ev) => {
                    ev.preventDefault(); ev.stopPropagation();
                    const blocoId = btn.getAttribute('data-bloco-id');
                    const mapId = btn.getAttribute('data-map-id');
                    const mapa = mapaFeicoesInstances[mapId];
                    if (!mapa || !tplAtual) return;
                    const bloco = (tplAtual.blocos || []).find(b => b.id === blocoId);
                    if (!bloco) return;
                    bloco.zoomManual = mapa.getZoom();
                    aplicarPesquisaGeral();
                });
            });
        }

        /** Arrastar a borda de baixo de um mini-mapa de feições muda a altura de TODOS os grupos do mesmo bloco. */
        function ligarRedimensionarMapasFeicoes() {
            document.querySelectorAll('.mapa-feicoes-resize').forEach(alca => {
                if (alca._ligada) return;
                alca._ligada = true;
                alca.addEventListener('mousedown', (ev) => {
                    ev.preventDefault(); ev.stopPropagation();
                    const blocoId = alca.getAttribute('data-bloco-id');
                    const mapasDoBloco = () => Array.from(document.querySelectorAll(`[data-mapa-feicoes-wrap][data-bloco-id="${blocoId}"] [data-mapa-feicoes]`));
                    const primeiro = mapasDoBloco()[0];
                    const inicial = primeiro ? primeiro.getBoundingClientRect().height : 260;
                    const y0 = ev.clientY;
                    const mover = (e) => {
                        const nova = Math.max(120, Math.min(800, Math.round(inicial + (e.clientY - y0))));
                        mapasDoBloco().forEach(div => { div.style.height = nova + 'px'; });
                    };
                    const soltar = () => {
                        document.removeEventListener('mousemove', mover);
                        document.removeEventListener('mouseup', soltar);
                        const alturaFinal = primeiro ? primeiro.getBoundingClientRect().height : null;
                        if (alturaFinal && tplAtual) {
                            const bloco = (tplAtual.blocos || []).find(b => b.id === blocoId);
                            if (bloco) {
                                bloco.alturaPx = Math.round(alturaFinal);
                                bloco.layoutPreenchimento = 'manual';
                            }
