<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador Oficial de Relatório A4</title>
    
    <!-- Tipografia Oficial e Ícones -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    
    <!-- Leaflet & Turf.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <script src="src/pageSize.js"></script>
    <script src="src/mapTools.js"></script>
    <script src="src/reportMap.js"></script>
    <script src="src/fieldFormatter.js"></script>
    <script src="src/reportData.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
            margin: 0;
            padding: 0;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        .a4-page {
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
            margin: 20px auto;
            position: relative;
            box-sizing: border-box;
            transition: all 0.2s ease;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        @media screen {
            .a4-page {
                min-height: var(--page-height, 1123px);
                max-width: var(--page-width, 794px);
            }
            .a4-page.single-page {
                height: var(--page-height, 1123px);
                max-height: var(--page-height, 1123px);
                overflow: hidden;
            }
        }

        @page {
            size: A4 portrait;
            margin: 0 !important;
        }

        @media print {
            .no-print {
                display: none !important;
            }
            html, body {
                background: #ffffff !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
            }
            main {
                padding: 0 !important;
                margin: 0 !important;
                display: block !important;
            }
            #a4-document-container {
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                max-width: none !important;
                display: block !important;
            }
            .a4-page {
                box-shadow: none !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                max-width: none !important;
                height: var(--print-page-height, 297mm) !important;
                min-height: var(--print-page-height, 297mm) !important;
                max-height: var(--print-page-height, 297mm) !important;
                overflow: hidden !important;
                box-sizing: border-box !important;
                page-break-after: always !important;
                break-after: page !important;
            }
            .a4-page:last-child {
                page-break-after: auto !important;
                break-after: auto !important;
            }
            .page-break-avoid {
                break-inside: avoid;
                page-break-inside: avoid;
            }
        }

        /* Mini-mapa: sobreposições impressas junto com o mapa */
        .report-map-overlay { position: absolute; z-index: 500; pointer-events: none; }
        #map-north { top: 8px; right: 8px; background: rgba(0,0,0,.72); color: #fff; padding: 4px 6px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; font: 700 10px monospace; line-height: 1; }
        #map-info-bar { bottom: 34px; left: 8px; background: rgba(0,0,0,.72); color: #fff; padding: 3px 7px; border-radius: 5px; font: 9px monospace; display: flex; gap: 6px; align-items: center; max-width: 70%; flex-wrap: wrap; }
        #map-legend { bottom: 22px; right: 8px; background: rgba(255,255,255,.92); border: 1px solid #cbd5e1; border-radius: 6px; padding: 4px 7px; font: 9px sans-serif; color: #0f172a; max-width: 45%; }
        #map-legend div { display: flex; align-items: center; gap: 5px; line-height: 1.5; }
        #map-legend i { display: inline-block; width: 12px; height: 8px; border-radius: 2px; border: 1px solid rgba(0,0,0,.35); }
        .leaflet-container { font-family: inherit; }
        .report-measure { background: transparent; border: 0; }
        .report-measure-label { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; background: rgba(255,255,255,.92); color: #065f46; border: 1px solid #6ee7b7; border-radius: 4px; padding: 0 4px; font: 700 9px/14px monospace; cursor: text; }
        .report-measure-label.edited { border-style: dashed; color: #92400e; border-color: #f59e0b; }
        .report-measure-input { width: 120px; font: 700 9px monospace; border: 1px solid #059669; border-radius: 3px; padding: 0 3px; outline: none; }
        @media print {
            .leaflet-control-zoom, #map-tools-panel, #map-tools-toggle { display: none !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
        #map-tools-panel { position: fixed; top: 84px; right: 12px; width: 268px; max-height: calc(100vh - 100px); overflow-y: auto; z-index: 1200; background: #fff; border: 1px solid #cbd5e1; border-radius: 14px; box-shadow: 0 10px 30px rgba(15,23,42,.18); font-size: 12px; color: #0f172a; }
        #map-tools-panel h4 { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #64748b; font-weight: 800; margin: 10px 0 4px; }
        #map-tools-panel label.row { display: flex; align-items: center; gap: 7px; padding: 2px 0; cursor: pointer; }
        #map-tools-panel label.row.off { opacity: .45; cursor: not-allowed; }
        #map-tools-panel button.act { width: 100%; padding: 7px 8px; border-radius: 9px; font-weight: 700; font-size: 12px; cursor: pointer; border: 1px solid #cbd5e1; background: #f8fafc; }
        #map-tools-panel button.act.primary { background: #059669; border-color: #059669; color: #fff; }
        #map-tools-toggle { position: fixed; top: 84px; right: 12px; z-index: 1200; background: #0f172a; color: #fff; border-radius: 999px; padding: 7px 12px; font-size: 12px; font-weight: 700; cursor: pointer; display: none; box-shadow: 0 6px 18px rgba(15,23,42,.3); }
        .mention-rendered {
            font-weight: 600;
            color: #0f172a;
        }
        .mention-tag {
            user-select: all;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
        }
        .mention-tag[data-format-bold="true"], .mention-tag.font-bold, .mention-tag.font-black, .mention-tag.is-bold {
            font-weight: 700 !important;
        }
        .mention-tag[data-format-italic="true"], .mention-tag.italic {
            font-style: italic !important;
        }
        .mention-tag[data-format-underline="true"], .mention-tag.underline {
            text-decoration: underline !important;
            text-underline-offset: 2px !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- BARRA SUPERIOR (RODATETO) - AÇÕES RÁPIDAS (OCULTA NA IMPRESSÃO) -->
    <header class="no-print sticky top-0 z-50 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-xs px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-3 select-none">
        <div class="flex items-center gap-3 w-full sm:w-auto">
            <button type="button" onclick="window.close()" class="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full text-slate-500 transition-colors cursor-pointer" title="Fechar Janela">
                <span class="material-symbols-outlined text-[22px]">arrow_back</span>
            </button>
            <div class="flex flex-col">
                <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-sky-600 text-[20px]">description</span>
                    <h1 id="report-header-title" class="font-bold text-sm sm:text-base text-slate-900 dark:text-white leading-tight truncate max-w-xs sm:max-w-md">Relatório da Feição</h1>
                </div>
                <span id="report-header-subtitle" class="text-[11px] font-mono text-slate-500 dark:text-slate-400">Configuração Interativa do Documento • Edição de Mapa &amp; Texto</span>
            </div>
        </div>

        <div class="flex items-center gap-2 w-full sm:w-auto justify-end flex-wrap">
            <!-- Botão Gerar Word -->
            <button type="button" onclick="gerarWord()" class="flex items-center gap-1.5 px-3.5 py-2 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white rounded-xl text-xs font-bold transition-all shadow-xs cursor-pointer" title="Exportar como documento Word (.doc)">
                <span class="material-symbols-outlined text-[17px]">article</span>
                <span>Gerar Word</span>
            </button>

            <!-- Botão Imprimir -->
            <button type="button" onclick="window.print()" class="flex items-center gap-1.5 px-3.5 py-2 bg-slate-800 hover:bg-slate-900 dark:bg-slate-700 dark:hover:bg-slate-600 active:scale-95 text-white rounded-xl text-xs font-bold transition-all shadow-xs cursor-pointer" title="Imprimir em impressora ou salvar como PDF">
                <span class="material-symbols-outlined text-[17px]">print</span>
                <span>Imprimir</span>
            </button>
        </div>
    </header>

    <!-- ÁREA DE NOTIFICAÇÃO / DICA VISUAL -->
    <div class="no-print bg-sky-50 dark:bg-sky-950/40 border-b border-sky-200 dark:border-sky-800/60 px-4 py-2 text-center text-xs text-sky-800 dark:text-sky-300 flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-[16px]">info</span>
        <span>Você pode navegar pelo Mini-Mapa Cartográfico (pan/zoom/camadas) e editar a Caixa de Texto Livre diretamente na folha antes de imprimir (ou salvar em PDF) ou gerar o Word.</span>
    </div>

    <!-- CONTAINER DA FOLHA A4 -->
    <main class="flex-1 flex justify-center p-3 sm:p-6 overflow-y-auto">
        <div id="a4-document-container" class="w-full flex flex-col items-center gap-6">
            <!-- Conteúdo montado dinamicamente via JS com suporte a multi-páginas e folha única sem vazamento -->
            <div id="report-blocks-render" class="a4-page w-full text-slate-900"></div>
        </div>
    </main>

    <script>
        let reportPayload = null;
        let mapController = null;     // controlador do mini-mapa (src/reportMap.js)
        let mapBaseConfig = null;     // configuração definida no modelo
        let mapBloco = null;          // bloco 'mapa_estatico' do modelo

        window.addEventListener('DOMContentLoaded', () => {
            initReportViewer();
        });


        function getOrgBadgeHtml(org) {
            const o = String(org || '').toUpperCase().trim();
            if (!o || o === 'VISTORIA') {
                return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-slate-100 text-slate-700 border border-slate-200 shadow-2xs"><span class="material-symbols-outlined text-[12px]">visibility</span> Vistoria</span>`;
            }
            if (o.includes('MPF') || o.includes('MINISTÉRIO PÚBLICO') || o.includes('MINISTERIO PUBLICO') || o.includes('PROCURADORIA')) {
                return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-purple-100 text-purple-800 border border-purple-200 shadow-2xs"><span class="material-symbols-outlined text-[12px]">gavel</span> ${escapeHtml(org)}</span>`;
            }
            if (o.includes('POLÍCIA') || o.includes('POLICIA') || (o.includes('PF') && !o.includes('MPF'))) {
                return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-blue-100 text-blue-800 border border-blue-200 shadow-2xs"><span class="material-symbols-outlined text-[12px]">local_police</span> ${escapeHtml(org)}</span>`;
            }
            if (o.includes('SPU') || o.includes('PATRIMÔNIO') || o.includes('PATRIMONIO') || o.includes('FEDERAL')) {
                return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-200 shadow-2xs"><span class="material-symbols-outlined text-[12px]">account_balance</span> ${escapeHtml(org)}</span>`;
            }
            if (o.includes('MUNIC') || o.includes('PREFEITURA') || o.includes('SEDEC') || o.includes('SEPLAM') || o.includes('CABEDELO') || o === 'PM') {
                const displayOrg = (org === 'PM') ? 'MUNICÍPIO' : org;
                return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-amber-100 text-amber-800 border border-amber-200 shadow-2xs"><span class="material-symbols-outlined text-[12px]">domain</span> ${escapeHtml(displayOrg)}</span>`;
            }
            const genericPalettes = [
                'bg-sky-100 text-sky-800 border-sky-200',
                'bg-teal-100 text-teal-800 border-teal-200',
                'bg-indigo-100 text-indigo-800 border-indigo-200',
                'bg-rose-100 text-rose-800 border-rose-200',
                'bg-orange-100 text-orange-800 border-orange-200'
            ];
            const gHash = Math.abs(String(org || '').split('').reduce((acc, c) => acc + c.charCodeAt(0), 0));
            const gClass = genericPalettes[gHash % genericPalettes.length];
            return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9.5px] font-bold ${gClass} shadow-2xs"><span class="material-symbols-outlined text-[12px]">corporate_fare</span> ${escapeHtml(org)}</span>`;
        }

        function getStatusBadgeHtml(status) {
            const s = String(status || '').toLowerCase().trim();
            if (!s || s === '—' || s === '---' || s === '-') return '<span class="text-slate-400 opacity-60 font-mono text-[10px]">—</span>';
            if (s.includes('irregular') || s.includes('invas') || s.includes('não conforme') || s.includes('nao conforme')) {
                return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-red-100 text-red-700 border border-red-200 shadow-2xs"><span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span> ${escapeHtml(status)}</span>`;
            }
            if (s.includes('regular') || s.includes('conforme') || s.includes('legal')) {
                return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-emerald-100 text-emerald-700 border border-emerald-200 shadow-2xs"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> ${escapeHtml(status)}</span>`;
            }
            return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[9.5px] font-medium bg-slate-100 text-slate-700 border border-slate-200">${escapeHtml(status)}</span>`;
        }

        function getRecuoBadgeHtml(recuo) {
            const r = String(recuo || '').toLowerCase().trim();
            if (!r || r === '—' || r === '---' || r === '-') return '<span class="text-slate-400 opacity-60 font-mono text-[10px]">—</span>';
            if (r.includes('já recuou') || r.includes('ja recuou') || r.includes('recuado') || r.includes('com recuo') || r.includes('sim')) {
                return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-emerald-100 text-emerald-700 border border-emerald-200 shadow-2xs"><span class="material-symbols-outlined text-[11px]">check_circle</span> ${escapeHtml(recuo)}</span>`;
            }
            if (r.includes('não') || r.includes('nao') || r.includes('sem recuo') || r.includes('pendente')) {
                return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-amber-100 text-amber-800 border border-amber-200 shadow-2xs"><span class="material-symbols-outlined text-[11px]">warning</span> ${escapeHtml(recuo)}</span>`;
            }
            return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[9.5px] font-medium bg-slate-100 text-slate-700 border border-slate-200">${escapeHtml(recuo)}</span>`;
        }

        /**
         * Centro da geometria da feição (usado como valor de campos de geolocalização não gravados).
         */
        function getGeometryCenter() {
            try {
                const g = reportPayload && reportPayload.featureGeometry;
                if (!g || typeof turf === 'undefined') return null;
                const c = turf.centroid({ type: 'Feature', properties: {}, geometry: g }).geometry.coordinates;
                return { lat: c[1], lng: c[0] };
            } catch (e) {
                return null;
            }
        }

        /**
         * Formata um valor para exibição. A formatação é decidida SOMENTE pelo TIPO do campo
         * (fieldDef.type), em src/fieldFormatter.js — o mesmo formatador serve ao construtor e ao Word.
         * Nunca adivinha por nome, rótulo ou id do campo.
         */
        function formatFieldValueForDisplay(val, fieldDef = {}) {
            return FieldFormatter.toText(val, fieldDef || {}, { geometryCenter: getGeometryCenter() });
        }


        /**
         * Valor bruto de um campo na feição (ou no registro 1:N). A ÚNICA chave de leitura é o id do
         * campo no schema do formulário. Só quando a definição não tem id (menção antiga) usa o nome
         * exato. Sem aliases, sem busca por rótulo, sem varredura em outras abas: se o dado não
         * existe naquele campo, o valor é vazio — nunca o de outro campo.
         */
        function readFieldRaw(f, data) {
            if (!f || !data) return undefined;
            const key = f.id || f.name;
            return key ? data[key] : undefined;
        }

        /** Campos cujo valor ocupa várias linhas ou tem links: exibidos na íntegra (HTML), sem truncar. */
        function isRichField(f) {
            return ['hiperlink', 'hiperlink_1n', 'attachment', 'photo', 'epol_1n', 'rip_1n', 'textarea'].includes(FieldFormatter.canonicalType(f || {}));
        }

        function resolveFieldHtml(f, featureData, fileMode) {
            if (!f || !featureData) return FieldFormatter.EMPTY;
            return FieldFormatter.toHtml(readFieldRaw(f, featureData), f, { geometryCenter: getGeometryCenter(), fileMode });
        }

        function resolveFieldValue(f, featureData, availableFields = []) {
            if (!f || !featureData) return FieldFormatter.EMPTY;
            return formatFieldValueForDisplay(readFieldRaw(f, featureData), f);
        }

        function initReportViewer() {
            // Recupera o payload de dados salvo pela aplicação principal
            try {
                const raw = sessionStorage.getItem('constructive_active_report_payload') || 
                            localStorage.getItem('constructive_active_report_payload');
                if (raw) {
                    reportPayload = JSON.parse(raw);
                }
            } catch(e) {
                console.error('[Viewer] Falha ao ler payload:', e);
            }

            // Fallback para recuperar dados da feição da janela principal (window.opener) se o payload for vazio
            if ((!reportPayload || !reportPayload.featureData || Object.keys(reportPayload.featureData).length === 0) && typeof window !== 'undefined' && window.opener) {
                try {
                    const opLayer = window.opener.activeFeatureLayer;
                    if (opLayer && opLayer.feature) {
                        if (!reportPayload) reportPayload = {};
                        reportPayload.featureData = window.opener.activeFeatureData || window.opener.currentFormFeatureData || opLayer.feature.properties || {};
                        reportPayload.featureGeometry = opLayer.feature.geometry || (opLayer.toGeoJSON ? opLayer.toGeoJSON().geometry : null);
                        if (!reportPayload.templateId) {
                            const urlParams = new URLSearchParams(window.location.search);
                            reportPayload.templateId = urlParams.get('templateId');
                        }
                    }
                } catch(e) {
                    console.warn('[Viewer] Falha ao recuperar dados da janela principal:', e);
                }
            }

            if (!reportPayload) {
                document.getElementById('report-blocks-render').innerHTML = `
                    <div class="p-10 text-center text-slate-500">
                        <span class="material-symbols-outlined text-5xl text-amber-500 mb-2">warning</span>
                        <h2 class="text-base font-bold">Nenhum dado de feição recebido</h2>
                        <p class="text-xs text-slate-400 mt-1">Selecione uma feição no mapa e abra o atalho de relatório.</p>
                    </div>
                `;
                return;
            }

            const { templateId, formId, featureData, featureGeometry, template } = reportPayload;
            
            // Busca o modelo
            let templates = [];
            try {
                templates = JSON.parse(localStorage.getItem('constructive_report_templates') || '[]');
            } catch(e) {}
            
            let tpl = template || templates.find(t => t.id === templateId) || templates.find(t => t.form_id === formId) || templates[0];
            if (!tpl) {
                tpl = {
                    id: 'default_preview',
                    nome: 'Ficha Individual do Imóvel',
                    tipo: 'individual',
                    config_pagina: { orientacao: 'portrait', margens_mm: { top: 15, bottom: 15, left: 15, right: 15 } },
                    blocos: [
                        { id: 'b1', tipo: 'cabecalho', titulo: 'FICHA CADASTRAL DO IMÓVEL', subtitulo: 'Prefeitura Municipal', logo: true, exibirDataHora: true, exibirProtocolo: true },
                        { id: 'b2', tipo: 'mapa_estatico', titulo: 'Delimitação Cartográfica do Imóvel', exibirCotas: true, exibirArea: true, exibirNorte: true, exibirEscala: true, escala: '1:2.500' },
                        { id: 'b3', tipo: 'grade_campos', titulo: 'Dados Cadastrais', colunasLayout: 2 },
                        { id: 'b4', tipo: 'caixa_texto_livre', titulo: 'Parecer Técnico / Observações', conteudo: 'O imóvel inspecionado encontra-se devidamente delimitado conforme as coordenadas georreferenciadas levantadas.' },
                        { id: 'b5', tipo: 'rodape', numeracao: true, exibirHash: true, exibirDataHora: true }
                    ]
                };
            }

            // Atualiza o título da barra superior
            document.getElementById('report-header-title').textContent = tpl.nome || 'Relatório da Feição';
            document.title = `${tpl.nome || 'Relatório'} - Feição`;

            // Configura as dimensões da folha (A4 ou A3, retrato ou paisagem)
            const pd = PageSize.dims(tpl.config_pagina);
            const orient = pd.orient;
            const mm = (tpl.config_pagina && tpl.config_pagina.margens_mm) || { top: 15, bottom: 15, left: 15, right: 15 };
            
            // Injeta regra @page dinâmica
            let pageStyle = document.getElementById('dynamic-page-print-style');
            if (!pageStyle) {
                pageStyle = document.createElement('style');
                pageStyle.id = 'dynamic-page-print-style';
                document.head.appendChild(pageStyle);
            }
            pageStyle.textContent = `
                @page {
                    size: ${pd.cssPageSize};
                    margin: 0;
                }
            `;

            const docContainer = document.getElementById('a4-document-container');
            if (docContainer) {
                docContainer.style.maxWidth = pd.widthPx + 'px';
                docContainer.style.padding = '0';
                docContainer.style.display = 'flex';
                docContainer.style.flexDirection = 'column';
                docContainer.style.alignItems = 'center';
            }
            document.documentElement.style.setProperty('--print-padding', `${mm.top}mm ${mm.right}mm ${mm.bottom}mm ${mm.left}mm`);
            document.documentElement.style.setProperty('--page-width', pd.widthPx + 'px');
            document.documentElement.style.setProperty('--page-height', pd.heightPx + 'px');
            document.documentElement.style.setProperty('--print-page-width', pd.widthMm + 'mm');
            document.documentElement.style.setProperty('--print-page-height', pd.heightMm + 'mm');

            // Injeta os blocos do relatório
            renderBlocks(tpl, featureData, featureGeometry);
        }

        function getFooterPageNumberText(pageIdx, totalPages, ftrBloco) {
            if (!ftrBloco || ftrBloco.numeracao === false) return '';
            const startMode = ftrBloco.inicio_numeracao || 'primeira';

            const curPad = String(pageIdx).padStart(2, '0');
            const totalPad = totalPages < 10 ? String(totalPages).padStart(2, '0') : String(totalPages);

            if (startMode === 'segunda') {
                if (pageIdx === 1) {
                    return ''; // Na 1ª folha não exibe número
                }
                return `Página ${curPad} de ${totalPad}`;
            } else {
                return `Página ${curPad} de ${totalPad}`;
            }
        }

        function renderHeaderSlotHtml(hdrBloco, tpl, padLeftMm, padRightMm) {
            if (!hdrBloco) return '';
            return `
                <div class="a4-page-header-slot w-full select-none" style="padding: 6mm ${padRightMm}mm 0 ${padLeftMm}mm;">
                    <div class="mb-2 page-break-avoid ${hdrBloco.repetir_todas_folhas ? 'cabecalho-repetir-todas' : ''}">
                        <!-- Metadados de Emissão e Protocolo fora do card/borda principal (topo direito) -->
                        ${(hdrBloco.exibirDataHora || hdrBloco.exibirProtocolo) ? `
                            <div class="flex items-center justify-end gap-3 text-[10px] font-mono text-slate-500 pb-1 mb-1 border-b border-slate-200/80">
                                ${hdrBloco.exibirDataHora ? `
                                    <div class="flex items-center gap-1">
                                        <span class="text-slate-400">Emissão:</span>
                                        <span class="font-medium text-slate-600">${new Date().toLocaleDateString('pt-BR')} ${new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}</span>
                                    </div>
                                ` : ''}
                                ${hdrBloco.exibirProtocolo ? `
                                    <div class="flex items-center gap-1 font-bold text-slate-700 bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200/60">
                                        <span class="text-slate-400 font-normal">Protocolo:</span>
                                        <span>#${(hdrBloco.id || '2026').slice(-6).toUpperCase()}</span>
                                    </div>
                                ` : ''}
                            </div>
                        ` : ''}

                        <div class="flex items-center justify-between border-b-2 border-slate-900 pb-2.5 gap-4">
                            <div class="flex items-center gap-3">
                                ${hdrBloco.logo ? `
                                    <div class="w-14 h-14 bg-slate-100 rounded-lg flex items-center justify-center overflow-hidden shrink-0 border border-slate-200">
                                        ${hdrBloco.logo_url ? `<img src="${hdrBloco.logo_url}" class="w-full h-full object-contain" />` : `<span class="material-symbols-outlined text-slate-800 text-[42px]">account_balance</span>`}
                                    </div>
                                ` : ''}
                                <div>
                                    <div class="text-[11px] uppercase font-bold text-slate-600 tracking-wider whitespace-pre-line">${(escapeHtml(hdrBloco.subtitulo || 'Prefeitura Municipal')).replace(/\r?\n/g, '<br>')}</div>
                                    <div class="text-lg font-black uppercase text-slate-900 tracking-tight whitespace-pre-line">${(escapeHtml(hdrBloco.titulo || tpl.nome || 'FICHA CADASTRAL DO IMÓVEL')).replace(/\r?\n/g, '<br>')}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderFooterSlotHtml(ftrBloco, pageIdx, totalPages, padLeftMm, padRightMm) {
            if (!ftrBloco) return '';
            const pageText = getFooterPageNumberText(pageIdx, totalPages, ftrBloco);
            return `
                <div class="a4-page-footer-slot w-full mt-auto select-none" style="padding: 0 ${padRightMm}mm 6mm ${padLeftMm}mm;">
                    <div class="border-t border-slate-300 pt-2 text-[10px] text-slate-500 flex items-center justify-between font-mono page-break-avoid w-full">
                        <div>
                            ${ftrBloco.exibirDataHora !== false ? `Emitido em ${new Date().toLocaleDateString('pt-BR')} às ${new Date().toLocaleTimeString('pt-BR')}` : ''}
                            ${ftrBloco.exibirHash !== false ? `<span class="ml-2 font-bold text-slate-600">SHA-256: ${(ftrBloco.id || '8a4f91e').slice(-8)}...</span>` : ''}
                        </div>
                        <div class="font-bold text-slate-700">
                            ${pageText}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderBlocks(tpl, featureData = {}, featureGeometry = null) {
            const docContainer = document.getElementById('a4-document-container');
            if (!docContainer) return;

            // Busca campos para preenchimento
            let fields = [];
            let formTabs = [];
            if (reportPayload && Array.isArray(reportPayload.formFields) && reportPayload.formFields.length > 0) {
                fields = [...reportPayload.formFields];
            }
            if (reportPayload && Array.isArray(reportPayload.formTabs) && reportPayload.formTabs.length > 0) {
                formTabs = [...reportPayload.formTabs];
            }

            // Fallback para window.opener se abas ou campos estiverem vazios
            if ((formTabs.length === 0 || fields.length === 0) && typeof window !== 'undefined' && window.opener) {
                try {
                    const op = window.opener;
                    const opTabs = op.activeFormSchema || op.currentFormFeatures || op.activeFormTabs;
                    if (Array.isArray(opTabs) && opTabs.length > 0) {
                        if (formTabs.length === 0) formTabs = opTabs;
                        if (fields.length === 0) {
                            opTabs.forEach(t => {
                                if (Array.isArray(t.fields)) fields.push(...t.fields);
                            });
                        }
                    }
                } catch(e) {}
            }

            if (fields.length === 0) {
                try {
                    const forms = JSON.parse(localStorage.getItem('constructive_forms') || '[]');
                    const curForm = forms.find(f => f.id === tpl.form_id) || forms[0];
                    const tabsList = curForm?.tabs || (curForm?.schema && curForm.schema.tabs);
                    if (tabsList && Array.isArray(tabsList)) {
                        tabsList.forEach(t => {
                            if (t.fields) fields.push(...t.fields);
                        });
                        if (formTabs.length === 0) formTabs = tabsList;
                    }
                } catch(e) {}
            }
            window.reportViewerFormTabs = formTabs;
            window.reportViewerFormFields = fields;

            const blocos = tpl.blocos || [];
            const hdrBloco = blocos.find(b => b.tipo === 'cabecalho');
            const ftrBloco = blocos.find(b => b.tipo === 'rodape');
            const bodyBlocos = blocos.filter(b => b.tipo !== 'cabecalho' && b.tipo !== 'rodape');

            const pageDims = PageSize.dims(tpl.config_pagina);
            const mm = (tpl.config_pagina && tpl.config_pagina.margens_mm) || { top: 15, bottom: 15, left: 15, right: 15 };
            const pageHeightPx = pageDims.heightPx;
            const pageWidthPx = pageDims.widthPx;

            // Renderiza os blocos de corpo. Blocos "divisíveis" (tabelas longas) devolvem { split }.
            const renderedBodyBlocks = bodyBlocos.map((b, bIdx) => {
                const globalIdx = blocos.indexOf(b);
                const out = renderSingleBlock(b, globalIdx >= 0 ? globalIdx : bIdx, featureData, featureGeometry, fields, tpl);
                return (out && typeof out === 'object' && out.split) ? { bloco: b, split: out.split } : { bloco: b, html: out };
            });

            // Medição de altura para distribuição em folhas
            let measureBox = document.getElementById('a4-measure-stage');
            if (!measureBox) {
                measureBox = document.createElement('div');
                measureBox.id = 'a4-measure-stage';
                measureBox.style.cssText = 'position:absolute; left:-9999px; top:-9999px; visibility:hidden; width:' + (pageWidthPx - Math.round((mm.left + mm.right) * 3.78)) + 'px;';
                document.body.appendChild(measureBox);
            }
            measureBox.style.width = (pageWidthPx - Math.round((mm.left + mm.right) * 3.78)) + 'px';

            const headerHeightPx = hdrBloco ? 135 : 0;
            const footerHeightPx = ftrBloco ? 42 : 0;
            const marginHeightPx = Math.round((mm.top + mm.bottom) * 3.78);

            const maxBodyHeightP1 = pageHeightPx - headerHeightPx - footerHeightPx - marginHeightPx;
            const maxBodyHeightP2 = pageHeightPx - (hdrBloco && hdrBloco.repetir_todas_folhas ? headerHeightPx : 15) - footerHeightPx - marginHeightPx;

            // Bloco comum: altura total. Bloco divisível: altura fixa (título + cabeçalho da tabela) e de cada linha.
            const BLOCK_GAP = 20;
            renderedBodyBlocks.forEach(rb => {
                if (rb.split) {
                    measureBox.innerHTML = rb.split.chunkHtml(rb.split.rowsHtml, true);
                    const rowEls = Array.from(measureBox.querySelectorAll('[data-split-row]'));
                    rb.rowHeights = rowEls.map(el => Math.max(1, Math.ceil(el.getBoundingClientRect().height)));
                    const total = measureBox.firstElementChild ? measureBox.firstElementChild.offsetHeight : measureBox.offsetHeight;
                    rb.overheadH = Math.max(0, total - rb.rowHeights.reduce((a, c) => a + c, 0));
                } else {
                    measureBox.innerHTML = rb.html;
                    rb.h = Math.max(40, measureBox.firstElementChild ? measureBox.firstElementChild.offsetHeight : measureBox.offsetHeight) + BLOCK_GAP;
                }
            });
            measureBox.innerHTML = '';

            // Distribuição em folhas: blocos inteiros; tabelas longas quebram por linhas (sem cortar conteúdo)
            const pagesBlocks = [[]];
            let pageAcc = 0;
            let pageLimit = maxBodyHeightP1;
            const startNewPage = () => { pagesBlocks.push([]); pageAcc = 0; pageLimit = maxBodyHeightP2; };
            const currentPage = () => pagesBlocks[pagesBlocks.length - 1];

            renderedBodyBlocks.forEach(rb => {
                if (!rb.split) {
                    if (currentPage().length > 0 && pageAcc + rb.h > pageLimit) startNewPage();
                    currentPage().push(rb);
                    pageAcc += rb.h;
                    return;
                }
                let rows = rb.split.rowsHtml.slice();
                let heights = rb.rowHeights.slice();
                let isFirstChunk = true;
                while (rows.length > 0) {
                    let room = pageLimit - pageAcc - rb.overheadH - BLOCK_GAP;
                    if (room < heights[0] && currentPage().length > 0) {
                        startNewPage();
                        room = pageLimit - rb.overheadH - BLOCK_GAP;
                    }
                    let take = 0;
                    let used = 0;
                    while (take < rows.length && used + heights[take] <= room) { used += heights[take]; take++; }
                    if (take === 0) take = 1; // linha maior que a folha: entra sozinha
                    currentPage().push({ bloco: rb.bloco, html: rb.split.chunkHtml(rows.slice(0, take), isFirstChunk) });
                    pageAcc += rb.overheadH + used + BLOCK_GAP;
                    isFirstChunk = false;
                    rows = rows.slice(take);
                    heights = heights.slice(take);
                    if (rows.length > 0) startNewPage();
                }
            });
            if (pagesBlocks.length > 1 && pagesBlocks[pagesBlocks.length - 1].length === 0) pagesBlocks.pop();

            const totalPages = pagesBlocks.length;

            let pagesHtml = '';
            pagesBlocks.forEach((pageBlocks, pIdx) => {
                const pageNum = pIdx + 1;
                const isFirst = (pageNum === 1);
                const showHeader = isFirst || (hdrBloco && hdrBloco.repetir_todas_folhas);
                const showFooter = !!ftrBloco;

                const padTopMm = showHeader ? Math.max(2, mm.top - 8) : mm.top;
                const padBotMm = showFooter ? Math.max(2, mm.bottom - 8) : mm.bottom;

                const bodyHtml = pageBlocks.map(b => b.html).join('');
                const pageIdAttr = isFirst ? 'id="report-blocks-render"' : '';

                pagesHtml += `
                    <div class="a4-page w-full text-slate-900 ${totalPages === 1 ? 'single-page' : ''}" 
                         data-page="${pageNum}"
                         style="max-width: ${pageWidthPx}px; min-height: ${pageHeightPx}px; ">
                        
                        <!-- Cabeçalho Institucional: Fora do corpo, acima da margem superior -->
                        ${showHeader ? renderHeaderSlotHtml(hdrBloco, tpl, mm.left, mm.right) : ''}

                        <!-- Corpo da Folha: Delimitado entre as margens superior e inferior -->
                        <div ${pageIdAttr} class="a4-page-body-slot flex flex-col gap-5 w-full flex-1" style="padding: ${padTopMm}mm ${mm.right}mm ${padBotMm}mm ${mm.left}mm; box-sizing: border-box;">
                            ${bodyHtml}
                        </div>

                        <!-- Rodapé Oficial: Fora do corpo, abaixo da margem inferior, fixo na base -->
                        ${showFooter ? renderFooterSlotHtml(ftrBloco, pageNum, totalPages, mm.left, mm.right) : ''}
                    </div>
                `;
            });

            docContainer.innerHTML = pagesHtml;

            // Inicializa o Mini-Mapa Leaflet Interativo (com os ajustes que o usuário já salvou)
            setTimeout(() => {
                initReportMiniMap(featureGeometry);
            }, 100);
        }

        function getFieldWidthStyle(pct) {
            const p = Math.max(15, Math.min(100, Math.round(pct || 50)));
            if (p >= 98) return '100%';
            const gap = 10;
            const deduction = Math.round((gap * (1 - p / 100)) * 10) / 10;
            return `calc(${p}% - ${deduction}px)`;
        }

        /**
         * Grade de Atributos / Campos. Fotos e anexos respeitam a escolha do usuário por campo
         * (bloco.campos_exibicao): 'lista' (título + nome do arquivo) ou 'imagem' (na íntegra, com metadados).
         */
        function renderAttributeGrid(bloco, featureData, fields) {
            const fileModes = bloco.campos_exibicao || {};
            const colCount = bloco.colunasLayout || 2;
            const spans = bloco.campos_spans || {};
            const larguras = bloco.campos_larguras || {};

            const fieldsMap = new Map();
            fields.forEach(f => {
                fieldsMap.set(f.id, f);
                if (f.name) fieldsMap.set(f.name, f);
            });

            const rawSel = Array.isArray(bloco.campos_selecionados) ? bloco.campos_selecionados : [];
            let fldsToRender = rawSel
                .map(item => typeof item === 'string' ? { id: item } : item)
                .map(item => {
                    const baseField = fieldsMap.get(item.id) || fieldsMap.get(item.name) || {};
                    return { ...baseField, ...item };
                })
                .filter(f => f && (f.label || f.name));

            if (fldsToRender.length === 0 && rawSel.length > 0) {
                const selSet = new Set(rawSel.map(s => typeof s === 'string' ? s : s.id));
                fldsToRender = fields.filter(f => selSet.has(f.id));
            }
            if (fldsToRender.length === 0) fldsToRender = fields.slice(0, 8);

            if (colCount === 1) {
                return `
                    <div class="mb-4 page-break-avoid">
                        <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2 flex items-center justify-between">
                            <span class="whitespace-pre-line">${(escapeHtml(bloco.titulo || 'Dados Cadastrais')).replace(/\r?\n/g, '<br>')}</span>
                        </div>
                        <div class="divide-y divide-slate-200 border border-slate-200 rounded-lg overflow-hidden">
                            ${fldsToRender.map(f => {
                                const val = resolveFieldValue(f, featureData);
                                if (isRichField(f)) {
                                    return `
                                    <div class="px-3 py-1.5 text-xs bg-white odd:bg-slate-50/50">
                                        <div class="font-bold text-slate-600">${escapeHtml(f.label)}:</div>
                                        <div class="font-semibold text-slate-900 text-[11px] break-words whitespace-normal">${resolveFieldHtml(f, featureData, fileModes[f.id])}</div>
                                    </div>`;
                                }
                                return `
                                    <div class="flex items-center justify-between px-3 py-1.5 text-xs bg-white odd:bg-slate-50/50">
                                        <span class="font-bold text-slate-600 truncate">${escapeHtml(f.label)}:</span>
                                        <span class="font-semibold text-slate-900 truncate font-mono text-[11px]">${escapeHtml(val)}</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }

            return `
                <div class="mb-4 page-break-avoid">
                    <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2 flex items-center justify-between">
                        <span class="whitespace-pre-line">${(escapeHtml(bloco.titulo || 'Dados Cadastrais')).replace(/\r?\n/g, '<br>')}</span>
                    </div>
                    <div class="flex flex-wrap gap-2.5">
                        ${fldsToRender.map(f => {
                            const val = resolveFieldValue(f, featureData);
                            let pct = larguras[f.id];
                            if (!pct) {
                                const span = Math.min(spans[f.id] || f.colSpan || 1, colCount);
                                if (span >= colCount) pct = 100;
                                else if (colCount === 3 && span === 2) pct = 66;
                                else pct = colCount === 3 ? 33 : 50;
                            }
                            pct = Math.round(pct);
                            const widthStyle = getFieldWidthStyle(pct);
                            const isLongText = pct >= 45 || String(val).length > 25 || (f.id && (f.id.includes('endereco') || f.id.includes('obs'))) || (f.label && (f.label.toLowerCase().includes('endereço') || f.label.toLowerCase().includes('observa')));
                            return `
                                <div class="p-2 border border-slate-200 rounded-lg bg-slate-50/50" 
                                     style="flex: 0 0 ${widthStyle}; max-width: ${widthStyle}; width: ${widthStyle}; box-sizing: border-box;">
                                    <div class="text-[9.5px] uppercase font-bold text-slate-500 truncate">${escapeHtml(f.label)}</div>
                                    <div class="text-xs font-bold text-slate-800 mt-0.5 ${(isLongText || isRichField(f)) ? 'break-words whitespace-normal leading-snug' : 'truncate'}">${isRichField(f) ? resolveFieldHtml(f, featureData, fileModes[f.id]) : escapeHtml(val)}</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderSingleBlock(bloco, idx, featureData, featureGeometry, fields, tpl) {
            switch(bloco.tipo) {
                case 'cabecalho':
                    return `
                        <div class="mb-3 page-break-avoid ${bloco.repetir_todas_folhas ? 'cabecalho-repetir-todas' : ''}">
                            <!-- Metadados de Emissão e Protocolo fora do card/borda principal (topo direito) -->
                            ${(bloco.exibirDataHora || bloco.exibirProtocolo) ? `
                                <div class="flex items-center justify-end gap-3 text-[10px] font-mono text-slate-500 pb-1 mb-1 border-b border-slate-200/80">
                                    ${bloco.exibirDataHora ? `
                                        <div class="flex items-center gap-1">
                                            <span class="text-slate-400">Emissão:</span>
                                            <span class="font-medium text-slate-600">${new Date().toLocaleDateString('pt-BR')} ${new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}</span>
                                        </div>
                                    ` : ''}
                                    ${bloco.exibirProtocolo ? `
                                        <div class="flex items-center gap-1 font-bold text-slate-700 bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200/60">
                                            <span class="text-slate-400 font-normal">Protocolo:</span>
                                            <span>#${(bloco.id || '2026').slice(-6).toUpperCase()}</span>
                                        </div>
                                    ` : ''}
                                </div>
                            ` : ''}

                            <div class="flex items-center justify-between border-b-2 border-slate-900 pb-3 gap-4">
                                <div class="flex items-center gap-3">
                                    ${bloco.logo ? `
                                        <div class="w-14 h-14 bg-slate-100 rounded-lg flex items-center justify-center overflow-hidden shrink-0 border border-slate-200">
                                            ${bloco.logo_url ? `<img src="${bloco.logo_url}" class="w-full h-full object-contain" />` : `<span class="material-symbols-outlined text-slate-800 text-[42px]">account_balance</span>`}
                                        </div>
                                    ` : ''}
                                    <div>
                                        <div class="text-[11px] uppercase font-bold text-slate-600 tracking-wider whitespace-pre-line">${(escapeHtml(bloco.subtitulo || 'Prefeitura Municipal')).replace(/\r?\n/g, '<br>')}</div>
                                        <div class="text-lg font-black uppercase text-slate-900 tracking-tight whitespace-pre-line">${(escapeHtml(bloco.titulo || tpl.nome || 'FICHA CADASTRAL DO IMÓVEL')).replace(/\r?\n/g, '<br>')}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;

                case 'grade_campos': {
                    return renderAttributeGrid(bloco, featureData, fields);
                }

                case 'mapa_estatico': {
                    mapBloco = bloco;
                    const mcfg = MapTools.normalizeMapConfig(bloco);
                    const mapPx = Math.round(mcfg.alturaMm * 3.78);
                    return `
                        <div class="mb-4 page-break-avoid">
                            <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2 flex items-center justify-between">
                                <span class="whitespace-pre-line">${(escapeHtml(bloco.titulo || 'Delimitação Cartográfica do Imóvel')).replace(/\r?\n/g, '<br>')}</span>
                            </div>
                            <!-- Mini-mapa Leaflet (configurado no painel "Mapa" à direita) -->
                            <div class="relative rounded-lg overflow-hidden border border-slate-300 shadow-xs" style="height: ${mapPx}px;">
                                <div id="interactive-report-map" class="w-full bg-slate-200 z-0" style="height: ${mapPx}px;"></div>
                                <div id="map-north" class="report-map-overlay"><span class="material-symbols-outlined" style="font-size:18px;color:#fbbf24">navigation</span><span>N</span></div>
                                <div id="map-info-bar" class="report-map-overlay"></div>
                                <div id="map-legend" class="report-map-overlay"></div>
                            </div>
                            <!-- Dimensões da feição -->
                            <div id="map-dimensions-summary" class="mt-1.5 p-2 bg-slate-50 border border-slate-200 rounded-lg flex flex-wrap items-center justify-between gap-2 text-[10px] font-mono">
                                <div class="flex items-center gap-1.5">
                                    <span class="font-bold text-emerald-700">Georreferenciamento:</span>
                                    <span id="map-sides-text">Processando lados do polígono...</span>
                                </div>
                                <div id="map-area-text" class="font-bold text-slate-900">Área: —</div>
                            </div>
                            ${bloco.notaTecnica ? `<div class="mt-1 text-[9.5px] text-slate-500 font-mono px-1">${escapeHtml(bloco.notaTecnica)}</div>` : ''}
                        </div>
                    `;
                }

                case 'caixa_texto_livre':
                case 'texto_livre':
                    // Substitui @mentions na sequência do texto com o dado do campo sem o título
                    const processedText = replaceMentionsWithData(bloco.conteudo || '', featureData);
                    return `
                        <div class="mb-4 page-break-avoid">
                            ${bloco.titulo ? `
                                <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2 flex items-center justify-between">
                                    <span class="whitespace-pre-line">${(escapeHtml(bloco.titulo)).replace(/\r?\n/g, '<br>')}</span>
                                    <span class="no-print text-[10px] text-slate-400 font-normal">Clique para editar pontualmente</span>
                                </div>
                            ` : ''}
                            <div id="viewer-free-text-${idx}" 
                                 contenteditable="true" 
                                 class="free-text-editable text-xs text-slate-800 leading-relaxed p-3 bg-white border border-dashed border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-sky-500 transition-all cursor-text print:border-none print:p-0" 
                                 style="white-space: pre-wrap; line-height: ${bloco.espacamento || '1.6'}; text-align: ${bloco.alinhamento || 'justify'};"
                                 title="Clique para editar este texto antes de exportar">${processedText}</div>
                        </div>
                    `;

                case 'tabela_sintetica_1n': {
                    return renderSyntheticTable(bloco, featureData);
                }

                case 'laudo_vistoria_fotos':
                case 'galeria_fotos': {
                    return renderAnalyticalLaudo(bloco, featureData);
                }

                case 'rodape': {
                    const startMode = bloco.inicio_numeracao || 'primeira';
                    const isSecond = (startMode === 'segunda');
                    const pageText = isSecond ? '' : 'Página 1 de 1';
                    return `
                        <div class="border-t border-slate-300 pt-2 mt-auto text-[10px] text-slate-500 flex items-center justify-between font-mono page-break-avoid w-full">
                            <div>
                                ${bloco.exibirDataHora !== false ? `Emitido em ${new Date().toLocaleDateString('pt-BR')} às ${new Date().toLocaleTimeString('pt-BR')}` : ''}
                                ${bloco.exibirHash !== false ? `<span class="ml-2 font-bold text-slate-600">SHA-256: 8a4f91e...</span>` : ''}
                            </div>
                            <div class="font-bold text-slate-700">
                                ${bloco.numeracao !== false ? pageText : ''}
                            </div>
                        </div>
                    `;
                }

                default:
                    return '';
            }
        }

        /**
         * Substitui menções @ por dados reais da feição sem o título do campo.
         */
        /**
         * Substitui menções @ por dados reais da feição sem o título do campo,
         * aplicando formatação de máscaras (CPF/CNPJ, Endereço, etc.) e formatação rica (Negrito, Itálico, Sublinhado).
         */
        function replaceMentionsWithData(contentHtml, featureData) {
            if (!contentHtml) return '';
            
            const availableFields = (window.reportViewerFormFields && Array.isArray(window.reportViewerFormFields)) ? window.reportViewerFormFields : [];

            // 1. Substitui spans com menção estruturada (@campo) priorizando data-field-id (único por campo e aba)
            let result = contentHtml.replace(/<span[^>]*class="[^"]*mention-[^"]*"[^>]*>[\s\S]*?<\/span>/gi, (match) => {
                const idMatch = match.match(/data-field-id="([^"]+)"/i);
                const nameMatch = match.match(/data-field-name="([^"]+)"/i);
                const fId = idMatch ? idMatch[1] : null;
                const fName = nameMatch ? nameMatch[1] : null;

                // Extrai rótulo limpo do texto da menção (ex: "@Loteamento (Dados do Imóvel)" -> "Loteamento")
                const rawInnerText = match.replace(/<[^>]+>/g, '').replace(/^@/, '').trim();
                const cleanLabel = rawInnerText.replace(/\s*\([^)]*\)$/, '').trim();

                let fieldDef = availableFields.find(f => (fId && f.id === fId) || (fName && f.name === fName));
                if (!fieldDef && cleanLabel) {
                    fieldDef = availableFields.find(f => f.label && f.label.toLowerCase().trim() === cleanLabel.toLowerCase().trim());
                }
                if (!fieldDef) {
                    fieldDef = { id: fId, name: fName, label: cleanLabel };
                }
                if (!fieldDef.label && cleanLabel) fieldDef.label = cleanLabel;

                // Resolve o valor formatado através de resolveFieldValue (que já faz busca inteligente, aliases e formatação)
                let val = undefined;
                if (typeof resolveFieldValue === 'function') {
                    const resolved = resolveFieldValue(fieldDef, featureData, availableFields);
                    if (resolved !== '—') val = resolved;
                }

                // Fallback direto em featureData caso resolveFieldValue não encontre
                if (val === undefined || val === null || val === '') {
                    if (fId && featureData[fId] !== undefined && featureData[fId] !== null && featureData[fId] !== '') {
                        val = formatFieldValueForDisplay(featureData[fId], fieldDef);
                    } else if (fName && featureData[fName] !== undefined && featureData[fName] !== null && featureData[fName] !== '') {
                        val = formatFieldValueForDisplay(featureData[fName], fieldDef);
                    } else if (fName && featureData[fName.toLowerCase()] !== undefined && featureData[fName.toLowerCase()] !== null && featureData[fName.toLowerCase()] !== '') {
                        val = formatFieldValueForDisplay(featureData[fName.toLowerCase()], fieldDef);
                    }
                }

                if (val === undefined || val === null || val === '') {
                    val = '—';
                }

                let displayVal = String(val);

                // Detecta opções de formatação ricas (Negrito, Itálico, Sublinhado) aplicadas na tag ou pelo editor
                const isBold = match.includes('data-format-bold="true"') || 
                               /font-weight\s*:\s*(bold|700|800|900)/i.test(match) || 
                               /\bfont-black\b/i.test(match) || 
                               /\bis-bold\b/i.test(match);

                const isItalic = match.includes('data-format-italic="true"') || 
                                 /font-style\s*:\s*italic/i.test(match) || 
                                 /\bitalic\b/i.test(match);

                const isUnderline = match.includes('data-format-underline="true"') || 
                                   /text-decoration\s*:\s*underline/i.test(match) || 
                                   /\bunderline\b/i.test(match);

                let formattedOutput = escapeHtml(displayVal);
                if (isUnderline) formattedOutput = `<u>${formattedOutput}</u>`;
                if (isItalic) formattedOutput = `<em>${formattedOutput}</em>`;
                if (isBold) formattedOutput = `<strong>${formattedOutput}</strong>`;

                return formattedOutput;
            });

            // 2. Substitui spans legados caso existam
            result = result.replace(/<span[^>]*data-field-id="([^"]+)"[^>]*>.*?<\/span>/gi, (match, fId) => {
                const isBold = match.includes('data-format-bold="true"') || /font-weight\s*:\s*(bold|700|800|900)/i.test(match) || /\bfont-black\b/i.test(match) || /\bis-bold\b/i.test(match);
                const isItalic = match.includes('data-format-italic="true"') || /font-style\s*:\s*italic/i.test(match) || /\bitalic\b/i.test(match);
                const isUnderline = match.includes('data-format-underline="true"') || /text-decoration\s*:\s*underline/i.test(match) || /\bunderline\b/i.test(match);

                let fieldDef = availableFields.find(f => f.id === fId) || { id: fId };
                let val = (typeof resolveFieldValue === 'function') ? resolveFieldValue(fieldDef, featureData, availableFields) : undefined;
                if (val === undefined || val === null || val === '—') {
                    val = featureData[fId] ? formatFieldValueForDisplay(featureData[fId], fieldDef) : '—';
                }
                let out = escapeHtml(String(val));
                if (isUnderline) out = `<u>${out}</u>`;
                if (isItalic) out = `<em>${out}</em>`;
                if (isBold) out = `<strong>${out}</strong>`;
                return out;
            });

            result = result.replace(/<span[^>]*data-field-name="([^"]+)"[^>]*>.*?<\/span>/gi, (match, fName) => {
                const isBold = match.includes('data-format-bold="true"') || /font-weight\s*:\s*(bold|700|800|900)/i.test(match) || /\bfont-black\b/i.test(match) || /\bis-bold\b/i.test(match);
                const isItalic = match.includes('data-format-italic="true"') || /font-style\s*:\s*italic/i.test(match) || /\bitalic\b/i.test(match);
                const isUnderline = match.includes('data-format-underline="true"') || /text-decoration\s*:\s*underline/i.test(match) || /\bunderline\b/i.test(match);

                let fieldDef = availableFields.find(f => f.name === fName) || { name: fName };
                let val = (typeof resolveFieldValue === 'function') ? resolveFieldValue(fieldDef, featureData, availableFields) : undefined;
                if (val === undefined || val === null || val === '—') {
                    val = featureData[fName] ? formatFieldValueForDisplay(featureData[fName], fieldDef) : '—';
                }
                let out = escapeHtml(String(val));
                if (isUnderline) out = `<u>${out}</u>`;
                if (isItalic) out = `<em>${out}</em>`;
                if (isBold) out = `<strong>${out}</strong>`;
                return out;
            });

            // 3. Substitui padrões como @[Nome] ou @nome_campo
            for (const [key, rawVal] of Object.entries(featureData)) {
                if (rawVal !== null && rawVal !== undefined) {
                    const regex = new RegExp(`@\\[?${key}\\]?`, 'gi');
                    if (regex.test(result)) {
                        const fieldDef = availableFields.find(f => f.name === key || f.id === key) || { id: key, name: key };
                        const formatted = formatFieldValueForDisplay(rawVal, fieldDef);
                        result = result.replace(regex, escapeHtml(String(formatted)));
                    }
                }
            }

            return result;
        }

        /**
         * Extrai e normaliza registros 1:N da feição (vistorias, fotos, relatos, links).
         */
        // =====================================================================================
        // QUADRO SINTÉTICO E LAUDO ANALÍTICO — guiados pelo schema do formulário (src/reportData.js)
        //  • Abas: as que o usuário escolheu no bloco (por id ou título); sem escolha = todas as 1:N.
        //  • Colunas: os campos escolhidos (por id). A origem da linha é o TÍTULO da aba.
        //  • Valores: sempre formatados pelo TIPO do campo (src/fieldFormatter.js).
        //  • Tabelas longas quebram por linhas entre as folhas (retornam { split }).
        // =====================================================================================

        /** Converte a seleção do bloco (ids ou títulos de aba) nos ids das abas realmente disponíveis. */
        function resolveTabIds(list, tabs) {
            const out = [];
            (Array.isArray(list) ? list : []).forEach(entry => {
                const e = (entry && typeof entry === 'object') ? (entry.id || entry.tabId || entry.title) : entry;
                const tab = tabs.find(t => String(t.id) === String(e)) ||
                            tabs.find(t => ReportData.norm(t.title) === ReportData.norm(e));
                if (tab && !out.includes(tab.id)) out.push(tab.id);
            });
            return out;
        }

        /** Abas visíveis (permissão e condição já aplicadas no snapshot; a condição é reaplicada por segurança). */
        function getReportSchema(featureData) {
            const tabs = ReportData.visibleTabs(window.reportViewerFormTabs || [], featureData);
            return { tabs, fieldIndex: ReportData.buildFieldIndex(tabs) };
        }

        function getTableDensityClasses(density) {
            if (density === 'comfortable') {
                return { th: 'p-2 text-[10.5px] font-bold text-slate-700 uppercase border-b-2 border-slate-300', td: 'p-2 text-[11px] border-b border-slate-200' };
            }
            if (density === 'ultracompact') {
                return { th: 'py-0.5 px-1 text-[8.5px] font-bold text-slate-700 uppercase border-b-2 border-slate-300', td: 'py-0.5 px-1 text-[9px] font-medium border-b border-slate-200' };
            }
            return { th: 'py-1.5 px-2 text-[9.5px] font-bold text-slate-700 uppercase border-b-2 border-slate-300', td: 'py-1.5 px-2 text-[10px] border-b border-slate-200' };
        }

        function reportBlockNotice(bloco, defaultTitle, message) {
            return `
                <div class="mb-4 page-break-avoid">
                    <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2">
                        ${FieldFormatter.escapeHtml(bloco.titulo || defaultTitle)}
                    </div>
                    <div class="p-4 text-center text-slate-400 italic text-xs border border-dashed border-slate-300 rounded-lg bg-slate-50/60">${FieldFormatter.escapeHtml(message)}</div>
                </div>`;
        }

        const MSG_TABS_UNAVAILABLE = 'As abas escolhidas para este quadro não estão disponíveis (ocultas por permissão ou condição, ou removidas do formulário). Revise a seleção de abas no construtor.';

        function renderSyntheticTable(bloco, featureData) {
            const TITLE = 'Quadro Sintético de Vistorias (Histórico 1:N)';
            const esc = FieldFormatter.escapeHtml;
            const { tabs, fieldIndex } = getReportSchema(featureData);

            const sortOrder = bloco.ordem_cronologica || 'desc';
            const groupByTab = !!bloco.ordenar_por_aba;
            const hasSelection = Array.isArray(bloco.abas_selecionadas) && bloco.abas_selecionadas.length > 0;
            const tabIds = hasSelection ? resolveTabIds(bloco.abas_selecionadas, tabs) : [];
            if (hasSelection && tabIds.length === 0) return reportBlockNotice(bloco, TITLE, MSG_TABS_UNAVAILABLE);

            let records = ReportData.buildRecords(tabs, featureData, { tabIds });
            records = ReportData.sortRecords(records, sortOrder, groupByTab, bloco.ordem_abas);
            if (records.length === 0) {
                return reportBlockNotice(bloco, TITLE, 'Nenhum registro cadastrado nas abas selecionadas para este imóvel.');
            }

            const rawCols = (Array.isArray(bloco.colunas) && bloco.colunas.length) ? bloco.colunas : ['aba', 'data', 'qtd_fotos'];
            const cols = rawCols.map(c => ({
                col: c,
                id: (c && typeof c === 'object') ? c.id : c,
                label: ReportData.columnLabel(c, fieldIndex)
            }));
            const ctx = { fieldIndex, geometryCenter: getGeometryCenter() };
            const dens = getTableDensityClasses(bloco.densidade || 'compact');
            const striping = bloco.zebrado || 'slate';
            const NUMERIC = ['area_m2', 'length_m', 'volume_m3', 'currency'];

            const cellHtml = (c, r) => {
                const cell = ReportData.cellFor(c.col, r, ctx);
                if (c.id === 'aba' || c.id === 'org') return getOrgBadgeHtml(r.tabTitle);
                if (c.id === 'situacao_ocupacao') return getStatusBadgeHtml(cell.text);
                if (c.id === 'situacao_recuo') return getRecuoBadgeHtml(cell.text);
                return cell.html;
            };

            const rowsHtml = records.map((r, i) => {
                const odd = i % 2 === 1;
                let rowBg = odd ? 'bg-slate-50/70' : 'bg-white';
                if (striping === 'sky') rowBg = odd ? 'bg-sky-50/50' : 'bg-white';
                else if (striping === 'white') rowBg = 'bg-white';
                const tds = cols.map(c => {
                    const field = ReportData.fieldForColumn(c.col, r, fieldIndex);
                    const numeric = field && NUMERIC.includes(String(field.type || '').toLowerCase());
                    return `<td class="${dens.td} border-r last:border-r-0 border-slate-200 whitespace-normal break-words ${numeric ? 'text-right font-mono' : 'text-slate-700'}">${cellHtml(c, r)}</td>`;
                }).join('');
                return `<tr data-split-row class="${rowBg}" style="page-break-inside: avoid;">
                    <td class="${dens.td} border-r border-slate-200 text-center font-mono text-[10px] text-slate-400">${i + 1}</td>${tds}</tr>`;
            });

            const theadHtml = `<thead><tr class="bg-slate-100 border-b border-slate-200 text-slate-700">
                <th class="${dens.th} border-r border-slate-200 w-8 text-center">#</th>
                ${cols.map(c => `<th class="${dens.th} border-r last:border-r-0 border-slate-200 whitespace-normal break-words leading-tight">${esc(c.label)}</th>`).join('')}
            </tr></thead>`;

            const meta = `${records.length} registro(s) • ${sortOrder === 'asc' ? 'Antigo → Recente' : 'Recente → Antigo'}${groupByTab ? ' • Por Aba' : ''}`;
            const chunkHtml = (rows, isFirst) => `
                <div class="mb-4">
                    <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2 flex items-center justify-between">
                        <span class="whitespace-pre-line">${esc(bloco.titulo || TITLE)}${isFirst ? '' : ' (continuação)'}</span>
                        <span class="text-[10px] font-mono text-slate-500 normal-case">${esc(meta)}</span>
                    </div>
                    <div class="border border-slate-200 rounded-lg overflow-hidden shadow-2xs">
                        <table class="w-full text-left border-collapse">${theadHtml}<tbody>${rows.join('')}</tbody></table>
                    </div>
                </div>`;

            return { split: { rowsHtml, chunkHtml } };
        }

        function renderAnalyticalLaudo(bloco, featureData) {
            const TITLE = 'Laudo Analítico e Caderno Fotográfico';
            const esc = FieldFormatter.escapeHtml;
            const { tabs, fieldIndex } = getReportSchema(featureData);

            const sortOrder = bloco.ordem_cronologica || 'desc';
            const groupByTab = !!bloco.ordenar_por_aba;

            // Campos escolhidos (por id) e abas: escolhidas no bloco, ou deduzidas dos campos, ou todas as 1:N
            const rawSel = Array.isArray(bloco.campos_selecionados) ? bloco.campos_selecionados : [];
            const selFieldIds = rawSel.map(cf => (typeof cf === 'string') ? cf : (cf && (cf.rawId || cf.id))).filter(id => id && fieldIndex[id]);
            const hasTabSelection = Array.isArray(bloco.abas_selecionadas) && bloco.abas_selecionadas.length > 0;
            let tabIds = hasTabSelection ? resolveTabIds(bloco.abas_selecionadas, tabs) : [];
            if (!hasTabSelection && selFieldIds.length) {
                selFieldIds.forEach(fid => {
                    const ref = fieldIndex[fid];
                    if (ref && !tabIds.includes(ref.tab.id)) tabIds.push(ref.tab.id);
                });
            }
            if (hasTabSelection && tabIds.length === 0) return reportBlockNotice(bloco, TITLE, MSG_TABS_UNAVAILABLE);

            let records = ReportData.buildRecords(tabs, featureData, { tabIds });
            if (bloco.escopo === 'ultima') {
                const seenTab = new Set();
                records = ReportData.sortRecords(records, 'desc', true, bloco.ordem_abas).filter(r => !seenTab.has(r.tabId) && seenTab.add(r.tabId));
            }
            records = ReportData.sortRecords(records, sortOrder, true, bloco.ordem_abas);
            if (records.length === 0) {
                return reportBlockNotice(bloco, TITLE, 'Nenhum registro cadastrado nas abas selecionadas para este imóvel.');
            }

            const layout = bloco.layoutFotos || '2_cols';
            const gridClass = layout === '1_col' ? 'grid-cols-1' : (layout === 'grid_4' ? 'grid-cols-4' : 'grid-cols-2');
            const striping = bloco.zebrado || 'slate';
            const larguras = bloco.campos_larguras || {};
            const modes = bloco.campos_exibicao || {};   // { idDoCampo: 'lista' | 'imagem' }
            const fileMeta = { titulo: bloco.exibirLegenda !== false, autor: bloco.exibirResp !== false, data: bloco.exibirData !== false };
            const geometryCenter = getGeometryCenter();
            const WIDE = ['textarea', 'hiperlink', 'hiperlink_1n', 'attachment', 'cep'];

            const widthOf = (pct) => {
                const p = Math.round(pct);
                return p >= 98 ? '100%' : (p >= 65 ? '66.666%' : (p <= 28 ? '25%' : (p <= 38 ? '33.333%' : '50%')));
            };

            const photosHtml = (r) => {
                // Campos de foto que o usuário mandou exibir como LISTA saem como texto (título + arquivo)
                const listFields = (r.tab.fields || []).filter(f => String(f.type || '').toLowerCase() === 'photo' && modes[f.id] === 'lista');
                const listHtml = listFields.map(f => {
                    const v = FieldFormatter.toHtml(r.values[f.id], f, { fileMode: 'lista', fileMeta });
                    if (v === FieldFormatter.EMPTY) return '';
                    return `<div class="p-2 bg-white rounded-lg border border-slate-200 text-xs">
                        <span class="font-bold text-slate-500 uppercase text-[9px] block mb-0.5">${esc(f.label || f.name || f.id)}:</span>
                        <div class="text-[10.5px] text-slate-800 font-semibold break-words">${v}</div></div>`;
                }).join('');
                const photos = ReportData.recordPhotos(r, listFields.map(f => f.id));
                if (photos.length === 0) return listHtml;
                return `<div class="grid ${gridClass} gap-3 pt-1">${photos.map(p => {
                    const href = FieldFormatter.normalizeUrl(p.url);
                    if (!href) return '';
                    return `<div class="border border-slate-200 rounded-lg overflow-hidden bg-white flex flex-col shadow-2xs">
                        <a href="${esc(href)}" target="_blank" rel="noopener noreferrer" class="block h-44 bg-slate-100 overflow-hidden">
                            <img src="${esc(href)}" class="w-full h-full object-cover" alt="${esc(p.title)}" />
                        </a>
                        <div class="p-2 text-[10.5px] space-y-0.5 text-slate-600">
                            ${bloco.exibirLegenda !== false && p.title ? `<div class="font-bold text-slate-800 break-words">${esc(p.title)}</div>` : ''}
                            ${bloco.exibirData !== false && p.date ? `<div class="text-slate-500">Data: ${esc(p.date)}</div>` : ''}
                            ${bloco.exibirResp !== false && p.author ? `<div class="text-slate-500">Resp: ${esc(p.author)}</div>` : ''}
                        </div></div>`;
                }).join('')}</div>` + listHtml;
            };

            const cardHtml = (r, idx) => {
                let cardBg = idx % 2 === 1 ? 'bg-slate-100/70 border-slate-300' : 'bg-white border-slate-200';
                if (striping === 'sky') cardBg = idx % 2 === 1 ? 'bg-sky-50/50 border-sky-200' : 'bg-white border-slate-200';
                else if (striping === 'white') cardBg = 'bg-white border-slate-200';

                const fields = ReportData.recordFields(r, selFieldIds.length ? selFieldIds : null)
                    .filter(f => String(f.type || '').toLowerCase() !== 'photo');
                const cells = fields.map(f => {
                    const type = String(f.type || '').toLowerCase();
                    const pct = larguras[f.id] || (WIDE.includes(type) ? 100 : 50);
                    const w = widthOf(pct);
                    return `<div class="p-2 bg-white rounded-lg border border-slate-200 text-xs" style="flex: 0 0 ${w}; max-width: ${w}; width: ${w}; box-sizing: border-box;">
                        <span class="font-bold text-slate-500 uppercase text-[9px] block truncate mb-0.5">${esc(f.label || f.name || f.id)}:</span>
                        <div class="text-[10.5px] text-slate-800 font-semibold break-words whitespace-normal ${type === 'textarea' ? 'font-normal text-justify' : ''}">${FieldFormatter.toHtml(r.values[f.id], f, { geometryCenter, fileMode: modes[f.id], fileMeta })}</div>
                    </div>`;
                }).join('');

                return `<div class="border rounded-xl p-3 ${cardBg} space-y-2.5 shadow-2xs">
                    ${cells ? `<div class="flex flex-wrap gap-2">${cells}</div>` : '<div class="text-[10px] italic text-slate-400">Nenhum campo desta aba foi selecionado para o laudo.</div>'}
                    ${photosHtml(r)}
                </div>`;
            };

            // Uma "unidade" por registro (a primeira de cada aba leva o título do grupo). Cada unidade é indivisível.
            const perTabCount = {};
            records.forEach(r => { perTabCount[r.tabId] = (perTabCount[r.tabId] || 0) + 1; });
            const seenTab = {};
            const rowsHtml = records.map((r, i) => {
                let groupHeader = '';
                if (!seenTab[r.tabId]) {
                    seenTab[r.tabId] = true;
                    groupHeader = `<div class="flex items-center justify-between px-2.5 py-1.5 bg-slate-100 rounded-lg border border-slate-200 text-xs font-bold text-slate-800 uppercase tracking-wide mb-2">
                        <div class="flex items-center gap-1.5"><span>${esc(bloco['custom_tab_title_' + r.tabId] || ('Aba / Ente: ' + r.tabTitle))}</span></div>
                        <span class="text-[9.5px] font-mono font-bold text-slate-500 bg-white px-2 py-0.5 rounded-full border border-slate-200">${perTabCount[r.tabId]} registro(s)</span>
                    </div>`;
                }
                return `<div data-split-row>${groupHeader}${cardHtml(r, i)}</div>`;
            });

            const meta = `${records.length} registro(s) • ${sortOrder === 'asc' ? 'Antigo → Recente' : 'Recente → Antigo'}`;
            const chunkHtml = (rows, isFirst) => `
                <div class="mb-4">
                    <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2.5 flex items-center justify-between">
                        <span class="whitespace-pre-line">${esc(bloco.titulo || TITLE)}${isFirst ? '' : ' (continuação)'}</span>
                        <span class="text-[10px] font-mono text-slate-500 normal-case">${esc(meta)}</span>
                    </div>
