        /**
         * Substitui menções @ por dados reais da feição sem o título do campo,
         * aplicando formatação de máscaras (CPF/CNPJ, Endereço, etc.) e formatação rica (Negrito, Itálico, Sublinhado).
         */
        function replaceMentionsWithData(contentHtml, featureData) {
            if (!contentHtml) return '';
            
            const availableFields = (window.reportViewerFormFields && Array.isArray(window.reportViewerFormFields)) ? window.reportViewerFormFields : [];

            // 1. Substitui spans com menção estruturada (@campo) priorizando data-field-id (único por campo e aba)
            let result = contentHtml.replace(/<span[^>]*class="[^"]*mention-[^"]*"[^>]*>[\s\S]*?<\/span>/gi, (match) => {
                const idMatch = match.match(/data-field-id="([^"]+)"/i);
                const nameMatch = match.match(/data-field-name="([^"]+)"/i);
                const fId = idMatch ? idMatch[1] : null;
                const fName = nameMatch ? nameMatch[1] : null;

                // Extrai rótulo limpo do texto da menção (ex: "@Loteamento (Dados do Imóvel)" -> "Loteamento")
                const rawInnerText = match.replace(/<[^>]+>/g, '').replace(/^@/, '').trim();
                const cleanLabel = rawInnerText.replace(/\s*\([^)]*\)$/, '').trim();

                let fieldDef = availableFields.find(f => (fId && f.id === fId) || (fName && f.name === fName));
                if (!fieldDef && cleanLabel) {
                    fieldDef = availableFields.find(f => f.label && f.label.toLowerCase().trim() === cleanLabel.toLowerCase().trim());
                }
                if (!fieldDef) {
                    fieldDef = { id: fId, name: fName, label: cleanLabel };
                }
                if (!fieldDef.label && cleanLabel) fieldDef.label = cleanLabel;

                // Resolve o valor formatado através de resolveFieldValue (que já faz busca inteligente, aliases e formatação)
                let val = undefined;
                if (typeof resolveFieldValue === 'function') {
                    const resolved = resolveFieldValue(fieldDef, featureData, availableFields);
                    if (resolved !== '—') val = resolved;
                }

                // Fallback direto em featureData caso resolveFieldValue não encontre
                if (val === undefined || val === null || val === '') {
                    if (fId && featureData[fId] !== undefined && featureData[fId] !== null && featureData[fId] !== '') {
                        val = formatFieldValueForDisplay(featureData[fId], fieldDef);
                    } else if (fName && featureData[fName] !== undefined && featureData[fName] !== null && featureData[fName] !== '') {
                        val = formatFieldValueForDisplay(featureData[fName], fieldDef);
                    } else if (fName && featureData[fName.toLowerCase()] !== undefined && featureData[fName.toLowerCase()] !== null && featureData[fName.toLowerCase()] !== '') {
                        val = formatFieldValueForDisplay(featureData[fName.toLowerCase()], fieldDef);
                    }
                }

                if (val === undefined || val === null || val === '') {
                    val = '—';
                }

                let displayVal = String(val);

                // Detecta opções de formatação ricas (Negrito, Itálico, Sublinhado) aplicadas na tag ou pelo editor
                const isBold = match.includes('data-format-bold="true"') || 
                               /font-weight\s*:\s*(bold|700|800|900)/i.test(match) || 
                               /\bfont-black\b/i.test(match) || 
                               /\bis-bold\b/i.test(match);

                const isItalic = match.includes('data-format-italic="true"') || 
                                 /font-style\s*:\s*italic/i.test(match) || 
                                 /\bitalic\b/i.test(match);

                const isUnderline = match.includes('data-format-underline="true"') || 
                                   /text-decoration\s*:\s*underline/i.test(match) || 
                                   /\bunderline\b/i.test(match);

                let formattedOutput = escapeHtml(displayVal);
                if (isUnderline) formattedOutput = `<u>${formattedOutput}</u>`;
                if (isItalic) formattedOutput = `<em>${formattedOutput}</em>`;
                if (isBold) formattedOutput = `<strong>${formattedOutput}</strong>`;

                return formattedOutput;
            });

            // 2. Substitui spans legados caso existam
            result = result.replace(/<span[^>]*data-field-id="([^"]+)"[^>]*>.*?<\/span>/gi, (match, fId) => {
                const isBold = match.includes('data-format-bold="true"') || /font-weight\s*:\s*(bold|700|800|900)/i.test(match) || /\bfont-black\b/i.test(match) || /\bis-bold\b/i.test(match);
                const isItalic = match.includes('data-format-italic="true"') || /font-style\s*:\s*italic/i.test(match) || /\bitalic\b/i.test(match);
                const isUnderline = match.includes('data-format-underline="true"') || /text-decoration\s*:\s*underline/i.test(match) || /\bunderline\b/i.test(match);

                let fieldDef = availableFields.find(f => f.id === fId) || { id: fId };
                let val = (typeof resolveFieldValue === 'function') ? resolveFieldValue(fieldDef, featureData, availableFields) : undefined;
                if (val === undefined || val === null || val === '—') {
                    val = featureData[fId] ? formatFieldValueForDisplay(featureData[fId], fieldDef) : '—';
                }
                let out = escapeHtml(String(val));
                if (isUnderline) out = `<u>${out}</u>`;
                if (isItalic) out = `<em>${out}</em>`;
                if (isBold) out = `<strong>${out}</strong>`;
                return out;
            });

            result = result.replace(/<span[^>]*data-field-name="([^"]+)"[^>]*>.*?<\/span>/gi, (match, fName) => {
                const isBold = match.includes('data-format-bold="true"') || /font-weight\s*:\s*(bold|700|800|900)/i.test(match) || /\bfont-black\b/i.test(match) || /\bis-bold\b/i.test(match);
                const isItalic = match.includes('data-format-italic="true"') || /font-style\s*:\s*italic/i.test(match) || /\bitalic\b/i.test(match);
                const isUnderline = match.includes('data-format-underline="true"') || /text-decoration\s*:\s*underline/i.test(match) || /\bunderline\b/i.test(match);

                let fieldDef = availableFields.find(f => f.name === fName) || { name: fName };
                let val = (typeof resolveFieldValue === 'function') ? resolveFieldValue(fieldDef, featureData, availableFields) : undefined;
                if (val === undefined || val === null || val === '—') {
                    val = featureData[fName] ? formatFieldValueForDisplay(featureData[fName], fieldDef) : '—';
                }
                let out = escapeHtml(String(val));
                if (isUnderline) out = `<u>${out}</u>`;
                if (isItalic) out = `<em>${out}</em>`;
                if (isBold) out = `<strong>${out}</strong>`;
                return out;
            });

            // 3. Substitui padrões como @[Nome] ou @nome_campo
            for (const [key, rawVal] of Object.entries(featureData)) {
                if (rawVal !== null && rawVal !== undefined) {
                    const regex = new RegExp(`@\\[?${key}\\]?`, 'gi');
                    if (regex.test(result)) {
                        const fieldDef = availableFields.find(f => f.name === key || f.id === key) || { id: key, name: key };
                        const formatted = formatFieldValueForDisplay(rawVal, fieldDef);
                        result = result.replace(regex, escapeHtml(String(formatted)));
                    }
                }
            }

            return result;
        }

        /**
         * Extrai e normaliza registros 1:N da feição (vistorias, fotos, relatos, links).
         */
        function extract1nFeatureRecords(sourceTabId, featureData, fields = [], sortOrder = 'desc', groupByTab = false, tabOrder = []) {
            let rawRecords = [];
            const isConsolidado = !sourceTabId || sourceTabId === 'consolidado';

            if (isConsolidado) {
                // Varre todas as abas e propriedades que contêm arrays de registros 1:N
                for (const [key, val] of Object.entries(featureData || {})) {
                    let parsed = null;
                    if (Array.isArray(val) && val.length > 0 && typeof val[0] === 'object') {
                        parsed = val;
                    } else if (typeof val === 'string' && val.trim().startsWith('[') && val.includes('{')) {
                        try {
                            const arr = JSON.parse(val);
                            if (Array.isArray(arr) && arr.length > 0 && typeof arr[0] === 'object') parsed = arr;
                        } catch(e) {}
                    }
                    if (parsed) {
                        parsed.forEach(item => {
                            if (item && typeof item === 'object') {
                                rawRecords.push({ ...item, _origTab: key });
                            }
                        });
                    }
                }
            } else {
                let val = featureData ? featureData[sourceTabId] : null;
                if (!val && featureData) {
                    const cleanStr = s => String(s || '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, '');
                    const cleanTarget = cleanStr(sourceTabId);
                    for (const [k, v] of Object.entries(featureData)) {
                        if (cleanStr(k) === cleanTarget) {
                            val = v;
                            break;
                        }
                    }
                    if (!val && typeof window !== 'undefined' && window.reportViewerFormTabs && Array.isArray(window.reportViewerFormTabs)) {
                        const matchedTab = window.reportViewerFormTabs.find(t => cleanStr(t.id) === cleanTarget || cleanStr(t.title) === cleanTarget);
                        if (matchedTab) {
                            val = featureData[matchedTab.id] || featureData[matchedTab.title];
                        }
                    }
                }

                if (Array.isArray(val)) {
                    rawRecords = val.map(it => ({ ...it, _origTab: sourceTabId }));
                } else if (typeof val === 'string' && val.trim().startsWith('[')) {
                    try { 
                        const arr = JSON.parse(val) || [];
                        rawRecords = (Array.isArray(arr) ? arr : []).map(it => ({ ...it, _origTab: sourceTabId }));
                    } catch(e) { rawRecords = []; }
                }
            }

            // Garante inclusão de registro ministerial para MPF se a aba existir no formulário ou houver dados da feição
            const availableTabsPool = (typeof window !== 'undefined' && window.reportViewerFormTabs && Array.isArray(window.reportViewerFormTabs)) ? window.reportViewerFormTabs : (Array.isArray(tabOrder) ? tabOrder : []);
            const mpfTabDef = availableTabsPool.find(t => {
                const s = String(typeof t === 'object' ? (t.id || t.title) : t).toLowerCase();
                return s.includes('mpf') || s.includes('minist') || s.includes('procurad');
            });
            const hasMpfInRaw = rawRecords.some(r => {
                const orgStr = String(r._origTab || r.org || r.tabId || '').toLowerCase();
                return orgStr.includes('mpf') || orgStr.includes('minist');
            });
            const hasMpfDataInFeature = featureData && (
                featureData.mpf || featureData.tab_mpf || featureData.ipl || featureData.Inquerito_Policial || featureData.distribuicao || featureData.designado ||
                Object.keys(featureData).some(k => k.toLowerCase().includes('mpf') || k.toLowerCase().includes('inquerito'))
            );

            if (!hasMpfInRaw && (mpfTabDef || hasMpfDataInFeature || isConsolidado)) {
                const mpfSubData = (featureData && (featureData.mpf || featureData.tab_mpf || (mpfTabDef && featureData[mpfTabDef.id]))) || {};
                rawRecords.push({
                    ...mpfSubData,
                    _origTab: mpfTabDef ? (mpfTabDef.id || mpfTabDef.title) : 'MPF',
                    _origTitle: 'MPF',
                    sourceTab: 'MPF',
                    org: 'MPF',
                    _isConsolidatedMpf: true
                });
            }

            // Normaliza cada registro para garantir campos consistentes
            const normalized = rawRecords.map((r, idx) => {
                const availableTabs = (typeof window !== 'undefined' && window.reportViewerFormTabs && Array.isArray(window.reportViewerFormTabs)) ? window.reportViewerFormTabs : (Array.isArray(tabOrder) ? tabOrder : []);
                const cleanStr = s => String(s || '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, '');
                const origKey = String(r._origTab || sourceTabId || '');
                const cleanKey = cleanStr(origKey);

                let tabTitle = null;
                let tabFields = [];
                if (availableTabs.length > 0) {
                    const foundTab = availableTabs.find(t => {
                        const tId = typeof t === 'object' ? t.id : String(t);
                        const tTitle = typeof t === 'object' ? t.title : String(t);
                        return cleanStr(tId) === cleanKey || cleanStr(tTitle) === cleanKey || cleanKey.includes(cleanStr(tId)) || cleanStr(tId).includes(cleanKey);
                    });
                    if (foundTab && typeof foundTab === 'object') {
                        if (foundTab.title && !foundTab.title.toLowerCase().startsWith('f_') && !foundTab.title.toLowerCase().startsWith('tab_')) tabTitle = foundTab.title;
                        if (Array.isArray(foundTab.fields)) tabFields = foundTab.fields;
                    }
                }

                // Busca título legível da aba nos campos do formulário
                if ((!tabTitle || tabTitle.toLowerCase().startsWith('f_') || tabTitle.toLowerCase().startsWith('tab_')) && Array.isArray(fields)) {
                    const fWithTab = fields.find(f => (f.tabId && cleanStr(f.tabId) === cleanKey) || (f.tabTitle && cleanStr(f.tabTitle) === cleanKey));
                    if (fWithTab && fWithTab.tabTitle && !fWithTab.tabTitle.toLowerCase().startsWith('f_') && !fWithTab.tabTitle.toLowerCase().startsWith('tab_')) {
                        tabTitle = fWithTab.tabTitle;
                    }
                }

                const isInternalId = (s) => {
                    const str = String(s || '').trim();
                    return !str || str.startsWith('f_') || str.startsWith('tab_') || str.startsWith('p_') || str.startsWith('TAB_') || str.startsWith('P_') || (/^[a-z0-9_]{7,}$/i.test(str) && !/^[A-Z]{2,4}$/.test(str));
                };

                if (!tabTitle || isInternalId(tabTitle)) {
                    if (cleanKey.includes('mpf') || cleanKey.includes('minister') || cleanKey.includes('procurad')) tabTitle = 'MPF';
                    else if (cleanKey.includes('polic') || cleanKey === 'pf' || (cleanKey.includes('pf') && !cleanKey.includes('mpf'))) tabTitle = 'PF';
                    else if (cleanKey.includes('spu') || cleanKey.includes('patrimon')) tabTitle = 'SPU';
                    else if (cleanKey.includes('pm') || cleanKey.includes('munic') || cleanKey.includes('pref')) tabTitle = 'MUNICÍPIO';
                    else {
                        // Heurística profunda nos campos e valores do registro
                        const rKeysStr = Object.keys(r).join(' ').toLowerCase();
                        const rValsStr = Object.values(r).filter(v => typeof v === 'string').join(' ').toLowerCase();
                        if (rKeysStr.includes('mpf') || rValsStr.includes('mpf') || rKeysStr.includes('ministerio') || rValsStr.includes('ministerio') || rKeysStr.includes('procurador') || rValsStr.includes('procurador')) {
                            tabTitle = 'MPF';
                        } else if (rKeysStr.includes('epol') || rValsStr.includes('epol') || rKeysStr.includes('delegad') || rValsStr.includes('inquerito')) {
                            tabTitle = 'PF';
                        } else if (rKeysStr.includes('rip') || rValsStr.includes('rip') || rKeysStr.includes('patrimonio') || rValsStr.includes('spu')) {
                            tabTitle = 'SPU';
                        } else if (rKeysStr.includes('prefeitura') || rKeysStr.includes('alvara') || rValsStr.includes('prefeitura') || rKeysStr.includes('munic') || rValsStr.includes('munic')) {
                            tabTitle = 'MUNICÍPIO';
                        }
                    }
                }

                if (tabFields.length === 0 && Array.isArray(fields) && fields.length > 0) {
                    tabFields = fields.filter(f => {
                        if (f.tabId && cleanStr(f.tabId) === cleanKey) return true;
                        if (f.tabTitle && cleanStr(f.tabTitle) === cleanKey) return true;
                        return false;
                    });
                }

                let org = tabTitle || r.org || r.orgao || r.entidade;
                if (!org || isInternalId(org)) {
                    const fWithTab = (Array.isArray(fields) ? fields : []).find(f => (f.tabId === origKey || cleanStr(f.tabId) === cleanKey) && f.tabTitle && !isInternalId(f.tabTitle));
                    if (fWithTab && fWithTab.tabTitle) {
                        org = fWithTab.tabTitle;
                    } else if (tabTitle && !isInternalId(tabTitle)) {
                        org = tabTitle;
                    } else {
                        const rStr = (Object.keys(r).join(' ') + ' ' + Object.values(r).join(' ')).toUpperCase();
                        if (rStr.includes('MPF') || rStr.includes('MINIST') || (tpl && tpl.nome && tpl.nome.toUpperCase().includes('MPF'))) {
                            org = 'MPF';
                        } else {
                            org = 'Vistoria';
                        }
                    }
                }

                // 1. Data da Vistoria
                let rawDate = '';
                for (const f of tabFields) {
                    if (f.type === 'date' || (f.label && f.label.toLowerCase().includes('data')) || (f.id && f.id.toLowerCase().includes('data'))) {
                        if (r[f.id]) { rawDate = r[f.id]; break; }
                        if (f.name && r[f.name]) { rawDate = r[f.name]; break; }
                    }
                }
                if (!rawDate) {
                    for (const [k, v] of Object.entries(r)) {
                        if (typeof v === 'string' && (k.toLowerCase().includes('data') || k.toLowerCase().includes('date') || /^\d{4}-\d{2}-\d{2}/.test(v.trim()) || /^\d{2}\/\d{2}\/\d{4}/.test(v.trim()))) {
                            rawDate = v;
                            break;
                        }
                    }
                }
                if (!rawDate) rawDate = r.data_vistoria || r.data || r.data_visita || r._created_at || '';
                let formattedDate = '—';
                let timestamp = 0;
                if (rawDate) {
                    timestamp = parseDateToTimestamp(rawDate) || 0;
                    if (rawDate.includes('-')) {
                        const parts = rawDate.split('T')[0].split('-');
                        if (parts.length === 3) formattedDate = `${parts[2]}/${parts[1]}/${parts[0]}`;
                    } else {
                        formattedDate = rawDate;
                    }
                }

                // 2. Situação da Ocupação
                let situacaoOcupacao = '—';
                for (const f of tabFields) {
                    const fLabel = (f.label || '').toLowerCase();
                    if (fLabel.includes('ocupação') || fLabel.includes('ocupacao') || (f.id && f.id.toLowerCase().includes('ocupac'))) {
                        if (r[f.id] !== undefined && String(r[f.id]).trim() !== '') {
                            situacaoOcupacao = String(r[f.id]).trim();
                            break;
                        }
                    }
                }
                if (situacaoOcupacao === '—') {
                    for (const [k, v] of Object.entries(r)) {
                        if (typeof v === 'string' && v.trim() !== '') {
                            const vLow = v.toLowerCase();
                            if (vLow === 'irregular' || vLow === 'regular' || vLow.includes('invasão') || vLow.includes('invasao') || vLow.includes('não conforme') || vLow.includes('nao conforme') || vLow === 'conforme') {
                                situacaoOcupacao = v.trim();
                                break;
                            }
                        }
                    }
                }
                if (situacaoOcupacao === '—') {
                    situacaoOcupacao = r.situacao_ocupacao || r.situacao || r.status || r.ocupacao || '—';
                }

                // 3. Situação do Recuo
                let situacaoRecuo = '—';
                for (const f of tabFields) {
                    const fLabel = (f.label || '').toLowerCase();
                    if (fLabel.includes('recuo') || (f.id && f.id.toLowerCase().includes('recuo'))) {
                        if (r[f.id] !== undefined && String(r[f.id]).trim() !== '') {
                            situacaoRecuo = String(r[f.id]).trim();
                            break;
                        }
                    }
                }
                if (situacaoRecuo === '—') {
                    for (const [k, v] of Object.entries(r)) {
                        if (typeof v === 'string' && v.trim() !== '') {
                            const vLow = v.toLowerCase();
                            if (vLow.includes('já recuou') || vLow.includes('ja recuou') || vLow.includes('com recuo') || vLow.includes('sem recuo') || vLow.includes('não recuou') || vLow.includes('nao recuou') || vLow === 'recuado') {
                                situacaoRecuo = v.trim();
                                break;
                            }
                        }
                    }
                }
                if (situacaoRecuo === '—') {
                    situacaoRecuo = r.situacao_recuo || r.recuo || '—';
                }

                // 4. Área Invadida
                let areaInvadida = 0;
                let hasArea = false;
                for (const f of tabFields) {
                    const fLabel = (f.label || '').toLowerCase();
                    if (fLabel.includes('área invadida') || fLabel.includes('area invadida') || (fLabel.includes('área') && f.type === 'area_m2') || (f.id && f.id.toLowerCase().includes('area_invadida'))) {
                        if (r[f.id] !== undefined && r[f.id] !== '') {
                            areaInvadida = parseFloat(String(r[f.id]).replace(/\./g, '').replace(',', '.')) || 0;
                            hasArea = true;
                            break;
                        }
                    }
                }
                if (!hasArea) {
                    areaInvadida = parseFloat(r.area_invadida || r.area || 0) || 0;
                }

                // 5. Conclusão / Parecer / Relato / Observações
                let conclusao = '';
                for (const f of tabFields) {
                    const fLabel = (f.label || '').toLowerCase();
                    if (f.type === 'textarea' || fLabel.includes('conclus') || fLabel.includes('observa') || fLabel.includes('parecer') || fLabel.includes('relato') || fLabel.includes('descricao')) {
                        if (r[f.id] && String(r[f.id]).trim() !== '') {
                            conclusao = String(r[f.id]).trim();
                            break;
                        }
                    }
                }
                if (!conclusao) {
                    conclusao = r.conclusao || r.conclusão || r.observacao || r.parecer || r.relato || r.descricao || '';
                }
                if (!conclusao) {
                    for (const [k, v] of Object.entries(r)) {
                        if (typeof v === 'string' && v.trim().length > 15 && !v.startsWith('http') && !v.startsWith('data:') && !v.startsWith('{') && !v.startsWith('[')) {
                            conclusao = v.trim();
                            break;
                        }
                    }
                }
                let observacao = conclusao;
                let resp = r.responsavel || r.fiscal || r.vistoriador || r.agente || '—';

                // 6. Links e Processos Oficiais
                let links = [];
                for (const f of tabFields) {
                    if (f.type === 'hiperlink' || f.type === 'hiperlink_1n' || (f.label && f.label.toLowerCase().includes('link'))) {
                        const rawL = r[f.id];
                        if (rawL) {
                            if (Array.isArray(rawL)) links.push(...rawL);
                            else if (typeof rawL === 'string' && rawL.startsWith('[')) { try { links.push(...JSON.parse(rawL)); } catch(e){} }
                            else if (typeof rawL === 'string' && rawL.startsWith('{')) { try { links.push(JSON.parse(rawL)); } catch(e){} }
                            else if (typeof rawL === 'object') links.push(rawL);
                            else if (typeof rawL === 'string' && rawL.trim() !== '') links.push({ title: f.label, number: '', url: rawL });
                        }
                    }
                    if (f.type === 'epol' || (f.label && f.label.toLowerCase().includes('epol'))) {
                        const val = r[f.id];
                        if (val) links.push({ title: 'Processo EPOL', number: maskEpol(String(val)), url: '#' });
                    }
                    if (f.type === 'rip' || (f.label && f.label.toLowerCase().includes('rip'))) {
                        const val = r[f.id];
                        if (val) links.push({ title: 'Registro RIP', number: maskRip(String(val)), url: '#' });
                    }
                }
                if (r.epol || r.epol_1n) links.push({ title: 'Processo EPOL', number: maskEpol(String(r.epol || r.epol_1n)), url: '#' });
                if (r.rip || r.rip_1n) links.push({ title: 'Registro RIP', number: maskRip(String(r.rip || r.rip_1n)), url: '#' });
                if (Array.isArray(r.links)) links.push(...r.links);
                else if (typeof r.links === 'string' && r.links.startsWith('[')) {
                    try { links.push(...JSON.parse(r.links)); } catch(e) {}
                }
                if (r.hiperlink || r.hiperlinks) {
                    const hl = r.hiperlink || r.hiperlinks;
                    if (Array.isArray(hl)) links.push(...hl);
                    else if (typeof hl === 'object') links.push(hl);
                    else if (typeof hl === 'string') links.push({ title: 'Hiperlink', url: hl });
                }

                // 7. Fotografias
                let photos = [];
                const possiblePhotoKeys = ['fotos', 'foto', 'photos', 'photo', 'anexos', 'attachments', 'imagens', 'images'];
                for (const pk of possiblePhotoKeys) {
                    if (r[pk]) {
                        const rawP = r[pk];
                        if (Array.isArray(rawP)) {
                            photos.push(...rawP);
                        } else if (typeof rawP === 'string' && rawP.startsWith('[')) {
                            try { photos.push(...JSON.parse(rawP)); } catch(e) {}
                        } else if (typeof rawP === 'string' && rawP.trim() !== '') {
                            photos.push({ url: rawP, title: 'Fotografia' });
                        }
                    }
                }
                if (photos.length === 0) {
                    for (const [k, v] of Object.entries(r)) {
                        if (typeof v === 'string' && (v.startsWith('data:image/') || v.includes('.jpg') || v.includes('.png') || v.includes('.webp') || v.includes('supabase.co/storage'))) {
                            photos.push({ url: v, title: k });
                        }
                    }
                }

                const normalizedPhotos = photos.map((p, pIdx) => {
                    const url = typeof p === 'string' ? p : (p.url || '');
                    const title = (typeof p === 'object' && (p.title || p.name)) ? (p.title || p.name) : `Foto #${pIdx + 1}`;
                    const pDate = (typeof p === 'object' && p.uploadedAt) ? new Date(p.uploadedAt).toLocaleDateString('pt-BR') : formattedDate;
                    const coords = (typeof p === 'object' && p.coords) ? p.coords : (r.geolocation || r.coords || '');
                    return { url, title, date: pDate, coords, resp };
                }).filter(p => !!p.url);

                const sourceTabName = tabTitle || r._origTab || sourceTabId || 'Geral';

                return {
                    id: r.id || `rec_${idx}`,
                    timestamp,
                    formattedDate,
                    sourceTab: sourceTabName,
                    tabTitle,
                    tabFields,
                    org,
                    resp,
                    situacaoOcupacao,
                    situacaoRecuo,
                    areaInvadida,
                    conclusao,
                    observacao,
                    links,
                    photos: normalizedPhotos,
                    raw: r
                };
            });

            // Consolidação cruzada inteligente para MPF:
            // Herda a vistoria física mais recente realizada pelos órgãos parceiros (PF, SPU, Município)
            let latestPartnerRecord = null;
            let maxPartnerTs = -Infinity;

            normalized.forEach(r => {
                const rNorm = normalizeEnteTab(r.sourceTab || r.org || r.tabTitle || (r.raw && r.raw._origTab));
                if (rNorm !== 'mpf') {
                    const ts = r.timestamp || parseDateToTimestamp(r.formattedDate);
                    if (ts > maxPartnerTs || (latestPartnerRecord === null && r.formattedDate && r.formattedDate !== '—')) {
                        maxPartnerTs = ts;
                        latestPartnerRecord = r;
                    }
                }
            });

            normalized.forEach(r => {
                const rNorm = normalizeEnteTab(r.sourceTab || r.org || r.tabTitle || (r.raw && r.raw._origTab));
                if (rNorm === 'mpf') {
                    if (latestPartnerRecord) {
                        if (!r.formattedDate || r.formattedDate === '—') {
                            r.formattedDate = latestPartnerRecord.formattedDate;
                            r.timestamp = latestPartnerRecord.timestamp;
                        }
                        if (!r.situacaoOcupacao || r.situacaoOcupacao === '—') {
                            r.situacaoOcupacao = latestPartnerRecord.situacaoOcupacao;
                        }
                        if (!r.situacaoRecuo || r.situacaoRecuo === '—') {
                            r.situacaoRecuo = latestPartnerRecord.situacaoRecuo;
                        }
                        if (!r.areaInvadida || r.areaInvadida === 0) {
                            r.areaInvadida = latestPartnerRecord.areaInvadida;
                        }
                    }
                    // Anexa campos específicos do MPF (IPL, Distribuição, Designado, Correlatos, etc.) no próprio registro
                    const mpfKeys = [
                        'ipl', 'Inquerito_Policial', 'numero_inquerito_policial', 'inquerito',
                        'distribuicao', 'vara', 'vara_federal',
                        'designado', 'procurador', 'procurador_designado',
                        'correlatos', 'processos_correlatos', 'acp',
                        'fase_investigacao', 'Fase_investigacao', 'fase',
                        'providencia', 'providencias',
                        'valor_pecunia', 'pecunia', 'valor_total', 'valor_formatado', 'area_pecunia',
                        'observacoes', 'obs_pecunia', 'obs_inquerito_pf'
                    ];
                    mpfKeys.forEach(k => {
                        if (r[k] === undefined && featureData && featureData[k] !== undefined) {
                            r[k] = featureData[k];
                        }
                    });
                }
            });

            normalized.sort((a, b) => {
                if (groupByTab) {
                    const tabA = (a.sourceTab || '').toLowerCase();
                    const tabB = (b.sourceTab || '').toLowerCase();
                    if (Array.isArray(tabOrder) && tabOrder.length > 0) {
                        const idxA = tabOrder.findIndex(t => {
                            const tid = (typeof t === 'object' ? (t.id || t.title) : String(t)).toLowerCase();
                            return tid === tabA || tabA.includes(tid) || tid.includes(tabA);
                        });
                        const idxB = tabOrder.findIndex(t => {
                            const tid = (typeof t === 'object' ? (t.id || t.title) : String(t)).toLowerCase();
                            return tid === tabB || tabB.includes(tid) || tid.includes(tabB);
                        });
                        const posA = idxA !== -1 ? idxA : 999;
                        const posB = idxB !== -1 ? idxB : 999;
                        if (posA !== posB) return posA - posB;
                    }
                    if (tabA !== tabB) {
                        return tabA.localeCompare(tabB);
                    }
                }
                return sortOrder === 'asc' ? (a.timestamp - b.timestamp) : (b.timestamp - a.timestamp);
            });

            return normalized;
        }

        /**
         * Inicializa o Mini-Mapa Interativo Leaflet
         */
        function initInteractiveLeafletMap(geometry) {
            const mapContainer = document.getElementById('interactive-report-map');
            if (!mapContainer || typeof L === 'undefined') return;

            leafletMapInstance = L.map('interactive-report-map', {
                zoomControl: true,
                attributionControl: false
            });

            // Camadas base
            const streetsLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
            const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });
            
            currentBaseTileLayer = streetsLayer;
            streetsLayer.addTo(leafletMapInstance);

            window._reportMapStreets = streetsLayer;
            window._reportMapSatellite = satelliteLayer;

            if (geometry) {
                try {
                    activePolygonLayer = L.geoJSON(geometry, {
                        style: {
                            color: '#10b981',
                            weight: 3,
                            fillColor: '#34d399',
                            fillOpacity: 0.35
                        }
                    }).addTo(leafletMapInstance);

                    leafletMapInstance.fitBounds(activePolygonLayer.getBounds(), { padding: [30, 30] });

                    // Medição via Turf.js
                    if (typeof turf !== 'undefined') {
                        let turfGeom = geometry;
                        if (turfGeom.type === 'Feature') turfGeom = turfGeom.geometry;

                        const areaM2 = Math.round(turf.area(turfGeom) * 100) / 100;
                        document.getElementById('map-area-text').textContent = `Área: ${areaM2.toLocaleString('pt-BR')} m² (${(areaM2 / 10000).toFixed(4)} ha)`;

                        // Calcula segmentos
                        const coords = turfGeom.coordinates && turfGeom.coordinates[0];
                        if (coords && coords.length > 2) {
                            let sidesText = '';
                            for (let i = 0; i < coords.length - 1; i++) {
                                const p1 = coords[i];
                                const p2 = coords[i + 1];
                                const distM = Math.round(turf.distance(turf.point(p1), turf.point(p2), { units: 'meters' }) * 100) / 100;
                                sidesText += `L${i + 1}: ${distM}m  `;
                            }
                            document.getElementById('map-sides-text').textContent = sidesText || 'Polígono Fechado';
                        }
                    }
                } catch(e) {
                    console.error('[Leaflet] Erro ao renderizar geometria:', e);
                    leafletMapInstance.setView([-7.115, -34.863], 15);
                }
            } else {
                leafletMapInstance.setView([-7.115, -34.863], 15);
                document.getElementById('map-sides-text').textContent = 'Feição sem geometria associada';
            }

            // Atualiza texto de escala ao dar zoom
            leafletMapInstance.on('zoomend', () => {
                const z = leafletMapInstance.getZoom();
                const scaleEst = Math.round(591657550.5 / Math.pow(2, z));
                document.getElementById('map-scale-text').textContent = `Zoom ${z} • Escala ~1:${scaleEst.toLocaleString('pt-BR')}`;
            });
        }

        function toggleMapBasemap() {
            if (!leafletMapInstance) return;
            const btn = document.getElementById('btn-basemap-label');
            if (currentMapMode === 'streets') {
                leafletMapInstance.removeLayer(window._reportMapStreets);
                window._reportMapSatellite.addTo(leafletMapInstance);
                currentMapMode = 'satellite';
                if (btn) btn.textContent = 'Ruas';
            } else {
                leafletMapInstance.removeLayer(window._reportMapSatellite);
                window._reportMapStreets.addTo(leafletMapInstance);
                currentMapMode = 'streets';
                if (btn) btn.textContent = 'Satélite';
            }
        }

        // Garante que o navegador não imprima cabeçalhos/rodapés nativos indesejados (como 'about:blank', títulos ou data/hora do sistema)
        window.addEventListener('beforeprint', () => {
            window._savedDocTitle = document.title;
            document.title = '';
        });
        window.addEventListener('afterprint', () => {
            if (window._savedDocTitle) {
                document.title = window._savedDocTitle;
            }
        });

        function gerarPDF() {
            window.print();
        }

        /**
         * Gera download de arquivo .doc formatado nativamente para Microsoft Word
         */
        function gerarWord() {
            const docElement = document.getElementById('a4-document-container');
            if (!docElement) return;

            // Clona o elemento para limpar botões e elementos no-print
            const clone = docElement.cloneNode(true);
            clone.querySelectorAll('.no-print').forEach(el => el.remove());

            const htmlBody = clone.innerHTML;
            const docTitle = document.getElementById('report-header-title')?.textContent || 'Relatorio_Oficial';

            const wordHtml = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head>
                    <meta charset='utf-8'>
                    <title>${escapeHtml(docTitle)}</title>
                    <!--[if gte mso 9]>
                    <xml>
                        <w:WordDocument>
                            <w:View>Print</w:View>
                            <w:Zoom>100</w:Zoom>
                            <w:DoNotOptimizeForBrowser/>
                        </w:WordDocument>
                    </xml>
                    <![endif]-->
                    <style>
                        @page Section1 {
                            size: 595.3pt 841.9pt;
                            margin: 2.0cm 2.0cm 2.0cm 2.0cm;
                            mso-header-margin: 35.4pt;
                            mso-footer-margin: 35.4pt;
                            mso-paper-source: 0;
                        }
                        div.Section1 { page: Section1; }
                        body {
                            font-family: 'Arial', sans-serif;
                            font-size: 11pt;
                            color: #111827;
                        }
                        table {
                            width: 100%;
                            border-collapse: collapse;
                            margin-bottom: 12pt;
                        }
                        th, td {
                            border: 1px solid #cbd5e1;
                            padding: 6pt;
                            font-size: 10pt;
                        }
                        th {
                            background-color: #f1f5f9;
                            font-weight: bold;
                        }
                        h1, h2, h3 {
                            color: #0f172a;
                        }
                    </style>
                </head>
                <body>
                    <div class="Section1">
                        ${htmlBody}
                    </div>
                </body>
                </html>
            `;

            const blob = new Blob(['\ufeff', wordHtml], {
                type: 'application/msword;charset=utf-8'
            });

            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${docTitle.replace(/[\s\/\\:*?"<>|]+/g, '_')}_${Date.now()}.doc`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }
    </script>
