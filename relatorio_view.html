                        }
                        mapasDoBloco().forEach(div => { const m = mapaFeicoesInstances[div.id]; if (m) m.invalidateSize(); });
                        renderPainelPesquisaGeral();
                    };
                    document.addEventListener('mousemove', mover);
                    document.addEventListener('mouseup', soltar);
                });
            });
        }

        /**
         * Anexa alça interativa para esticar/comprimir a altura vertical de quadros 1:N (Sintético e Analítico)
         * e botões rápidos de densidade.
         */
        function anexarAlcaRedimensionarQuadro(res, bloco, idx) {
            if (!res) return res;
            const blocoId = bloco.id || ('quadro_' + idx);
            const densidadeAtual = bloco.densidade || 'compact';
            const isCompacta = densidadeAtual === 'compacta' || densidadeAtual === 'tight';
            const alcaHtml = `
                <div class="quadro-v-resize no-print" data-bloco-id="${blocoId}">
                    <div class="quadro-v-resize-bar" data-bloco-id="${blocoId}" title="Arraste para cima para comprimir ou para baixo para esticar as linhas deste quadro"></div>
                    <div class="quadro-v-density-pills" data-bloco-id="${blocoId}">
                        <span class="quadro-v-density-label">Densidade:</span>
                        <button type="button" class="quadro-pill-btn ${densidadeAtual === 'comfortable' ? 'active' : ''}" data-bloco-id="${blocoId}" data-dens="comfortable" title="Confortável: linhas arejadas">Confortável</button>
                        <button type="button" class="quadro-pill-btn ${densidadeAtual === 'compact' ? 'active' : ''}" data-bloco-id="${blocoId}" data-dens="compact" title="Padrão: espaçamento original">Padrão</button>
                        <button type="button" class="quadro-pill-btn ${isCompacta ? 'active' : ''}" data-bloco-id="${blocoId}" data-dens="compacta" title="Compacta: economiza altura e evita quebra indesejada de folha">Compacta</button>
                        <button type="button" class="quadro-pill-btn ${densidadeAtual === 'ultracompact' ? 'active' : ''}" data-bloco-id="${blocoId}" data-dens="ultracompact" title="Ultracompacta: máxima densidade na folha">Ultracompacta</button>
                    </div>
                </div>
            `;

            if (typeof res === 'object' && res.split) {
                const origChunkHtml = res.split.chunkHtml;
                return {
                    split: Object.assign({}, res.split, {
                        chunkHtml: function(rows, isFirst, semTabela) {
                            const chunk = origChunkHtml(rows, isFirst, semTabela);
                            return isFirst ? (chunk + alcaHtml) : chunk;
                        }
                    })
                };
            }
            if (typeof res === 'string') {
                return res + alcaHtml;
            }
            return res;
        }

        function ajustarDensidadeQuadro(blocoId, novaDensidade) {
            if (!tplAtual || !novaDensidade) return;
            const bloco = (tplAtual.blocos || []).find((b, idx) => (b.id === blocoId) || (('quadro_' + idx) === blocoId) || (('laudo_' + idx) === blocoId));
            if (bloco) {
                bloco.densidade = novaDensidade;
                try {
                    const tplId = tplAtual.id || (reportPayload && reportPayload.templateId) || 'default';
                    localStorage.setItem('constructive_block_density_' + tplId + '_' + blocoId, novaDensidade);
                } catch (e) {}
                desenharRelatorio();
            }
        }

        const DENSIDADES_ORDEM = ['comfortable', 'compact', 'compacta', 'ultracompact'];
        const DENSIDADES_NOMES = {
            comfortable: 'Confortável (arejada)',
            compact: 'Padrão',
            compacta: 'Compacta (economiza ~20% de altura)',
            ultracompact: 'Ultracompacta (máximo aproveitamento)'
        };

        function ligarRedimensionarQuadros1N() {
            // Cliques nos botões de pílula
            document.querySelectorAll('.quadro-pill-btn').forEach(btn => {
                if (btn._ligado) return;
                btn._ligado = true;
                btn.addEventListener('click', (ev) => {
                    ev.preventDefault(); ev.stopPropagation();
                    const blocoId = btn.getAttribute('data-bloco-id');
                    const dens = btn.getAttribute('data-dens');
                    ajustarDensidadeQuadro(blocoId, dens);
                });
            });

            // Arraste vertical com o mouse na barra
            document.querySelectorAll('.quadro-v-resize-bar').forEach(alca => {
                if (alca._ligada) return;
                alca._ligada = true;
                alca.addEventListener('mousedown', (ev) => {
                    ev.preventDefault(); ev.stopPropagation();
                    const blocoId = alca.getAttribute('data-bloco-id');
                    const wrap = alca.closest('.quadro-v-resize');
                    if (wrap) wrap.classList.add('arrastando');

                    const bloco = (tplAtual && tplAtual.blocos || []).find((b, idx) => (b.id === blocoId) || (('quadro_' + idx) === blocoId) || (('laudo_' + idx) === blocoId));
                    const densAtual = (bloco && bloco.densidade) || 'compact';
                    let idxBase = DENSIDADES_ORDEM.indexOf(densAtual === 'tight' ? 'compacta' : densAtual);
                    if (idxBase === -1) idxBase = 1;

                    let tooltip = document.createElement('div');
                    tooltip.className = 'quadro-resize-tooltip';
                    tooltip.innerHTML = `↕ Densidade: <b>${DENSIDADES_NOMES[DENSIDADES_ORDEM[idxBase]]}</b>`;
                    tooltip.style.left = (ev.clientX + 14) + 'px';
                    tooltip.style.top = (ev.clientY - 24) + 'px';
                    document.body.appendChild(tooltip);

                    const y0 = ev.clientY;
                    let targetIdx = idxBase;

                    const mover = (e) => {
                        const dy = e.clientY - y0;
                        tooltip.style.left = (e.clientX + 14) + 'px';
                        tooltip.style.top = (e.clientY - 24) + 'px';

                        // Arrastar para CIMA (-dy) = comprimir (índices maiores: compacta, ultracompact)
                        // Arrastar para BAIXO (+dy) = esticar (índices menores: compact, comfortable)
                        const stepDelta = Math.round(-dy / 28);
                        targetIdx = Math.max(0, Math.min(DENSIDADES_ORDEM.length - 1, idxBase + stepDelta));
                        const nomeDens = DENSIDADES_ORDEM[targetIdx];
                        tooltip.innerHTML = `↕ Densidade: <b>${DENSIDADES_NOMES[nomeDens]}</b> (solte para aplicar)`;
                    };

                    const soltar = () => {
                        document.removeEventListener('mousemove', mover);
                        document.removeEventListener('mouseup', soltar);
                        if (tooltip && tooltip.parentNode) tooltip.parentNode.removeChild(tooltip);
                        if (wrap) wrap.classList.remove('arrastando');
                        const novaDens = DENSIDADES_ORDEM[targetIdx];
                        if (novaDens && novaDens !== densAtual) {
                            ajustarDensidadeQuadro(blocoId, novaDens);
                        }
                    };

                    document.addEventListener('mousemove', mover);
                    document.addEventListener('mouseup', soltar);
                });
            });
        }

        /**

        /**
         * Extrai e normaliza registros 1:N da feição (vistorias, fotos, relatos, links).

        // =====================================================================================
        // QUADRO SINTÉTICO E LAUDO ANALÍTICO — guiados pelo schema do formulário (src/reportData.js)
        //  • Abas: as que o usuário escolheu no bloco (por id ou título); sem escolha = todas as 1:N.
        //  • Colunas: os campos escolhidos (por id). A origem da linha é o TÍTULO da aba.

        // Quadro sintético e laudo analítico: desenhados por src/reportBlocks.js (o construtor usa os mesmos, com controles de edição)
        const { renderSyntheticTable, renderAnalyticalLaudo } = Blocks;

        // =====================================================================================
        // MINI-MAPA DO RELATÓRIO: configuração do modelo + ajustes do usuário (salvos por relatório + feição)
        // =====================================================================================
        const AJUSTES_STORAGE_KEY = 'constructive_report_ajustes';

        function getOpenerAdapter() {
            try {
                return (window.opener && !window.opener.closed && window.opener.ReportAdapter) ? window.opener.ReportAdapter : null;
            } catch (e) { return null; }
        }

        function mapAjusteIds() {
            const tplId = (reportPayload && (reportPayload.templateId || (reportPayload.template && reportPayload.template.id))) || '';
            const key = (reportPayload && reportPayload.featureKey) || MapTools.featureKey(reportPayload && reportPayload.featureData) || '';
            return { tplId: String(tplId), key: String(key), formId: (reportPayload && reportPayload.formId) || '' };
        }

        const emPrevia = () => !!(reportPayload && reportPayload.preview);

        async function loadMapAjustes() {
            if (emPrevia()) return null; // prévia: sempre o padrão do modelo
            const { tplId, key } = mapAjusteIds();
            if (!tplId || !key) return null;
            const adapter = getOpenerAdapter();
            if (adapter && typeof adapter.getAjustes === 'function') {
                try { return await adapter.getAjustes(tplId, key); } catch (e) { /* cai para o navegador */ }
            }
            try { return (JSON.parse(localStorage.getItem(AJUSTES_STORAGE_KEY) || '{}') || {})[tplId + '|' + key] || null; } catch (e) { return null; }
        }

        async function persistMapAjustes(ajustes) {
            if (emPrevia()) return { ok: false, motivo: 'previa' };
            const { tplId, key, formId } = mapAjusteIds();
            if (!tplId || !key) return { ok: false, motivo: 'sem-feicao' };
            const adapter = getOpenerAdapter();
            if (adapter && typeof adapter.saveAjustes === 'function') {
                try { return await adapter.saveAjustes(tplId, key, formId, ajustes); } catch (e) { /* cai para o navegador */ }
            }
            try {
                const all = JSON.parse(localStorage.getItem(AJUSTES_STORAGE_KEY) || '{}') || {};
                all[tplId + '|' + key] = ajustes;
                localStorage.setItem(AJUSTES_STORAGE_KEY, JSON.stringify(all));
                return { ok: true, remoto: false };
            } catch (e) { return { ok: false, motivo: 'erro' }; }
        }


        // SINCRONIZAÇÃO EM TEMPO REAL: "Camadas ativas no mapa" sincronizado com o menu de camadas do projeto ativo em index.html
        function sincronizarCamadasDoMenu(forceApply) {
            if (typeof window === 'undefined' || !window.opener || !Array.isArray(window.opener.themes)) return;
            try {
                const op = window.opener;
                let projectThemes = [];
                if (op.document) {
                    try {
                        const domContainer = op.document.getElementById('themes-container');
                        if (domContainer) {
                            const cards = domContainer.querySelectorAll('.theme-card');
                            if (cards && cards.length > 0) {
                                const ids = Array.from(cards).map(c => String(c.dataset.id || c.id.replace('theme-card-', ''))).filter(Boolean);
                                const tMap = new Map((op.themes || []).map(t => [String(t.id), t]));
                                projectThemes = ids.map(id => tMap.get(id)).filter(t => t && ((typeof op.userCanOnTheme !== 'function') || op.userCanOnTheme(t.id, 'ver')));
                            }
                        }
                    } catch(eDom) {}
                }
                if (!projectThemes.length) {
                    const isThemeInMenu = (t) => {
                        if (typeof op.userCanOnTheme === 'function' && !op.userCanOnTheme(t.id, 'ver')) return false;
                        if (typeof op.isThemeInWorkspace === 'function') return op.isThemeInWorkspace(t.id);
                        if (Array.isArray(op.activeWorkspaceThemes)) return op.activeWorkspaceThemes.some(x => String(x) === String(t.id));
                        return true;
                    };
                    projectThemes = op.themes.filter(isThemeInMenu);
                }
                const geom = (renderArgs && renderArgs.featureGeometry) || (reportPayload && reportPayload.featureGeometry) || window.currentReportGeometry || null;
                const mt = op.MapTools || window.MapTools;
                if (!mt || typeof mt.collectNearbyLayers !== 'function') return;

                const rotulos = (theme, f) => {
                    try {
                        if (typeof op.canUserSeeThemeData === 'function' && !op.canUserSeeThemeData(theme)) return null;
                        if (typeof op.getFeaturePropertyValue !== 'function') return null;
                        const lab = (k) => (typeof op.getThemeFieldLabel === 'function' ? op.getThemeFieldLabel(theme, k) : k);
                        const partes = [];
                        if (theme.disp2Active !== false) { const v = op.getFeaturePropertyValue(theme, f, theme.disp2 || 'Quadra'); if (v) partes.push(lab(theme.disp2 || 'Quadra') + ' ' + v); }
                        if (theme.disp1Active !== false) { const v = op.getFeaturePropertyValue(theme, f, theme.disp1 || 'Lote'); if (v) partes.push(lab(theme.disp1 || 'Lote') + ' ' + v); }
                        const titulo = op.getFeaturePropertyValue(theme, f, theme.mainTitle || 'Proprietário');
                        return { r: partes.join(' • '), t: titulo ? String(titulo) : '' };
                    } catch (e) { return null; }
                };

                const novasCamadas = mt.collectNearbyLayers(projectThemes, geom, {
                    bufferM: 1500,
                    excludeKey: (reportPayload && reportPayload.featureKey) || '',
                    canSee: (id) => (typeof op.userCanOnTheme !== 'function') || op.userCanOnTheme(id, 'ver'),
                    includeAllThemes: true,
                    includeEmpty: true,
                    labelFn: rotulos
                });

                if (Array.isArray(novasCamadas)) {
                    if (!reportPayload) reportPayload = {};
                    reportPayload.camadasMapa = novasCamadas;

                    if (mapController) {
                        const cfgAtual = mapController.getConfig();
                        const ligadasExistentes = new Set((cfgAtual.camadasLigadas || []).map(String));
                        const menuVisiveis = new Set(projectThemes.filter(t => t.visible !== false).map(t => String(t.id)));
                        
                        // Mantém ligadas as que já estavam ligadas pelo usuário OU as que estão visíveis no menu
                        const novasLigadas = novasCamadas
                            .filter(c => ligadasExistentes.has(String(c.id)) || menuVisiveis.has(String(c.id)))
                            .map(c => String(c.id));
                        
                        mapController.setConfig({ camadasLigadas: novasLigadas });

                        if (typeof mapController.setCamadas === 'function') {
                            mapController.setCamadas(novasCamadas);
                        }
                    }

                    if (temporalController && typeof temporalController.refreshLayers === 'function') {
                        temporalController.refreshLayers();
                    }

                    renderMapToolsPanel();
                    scheduleRepaginate();
                    scheduleEmissao();
                }
            } catch(e) {
                console.warn('[sincronizarCamadasDoMenu] Aviso na sincronização:', e);
            }
        }
        window.sincronizarCamadasDoMenu = sincronizarCamadasDoMenu;

        if (typeof BroadcastChannel !== 'undefined') {
            try {
                const bc = new BroadcastChannel('sig_project_sync');
                bc.onmessage = (ev) => {
                    if (ev.data && (ev.data.type === 'PROJECT_CHANGED' || ev.data.type === 'THEMES_CHANGED')) {
                        sincronizarCamadasDoMenu(true);
                    }
                };
            } catch(e) {}
        }
        window.addEventListener('storage', (ev) => {
            if (ev.key === 'sig_last_active_project_change' || (ev.key && ev.key.startsWith('last_active_project_'))) {
                sincronizarCamadasDoMenu(true);
            }
        });
        window.addEventListener('focus', () => {
            sincronizarCamadasDoMenu();
        });

        async function initReportMiniMap(geometry) {
            sincronizarCamadasDoMenu();
            window.currentReportGeometry = geometry;
            const mapContainer = document.getElementById('interactive-report-map');
            if (!mapContainer || typeof L === 'undefined' || !mapBloco) return;

            mapBaseConfig = MapTools.normalizeMapConfig(mapBloco);
            mapBaseConfig.referencia.ativo = false; // "Distância e sobreposição (camada de referência)" foi retirada do relatório
            let ajustes = null;
            try { ajustes = await loadMapAjustes(); } catch (e) {}
            const config = MapTools.mergeAjustes(mapBaseConfig, ajustes);
            config.referencia.ativo = false;
            const camadas = (reportPayload && Array.isArray(reportPayload.camadasMapa)) ? reportPayload.camadasMapa : [];

            if (Array.isArray(camadas) && camadas.length > 0 && (!config.camadasLigadas || config.camadasLigadas.length === 0)) {
                config.camadasLigadas = camadas.map(c => String(c.id));
            }

            try {
                lastPontosKey = blocosKey(config);
                mapController = ReportMap.create({ L, MapTools, container: 'interactive-report-map', geometry, camadas, onMeasureState: () => renderMapToolsPanel(), onMedicaoCriada: (id) => abrirModalTipoArea(id), ortofotos: (reportPayload && Array.isArray(reportPayload.ortofotos)) ? reportPayload.ortofotos : [], config, onChange: onMapChange });
            } catch (e) {
                console.error('[Mapa] Erro ao criar o mini-mapa:', e);
                return;
            }
            aplicarAlturaMapa(config.alturaMm); // altura escolhida pelo usuário na última vez
            renderMapToolsPanel();
            // análise temporal: ortofotos que a página do mapa entregou (só as que o usuário pode ver)
            const ortofotos = (reportPayload && Array.isArray(reportPayload.ortofotos)) ? reportPayload.ortofotos : [];
            if (ortofotos.length) {
                temporalController = ReportTemporal.create({
                    L, MapTools, geometry, ortofotos, config: config.temporal, corContorno: config.destaque.cor,
                    camadas: camadas,
                    getActiveLayerIds: () => (mapController ? mapController.getConfig().camadasLigadas : (config.camadasLigadas || [])),
                    probe: makeOrtofotoProbe(geometry),
                    onStructureChange: () => { renderMapToolsPanel(); scheduleRepaginate(); scheduleEmissao(); },
                    onChange: () => { renderMapToolsPanel(); scheduleEmissao(); }
                });
                if (config.temporal.ativo) temporalController.start();
            }
            renderMapToolsPanel();
            // pontos e série temporal já salvos: os blocos precisam entrar na paginação
            const temPontos = mapController.pointRows().rows.length && config.pontos.ativo && config.pontos.tabela;
            const temAnalises = (config.confrontantes.ativo && config.confrontantes.camada) || (config.referencia.ativo && config.referencia.camada) || (config.comparacaoArea.ativo && config.comparacaoArea.campo);
            if (temPontos || temAnalises || (temporalController && config.temporal.ativo)) scheduleRepaginate();
        }

        // Ortofotos em tiles não informam a área que cobrem: pede o tile do centro da feição; se não existe, o quadro sai.
        function makeOrtofotoProbe(geometry) {
            const bb = MapTools.geometryBBox(geometry);
            const c = bb ? MapTools.bboxCenter(bb) : null;
            return (o) => new Promise(resolve => {
                if (o && o.coberturaConhecida) { resolve(true); return; }
                if (!c) { resolve(null); return; }
                const z = MapTools.probeZoom(o);
                const t = MapTools.tileXY(c[1], c[0], z);
                const img = new Image();
                let done = false;
                const fin = (v) => { if (!done) { done = true; clearTimeout(timer); resolve(v); } };
                const timer = setTimeout(() => fin(null), 8000);
                img.onload = () => fin(true);
                img.onerror = () => fin(false);
                img.src = MapTools.tileUrl(o.url, t.x, t.y, z);
            });
        }

        // ajustes completos para salvar: mapa + série temporal
        function snapshotCompleto() {
            const s = mapController.snapshot();
            if (temporalController) s.temporal = temporalController.snapshot();
            return s;
        }

        // ---------------- pontos nos vértices: tabela (com memorial) e repaginação
        function onMapChange(cfg) {
            scheduleEmissao();
            if (mapController && cfg.alturaMm !== mapAlturaMm) { aplicarAlturaMapa(cfg.alturaMm); renderMapToolsPanel(); }
            const key = blocosKey(cfg);
            if (key === lastPontosKey) return;
            lastPontosKey = key;
            if (!mapController) return; // ainda montando
            renderMapToolsPanel();
            scheduleRepaginate();
        }

        // ---- altura do mapa na folha: arrastar a borda inferior, digitar em mm ou preencher o espaço livre da folha
        function mapaAlturaMaxMm() {
            const tpl = renderArgs && renderArgs.tpl;
            const d = PageSize.dims(tpl && tpl.config_pagina);
            const m = (tpl && tpl.config_pagina && tpl.config_pagina.margens_mm) || { top: 15, bottom: 15 };
            // sobra da folha depois do cabeçalho, do rodapé, das margens e da caixa de dimensões que vem embaixo do mapa
            const px = d.heightPx - Math.round(((m.top || 0) + (m.bottom || 0)) * 3.78) - 135 - 42 - 110;
            return Math.max(60, Math.floor(px / 3.78));
        }
        function mapaAlturaLimitada(mm) { return Math.round(Math.min(mapaAlturaMaxMm(), Math.max(40, Number(mm) || 0))); }
        /** Nova altura (mm) que aproveita o espaço livre (px) no fim da folha; nunca fora de [40, max]. */
        function mapaAlturaPreenchida(atualMm, livrePx, maxMm) {
            return Math.round(Math.min(maxMm, Math.max(40, atualMm + livrePx / 3.78 - 3)));
        }
        function aplicarAlturaMapa(mm) {
            const nova = mapaAlturaLimitada(mm);
            if (nova === mapAlturaMm) return;
            mapAlturaMm = nova;
            const px = Math.round(nova * 3.78) + 'px';
            const wrap = document.getElementById('map-wrap');
            const inner = document.getElementById('interactive-report-map');
            if (wrap) wrap.style.height = px;
            if (inner) inner.style.height = px;
            if (mapController) mapController.invalidate();
            scheduleRepaginate();
        }
        document.addEventListener('pointerdown', (ev) => {
            const h = ev.target && ev.target.closest ? ev.target.closest('#map-resize') : null;
            if (!h || !mapController) return;
            ev.preventDefault();
            const wrap = document.getElementById('map-wrap');
            const inner = document.getElementById('interactive-report-map');
            if (!wrap || !inner) return;
            const y0 = ev.clientY, h0 = wrap.getBoundingClientRect().height;
            const minPx = 40 * 3.78, maxPx = mapaAlturaMaxMm() * 3.78;
            let px = h0;
            h.classList.add('ativo');
            const move = (e) => {
                px = Math.min(maxPx, Math.max(minPx, h0 + (e.clientY - y0)));
                wrap.style.height = inner.style.height = Math.round(px) + 'px';
                mapController.invalidate();
            };
            const up = () => {
                document.removeEventListener('pointermove', move);
                document.removeEventListener('pointerup', up);
                h.classList.remove('ativo');
                mapController.setAltura(Math.round(px / 3.78));
            };
            document.addEventListener('pointermove', move);
            document.addEventListener('pointerup', up);
        });

        function scheduleRepaginate() {
            clearTimeout(repaginateTimer);
            repaginateTimer = setTimeout(repaginateKeepingMap, 120);
        }

        function repaginateKeepingMap() {
            if (!renderArgs || !mapController) return;
            keptMapWrap = document.getElementById('map-wrap');
            const y = window.scrollY;
            renderBlocks(renderArgs.tpl, renderArgs.featureData, renderArgs.featureGeometry);
            window.scrollTo(0, y);
        }

        /** Área cadastral x calculada e distância/sobreposição com a camada de referência. */

            if (!mapController || !renderArgs) return '';

            const fmt = MapTools.fmtNumber;

                const areaItem = MapTools.computeMeasures(geom).itens.find(i => i.id === 'area');
                const cmp = campo && areaItem ? MapTools.compararAreas(readFieldRaw(campo, renderArgs.featureData), areaItem.valor) : null;
                if (cmp) {
                    const sinal = cmp.diferenca >= 0 ? '+' : '−';
                    linhas.push({ id: 'comp', aviso: cmp.alerta, html: `<b>Área:</b> cadastral (${areaEmLinha(campo.label || campo.name || 'campo')}${campo.tabTitle ? ' — Aba: ' + areaEmLinha(campo.tabTitle) : ''}) ${fmt(cmp.cadastro, 2)} m² • calculada pela geometria ${fmt(cmp.calculada, 2)} m² • diferença ${sinal}${fmt(Math.abs(cmp.diferenca), 2)} m²${cmp.pct === null ? '' : ` (${sinal}${fmt(Math.abs(cmp.pct), 2)}%)`}${cmp.alerta ? ' — <b>divergência acima de 1%</b>' : ''}` });
                }
            }

            if (cfg.referencia.ativo && cfg.referencia.camada) {
                const cam = camadasDoPayload().find(x => String(x.id) === cfg.referencia.camada);

                    const d = MapTools.distanciaCamada(geom, cam);

                        } else {
                            txt = `Distância até a camada <b>${escapeHtml(cam.name)}</b>${alvo}: <b>${fmt(d.metros, 2)} m</b>.`;
                        }
                        linhas.push({ aviso: d.intersecta, html: txt + (cam.truncated ? ' <i>(camada recortada pelo limite de envio)</i>' : '') });
                    } else {
                        linhas.push({ aviso: false, html: `Camada <b>${escapeHtml(cam.name)}</b>: nenhuma feição num raio de 400 m da feição.` });

            if (cfg.referencia.ativo && cfg.referencia.camada && mapController.distanceRows) {

            const pontosMedidos = (mapController.medicaoRows ? mapController.medicaoRows() : []).filter(r => r.tipo === 'ponto');
            if (mapController.medicaoRows) {
                mapController.medicaoRows().forEach(r => {
                    if (r.tipo === 'linha') {

                    }
                });
            }

            let tabelaVerticesHtml = '';
            if (pontosMedidos.length > 0) {
                const esc = escapeHtml;
                const rowsHtml = pontosMedidos.map((r, i) => {

                        <td class="font-semibold text-emerald-800 px-2 py-1 border-r border-slate-200 border-b">${p.zone} ${p.hemisphere}</td>
                        <td class="text-slate-800 px-2 py-1 border-r border-slate-200 border-b">${MapTools.fmtNumber(u.e, 2)}</td>
                        <td class="text-slate-800 px-2 py-1 border-b">${MapTools.fmtNumber(u.n, 2)}</td>

                }).join('');

                tabelaVerticesHtml = `
                    <div class="w-full border border-slate-300 rounded overflow-hidden mb-2 bg-white shadow-2xs mt-2 page-break-avoid">
                        <div class="bg-[#0b1a30] text-white px-2.5 py-1.5 flex justify-between items-center">
                            <div class="flex items-center gap-1.5">
                                <span class="material-symbols-outlined text-[13px] text-emerald-400">format_list_bulleted</span>
                                <h2 class="font-bold text-[9px] uppercase tracking-wider text-white">Coordenadas dos Vértices</h2>

                                <thead>
                                    <tr class="bg-slate-50 text-[8px] uppercase font-bold text-slate-700">

                                        <th class="text-center px-2 py-1 border-r border-b border-slate-200 bg-slate-50" colspan="2">GMS</th>
                                        <th class="text-center px-2 py-1 border-b border-slate-200 bg-emerald-50/50 text-emerald-950" colspan="3">UTM (SIRGAS 2000)</th>
                                    </tr>
                                    <tr class="bg-slate-50 text-[7px] font-bold text-slate-600 uppercase border-b border-slate-200">
                                        <th class="text-center px-1.5 py-1 border-r border-slate-200">Lat (°)</th>
                                        <th class="text-center px-1.5 py-1 border-r border-slate-200">Long (°)</th>
                                        <th class="text-center px-1.5 py-1 border-r border-slate-200">Lat (DMS)</th>
                                        <th class="text-center px-1.5 py-1 border-r border-slate-200">Long (DMS)</th>
                                        <th class="text-center px-1.5 py-1 border-r border-slate-200">Zona</th>
                                        <th class="text-center px-1.5 py-1 border-r border-slate-200">E (m)</th>
                                        <th class="text-center px-1.5 py-1">N (m)</th>
                                    </tr>
                                </thead>
                                <tbody>${rowsHtml}</tbody>
                            </table>
                        </div>
                    </div>`;
            }

            if (!linhas.length && !tabelaVerticesHtml) return '';
            const largura = cfg.analises.largura || {};
            const GAP = 6;
            const larguraCss = (id) => { const p = id && largura[id] ? largura[id] : 100; return p >= 100 ? '100%' : 'calc(' + p + '% - ' + (GAP * (1 - p / 100)).toFixed(1) + 'px)'; };
            const cardHtml = (l) => `<div class="relative text-[10.5px] p-2 rounded-lg border ${l.aviso ? 'bg-amber-50 border-amber-300 text-amber-900' : 'bg-white border-slate-200 text-slate-800'}" ${l.id ? 'data-analise-id="' + l.id + '"' : ''} style="width: ${larguraCss(l.id)}; box-sizing: border-box;">${l.html}${l.id ? '<span class="col-resize no-print" data-card-resize="' + l.id + '" title="Arraste para ajustar a largura do card (dois cliques: largura total)"></span>' : ''}</div>`;
            const cardsGridHtml = linhas.length ? `<div class="flex flex-wrap items-stretch" style="gap: 4px ${GAP}px;">${linhas.map(cardHtml).join('')}</div>` : '';

            return `<div class="mb-4 page-break-avoid">

        function renderPointsTable() {
            if (!mapController) return '';
            const cfg = mapController.getConfig();
            if (!cfg.pontos.ativo || !cfg.pontos.tabela) return '';
            const pr = mapController.pointRows();

            return { split: { rowsHtml, chunkHtml } };
        }

        // ---------------- painel "Mapa" (só na tela; não sai na impressão)
        let mapPanelRotulosDropdownAberto = false;
        let mapPanelRotulosCamadaAberta = null;

        function getFieldTabName(c, f) {
            if (f && f.tabTitle) return f.tabTitle;
            if (f && f.aba) return f.aba;
            const fId = String(f && (f.k || f.id) || '');
            const fLabel = String(f && (f.l || f.label) || '');
            if (reportPayload && Array.isArray(reportPayload.formFields) && Array.isArray(reportPayload.formTabs)) {
                const match = reportPayload.formFields.find(x => String(x.id || x.name) === fId || (fLabel && (x.label === fLabel || x.name === fLabel)));
                if (match && match.tabId) {
                    const t = reportPayload.formTabs.find(tab => tab.id === match.tabId);
                    if (t && (t.title || t.name)) return t.title || t.name;
                }
            }
            try {
                const forms = (typeof allForms !== 'undefined' && Array.isArray(allForms)) ? allForms :
                              ((window.opener && Array.isArray(window.opener.allForms)) ? window.opener.allForms :
                              (Array.isArray(window.allForms) ? window.allForms : []));
                const formId = c && c.formId;

            panel.scrollTop = scrollTop;

        // O painel ocupa 268 px à direita da folha (794 px): em telas estreitas começa recolhido, atrás do botão "Mapa".
        const MAP_PANEL_MIN_WIDTH = 1360;

        }

        // edição por duplo clique dos textos da tabela de pontos (título, nome, coordenadas, azimute, distância)
        function editarTextoTabelaPontos(td) {
            if (!mapController || !td || td.querySelector('input')) return;
            const chave = td.getAttribute('data-pt-edit') || td.getAttribute('data-conf-edit');
            const daConf = !td.getAttribute('data-pt-edit');
            const atual = td.textContent.trim();
            // orientação, distância e confrontantes aceitam quebra de linha (Shift+Enter); as demais células, uma linha só
            const multi = !daConf && /:(dist|cf|or)$/.test(chave);
            const input = document.createElement(multi ? 'textarea' : 'input');
            if (!multi) input.type = 'text';
            input.value = atual;
            input.maxLength = multi ? 160 : 80;
            if (multi) input.rows = Math.max(2, atual.split('\n').length);
            input.className = 'pt-edit-input';
            input.style.cssText = 'width:100%;min-width:60px;font:inherit;text-align:center;border:1px solid #059669;border-radius:3px;padding:0 2px;outline:none;' + (multi ? 'resize:none;display:block;white-space:pre-wrap' : '');
            td.textContent = '';
            td.appendChild(input);
            input.focus();
            input.select();
            let feito = false;
            const fim = (grava) => {
                if (feito) return;
                feito = true;
                if (!grava || input.value === atual) { td.textContent = atual; return; }
                if (daConf) mapController.setConfrontanteTexto(chave, input.value);
                else if (/:t$/.test(chave)) mapController.renamePoint(chave.slice(0, -2), input.value);
                else mapController.setTabelaTexto(chave, input.value);
            };
            input.addEventListener('keydown', (ev) => {
                if (ev.key === 'Enter' && !(multi && ev.shiftKey)) { if (ev.preventDefault) ev.preventDefault(); fim(true); } // Shift+Enter: nova linha
                else if (ev.key === 'Escape') fim(false);
            });
            input.addEventListener('blur', () => fim(true));
        }

        // largura das colunas Distância e Confrontantes: arrastar a divisória do cabeçalho (dois cliques voltam ao automático)
        document.addEventListener('pointerdown', (ev) => {
            const h = ev.target && ev.target.closest ? ev.target.closest('[data-col-resize]') : null;
            if (!h || !mapController) return;
            ev.preventDefault();
            const chave = h.getAttribute('data-col-resize');
            const th = h.closest('th'), tabela = h.closest('table');
            if (!th || !tabela) return;
            const x0 = ev.clientX, w0 = th.getBoundingClientRect().width, tw = tabela.getBoundingClientRect().width || 1;
            let pct = w0 / tw * 100;
            h.classList.add('ativo');
            const move = (e) => {
                pct = Math.min(60, Math.max(8, (w0 + (e.clientX - x0)) / tw * 100));
                document.querySelectorAll('th[data-col-key="' + chave + '"]').forEach(x => { x.style.width = pct + '%'; });
            };
            const up = () => {
                document.removeEventListener('pointermove', move);
                document.removeEventListener('pointerup', up);
                h.classList.remove('ativo');
                mapController.setColunaPontos(chave, Math.round(pct * 10) / 10);
            };
            document.addEventListener('pointermove', move);
            document.addEventListener('pointerup', up);
        });
        // largura dos cards de "Análises da Feição": arrastar a borda direita (encaixa em 25, 33, 50, 67, 75 e 100%); dois cliques = largura total
        const GAP_CARDS = 6;
        const larguraCardCss = (p) => (p >= 100 ? '100%' : 'calc(' + p + '% - ' + (GAP_CARDS * (1 - p / 100)).toFixed(1) + 'px)');
        function encaixeCard(p) {
            const alvo = [25, 33.3, 50, 66.7, 75, 100].find(x => Math.abs(p - x) <= 2.5);
            return alvo || Math.round(p * 10) / 10;
        }
        document.addEventListener('pointerdown', (ev) => {
            const h = ev.target && ev.target.closest ? ev.target.closest('[data-card-resize]') : null;
            if (!h || !mapController) return;
            ev.preventDefault();
            const id = h.getAttribute('data-card-resize');
            const card = h.closest('[data-analise-id]');
            const pai = card ? card.parentElement : null;
            if (!card || !pai) return;
            const x0 = ev.clientX, w0 = card.getBoundingClientRect().height ? card.getBoundingClientRect().width : 0, pw = pai.getBoundingClientRect().width || 1;
            let pct = (w0 + GAP_CARDS) / (pw + GAP_CARDS) * 100;
            h.classList.add('ativo');
            const move = (e) => {
                pct = Math.min(100, Math.max(20, (w0 + (e.clientX - x0) + GAP_CARDS) / (pw + GAP_CARDS) * 100));
                card.style.width = larguraCardCss(encaixeCard(pct));
            };
            const up = () => {
                document.removeEventListener('pointermove', move);
                document.removeEventListener('pointerup', up);
                h.classList.remove('ativo');
                const final = encaixeCard(pct);
                mapController.setAnaliseLargura(id, final >= 100 ? undefined : final);
            };
            document.addEventListener('pointermove', move);
            document.addEventListener('pointerup', up);
        });
        document.addEventListener('dblclick', (ev) => {
            const h = ev.target && ev.target.closest ? ev.target.closest('[data-card-resize]') : null;
            if (h && mapController) { ev.preventDefault(); mapController.setAnaliseLargura(h.getAttribute('data-card-resize'), undefined); }
        });
        document.addEventListener('dblclick', (ev) => {

        // coluna "Confrontantes" da tabela de pontos: camadas, campos e distâncias

        function mapPanelColConfLog(id, on) { colConfEditar(c => { const s = c.camadas.find(x => x.id === String(id)); if (s) s.logradouro = !!on; }); }
        function mapPanelColConfCampo(id, j, on) {

        function mapPanelConfMover(id, dir) { if (mapController) { mapController.moveConfrontante(id, dir); renderMapToolsPanel(); } }

        // quantos cards de "Análises da Feição" por linha: 1 = largura total; 2 e 3 dividem a linha em partes iguais
        function mapPanelAnalisesPorLinha(n) {

        function mapPanelMedRemover(id) { if (mapController) { mapController.removeMedicao(id); renderMapToolsPanel(); } }
        function mapPanelMedLimpar() { if (mapController) { mapController.clearMedicoes(); renderMapToolsPanel(); } }
        function mapPanelMedCopiar(id) {

            navigator.clipboard.writeText('DEC: ' + r.coords.dec + '\nGMS: ' + r.coords.gms + '\nUTM: ' + r.coords.utm).catch(() => {});
        }
        // ao concluir o polígono da ferramenta Área, pergunta que tipo de área é (aparece no mapa e nas análises)
        let tipoAreaPendente = null;
        const TIPOS_AREA = ['Construção', 'Galpão', 'Pérgola', 'Pavilhão em madeira', 'Caiçara', 'Cobertura', 'Garagem', 'Muro', 'Piscina', 'Calçada'];
        function abrirModalTipoArea(id) {

            m.innerHTML = '<div style="background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(15,23,42,.35);padding:16px;width:100%;max-width:380px;font:13px sans-serif;color:#0f172a">' +
                '<div style="font-weight:800;font-size:14px;margin-bottom:4px">Que tipo de área é?</div>' +
                '<div style="color:#64748b;margin-bottom:8px;line-height:1.35">Informe o tipo da área que você acabou de medir. O nome aparece no mapa e nas análises da folha.</div>' +
                '<input id="tipo-area-input" type="text" maxlength="60" placeholder="Ex.: construção, galpão, pérgola, caiçara..." onkeydown="if (event.key === \'Enter\') confirmarTipoArea(this.value); else if (event.key === \'Escape\') fecharModalTipoArea();" style="width:100%;padding:7px 9px;border:1px solid #94a3b8;border-radius:8px;font-size:13px;outline:none">' +
                '<div style="display:flex;flex-wrap:wrap;gap:5px;margin:8px 0">' + TIPOS_AREA.map(x => '<button type="button" onclick="document.getElementById(\'tipo-area-input\').value = this.textContent; document.getElementById(\'tipo-area-input\').focus()" style="border:1px solid #cbd5e1;background:#f8fafc;border-radius:999px;padding:3px 9px;font-size:11px;cursor:pointer">' + x + '</button>').join('') + '</div>' +
                '<div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" onclick="fecharModalTipoArea()" style="border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:7px 14px;font-weight:700;cursor:pointer">Pular</button><button type="button" onclick="confirmarTipoArea(document.getElementById(\'tipo-area-input\').value)" style="border:0;background:#059669;color:#fff;border-radius:9px;padding:7px 14px;font-weight:700;cursor:pointer">Confirmar</button></div></div>';
            document.body.appendChild(m);
            const inp = document.getElementById('tipo-area-input');

        }
        function fecharModalTipoArea() {

        }
        function mapPanelConsulta() { consultaAberta = !consultaAberta; consultaErro = ''; renderMapToolsPanel(); }
        function mapPanelConsultaAba(a) { consultaAba = a; consultaErro = ''; renderMapToolsPanel(); }
        function mapPanelConsultaCampo(k, v) { consultaCampos[k] = v; }
        function mapPanelConsultaMarcar() {
            if (!mapController || !renderArgs) return;

            const c = bb ? MapTools.bboxCenter(bb) : [-34.8, -7];
            const r = MapTools.parseCoordenadas(consultaAba, consultaCampos, { lat: c[1], lng: c[0] });
            if (r.erro) { consultaErro = r.erro; renderMapToolsPanel(); return; }

        function mapPanelPreencher() {

        function mapPanelToggleSatHistorico(id, on) {
            const satDef = SATELLITE_CATALOG[id];
            if (!satDef) return;

            if (!reportPayload) reportPayload = {};
            if (!Array.isArray(reportPayload.ortofotos)) reportPayload.ortofotos = [];

            const idx = reportPayload.ortofotos.findIndex(x => String(x.id) === String(satDef.id));
            if (idx < 0) {
                reportPayload.ortofotos.push(JSON.parse(JSON.stringify(satDef)));
            }

            const geom = (renderArgs && renderArgs.featureGeometry) || (reportPayload && reportPayload.featureGeometry) || window.currentReportGeometry || null;
            let cfgTemp = temporalController ? temporalController.getConfig() : ((mapController && mapController.getConfig().temporal) || { ativo: true, ordem: 'desc', colunas: 2, alturaMm: 45, contorno: true, sincronizar: true, excluidas: [] });
            
            if (on) {
                cfgTemp.ativo = true;
            }

            let excluidas = Array.from(new Set((cfgTemp.excluidas || []).map(String)));
            if (on) {
                excluidas = excluidas.filter(x => x !== String(id));
            } else {
                if (!excluidas.includes(String(id))) excluidas.push(String(id));
            }
            cfgTemp.excluidas = excluidas;

            if (temporalController) {
                try { temporalController.destroy(); } catch (e) {}
            }
            temporalController = ReportTemporal.create({
                L, MapTools, geometry: geom, ortofotos: reportPayload.ortofotos,
                config: cfgTemp, corContorno: (mapController ? mapController.getConfig().destaque.cor : '#10b981'),
                camadas: camadasDoPayload(),
                getActiveLayerIds: () => (mapController ? mapController.getConfig().camadasLigadas : []),
                probe: makeOrtofotoProbe(geom),
                onStructureChange: () => { renderMapToolsPanel(); scheduleRepaginate(); scheduleEmissao(); },
                onChange: () => { renderMapToolsPanel(); scheduleEmissao(); }
            });
            if (mapController) {
                mapController.setConfig({ temporal: cfgTemp });
            }
            if (cfgTemp.ativo) {
                temporalController.start();
            }
            renderMapToolsPanel();
            scheduleRepaginate();
            scheduleEmissao();
        }

        // Garante que o navegador não imprima cabeçalhos/rodapés nativos indesejados (como 'about:blank', títulos ou data/hora do sistema)
        window.addEventListener('beforeprint', () => {
            window._savedDocTitle = document.title;
            document.title = '';

        });

        // =====================================================================================
        // EMISSÃO: protocolo + SHA-256 do conteúdo, calculados a partir do que está na folha
        // =====================================================================================
        function emissaoTexto(kind) {
            if (emissao.erro) return kind === 'protocolo' ? 'indisponível' : 'indisponível';
            if (!emissao.hash) return 'a gerar…';
            return kind === 'protocolo' ? '#' + emissao.protocolo : emissao.hash.slice(0, 16) + '…';
        }
        function emissaoTitulo() {
            return emissao.erro ? escapeHtml(emissao.erro) : escapeHtml(emissao.hash || '');
        }

        /** QR code (imagem GIF embutida) que leva à página de verificação com o protocolo. Vazio se ainda não há protocolo. */
        function qrDataUrl() {
            if (!emissao.protocolo || typeof qrcode !== 'function' || typeof VerificarEmissao === 'undefined') return '';
            try {
                const qr = qrcode(0, 'M');
                qr.addData(VerificarEmissao.verificationUrl(window.location.href, emissao.protocolo));
                qr.make();
                return qr.createDataURL(4, 0);
            } catch (e) { return ''; }
        }

        function aplicarEmissaoNoDom() {
            const qr = qrDataUrl();
            document.querySelectorAll('[data-emissao="qr"]').forEach(e => { if (qr) { e.src = qr; e.style.display = ''; } else { e.style.display = 'none'; } });
            document.querySelectorAll('[data-emissao="protocolo"]').forEach(e => { e.textContent = emissaoTexto('protocolo'); });
            document.querySelectorAll('[data-emissao="hash"]').forEach(e => { e.textContent = emissaoTexto('hash'); e.title = emissao.hash || emissao.erro || ''; });
        }

        /** Tudo que o hash garante: modelo, feição, ajustes do mapa (com o zoom atual) e textos editados na folha. */
        function coletarConteudoParaHash() {
            const args = renderArgs || {};
            const snap = mapController ? snapshotCompleto() : null;
            const temporal = snap ? snap.temporal : null;
            if (snap) delete snap.temporal;
            return {
                template: args.tpl, featureKey: mapAjusteIds().key, featureData: args.featureData, geometry: args.featureGeometry,
                mapa: snap, temporal: temporal,
                textos: Array.from(document.querySelectorAll('.free-text-editable')).map(e => e.textContent || '')
            };
        }

        async function calcularEmissao() {
            try {
                const hash = await ReportExport.sha256Hex(ReportExport.buildHashContent(coletarConteudoParaHash()));
                emissao = { hash: hash, protocolo: ReportExport.makeProtocol(hash, emissaoData), erro: '' };
            } catch (e) {
                emissao = { hash: '', protocolo: '', erro: (e && e.message) || 'SHA-256 indisponível' };
            }
            aplicarEmissaoNoDom();
            return emissao;
        }

        function scheduleEmissao() {
            clearTimeout(emissaoTimer);
            emissaoTimer = setTimeout(() => { calcularEmissao(); }, 400);
        }

        /** Recalcula na hora (o conteúdo pode ter mudado há instantes) e registra a emissão. */
        async function emitirEregistrar(formato) {
            clearTimeout(emissaoTimer);
            const em = await calcularEmissao();
            if (em.hash && !emPrevia()) { // prévia: nada é registrado (o protocolo não existe no servidor)
                const adapter = getOpenerAdapter();
                const ids = mapAjusteIds();
                if (adapter && typeof adapter.registrarEmissao === 'function') {
                    try { await adapter.registrarEmissao({ protocolo: em.protocolo, hash: em.hash, templateId: ids.tplId, featureKey: ids.key, formId: ids.formId, formato: formato }); } catch (e) { /* o registro não impede a emissão */ }
                }
            }
            return em;
        }

        async function imprimirRelatorio() {
            await emitirEregistrar('impressao');
            window.print();
        }

        // =====================================================================================
        // IMAGEM DO MAPA (PNG e Word)
        // =====================================================================================
        /** Captura um elemento (mapa com camadas, rótulos, norte, escala e legenda) como imagem PNG. */
        async function capturarElemento(el, escala) {
            if (typeof html2canvas !== 'function') throw new Error('html2canvas não carregou (sem internet?)');
            // 1) html2canvas desenha tiles e vetores; 2) rótulos, norte, escala, legenda e crédito são desenhados por cima
            //    nas posições que o navegador calculou (o html2canvas os posiciona alguns pixels fora do lugar)
            return MapSnapshot.capture(el, {
                html2canvas: html2canvas,
                cs: (e) => window.getComputedStyle(e),
                rect: (e) => e.getBoundingClientRect(),
                textRect: nodeTextRect,
                size: (e) => ({ w: e.offsetWidth, h: e.offsetHeight }),
                scale: escala || 2
            });
        }

        /** Retângulo (união das linhas) que o navegador reservou para um trecho de texto. */
        function nodeTextRect(node) {
            const rg = document.createRange();
            rg.selectNodeContents(node);
            const rects = rg.getClientRects();
            if (!rects.length) return null;
            let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity;
            Array.prototype.forEach.call(rects, x => { l = Math.min(l, x.left); t = Math.min(t, x.top); r = Math.max(r, x.right); b = Math.max(b, x.bottom); });
            return { left: l, top: t, right: r, bottom: b, width: r - l, height: b - t };
        }

        /** Captura o mapa principal e os quadros da análise temporal. Devolve { id: captura | null }. */
        async function capturarMapasDoRelatorio() {
            const ids = ['map-wrap'];
            document.querySelectorAll('.report-tframe-wrap').forEach(e => { if (e.id) ids.push(e.id); });
            const caps = {};
            if (mapController) mapController.setExportMode(true);
            try {
                for (const id of ids) {
                    const el = document.getElementById(id);
                    if (!el) continue;
                    try { caps[id] = await capturarElemento(el, 2); }
                    catch (e) { console.warn('[Exportação] Falha ao capturar ' + id + ':', e); caps[id] = null; }
                }
            } finally {
                if (mapController) mapController.setExportMode(false);
            }
            return caps;
        }

        function baixarArquivo(conteudo, tipo, nome) {
            const blob = new Blob(conteudo, { type: tipo });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = nome;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(link.href), 2000);
        }

        async function exportarMapaPng() {
            const status = document.getElementById('map-panel-status');
            try {
                const el = document.getElementById('map-wrap');
                if (!el) throw new Error('mapa não encontrado');
                if (status) status.textContent = 'Gerando imagem…';
                if (mapController) mapController.setExportMode(true);
                let cap;
                try { cap = await capturarElemento(el, 2); } finally { if (mapController) mapController.setExportMode(false); }
                const bin = atob(cap.dataUrl.split(',')[1]);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                baixarArquivo([bytes], 'image/png', 'mapa_' + (emissao.protocolo || Date.now()) + '.png');
                if (status) status.textContent = 'Imagem do mapa salva.';
            } catch (e) {
                console.warn('[Exportação] PNG do mapa:', e);
                if (status) status.textContent = 'Não foi possível gerar a imagem do mapa (' + ((e && e.message) || 'erro') + ').';
            }
        }

        /**
         * Word: os mapas entram como IMAGEM (capturada da tela), os quadros da análise temporal viram tabela e o
         * arquivo é um MHTML (.doc) com as imagens dentro, que o Word abre normalmente.
         */
        async function gerarWord() {
            const docElement = document.getElementById('a4-document-container');
            if (!docElement) return;
            await emitirEregistrar('word');
            const caps = await capturarMapasDoRelatorio();
            const falhas = Object.keys(caps).filter(id => !caps[id]);

            const tpl = renderArgs && renderArgs.tpl;
            const cfgPag = (tpl && tpl.config_pagina) || {};
            const docTitle = document.getElementById('report-header-title')?.textContent || 'Relatorio_Oficial';
            // A folha viva (com o layout calculado pelo navegador) vira HTML de Word: estilos em cada elemento,
            // flex/grid como tabelas, mapas como imagem, cabeçalho no topo e rodapé do Word com número de página.
            const partes = ReportWord.buildDocument(docElement, {
                cs: (el) => window.getComputedStyle(el),
                rect: (el) => el.getBoundingClientRect(),
                captures: caps
            });
            const dims = PageSize.dims(cfgPag);
            // o corpo vai como HTML (MHTML com as imagens) dentro do .docx; o rodapé é escrito em OOXML, com campos de página
            const wordHtml = ReportWord.wordFileHtml({ title: docTitle, page: dims, margins: cfgPag.margens_mm, sinRodape: true }, { header: partes.header, body: partes.body, footer: '' });
            const ftrBloco = ((tpl && tpl.blocos) || []).find(b => b.tipo === 'rodape') || {};
            const agora = new Date();
            const qrUrl = qrDataUrl();
            const bytes = ReportDocx.build({
                mhtml: ReportExport.toWordMhtml(wordHtml),
                page: dims,
                margins: cfgPag.margens_mm,
                footer: {
                    data: 'Emitido em ' + agora.toLocaleDateString('pt-BR') + ' às ' + agora.toLocaleTimeString('pt-BR'),
                    hash: emissao.hash ? emissao.hash.slice(0, 16) + '…' : '',
                    qr: qrUrl ? ReportDocx.b64ToBytes(qrUrl.split(',')[1]) : null, qrExt: 'gif',
                    mostrarData: ftrBloco.exibirDataHora !== false, mostrarHash: ftrBloco.exibirHash !== false,
                    mostrarQr: ftrBloco.exibirQr !== false, mostrarPaginas: ftrBloco.numeracao !== false
                }
            });
            baixarArquivo([bytes], 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', docTitle.replace(/[\s\/\\:*?"<>|]+/g, '_') + '_' + (emissao.protocolo || Date.now()) + '.docx');
            if (falhas.length) alert('O Word foi gerado, mas ' + falhas.length + ' mapa(s) não puderam virar imagem (veja o aviso no lugar do mapa). Confira a conexão com a internet e tente de novo.');
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }
