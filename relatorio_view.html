<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador Oficial de Relatório A4</title>
    
    <!-- Tipografia Oficial e Ícones -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    
    <!-- Leaflet & Turf.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
            margin: 0;
            padding: 0;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        .a4-page {
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
            margin: 20px auto;
            position: relative;
            box-sizing: border-box;
            transition: all 0.2s ease;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        @media screen {
            .a4-page {
                min-height: var(--page-height, 1123px);
                max-width: var(--page-width, 794px);
            }
            .a4-page.single-page {
                height: var(--page-height, 1123px);
                max-height: var(--page-height, 1123px);
                overflow: hidden;
            }
        }

        @page {
            size: A4 portrait;
            margin: 0 !important;
        }

        @media print {
            .no-print {
                display: none !important;
            }
            html, body {
                background: #ffffff !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
            }
            main {
                padding: 0 !important;
                margin: 0 !important;
                display: block !important;
            }
            #a4-document-container {
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                max-width: none !important;
                display: block !important;
            }
            .a4-page {
                box-shadow: none !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                max-width: none !important;
                height: var(--print-page-height, 297mm) !important;
                min-height: var(--print-page-height, 297mm) !important;
                max-height: var(--print-page-height, 297mm) !important;
                overflow: hidden !important;
                box-sizing: border-box !important;
                page-break-after: always !important;
                break-after: page !important;
            }
            .a4-page:last-child {
                page-break-after: auto !important;
                break-after: auto !important;
            }
            .page-break-avoid {
                break-inside: avoid;
                page-break-inside: avoid;
            }
        }

        .mention-rendered {
            font-weight: 600;
            color: #0f172a;
        }
        .mention-tag {
            user-select: all;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
        }
        .mention-tag[data-format-bold="true"], .mention-tag.font-bold, .mention-tag.font-black, .mention-tag.is-bold {
            font-weight: 700 !important;
        }
        .mention-tag[data-format-italic="true"], .mention-tag.italic {
            font-style: italic !important;
        }
        .mention-tag[data-format-underline="true"], .mention-tag.underline {
            text-decoration: underline !important;
            text-underline-offset: 2px !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- BARRA SUPERIOR (RODATETO) - AÇÕES RÁPIDAS (OCULTA NA IMPRESSÃO) -->
    <header class="no-print sticky top-0 z-50 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-xs px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-3 select-none">
        <div class="flex items-center gap-3 w-full sm:w-auto">
            <button type="button" onclick="window.close()" class="p-1.5 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full text-slate-500 transition-colors cursor-pointer" title="Fechar Janela">
                <span class="material-symbols-outlined text-[22px]">arrow_back</span>
            </button>
            <div class="flex flex-col">
                <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-sky-600 text-[20px]">description</span>
                    <h1 id="report-header-title" class="font-bold text-sm sm:text-base text-slate-900 dark:text-white leading-tight truncate max-w-xs sm:max-w-md">Relatório da Feição</h1>
                </div>
                <span id="report-header-subtitle" class="text-[11px] font-mono text-slate-500 dark:text-slate-400">Configuração Interativa do Documento • Edição de Mapa &amp; Texto</span>
            </div>
        </div>

        <div class="flex items-center gap-2 w-full sm:w-auto justify-end flex-wrap">
            <!-- Botão Gerar PDF -->
            <button type="button" onclick="gerarPDF()" class="flex items-center gap-1.5 px-3.5 py-2 bg-rose-600 hover:bg-rose-700 active:scale-95 text-white rounded-xl text-xs font-bold transition-all shadow-xs cursor-pointer" title="Exportar como documento PDF">
                <span class="material-symbols-outlined text-[17px]">picture_as_pdf</span>
                <span>Gerar PDF</span>
            </button>

            <!-- Botão Gerar Word -->
            <button type="button" onclick="gerarWord()" class="flex items-center gap-1.5 px-3.5 py-2 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white rounded-xl text-xs font-bold transition-all shadow-xs cursor-pointer" title="Exportar como documento Word (.doc)">
                <span class="material-symbols-outlined text-[17px]">article</span>
                <span>Gerar Word</span>
            </button>

            <!-- Botão Imprimir -->
            <button type="button" onclick="window.print()" class="flex items-center gap-1.5 px-3.5 py-2 bg-slate-800 hover:bg-slate-900 dark:bg-slate-700 dark:hover:bg-slate-600 active:scale-95 text-white rounded-xl text-xs font-bold transition-all shadow-xs cursor-pointer" title="Imprimir em impressora">
                <span class="material-symbols-outlined text-[17px]">print</span>
                <span>Imprimir</span>
            </button>
        </div>
    </header>

    <!-- ÁREA DE NOTIFICAÇÃO / DICA VISUAL -->
    <div class="no-print bg-sky-50 dark:bg-sky-950/40 border-b border-sky-200 dark:border-sky-800/60 px-4 py-2 text-center text-xs text-sky-800 dark:text-sky-300 flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-[16px]">info</span>
        <span>Você pode navegar pelo Mini-Mapa Cartográfico (pan/zoom/camadas) e editar a Caixa de Texto Livre diretamente na folha antes de gerar o PDF ou Word.</span>
    </div>

    <!-- CONTAINER DA FOLHA A4 -->
    <main class="flex-1 flex justify-center p-3 sm:p-6 overflow-y-auto">
        <div id="a4-document-container" class="w-full flex flex-col items-center gap-6">
            <!-- Conteúdo montado dinamicamente via JS com suporte a multi-páginas e folha única sem vazamento -->
            <div id="report-blocks-render" class="a4-page w-full text-slate-900"></div>
        </div>
    </main>

    <script>
        let reportPayload = null;
        let leafletMapInstance = null;
        let activePolygonLayer = null;
        let currentBaseTileLayer = null;
        let currentMapMode = 'streets';

        window.addEventListener('DOMContentLoaded', () => {
            initReportViewer();
        });

        function maskCpfCnpj(val) {
            if (!val) return '';
            const digits = String(val).replace(/\D/g, '');
            if (digits.length === 11) {
                return digits.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
            } else if (digits.length === 14) {
                return digits.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, "$1.$2.$3/$4-$5");
            }
            return String(val);
        }

        function maskCep(val) {
            if (!val) return '';
            const digits = String(val).replace(/\D/g, '');
            if (digits.length === 8) {
                return digits.replace(/^(\d{5})(\d{3})/, "$1-$2");
            }
            return String(val);
        }

        function maskEpol(val) {
            if (!val) return '';
            const digits = String(val).replace(/\D/g, '');
            if (digits.length >= 5) {
                return digits.substring(0, 4) + '.' + digits.substring(4, 11);
            }
            return String(val);
        }

        function maskRip(val) {
            if (!val) return '';
            const digits = String(val).replace(/\D/g, '');
            if (digits.length >= 12) {
                return digits.substring(0, 11) + '-' + digits.substring(11, 13);
            }
            return String(val);
        }

        function maskInscCabedelo(val) {
            if (!val) return '';
            const digits = String(val).replace(/\D/g, '');
            if (digits.length === 19) {
                return digits.replace(/(\d{1})(\d{4})(\d{3})(\d{2})(\d{4})(\d{4})(\d{1})/, "$1.$2.$3.$4.$5.$6.$7");
            }
            return String(val);
        }

        function formatAddressValue(val) {
            if (!val) return '—';
            let data = null;
            if (typeof val === 'object' && val !== null) {
                data = val;
            } else if (typeof val === 'string' && val.trim().startsWith('{')) {
                try { data = JSON.parse(val); } catch(e) {}
            }
            if (data && typeof data === 'object') {
                const parts = [];
                if (data.logradouro && data.logradouro !== 'null' && String(data.logradouro).trim() !== '') {
                    let line = String(data.logradouro).trim();
                    if (data.numero && data.numero !== 'null' && String(data.numero).trim() !== '' && String(data.numero).trim().toUpperCase() !== 'S/N') {
                        line += `, nº ${String(data.numero).trim()}`;
                    } else if (data.numero && String(data.numero).trim().toUpperCase() === 'S/N') {
                        line += ', S/N';
                    }
                    if (data.complemento && data.complemento !== 'null' && String(data.complemento).trim() !== '') {
                        line += ` (${String(data.complemento).trim()})`;
                    }
                    parts.push(line);
                }
                if (data.bairro && data.bairro !== 'null' && String(data.bairro).trim() !== '') {
                    parts.push(String(data.bairro).trim());
                }
                const cityParts = [];
                if (data.cidade && data.cidade !== 'null' && String(data.cidade).trim() !== '') {
                    cityParts.push(String(data.cidade).trim());
                }
                if (data.uf && data.uf !== 'null' && String(data.uf).trim() !== '') {
                    cityParts.push(String(data.uf).trim());
                }
                if (cityParts.length > 0) {
                    parts.push(cityParts.join(' - '));
                }
                if (data.cep && data.cep !== 'null' && String(data.cep).trim() !== '') {
                    parts.push(`CEP: ${maskCep(data.cep)}`);
                }
                if (parts.length > 0) return parts.join(' - ');
            }
            return String(val || '—');
        }

        function getOrgBadgeHtml(org) {
            const o = String(org || '').toUpperCase().trim();
            if (!o || o === 'VISTORIA') {
                return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-slate-100 text-slate-700 border border-slate-200 shadow-2xs"><span class="material-symbols-outlined text-[12px]">visibility</span> Vistoria</span>`;
            }
            if (o.includes('MPF') || o.includes('MINISTÉRIO PÚBLICO') || o.includes('MINISTERIO PUBLICO') || o.includes('PROCURADORIA')) {
                return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-purple-100 text-purple-800 border border-purple-200 shadow-2xs"><span class="material-symbols-outlined text-[12px]">gavel</span> ${escapeHtml(org)}</span>`;
            }
            if (o.includes('POLÍCIA') || o.includes('POLICIA') || (o.includes('PF') && !o.includes('MPF'))) {
                return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-blue-100 text-blue-800 border border-blue-200 shadow-2xs"><span class="material-symbols-outlined text-[12px]">local_police</span> ${escapeHtml(org)}</span>`;
            }
            if (o.includes('SPU') || o.includes('PATRIMÔNIO') || o.includes('PATRIMONIO') || o.includes('FEDERAL')) {
                return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-200 shadow-2xs"><span class="material-symbols-outlined text-[12px]">account_balance</span> ${escapeHtml(org)}</span>`;
            }
            if (o.includes('MUNIC') || o.includes('PREFEITURA') || o.includes('SEDEC') || o.includes('SEPLAM') || o.includes('CABEDELO') || o === 'PM') {
                const displayOrg = (org === 'PM') ? 'MUNICÍPIO' : org;
                return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-amber-100 text-amber-800 border border-amber-200 shadow-2xs"><span class="material-symbols-outlined text-[12px]">domain</span> ${escapeHtml(displayOrg)}</span>`;
            }
            const genericPalettes = [
                'bg-sky-100 text-sky-800 border-sky-200',
                'bg-teal-100 text-teal-800 border-teal-200',
                'bg-indigo-100 text-indigo-800 border-indigo-200',
                'bg-rose-100 text-rose-800 border-rose-200',
                'bg-orange-100 text-orange-800 border-orange-200'
            ];
            const gHash = Math.abs(String(org || '').split('').reduce((acc, c) => acc + c.charCodeAt(0), 0));
            const gClass = genericPalettes[gHash % genericPalettes.length];
            return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9.5px] font-bold ${gClass} shadow-2xs"><span class="material-symbols-outlined text-[12px]">corporate_fare</span> ${escapeHtml(org)}</span>`;
        }

        function getStatusBadgeHtml(status) {
            const s = String(status || '').toLowerCase().trim();
            if (!s || s === '—' || s === '---' || s === '-') return '<span class="text-slate-400 opacity-60 font-mono text-[10px]">—</span>';
            if (s.includes('irregular') || s.includes('invas') || s.includes('não conforme') || s.includes('nao conforme')) {
                return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-red-100 text-red-700 border border-red-200 shadow-2xs"><span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span> ${escapeHtml(status)}</span>`;
            }
            if (s.includes('regular') || s.includes('conforme') || s.includes('legal')) {
                return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-emerald-100 text-emerald-700 border border-emerald-200 shadow-2xs"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> ${escapeHtml(status)}</span>`;
            }
            return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[9.5px] font-medium bg-slate-100 text-slate-700 border border-slate-200">${escapeHtml(status)}</span>`;
        }

        function getRecuoBadgeHtml(recuo) {
            const r = String(recuo || '').toLowerCase().trim();
            if (!r || r === '—' || r === '---' || r === '-') return '<span class="text-slate-400 opacity-60 font-mono text-[10px]">—</span>';
            if (r.includes('já recuou') || r.includes('ja recuou') || r.includes('recuado') || r.includes('com recuo') || r.includes('sim')) {
                return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-emerald-100 text-emerald-700 border border-emerald-200 shadow-2xs"><span class="material-symbols-outlined text-[11px]">check_circle</span> ${escapeHtml(recuo)}</span>`;
            }
            if (r.includes('não') || r.includes('nao') || r.includes('sem recuo') || r.includes('pendente')) {
                return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9.5px] font-bold bg-amber-100 text-amber-800 border border-amber-200 shadow-2xs"><span class="material-symbols-outlined text-[11px]">warning</span> ${escapeHtml(recuo)}</span>`;
            }
            return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[9.5px] font-medium bg-slate-100 text-slate-700 border border-slate-200">${escapeHtml(recuo)}</span>`;
        }

        function formatFieldValueForDisplay(val, fieldDef = {}) {
            if (val === undefined || val === null || val === '' || val === 'null' || val === 'undefined') {
                return '—';
            }

            const type = (fieldDef.type || '').toLowerCase();
            const id = (fieldDef.id || '').toLowerCase();
            const label = (fieldDef.label || '').toLowerCase();

            // 1. JSON ou Objeto de Endereço / CEP
            if (type === 'cep' || (typeof val === 'string' && val.trim().startsWith('{') && (val.includes('"logradouro"') || val.includes('"cep"') || val.includes('"bairro"') || val.includes('"cidade"')))) {
                return formatAddressValue(val);
            }
            if (typeof val === 'object' && val !== null && !Array.isArray(val) && (val.logradouro || val.cep || val.bairro || val.cidade)) {
                return formatAddressValue(val);
            }

            // 2. Arrays (anexos, fotos, links, listas)
            if (Array.isArray(val) || (typeof val === 'string' && val.trim().startsWith('[') && val.includes('{'))) {
                let arr = Array.isArray(val) ? val : null;
                if (!arr) { try { arr = JSON.parse(val); } catch(e){} }
                if (Array.isArray(arr)) {
                    if (arr.length === 0) return '—';
                    if (type === 'photo' || type === 'attachment') {
                        return `📷 ${arr.length} anexo(s)`;
                    }
                    if (arr[0] && (arr[0].title || arr[0].url || arr[0].name)) {
                        return arr.map(it => it.title || it.name || it.number || it.url).filter(Boolean).join(', ');
                    }
                    return arr.join(', ');
                }
            }

            // 3. CPF / CNPJ
            const cleanDigits = String(val).replace(/\D/g, '');
            const isProcessOrCode = id.includes('ipl') || id.includes('process') || id.includes('inquerito') || id.includes('protocol') || id.includes('auto') || id.includes('distrib') ||
                                    label.includes('ipl') || label.includes('process') || label.includes('inquérito') || label.includes('protocol') || label.includes('auto') || label.includes('distrib');
            if (!isProcessOrCode && (type === 'cpfcnpj' || id.includes('cpf') || id.includes('cnpj') || label.includes('cpf') || label.includes('cnpj') || (!id.includes('tel') && !id.includes('fone') && !label.includes('tel') && !label.includes('cel') && (cleanDigits.length === 11 || cleanDigits.length === 14) && (id.includes('doc') || label.includes('doc') || type === 'cpfcnpj')))) {
                if (cleanDigits.length === 11 || cleanDigits.length === 14) {
                    return maskCpfCnpj(cleanDigits);
                }
            }

            // 4. EPOL
            if (type === 'epol' || id.includes('epol') || label.includes('epol')) {
                return maskEpol(val);
            }

            // 5. RIP
            if (type === 'rip' || id.includes('rip') || label.includes('rip')) {
                return maskRip(val);
            }

            // 6. Inscrição Imobiliária Cabedelo
            if (type === 'insc_imob_cabedelo' || id.includes('insc_imob') || label.includes('inscrição imobiliária') || label.includes('inscricao imobiliaria')) {
                return maskInscCabedelo(val);
            }

            // 7. Parse de números locais (com suporte a vírgula brasileira)
            const parseLocalNumber = (v) => {
                const s = String(v).trim();
                if (s.includes(',')) return parseFloat(s.replace(/\./g, '').replace(',', '.'));
                return parseFloat(s);
            };

            // 8. Moeda / Currency
            if (type === 'currency' || label.includes('(r$)') || (label.includes('valor') && !label.includes('recuo') && !label.includes('ocup'))) {
                const num = parseLocalNumber(val);
                if (!isNaN(num)) return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(num);
            }

            // 9. Áreas e Dimensões
            if (type === 'area_m2' || label.includes('(m²)') || label.includes('m2') || label.includes('área invadida') || label.includes('area invadida') || label.includes('área do terreno') || label.includes('area do terreno')) {
                const num = parseLocalNumber(val);
                if (!isNaN(num)) return new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num) + ' m²';
            }
            if (type === 'length_m' || label.includes('(m)')) {
                const num = parseLocalNumber(val);
                if (!isNaN(num)) return new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num) + ' m';
            }
            if (type === 'volume_m3' || label.includes('(m³)')) {
                const num = parseLocalNumber(val);
                if (!isNaN(num)) return new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num) + ' m³';
            }

            // 10. Datas (ISO -> DD/MM/YYYY)
            if (type === 'date' || (typeof val === 'string' && /^\d{4}-\d{2}-\d{2}/.test(val.trim()))) {
                const str = String(val).trim().split('T')[0];
                const p = str.split('-');
                if (p.length === 3) return `${p[2]}/${p[1]}/${p[0]}`;
            }

            // 11. Booleanos
            if (typeof val === 'boolean') {
                return val ? 'Sim' : 'Não';
            }

            return String(val);
        }

        function normalizeEnteTab(val) {
            if (!val) return '';
            const s = String(val).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, '');
            if (s.includes('mpf') || s.includes('minister') || s.includes('procurad')) return 'mpf';
            if (s.includes('polic') || s === 'pf' || (s.includes('pf') && !s.includes('mpf'))) return 'pf';
            if (s.includes('spu') || s.includes('patrimon')) return 'spu';
            if (s.includes('munic') || s.includes('pref') || s.includes('pm') || s.includes('meio')) return 'municipio';
            return s;
        }

        function parseDateToTimestamp(val) {
            if (!val) return -Infinity;
            const s = String(val).trim();
            if (!s) return -Infinity;
            const brMatch = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})(.*)$/);
            if (brMatch) {
                const day = parseInt(brMatch[1], 10);
                const month = parseInt(brMatch[2], 10) - 1;
                const year = parseInt(brMatch[3], 10);
                return new Date(year, month, day).getTime();
            }
            const t = Date.parse(s);
            return isNaN(t) ? -Infinity : t;
        }

        function getLatestRecordAcrossTabs(targetTabs, dateFieldId, sourceFieldId, featureData, sourceFieldLabel) {
            const fData = featureData || (typeof reportPayload !== 'undefined' && reportPayload?.featureData) || {};
            let collectedEntries = [];
            const clean = s => String(s || '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, '');

            for (const [k, val] of Object.entries(fData)) {
                let records = [];
                if (Array.isArray(val)) records = val;
                else if (typeof val === 'string' && val.trim().startsWith('[')) {
                    try { records = JSON.parse(val); } catch(e) {}
                }
                if (!Array.isArray(records) || records.length === 0) continue;

                const normTab = normalizeEnteTab(k);
                if (Array.isArray(targetTabs) && targetTabs.length > 0) {
                    const allowed = targetTabs.map(normalizeEnteTab);
                    if (!allowed.includes(normTab)) continue;
                }

                records.forEach(rec => {
                    if (!rec || typeof rec !== 'object') return;
                    let recordDate = null;
                    if (dateFieldId && dateFieldId !== 'auto' && rec[dateFieldId] !== undefined) {
                        recordDate = rec[dateFieldId];
                    } else {
                        for (const rk of Object.keys(rec)) {
                            if (rk.toLowerCase().includes('data') || rk.toLowerCase().includes('date')) {
                                recordDate = rec[rk];
                                break;
                            }
                        }
                        if (!recordDate) {
                            for (const rk of Object.keys(rec)) {
                                const valStr = String(rec[rk]).trim();
                                if (/^\d{4}-\d{2}-\d{2}/.test(valStr) || /^\d{2}[\/\-]\d{2}[\/\-]\d{4}/.test(valStr)) {
                                    recordDate = rec[rk];
                                    break;
                                }
                            }
                        }
                    }
                    const timestamp = parseDateToTimestamp(recordDate);

                    let valResolved = undefined;
                    if (sourceFieldId && rec[sourceFieldId] !== undefined) {
                        valResolved = rec[sourceFieldId];
                    } else {
                        const targetSlug = clean(sourceFieldLabel || sourceFieldId || '');
                        for (const [rk, rv] of Object.entries(rec)) {
                            if (clean(rk) === targetSlug || clean(rk).includes(targetSlug)) {
                                valResolved = rv;
                                break;
                            }
                        }
                    }
                    if (valResolved !== undefined && valResolved !== null && String(valResolved).trim() !== '') {
                        collectedEntries.push({ timestamp, value: valResolved, record: rec });
                    }
                });
            }

            if (collectedEntries.length === 0) return null;
            collectedEntries.sort((a, b) => b.timestamp - a.timestamp);
            return collectedEntries[0].value;
        }

        function resolveFieldValue(f, featureData, availableFields = []) {
            if (!featureData || !f) return '—';
            const fId = f.id;
            const fName = f.name;
            const fLabel = f.label;

            let rawVal = undefined;

            // 1. Verificação direta de chaves no nível raiz
            if (fId && featureData[fId] !== undefined && featureData[fId] !== null && featureData[fId] !== '') rawVal = featureData[fId];
            else if (fName && featureData[fName] !== undefined && featureData[fName] !== null && featureData[fName] !== '') rawVal = featureData[fName];
            else if (fLabel && featureData[fLabel] !== undefined && featureData[fLabel] !== null && featureData[fLabel] !== '') rawVal = featureData[fLabel];

            // 2. Variações de maiúsculas e minúsculas
            if (rawVal === undefined) {
                const candidates = [fLabel, fName, fId].filter(Boolean);
                for (const c of candidates) {
                    const upper = c.toUpperCase();
                    const lower = c.toLowerCase();
                    if (featureData[upper] !== undefined && featureData[upper] !== null && featureData[upper] !== '') { rawVal = featureData[upper]; break; }
                    if (featureData[lower] !== undefined && featureData[lower] !== null && featureData[lower] !== '') { rawVal = featureData[lower]; break; }
                }
            }

            // 3. Mapeamento cruzado através da lista de campos do formulário (availableFields)
            const fieldsPool = (Array.isArray(availableFields) && availableFields.length > 0) 
                ? availableFields 
                : (typeof window !== 'undefined' && Array.isArray(window.reportViewerFormFields) ? window.reportViewerFormFields : []);

            if (rawVal === undefined && fieldsPool.length > 0) {
                const clean = (s) => String(s || '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, '');
                const targetClean = [clean(fLabel), clean(fName), clean(fId)].filter(Boolean);
                const matchedDef = fieldsPool.find(af => {
                    const afClean = [clean(af.label), clean(af.name), clean(af.id)].filter(Boolean);
                    return targetClean.some(t => afClean.includes(t));
                });
                if (matchedDef) {
                    if (featureData[matchedDef.id] !== undefined && featureData[matchedDef.id] !== null && featureData[matchedDef.id] !== '') {
                        rawVal = featureData[matchedDef.id];
                    } else if (matchedDef.name && featureData[matchedDef.name] !== undefined && featureData[matchedDef.name] !== null && featureData[matchedDef.name] !== '') {
                        rawVal = featureData[matchedDef.name];
                    }
                }
            }

            // 4. Normalização de acentos e caracteres especiais
            if (rawVal === undefined) {
                const clean = (s) => String(s || '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, '');
                const targetSlugs = [clean(fLabel), clean(fName), clean(fId)].filter(Boolean);

                for (const [k, v] of Object.entries(featureData)) {
                    if (v === undefined || v === null || v === '' || v === 'null') continue;
                    const cleanK = clean(k);
                    if (targetSlugs.some(t => t === cleanK || cleanK === t.replace(/_/g, ''))) {
                        rawVal = v;
                        break;
                    }
                }
            }

            // 5. Aliases semânticos comuns (incluindo campos específicos MPF, PF, SPU e Município)
            if (rawVal === undefined) {
                const clean = (s) => String(s || '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, '');
                const targetSlugs = [clean(fLabel), clean(fName), clean(fId)].filter(Boolean);

                const semanticAliases = {
                    'proprietario': ['proprietario', 'titular', 'nome_proprietario', 'contribuinte', 'posseiro', 'responsavel', 'nome', 'proprietario_posseiro'],
                    'cpf': ['cpf_cnpj', 'cpf', 'cnpj', 'cpfcnpj', 'documento', 'doc', 'num_doc'],
                    'cpf_cnpj': ['cpf_cnpj', 'cpf', 'cnpj', 'cpfcnpj', 'documento', 'doc', 'num_doc'],
                    'endereco': ['endereco', 'logradouro', 'rua', 'local', 'localizacao', 'endereco_completo', 'cep', 'endereco_imovel', 'local_imovel'],
                    'loteamento': ['loteamento', 'bairro', 'condominio', 'gleba', 'setor', 'localidade', 'subdivisao'],
                    'quadra': ['quadra', 'qd', 'quadra_lote', 'num_quadra'],
                    'lote': ['lote', 'lt', 'numero_lote', 'num_lote', 'lote_numero'],
                    'observacoes': ['observacoes_do_imovel', 'observacoes', 'observacao', 'obs', 'obs_gerais', 'observacoes_gerais', 'obs_mpf', 'obs_pecunia', 'obs_inquerito_pf', 'observacao_imovel', 'observacoes_imovel', 'parecer', 'descricao', 'historico', 'relato', 'nota', 'detalhes', 'anotacoes', 'conclusao', 'conclusoes'],
                    'area_terreno': ['area_terreno', 'area_do_terreno', 'areaterreno', 'area_total', 'area_imovel', 'area_m2', 'area'],
                    'area_invadida': ['area_invadida', 'areainvadida', 'area_ocupada', 'area_invasao'],
                    'epol': ['epol', 'processo_epol', 'num_epol', 'num_processo', 'inquerito', 'fld_epol'],
                    'rip': ['rip', 'registro_rip', 'num_rip', 'fld_rip'],
                    'recuo': ['situacao_recuo', 'recuo', 'status_recuo'],
                    'ocupacao': ['situacao_ocupacao', 'ocupacao', 'status_ocupacao'],
                    // Aliases MPF
                    'ipl': ['ipl', 'inquerito_policial', 'inquerito', 'inquerito_policial_link', 'numero_inquerito_policial', 'processo_ipl', 'num_inquerito', 'fld_ipl'],
                    'distribuicao': ['distribuicao', 'vara', 'vara_federal', 'juizo', 'distribuicao_vara', 'num_vara'],
                    'designado': ['designado', 'procurador', 'procurador_designado', 'membro_mpf', 'procurador_republica', 'responsavel_mpf', 'fiscal_designado'],
                    'correlatos': ['correlatos', 'processos_correlatos', 'acp', 'acao_civil_publica', 'inquerito_civil', 'procedimento_preparatorio'],
                    'fase_investigacao': ['fase_investigacao', 'fase', 'fase_da_investigacao', 'etapa_investigacao', 'status_investigacao'],
                    'providencia': ['providencia', 'providencias', 'medida', 'medidas', 'deliberacao', 'despacho'],
                    'valor_pecunia': ['valor_pecunia', 'pecunia', 'valor_total', 'valor_formatado', 'valor_m2', 'area_pecunia', 'obs_pecunia']
                };

                for (const target of targetSlugs) {
                    for (const [concept, aliases] of Object.entries(semanticAliases)) {
                        if (target.includes(concept) || aliases.includes(target)) {
                            for (const alias of aliases) {
                                for (const [k, v] of Object.entries(featureData)) {
                                    if (v === undefined || v === null || v === '' || v === 'null') continue;
                                    if (clean(k) === clean(alias)) {
                                        rawVal = v;
                                        break;
                                    }
                                }
                                if (rawVal !== undefined) break;
                            }
                        }
                        if (rawVal !== undefined) break;
                    }
                    if (rawVal !== undefined) break;
                }
            }

            // 6. Varredura recursiva em sub-objetos de abas (ex: featureData.mpf, featureData.tab_mpf)
            if (rawVal === undefined) {
                for (const [subKey, subVal] of Object.entries(featureData)) {
                    if (subVal && typeof subVal === 'object' && !Array.isArray(subVal)) {
                        const subRes = resolveFieldValue(f, subVal, availableFields);
                        if (subRes !== '—') {
                            return subRes;
                        }
                    }
                }
            }

            // 7. Fallback consolidado para vistorias (Data, Ocupação, Recuo, Área)
            if (rawVal === undefined) {
                const clean = (s) => String(s || '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, '');
                const targetSlugs = [clean(fLabel), clean(fName), clean(fId)].filter(Boolean);
                const isDate = targetSlugs.some(s => s.includes('data'));
                const isOcup = targetSlugs.some(s => s.includes('ocupac'));
                const isRecuo = targetSlugs.some(s => s.includes('recuo'));
                const isArea = targetSlugs.some(s => s.includes('areainvadida') || (s.includes('area') && !s.includes('terreno')));

                if (isDate || isOcup || isRecuo || isArea) {
                    const reqKey = isDate ? 'data' : (isOcup ? 'situacao_ocupacao' : (isRecuo ? 'situacao_recuo' : 'area_invadida'));
                    const latest = getLatestRecordAcrossTabs(['PF', 'SPU', 'MUNICÍPIO'], 'auto', reqKey, featureData, fLabel);
                    if (latest !== null && latest !== undefined && latest !== '') {
                        rawVal = latest;
                    }
                }
            }

            if (rawVal === undefined || rawVal === null || rawVal === '' || rawVal === 'null') {
                return '—';
            }

            return formatFieldValueForDisplay(rawVal, f);
        }

        function renderBlocks(tpl, featureData = {}, featureGeometry = null) {
            const docContainer = document.getElementById('a4-document-container');
            if (!docContainer) return;

            // Busca campos para preenchimento
            let fields = [];
            let formTabs = [];
            if (reportPayload && Array.isArray(reportPayload.formFields) && reportPayload.formFields.length > 0) {
                fields = [...reportPayload.formFields];
            }
            if (reportPayload && Array.isArray(reportPayload.formTabs) && reportPayload.formTabs.length > 0) {
                formTabs = [...reportPayload.formTabs];
            }

            // Fallback para window.opener se abas ou campos estiverem vazios
            if ((formTabs.length === 0 || fields.length === 0) && typeof window !== 'undefined' && window.opener) {
                try {
                    const op = window.opener;
                    const opTabs = op.activeFormSchema || op.currentFormFeatures || op.activeFormTabs;
                    if (Array.isArray(opTabs) && opTabs.length > 0) {
                        if (formTabs.length === 0) formTabs = opTabs;
                        if (fields.length === 0) {
                            opTabs.forEach(t => {
                                if (Array.isArray(t.fields)) fields.push(...t.fields);
                            });
                        }
                    }
                } catch(e) {}
            }

            if (fields.length === 0) {
                try {
                    const forms = JSON.parse(localStorage.getItem('constructive_forms') || '[]');
                    const curForm = forms.find(f => f.id === tpl.form_id) || forms[0];
                    const tabsList = curForm?.tabs || (curForm?.schema && curForm.schema.tabs);
                    if (tabsList && Array.isArray(tabsList)) {
                        tabsList.forEach(t => {
                            if (t.fields) fields.push(...t.fields);
                        });
                        if (formTabs.length === 0) formTabs = tabsList;
                    }
                } catch(e) {}
            }
            window.reportViewerFormTabs = formTabs;
            window.reportViewerFormFields = fields;

            const blocos = tpl.blocos || [];
            const hdrBloco = blocos.find(b => b.tipo === 'cabecalho');
            const ftrBloco = blocos.find(b => b.tipo === 'rodape');
            const bodyBlocos = blocos.filter(b => b.tipo !== 'cabecalho' && b.tipo !== 'rodape');

            const orient = (tpl.config_pagina && tpl.config_pagina.orientacao) || 'portrait';
            const mm = (tpl.config_pagina && tpl.config_pagina.margens_mm) || { top: 15, bottom: 15, left: 15, right: 15 };
            const pageHeightPx = orient === 'landscape' ? 794 : 1123;
            const pageWidthPx = orient === 'landscape' ? 1123 : 794;

            // Renderiza previamente os blocos de corpo
            const renderedBodyBlocks = bodyBlocos.map((b, bIdx) => {
                const globalIdx = blocos.indexOf(b);
                return {
                    bloco: b,
                    html: renderSingleBlock(b, globalIdx >= 0 ? globalIdx : bIdx, featureData, featureGeometry, fields, tpl)
                };
            });

            // Medição inteligente de altura para distribuição em folhas
            let measureBox = document.getElementById('a4-measure-stage');
            if (!measureBox) {
                measureBox = document.createElement('div');
                measureBox.id = 'a4-measure-stage';
                measureBox.style.cssText = 'position:absolute; left:-9999px; top:-9999px; visibility:hidden; width:' + (pageWidthPx - Math.round((mm.left + mm.right) * 3.78)) + 'px;';
                document.body.appendChild(measureBox);
            }
            measureBox.style.width = (pageWidthPx - Math.round((mm.left + mm.right) * 3.78)) + 'px';

            const headerHeightPx = hdrBloco ? 135 : 0;
            const footerHeightPx = ftrBloco ? 42 : 0;
            const marginHeightPx = Math.round((mm.top + mm.bottom) * 3.78);

            const maxBodyHeightP1 = pageHeightPx - headerHeightPx - footerHeightPx - marginHeightPx;
            const maxBodyHeightP2 = pageHeightPx - (hdrBloco && hdrBloco.repetir_todas_folhas ? headerHeightPx : 15) - footerHeightPx - marginHeightPx;

            let totalEstimatedHeight = 0;
            const blockHeights = renderedBodyBlocks.map(rb => {
                measureBox.innerHTML = rb.html;
                const h = Math.max(40, measureBox.firstElementChild ? measureBox.firstElementChild.offsetHeight : measureBox.offsetHeight) + 20;
                totalEstimatedHeight += h;
                return h;
            });
            measureBox.innerHTML = '';

            const pagesBlocks = [];
            if (totalEstimatedHeight <= maxBodyHeightP1 || renderedBodyBlocks.length <= 1) {
                pagesBlocks.push(renderedBodyBlocks);
            } else {
                let currentPage = [];
                let currentAccum = 0;
                let isFirstPage = true;

                renderedBodyBlocks.forEach((rb, i) => {
                    const blockH = blockHeights[i];
                    const limit = isFirstPage ? maxBodyHeightP1 : maxBodyHeightP2;

                    if (currentPage.length > 0 && (currentAccum + blockH > limit)) {
                        pagesBlocks.push(currentPage);
                        currentPage = [rb];
                        currentAccum = blockH;
                        isFirstPage = false;
                    } else {
                        currentPage.push(rb);
                        currentAccum += blockH;
                    }
                });

                if (currentPage.length > 0) {
                    pagesBlocks.push(currentPage);
                }
            }

            const totalPages = pagesBlocks.length;

            let pagesHtml = '';
            pagesBlocks.forEach((pageBlocks, pIdx) => {
                const pageNum = pIdx + 1;
                const isFirst = (pageNum === 1);
                const showHeader = isFirst || (hdrBloco && hdrBloco.repetir_todas_folhas);
                const showFooter = !!ftrBloco;

                const padTopMm = showHeader ? Math.max(2, mm.top - 8) : mm.top;
                const padBotMm = showFooter ? Math.max(2, mm.bottom - 8) : mm.bottom;

                const bodyHtml = pageBlocks.map(b => b.html).join('');
                const pageIdAttr = isFirst ? 'id="report-blocks-render"' : '';

                pagesHtml += `
                    <div class="a4-page w-full text-slate-900 ${totalPages === 1 ? 'single-page' : ''}" 
                         data-page="${pageNum}"
                         style="max-width: ${pageWidthPx}px; min-height: ${pageHeightPx}px; ${totalPages === 1 ? `height: ${pageHeightPx}px; max-height: ${pageHeightPx}px; overflow: hidden;` : ''}">
                        
                        <!-- Cabeçalho Institucional: Fora do corpo, acima da margem superior -->
                        ${showHeader ? renderHeaderSlotHtml(hdrBloco, tpl, mm.left, mm.right) : ''}

                        <!-- Corpo da Folha: Delimitado entre as margens superior e inferior -->
                        <div ${pageIdAttr} class="a4-page-body-slot flex flex-col gap-5 w-full flex-1" style="padding: ${padTopMm}mm ${mm.right}mm ${padBotMm}mm ${mm.left}mm; box-sizing: border-box;">
                            ${bodyHtml}
                        </div>

                        <!-- Rodapé Oficial: Fora do corpo, abaixo da margem inferior, fixo na base -->
                        ${showFooter ? renderFooterSlotHtml(ftrBloco, pageNum, totalPages, mm.left, mm.right) : ''}
                    </div>
                `;
            });

            docContainer.innerHTML = pagesHtml;

            // Inicializa o Mini-Mapa Leaflet Interativo
            setTimeout(() => {
                initInteractiveLeafletMap(featureGeometry);
            }, 100);
        }

        function getFieldWidthStyle(pct) {
            const p = Math.max(15, Math.min(100, Math.round(pct || 50)));
            if (p >= 98) return '100%';
            const gap = 10;
            const deduction = Math.round((gap * (1 - p / 100)) * 10) / 10;
            return `calc(${p}% - ${deduction}px)`;
        }

        function renderSingleBlock(bloco, idx, featureData, featureGeometry, fields, tpl) {
            switch(bloco.tipo) {
                case 'cabecalho':
                    return `
                        <div class="mb-3 page-break-avoid ${bloco.repetir_todas_folhas ? 'cabecalho-repetir-todas' : ''}">
                            <!-- Metadados de Emissão e Protocolo fora do card/borda principal (topo direito) -->
                            ${(bloco.exibirDataHora || bloco.exibirProtocolo) ? `
                                <div class="flex items-center justify-end gap-3 text-[10px] font-mono text-slate-500 pb-1 mb-1 border-b border-slate-200/80">
                                    ${bloco.exibirDataHora ? `
                                        <div class="flex items-center gap-1">
                                            <span class="text-slate-400">Emissão:</span>
                                            <span class="font-medium text-slate-600">${new Date().toLocaleDateString('pt-BR')} ${new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}</span>
                                        </div>
                                    ` : ''}
                                    ${bloco.exibirProtocolo ? `
                                        <div class="flex items-center gap-1 font-bold text-slate-700 bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200/60">
                                            <span class="text-slate-400 font-normal">Protocolo:</span>
                                            <span>#${(bloco.id || '2026').slice(-6).toUpperCase()}</span>
                                        </div>
                                    ` : ''}
                                </div>
                            ` : ''}

                            <div class="flex items-center justify-between border-b-2 border-slate-900 pb-3 gap-4">
                                <div class="flex items-center gap-3">
                                    ${bloco.logo ? `
                                        <div class="w-14 h-14 bg-slate-100 rounded-lg flex items-center justify-center overflow-hidden shrink-0 border border-slate-200">
                                            ${bloco.logo_url ? `<img src="${bloco.logo_url}" class="w-full h-full object-contain" />` : `<span class="material-symbols-outlined text-slate-800 text-[42px]">account_balance</span>`}
                                        </div>
                                    ` : ''}
                                    <div>
                                        <div class="text-[11px] uppercase font-bold text-slate-600 tracking-wider whitespace-pre-line">${(escapeHtml(bloco.subtitulo || 'Prefeitura Municipal')).replace(/\r?\n/g, '<br>')}</div>
                                        <div class="text-lg font-black uppercase text-slate-900 tracking-tight whitespace-pre-line">${(escapeHtml(bloco.titulo || tpl.nome || 'FICHA CADASTRAL DO IMÓVEL')).replace(/\r?\n/g, '<br>')}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;

                case 'grade_campos': {
                    const colCount = bloco.colunasLayout || 2;
                    const spans = bloco.campos_spans || {};
                    const larguras = bloco.campos_larguras || {};

                    const fieldsMap = new Map();
                    fields.forEach(f => {
                        fieldsMap.set(f.id, f);
                        if (f.name) fieldsMap.set(f.name, f);
                    });

                    const rawSel = Array.isArray(bloco.campos_selecionados) ? bloco.campos_selecionados : [];
                    let fldsToRender = rawSel
                        .map(item => typeof item === 'string' ? { id: item } : item)
                        .map(item => {
                            const baseField = fieldsMap.get(item.id) || fieldsMap.get(item.name) || {};
                            return { ...baseField, ...item };
                        })
                        .filter(f => f && (f.label || f.name));

                    if (fldsToRender.length === 0 && rawSel.length > 0) {
                        const selSet = new Set(rawSel.map(s => typeof s === 'string' ? s : s.id));
                        fldsToRender = fields.filter(f => selSet.has(f.id));
                    }
                    if (fldsToRender.length === 0) fldsToRender = fields.slice(0, 8);

                    if (colCount === 1) {
                        return `
                            <div class="mb-4 page-break-avoid">
                                <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2 flex items-center justify-between">
                                    <span class="whitespace-pre-line">${(escapeHtml(bloco.titulo || 'Dados Cadastrais')).replace(/\r?\n/g, '<br>')}</span>
                                </div>
                                <div class="divide-y divide-slate-200 border border-slate-200 rounded-lg overflow-hidden">
                                    ${fldsToRender.map(f => {
                                        const val = resolveFieldValue(f, featureData);
                                        return `
                                            <div class="flex items-center justify-between px-3 py-1.5 text-xs bg-white odd:bg-slate-50/50">
                                                <span class="font-bold text-slate-600 truncate">${escapeHtml(f.label)}:</span>
                                                <span class="font-semibold text-slate-900 truncate font-mono text-[11px]">${escapeHtml(val)}</span>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        `;
                    }

                    return `
                        <div class="mb-4 page-break-avoid">
                            <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2 flex items-center justify-between">
                                <span class="whitespace-pre-line">${(escapeHtml(bloco.titulo || 'Dados Cadastrais')).replace(/\r?\n/g, '<br>')}</span>
                            </div>
                            <div class="flex flex-wrap gap-2.5">
                                ${fldsToRender.map(f => {
                                    const val = resolveFieldValue(f, featureData);
                                    let pct = larguras[f.id];
                                    if (!pct) {
                                        const span = Math.min(spans[f.id] || f.colSpan || 1, colCount);
                                        if (span >= colCount) pct = 100;
                                        else if (colCount === 3 && span === 2) pct = 66;
                                        else pct = colCount === 3 ? 33 : 50;
                                    }
                                    pct = Math.round(pct);
                                    const widthStyle = getFieldWidthStyle(pct);
                                    const isLongText = pct >= 45 || String(val).length > 25 || (f.id && (f.id.includes('endereco') || f.id.includes('obs'))) || (f.label && (f.label.toLowerCase().includes('endereço') || f.label.toLowerCase().includes('observa')));
                                    return `
                                        <div class="p-2 border border-slate-200 rounded-lg bg-slate-50/50" 
                                             style="flex: 0 0 ${widthStyle}; max-width: ${widthStyle}; width: ${widthStyle}; box-sizing: border-box;">
                                            <div class="text-[9.5px] uppercase font-bold text-slate-500 truncate">${escapeHtml(f.label)}</div>
                                            <div class="text-xs font-bold text-slate-800 mt-0.5 ${isLongText ? 'break-words whitespace-normal leading-snug' : 'truncate'}">${escapeHtml(val)}</div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                }

                case 'mapa_estatico':
                    return `
                        <div class="mb-4 page-break-avoid">
                            <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2 flex items-center justify-between">
                                <span class="whitespace-pre-line">${(escapeHtml(bloco.titulo || 'Delimitação Cartográfica do Imóvel')).replace(/\r?\n/g, '<br>')}</span>
                                <div class="no-print flex items-center gap-1.5">
                                    <button type="button" onclick="toggleMapBasemap()" class="px-2 py-0.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-[10px] font-bold rounded flex items-center gap-1 cursor-pointer">
                                        <span class="material-symbols-outlined text-[13px]">layers</span>
                                        <span id="btn-basemap-label">Satélite</span>
                                    </button>
                                </div>
                            </div>
                            <!-- Container do Mapa Leaflet Interativo -->
                            <div class="relative rounded-lg overflow-hidden border border-slate-300 shadow-xs">
                                <div id="interactive-report-map" class="w-full h-64 bg-slate-900 z-0"></div>
                                
                                <!-- Rosa dos Ventos -->
                                ${bloco.exibirNorte ? `
                                    <div class="absolute top-2.5 right-2.5 z-[400] bg-black/70 backdrop-blur-xs p-1.5 rounded-lg flex flex-col items-center text-white text-[9px] font-bold pointer-events-none">
                                        <span class="material-symbols-outlined text-[18px] text-amber-400">navigation</span>
                                        <span>N</span>
                                    </div>
                                ` : ''}

                                <!-- Barra de Escala e Datum -->
                                <div class="absolute bottom-2 left-2 z-[400] bg-black/70 backdrop-blur-xs px-2 py-1 rounded text-white text-[9px] font-mono flex items-center gap-2 pointer-events-none">
                                    <span>SIRGAS 2000 UTM Fuso 25S</span>
                                    <span>•</span>
                                    <span id="map-scale-text">Escala ${bloco.escala || '1:2.500'}</span>
                                </div>
                            </div>
                            
                            <!-- Dimensões Perimetrais Calculadas -->
                            <div id="map-dimensions-summary" class="mt-1.5 p-2 bg-slate-50 border border-slate-200 rounded-lg flex flex-wrap items-center justify-between text-xs font-mono text-slate-700">
                                <div class="flex items-center gap-1.5">
                                    <span class="font-bold text-emerald-700">Georreferenciamento:</span>
                                    <span id="map-sides-text">Processando lados do polígono...</span>
                                </div>
                                <div id="map-area-text" class="font-bold text-slate-900">Área: —</div>
                            </div>
                        </div>
                    `;

                case 'caixa_texto_livre':
                case 'texto_livre':
                    // Substitui @mentions na sequência do texto com o dado do campo sem o título
                    const processedText = replaceMentionsWithData(bloco.conteudo || '', featureData);
                    return `
                        <div class="mb-4 page-break-avoid">
                            ${bloco.titulo ? `
                                <div class="text-xs font-bold uppercase tracking-wider text-slate-800 border-b border-slate-300 pb-1 mb-2 flex items-center justify-between">
                                    <span class="whitespace-pre-line">${(escapeHtml(bloco.titulo)).replace(/\r?\n/g, '<br>')}</span>
                                    <span class="no-print text-[10px] text-slate-400 font-normal">Clique para editar pontualmente</span>
                                </div>
                            ` : ''}
                            <div id="viewer-free-text-${idx}" 
                                 contenteditable="true" 
                                 class="free-text-editable text-xs text-slate-800 leading-relaxed p-3 bg-white border border-dashed border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-sky-500 transition-all cursor-text print:border-none print:p-0" 
                                 style="white-space: pre-wrap; line-height: ${bloco.espacamento || '1.6'}; text-align: ${bloco.alinhamento || 'justify'};"
                                 title="Clique para editar este texto antes de exportar">${processedText}</div>
                        </div>
                    `;

                case 'tabela_sintetica_1n': {
                    const sortOrder = bloco.ordem_cronologica || 'desc';
                    const groupByTab = !!bloco.ordenar_por_aba;
                    const tabOrder = bloco.ordem_abas || [];
                    let records = extract1nFeatureRecords(bloco.sourceTabId, featureData, fields, sortOrder, groupByTab, tabOrder);
                    if (Array.isArray(bloco.abas_selecionadas) && bloco.abas_selecionadas.length > 0) {
                        const normSel = new Set(bloco.abas_selecionadas.map(normalizeEnteTab));
                        const selTabs = new Set(bloco.abas_selecionadas.map(s => String(s).toLowerCase()));
                        const filtered = records.filter(r => {
                            const rTab = String(r.sourceTab || r.tabId || r.org || r.tabTitle || (r.raw && r.raw._origTab) || '').toLowerCase();
                            if (selTabs.has(rTab)) return true;
                            const normR = normalizeEnteTab(r.sourceTab || r.org || r.tabTitle || (r.raw && r.raw._origTab));
                            return normSel.has(normR);
                        });
                        records = filtered;
                    }

                    // Deduplicação estrita para MPF: garante no máximo 1 único registro consolidado (o mais recente)
                    const dedupedRecords = [];
                    let hasMpfRecord = false;
                    records.forEach(r => {
                        const rOrg = String(r.org || r.sourceTab || '').toLowerCase();
                        if (rOrg.includes('mpf') || rOrg.includes('minist')) {
                            if (!hasMpfRecord) {
                                dedupedRecords.push(r);
                                hasMpfRecord = true;
                            }
                        } else {
                            dedupedRecords.push(r);
                        }
                    });
                    records = dedupedRecords;

                    const rawCols = bloco.colunas || ['aba', 'data', 'org', 'situacao_ocupacao', 'situacao_recuo', 'area_invadida', 'qtd_fotos'];
                    const cols = rawCols.map(c => typeof c === 'object' ? c.id : c);
                    const colLabelMap = {
                        'aba': 'Aba / Ente',
                        'data': 'Data',
                        'org': 'Órgão / Entidade',
                        'situacao_ocupacao': 'Situação Ocupação',
                        'situacao_recuo': 'Situação Recuo',
                        'area_invadida': 'Área Invadida',
                        'qtd_fotos': 'Fotos'
                    };
                    rawCols.forEach(c => {
                        if (typeof c === 'object' && c.id) {
                            colLabelMap[c.id] = c.label || c.id;
                        }
                    });
                    if (Array.isArray(fields)) {
                        fields.forEach(f => {
                            if (f && f.id && !colLabelMap[f.id]) {
                                colLabelMap[f.id] = f.label || f.name || f.id;
                            }
                        });
                    }

                    const density = bloco.densidade || 'compact';
                    const striping = bloco.zebrado || 'slate';

                    let thDensityClass = 'py-1.5 px-2 text-[9.5px] font-bold text-slate-700 uppercase border-b-2 border-slate-300';
                    let tdDensityClass = 'py-1.5 px-2 text-[10px] border-b border-slate-200';
                    if (density === 'comfortable') {
                        thDensityClass = 'p-2 text-[10.5px] font-bold text-slate-700 uppercase border-b-2 border-slate-300';
                        tdDensityClass = 'p-2 text-[11px] border-b border-slate-200';
                    } else if (density === 'ultracompact') {
                        thDensityClass = 'py-0.5 px-1 text-[8.5px] font-bold text-slate-700 uppercase border-b-2 border-slate-300';
                        tdDensityClass = 'py-0.5 px-1 text-[9px] font-medium border-b border-slate-200';
                    }

                    let tbodyHtml = '';
                    if (records.length === 0) {
                        tbodyHtml = `<tr><td colspan="${cols.length + 1}" class="p-4 text-center text-slate-400 italic bg-slate-50/50">Nenhuma vistoria ou registro 1:N cadastrado para este imóvel.</td></tr>`;
                    } else {
                        tbodyHtml = records.map((r, rIdx) => {
                            const isOdd = rIdx % 2 === 1;
                            let rowBg = isOdd ? 'bg-slate-50/70' : 'bg-white';
                            if (striping === 'sky') {
                                rowBg = isOdd ? 'bg-sky-50/50' : 'bg-white';
                            } else if (striping === 'ente') {
                                const tabLow = (r.sourceTab || r.org || '').toLowerCase();
                                if (tabLow.includes('pf') || tabLow.includes('policia') || tabLow.includes('polícia')) {
                                    rowBg = 'bg-blue-50/35';
                                } else if (tabLow.includes('spu') || tabLow.includes('patrimonio') || tabLow.includes('patrimônio')) {
                                    rowBg = 'bg-emerald-50/35';
                                } else {
                                    rowBg = isOdd ? 'bg-amber-50/35' : 'bg-white';
                                }
                            } else if (striping === 'white') {
                                rowBg = 'bg-white';
                            }

                            return `
                                <tr class="${rowBg} hover:bg-amber-50/40 transition-colors">
                                    <td class="${tdDensityClass} border-r border-slate-200 text-center font-mono text-[10px] text-slate-400">${rIdx + 1}</td>
                                    ${cols.map(c => {
                                        if (c === 'aba') {
                                            return `<td class="${tdDensityClass} border-r last:border-r-0 border-slate-200 whitespace-normal break-words">${getOrgBadgeHtml(r.sourceTab || r.org || 'Vistoria')}</td>`;
                                        }
                                        if (c === 'data') return `<td class="${tdDensityClass} border-r last:border-r-0 border-slate-200 font-medium text-slate-800 font-mono text-[10px] whitespace-normal break-words">${escapeHtml(r.formattedDate)}</td>`;
                                        if (c === 'org') return `<td class="${tdDensityClass} border-r last:border-r-0 border-slate-200 whitespace-normal break-words">${getOrgBadgeHtml(r.org)}</td>`;
                                        if (c === 'situacao_ocupacao') {
                                            return `<td class="${tdDensityClass} border-r last:border-r-0 border-slate-200 whitespace-normal break-words">${getStatusBadgeHtml(r.situacaoOcupacao)}</td>`;
                                        }
                                        if (c === 'situacao_recuo') {
                                            return `<td class="${tdDensityClass} border-r last:border-r-0 border-slate-200 whitespace-normal break-words">${getRecuoBadgeHtml(r.situacaoRecuo)}</td>`;
                                        }
                                        if (c === 'area_invadida') {
                                            return `<td class="${tdDensityClass} border-r last:border-r-0 border-slate-200 font-mono font-bold text-right text-slate-800 text-[10.5px] whitespace-normal break-words">${r.areaInvadida > 0 ? (new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(r.areaInvadida) + ' m²') : '—'}</td>`;
                                        }
                                        if (c === 'qtd_fotos') {
                                            const fotoCount = Array.isArray(r.photos) ? r.photos.length : 0;
                                            const docCount = Array.isArray(r.links) ? r.links.length : 0;
                                            let anexoLabel = '';
                                            if (fotoCount > 0 && docCount > 0) anexoLabel = `📷 ${fotoCount} foto(s) + 📎 ${docCount} doc(s)`;
                                            else if (fotoCount > 0) anexoLabel = `📷 ${fotoCount} foto(s)`;
                                            else if (docCount > 0) anexoLabel = `📎 ${docCount} doc(s)`;
                                            else anexoLabel = '<span class="text-slate-400 font-mono text-[10px]">—</span>';
                                            return `<td class="${tdDensityClass} border-r last:border-r-0 border-slate-200 text-sky-700 font-semibold text-[10px] whitespace-normal break-words">${anexoLabel}</td>`;
                                        }

                                        // Lookup candidate keys from aliases if c is unified
                                        const colObj = rawCols.find(col => (typeof col === 'object' ? col.id : col) === c);
                                        const candidates = [c];
                                        if (colObj && typeof colObj === 'object' && Array.isArray(colObj.fieldIds)) {
                                            candidates.push(...colObj.fieldIds);
                                        }
                                        let customVal = null;
                                        for (const cand of candidates) {
                                            if (r[cand] !== undefined && r[cand] !== null) { customVal = r[cand]; break; }
                                            if (r.raw && r.raw[cand] !== undefined && r.raw[cand] !== null) { customVal = r.raw[cand]; break; }
                                        }
                                        if (!customVal && c === 'conclusao') {
                                            customVal = r.conclusao || r.observacao || null;
                                        }
                                        if (!customVal && c === 'links' && Array.isArray(r.links) && r.links.length > 0) {
                                            customVal = r.links;
                                        }
                                        if (customVal === null && typeof resolveFieldValue === 'function') {
                                            const candidateData = Object.assign({}, featureData || {}, r.raw || {}, r || {});
                                            const candidateDef = (r.tabFields || fields || []).find(f => candidates.includes(f.id) || candidates.includes(f.name)) || (typeof colObj === 'object' ? colObj : { id: c });
                                            const resolved = resolveFieldValue(candidateDef, candidateData, (r.tabFields || fields));
                                            if (resolved !== '—') customVal = resolved;
                                        }
                                        
                                        // Formatação inteligente para campos compostos (links, processos, listas)
                                        if (Array.isArray(customVal) || (typeof customVal === 'string' && customVal.trim().startsWith('[') && customVal.includes('{'))) {
                                            let parsed = Array.isArray(customVal) ? customVal : null;
                                            if (!parsed) { try { parsed = JSON.parse(customVal); } catch(e){} }
                                            if (Array.isArray(parsed) && parsed.length > 0) {
