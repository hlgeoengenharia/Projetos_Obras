<!DOCTYPE html>
<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Entrar — GeoGestor</title>
<script>
  (function() {
    try {
      var savedTheme = localStorage.getItem('constructive_theme') || 'Claro';
      document.documentElement.classList.remove('light', 'dark', 'neon');
      if (savedTheme === 'Azul neon') {
        document.documentElement.classList.add('neon', 'dark');
      } else if (savedTheme === 'Escuro' || (savedTheme === 'Automático' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.add('light');
      }
    } catch(e) {}
  })();
</script>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link rel="icon" type="image/png" href="assets/logo.png">
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          primary: "#0ea5e9",
          "on-primary": "#ffffff"
        },
        fontFamily: { sans: ["Inter", "sans-serif"] }
      }
    }
  }
</script>
<style>
  body { background-color: #f8fafc; color: #334155; }
  html.dark body { background-color: #0f172a; color: #e2e8f0; }
  .card {
    background-color: #ffffff;
    box-shadow: 4px 4px 12px rgba(209, 217, 230, 0.4), -4px -4px 12px rgba(255, 255, 255, 0.8);
    border: 1px solid rgba(226, 232, 240, 0.6);
  }
  html.dark .card {
    background-color: #1e293b;
    border-color: rgba(51, 65, 85, 0.6);
    box-shadow: none;
  }
</style>
</head>
<body class="font-sans min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm">
    <div class="flex flex-col items-center mb-8">
      <img src="assets/logo.png" alt="GeoGestor" class="w-24 h-24 rounded-2xl shadow-lg mb-3 object-cover">
      <p class="text-xs text-slate-400 mt-1">Sistema de Gestão Territorial</p>
    </div>

    <div class="card rounded-2xl p-6">
      <form id="login-form" class="flex flex-col gap-4">
        <div>
          <label class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Login</label>
          <input id="login-email" type="email" required autocomplete="username"
            class="mt-1 w-full rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary"
            placeholder="seu.email@orgao.gov.br">
        </div>
        <div>
          <div class="flex items-center justify-between">
            <label class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Senha</label>
            <a href="forgot-password.html" class="text-[11px] text-primary hover:underline">Esqueceu a senha?</a>
          </div>
          <div class="relative mt-1">
            <input id="login-password" type="password" required autocomplete="current-password"
              class="w-full rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 pl-3 pr-10 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary"
              placeholder="••••••••">
            <button type="button" id="login-password-toggle" tabindex="-1" class="absolute right-2 top-1/2 -translate-y-1/2 p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors" title="Mostrar/ocultar senha">
              <span id="login-password-toggle-icon" class="material-symbols-outlined text-[20px]">visibility</span>
            </button>
          </div>
        </div>

        <div id="login-error" class="hidden text-xs text-red-600 bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 rounded-lg px-3 py-2"></div>

        <button id="login-submit" type="submit"
          class="mt-2 w-full bg-primary text-on-primary font-semibold text-sm rounded-lg py-2.5 hover:opacity-90 transition-opacity flex items-center justify-center gap-2">
          <span id="login-submit-text">Entrar</span>
        </button>
      </form>
    </div>

    <p class="text-center text-[11px] text-slate-400 mt-6">
      Ainda não tem acesso? <a href="signup.html" class="text-primary hover:underline">Solicitar acesso</a>
    </p>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function() {
  const form = document.getElementById('login-form');
  const emailEl = document.getElementById('login-email');
  const passwordEl = document.getElementById('login-password');
  const errorEl = document.getElementById('login-error');
  const submitBtn = document.getElementById('login-submit');
  const submitText = document.getElementById('login-submit-text');

  const passwordToggleBtn = document.getElementById('login-password-toggle');
  const passwordToggleIcon = document.getElementById('login-password-toggle-icon');
  if (passwordToggleBtn) {
    passwordToggleBtn.addEventListener('click', function() {
      const showing = passwordEl.type === 'text';
      passwordEl.type = showing ? 'password' : 'text';
      passwordToggleIcon.textContent = showing ? 'visibility' : 'visibility_off';
    });
  }

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.className = 'text-xs text-red-600 bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 rounded-lg px-3 py-2';
    errorEl.classList.remove('hidden');
  }

  function showInactivityNotice() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('reason') === 'inactivity') {
      errorEl.innerHTML = '<span class="flex items-center gap-1.5 font-semibold text-amber-700 dark:text-amber-300"><span class="material-symbols-outlined text-[18px]">lock_clock</span> Sessão encerrada por inatividade (15 min). Faça login novamente para continuar.</span>';
      errorEl.className = 'text-xs bg-amber-50 dark:bg-amber-950/40 border border-amber-300 dark:border-amber-700/60 rounded-lg px-3 py-2.5 shadow-sm';
      errorEl.classList.remove('hidden');
    }
  }
  showInactivityNotice();

  async function handlePostLoginRouting(userId) {
    try {
      const { data: profile } = await supabaseClient.from('profiles').select('super_admin, entidade_admin').eq('id', userId).single();
      
      if (profile && profile.super_admin) {
        window.location.href = 'home.html';
        return;
      }

      const { data: membros } = await supabaseClient
        .from('municipio_membros')
        .select('papel, municipios(id, nome, uf)')
        .eq('user_id', userId)
        .eq('status', 'aprovado');

      const municipiosAtribuidos = (membros || [])
        .filter(m => m.municipios)
        .map(m => ({ id: m.municipios.id, nome: m.municipios.nome, uf: m.municipios.uf, papel: m.papel }));

      // Usuário Municipal com apenas 1 município: entra direto no mapa (index.html)
      if (municipiosAtribuidos.length === 1 && !profile?.entidade_admin) {
        const mun = municipiosAtribuidos[0];
        sessionStorage.setItem('municipio_ativo', mun.id);
        sessionStorage.setItem('municipio_ativo_nome', mun.nome);
        window.location.href = 'index.html';
        return;
      }

      // Diferente de municipal (múltiplos municípios): entra na Home
      window.location.href = 'home.html';
    } catch(err) {
      window.location.href = 'home.html';
    }
  }

  // Já logado?
  (async function redirectIfLoggedIn() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('reason') === 'inactivity') return;
    if (!supabaseClient) return;
    const { data } = await supabaseClient.auth.getSession();
    if (data && data.session) {
      await handlePostLoginRouting(data.session.user.id);
    }
  })();

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    errorEl.classList.add('hidden');

    if (!supabaseClient) {
      showError('Não foi possível conectar ao sistema. Tente novamente em instantes.');
      return;
    }

    submitBtn.disabled = true;
    submitText.textContent = 'Entrando...';

    const { data: authData, error } = await supabaseClient.auth.signInWithPassword({
      email: emailEl.value.trim(),
      password: passwordEl.value
    });

    submitBtn.disabled = false;
    submitText.textContent = 'Entrar';

    if (error) {
      showError('E-mail ou senha inválidos.');
      return;
    }

    if (authData && authData.user) {
      await handlePostLoginRouting(authData.user.id);
    } else {
      window.location.href = 'home.html';
    }
  });
})();
</script>
</body>
</html>
